    vi: Nền tảng nguồn mà bạn nhập dữ liệu trả về nội dung ReputeCast không đọc được. Trường detail chứa nội dung đã trả về.
    de: >-
      Die Plattform, von der Sie importieren, hat mit etwas geantwortet, das ReputeCast nicht lesen kann. Das Feld
      detail enthält ihre Antwort.
    es: >-
      La plataforma desde la que importas respondió con algo que ReputeCast no puede leer. El detalle incluye lo que
