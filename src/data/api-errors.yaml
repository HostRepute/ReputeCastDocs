    vi: 'Thư, tính cả tệp đính kèm, vượt giới hạn kích thước của tuyến: giới hạn nhỏ nhất trong các nhà cung cấp gửi thư của tuyến.'
    de: >-
      Die Nachricht ist samt Anhängen größer als das Größenlimit der Route: das kleinste Limit der Versandanbieter der
      Route.
    es: >-
      El mensaje, adjuntos incluidos, supera el límite de tamaño de la ruta: el límite más pequeño de los proveedores de
      envío de la ruta.
    fr: >-
      Le message, pièces jointes comprises, dépasse la limite de taille de la route : la plus petite limite des
      fournisseurs d’envoi de la route.
- id: no_healthy_route
  status: 503
  area:
    en: Transactional API
    vi: API email giao dịch
    de: Transaktions-API
    es: API transaccional
    fr: API transactionnelle
  description:
    en: Every sending provider in the route is down. Retry with the same idempotency key.
    vi: Mọi nhà cung cấp gửi thư trong tuyến đều đang gián đoạn. Hãy thử lại với cùng Idempotency-Key.
    de: Alle Versandanbieter der Route sind ausgefallen. Versuchen Sie es mit demselben Idempotenzschlüssel erneut.
    es: Todos los proveedores de envío de la ruta están caídos. Vuelve a intentarlo con la misma clave de idempotencia.
    fr: Tous les fournisseurs d’envoi de la route sont en panne. Réessayez avec la même clé d’idempotence.
- id: template_not_allowed
  status: 403
  area:
    en: Transactional API
    vi: API email giao dịch
    de: Transaktions-API
    es: API transaccional
    fr: API transactionnelle
  description:
    en: The key can't send this template or category. Use a key that can, or widen the key's scope.
    vi: Khóa này không được gửi mẫu hoặc danh mục này. Hãy dùng khóa được phép, hoặc mở rộng phạm vi của khóa.
    de: >-
      Der Schlüssel darf diese Vorlage oder Kategorie nicht senden. Verwenden Sie einen Schlüssel, der das darf, oder
      erweitern Sie den Geltungsbereich des Schlüssels.
    es: La clave no puede enviar esta plantilla o categoría. Usa una clave que pueda o amplía el ámbito de la clave.
    fr: >-
      La clé ne peut pas envoyer ce modèle ou cette catégorie. Utilisez une clé qui le peut, ou élargissez la portée de
      la clé.
- id: agents_never_send
  status: 403
  area:
    en: Transactional API
    vi: API email giao dịch
    de: Transaktions-API
    es: API transaccional
    fr: API transactionnelle
  description:
    en: MCP agents never send transactional mail. Send from your app with a send-only key.
    vi: Tác tử MCP không bao giờ gửi email giao dịch. Hãy gửi từ ứng dụng của bạn bằng khóa chỉ gửi.
    de: MCP-Agenten senden nie Transaktions-E-Mails. Senden Sie aus Ihrer App mit einem Nur-Senden-Schlüssel.
    es: Los agentes MCP nunca envían correo transaccional. Envía desde tu aplicación con una clave solo de envío.
    fr: >-
      Les agents MCP n’envoient jamais d’e-mails transactionnels. Envoyez depuis votre application avec une clé d’envoi
      uniquement.
- id: content_removed
  status: 410
  area:
    en: Transactional API
    vi: API email giao dịch
    de: Transaktions-API
    es: API transaccional
    fr: API transactionnelle
  description:
    en: The message's rendered content is no longer kept (content retention), or it was never rendered. The summary and events stay until metadata retention ends.
    vi: Nội dung đã kết xuất của thư không còn được lưu (theo thời hạn lưu nội dung), hoặc thư chưa từng được kết xuất. Phần tóm tắt và sự kiện vẫn được giữ đến hết thời hạn lưu siêu dữ liệu.
    de: >-
      Der gerenderte Inhalt der Nachricht wird nicht mehr aufbewahrt (Aufbewahrungsdauer für Inhalte), oder er wurde nie
      gerendert. Zusammenfassung und Ereignisse bleiben bis zum Ende der Aufbewahrungsdauer für Metadaten erhalten.
    es: >-
      El contenido renderizado del mensaje ya no se conserva (conservación del contenido), o nunca se renderizó. El
      resumen y los eventos se mantienen hasta que termina la conservación de los metadatos.
    fr: >-
      Le contenu rendu du message n’est plus conservé (durée de conservation du contenu), ou il n’a jamais été rendu. Le
      résumé et les événements restent jusqu’à la fin de la durée de conservation des métadonnées.
- id: resend_unavailable
  status: 409
  area:
    en: Transactional API
    vi: API email giao dịch
    de: Transaktions-API
    es: API transaccional
    fr: API transactionnelle
  description:
    en: "The message can't be sent again from ReputeCast: sensitive variables or attachments weren't stored, or it arrived by SMTP. Send it again from your app."
    vi: 'Không thể gửi lại thư này từ ReputeCast: biến nhạy cảm hoặc tệp đính kèm không được lưu, hoặc thư đến qua SMTP. Hãy gửi lại từ ứng dụng của bạn.'
    de: >-
      Die Nachricht kann nicht erneut aus ReputeCast gesendet werden: Vertrauliche Variablen oder Anhänge wurden nicht
      gespeichert, oder sie kam per SMTP. Senden Sie sie erneut aus Ihrer App.
    es: >-
      El mensaje no se puede volver a enviar desde ReputeCast: las variables confidenciales o los adjuntos no se
      guardaron, o llegó por SMTP. Vuelve a enviarlo desde tu aplicación.
    fr: >-
      Le message ne peut pas être renvoyé depuis ReputeCast : des variables sensibles ou des pièces jointes n’ont pas
      été stockées, ou il est arrivé par SMTP. Renvoyez-le depuis votre application.
- id: not_scheduled
  status: 409
  area:
    en: Transactional API
    vi: API email giao dịch
    de: Transaktions-API
    es: API transaccional
    fr: API transactionnelle
  description:
    en: Only a message waiting for its send time can be cancelled or moved. This one was already cancelled, is on its way or is done; the detail says which.
    vi: Chỉ có thể hủy hoặc dời tin nhắn đang chờ đến giờ gửi. Tin nhắn này đã bị hủy, đang được gửi hoặc đã xong; trường detail cho biết trường hợp nào.
    de: >-
      Nur eine Nachricht, die auf ihren Versandzeitpunkt wartet, kann abgebrochen oder verschoben werden. Diese wurde
      bereits abgebrochen, ist unterwegs oder abgeschlossen; das Feld detail nennt, was zutrifft.
    es: >-
      Solo se puede cancelar o mover un mensaje que espera su hora de envío. Este ya se canceló, está en camino o ha
      terminado; el detalle indica cuál.
    fr: >-
      Seul un message qui attend son heure d’envoi peut être annulé ou déplacé. Celui-ci a déjà été annulé, est en cours
      d’acheminement ou est terminé ; le détail indique lequel.
- id: breaking_change
  status: 409
  area:
    en: Transactional templates
    vi: Mẫu giao dịch
    de: Transaktionsvorlagen
    es: Plantillas transaccionales
    fr: Modèles transactionnels
  description:
    en: The draft changes variables in a way that would break calls made in the last 7 days. Make the variable optional with a default, update your app first, or publish anyway. meta.breaking lists the changes.
    vi: Bản nháp thay đổi biến theo cách sẽ làm hỏng các lệnh gọi trong 7 ngày qua. Hãy chuyển biến thành không bắt buộc với giá trị mặc định, cập nhật ứng dụng của bạn trước, hoặc vẫn xuất bản. meta.breaking liệt kê các thay đổi.
    de: >-
      Der Entwurf ändert Variablen so, dass Aufrufe der letzten 7 Tage nicht mehr funktionieren würden. Machen Sie die
      Variable mit einem Standardwert optional, aktualisieren Sie zuerst Ihre App oder veröffentlichen Sie trotzdem.
      meta.breaking listet die Änderungen auf.
    es: >-
      El borrador cambia las variables de una forma que rompería las llamadas hechas en los últimos 7 días. Haz que la
      variable sea opcional con un valor predeterminado, actualiza antes tu aplicación o publica de todos modos.
      meta.breaking lista los cambios.
    fr: >-
      Le brouillon modifie des variables d’une façon qui casserait les appels effectués au cours des 7 derniers jours.
      Rendez la variable facultative avec une valeur par défaut, mettez d’abord à jour votre application, ou publiez
      quand même. meta.breaking liste les changements.
- id: template_does_not_render
  status: 422
  area:
    en: Transactional templates
    vi: Mẫu giao dịch
    de: Transaktionsvorlagen
    es: Plantillas transaccionales
    fr: Modèles transactionnels
  description:
    en: The template doesn't render with the given data, or the draft can't be published yet. The detail says what fails. Publishing and asking for approval answer 409.
    vi: Mẫu không kết xuất được với dữ liệu đã cho, hoặc bản nháp chưa xuất bản được. Trường detail cho biết lỗi ở đâu. Khi xuất bản và khi gửi yêu cầu phê duyệt, mã này đi kèm 409.
    de: >-
      Die Vorlage lässt sich mit den übergebenen Daten nicht rendern, oder der Entwurf kann noch nicht veröffentlicht
      werden. Das Feld detail nennt, was fehlschlägt. Beim Veröffentlichen und beim Anfordern einer Freigabe antwortet
      die API mit 409.
    es: >-
      La plantilla no se renderiza con los datos indicados, o el borrador aún no se puede publicar. El detalle indica
      qué falla. Publicar y pedir la aprobación responden 409.
    fr: >-
      Le modèle ne se rend pas avec les données fournies, ou le brouillon ne peut pas encore être publié. Le détail
      indique ce qui échoue. La publication et la demande d’approbation répondent 409.
- id: key_revoked
  status: 401
  area:
    en: Integration keys
    vi: Khóa tích hợp
    de: Integrationsschlüssel
    es: Claves de integración
    fr: Clés d’intégration
  description:
    en: The integration's key was revoked. Reconnect the integration in Settings › Integrations to get a new key.
    vi: Khóa của tích hợp đã bị thu hồi. Hãy kết nối lại tích hợp trong Cài đặt › Tích hợp để nhận khóa mới.
    de: >-
      Der Schlüssel der Integration wurde widerrufen. Verbinden Sie die Integration unter Einstellungen › Integrationen
      erneut, um einen neuen Schlüssel zu erhalten.
    es: >-
      La clave de la integración se revocó. Vuelve a conectar la integración en Configuración › Integraciones para
      obtener una clave nueva.
    fr: >-
      La clé de l’intégration a été révoquée. Reconnectez l’intégration dans Paramètres › Intégrations pour obtenir une
      nouvelle clé.
- id: key_expired
  status: 401
  area:
    en: Integration keys
    vi: Khóa tích hợp
    de: Integrationsschlüssel
    es: Claves de integración
    fr: Clés d’intégration
  description:
    en: The integration's key expired. Reconnect the integration in Settings › Integrations to get a new key.
    vi: Khóa của tích hợp đã hết hạn. Hãy kết nối lại tích hợp trong Cài đặt › Tích hợp để nhận khóa mới.
    de: >-
      Der Schlüssel der Integration ist abgelaufen. Verbinden Sie die Integration unter Einstellungen › Integrationen
      erneut, um einen neuen Schlüssel zu erhalten.
    es: >-
      La clave de la integración caducó. Vuelve a conectar la integración en Configuración › Integraciones para obtener
      una clave nueva.
    fr: >-
      La clé de l’intégration a expiré. Reconnectez l’intégration dans Paramètres › Intégrations pour obtenir une
      nouvelle clé.
- id: owner_deactivated
  status: 403
  area:
    en: Integration keys
    vi: Khóa tích hợp
    de: Integrationsschlüssel
    es: Claves de integración
    fr: Clés d’intégration
  description:
    en: The member who owns the integration's key left the workspace, so the key lost its permissions. Someone with integrations:manage can take it over in Settings › Integrations; the key stays the same.
    vi: Thành viên sở hữu khóa của tích hợp đã rời không gian làm việc, nên khóa mất các quyền. Người có quyền integrations:manage có thể tiếp quản khóa trong Cài đặt › Tích hợp; khóa vẫn giữ nguyên.
    de: >-
      Das Mitglied, dem der Schlüssel der Integration gehört, hat den Arbeitsbereich verlassen, daher hat der Schlüssel
      seine Berechtigungen verloren. Wer integrations:manage hat, kann ihn unter Einstellungen › Integrationen
      übernehmen; der Schlüssel bleibt derselbe.
    es: >-
      El miembro propietario de la clave de la integración salió del espacio de trabajo, así que la clave perdió sus
      permisos. Alguien con integrations:manage puede hacerse cargo de ella en Configuración › Integraciones; la clave
      sigue siendo la misma.
    fr: >-
      Le membre propriétaire de la clé de l’intégration a quitté l’espace de travail : la clé a donc perdu ses
      autorisations. Une personne disposant de integrations:manage peut la reprendre dans Paramètres › Intégrations ; la
      clé reste la même.
- id: integration_operation_denied
  status: 403
  area:
    en: Integration keys
    vi: Khóa tích hợp
    de: Integrationsschlüssel
    es: Claves de integración
    fr: Clés d’intégration
  description:
    en: The key belongs to an integration and works only for that integration's turned-on triggers and actions. Change what it can do in Settings › Integrations.
    vi: Khóa này thuộc một tích hợp và chỉ dùng được cho các trình kích hoạt và hành động đang bật của tích hợp đó. Hãy thay đổi những gì khóa được phép làm trong Cài đặt › Tích hợp.
    de: >-
      Der Schlüssel gehört zu einer Integration und funktioniert nur für deren eingeschaltete Trigger und Aktionen.
      Ändern Sie unter Einstellungen › Integrationen, was er darf.
    es: >-
      La clave pertenece a una integración y solo sirve para los disparadores y las acciones activados de esa
      integración. Cambia lo que puede hacer en Configuración › Integraciones.
    fr: >-
      La clé appartient à une intégration et ne fonctionne que pour les déclencheurs et actions activés de cette
      intégration. Modifiez ce qu’elle peut faire dans Paramètres › Intégrations.
- id: instance_unreachable
  status: 409
  area:
    en: Integration keys
    vi: Khóa tích hợp
    de: Integrationsschlüssel
    es: Claves de integración
    fr: Clés d’intégration
  description:
    en: The integration can't reach the instance's public URL. Give the instance a public address, or run the tool on your own network.
    vi: Tích hợp không truy cập được URL công khai của hệ thống. Hãy cấp cho hệ thống một địa chỉ công khai, hoặc chạy công cụ đó trong mạng của bạn.
    de: >-
      Die Integration kann die öffentliche URL der Instanz nicht erreichen. Geben Sie der Instanz eine öffentliche
      Adresse, oder betreiben Sie das Tool in Ihrem eigenen Netzwerk.
    es: >-
      La integración no puede llegar a la URL pública de la instancia. Da a la instancia una dirección pública o ejecuta
      la herramienta en tu propia red.
    fr: >-
      L’intégration ne peut pas joindre l’URL publique de l’instance. Donnez une adresse publique à l’instance, ou
      exécutez l’outil sur votre propre réseau.
- id: managed_by_integration
  status: 409
  area:
    en: Integration keys
    vi: Khóa tích hợp
    de: Integrationsschlüssel
    es: Claves de integración
    fr: Clés d’intégration
  description:
    en: "The API key or webhook endpoint belongs to an integration (Zapier, Make, n8n, WordPress). Change it in Settings › Integrations or in the workflow. An integration's key can't get allowed IPs either: the integration calls from its platform's servers."
    vi: 'Khóa API hoặc endpoint webhook này thuộc một tích hợp (Zapier, Make, n8n, WordPress). Hãy thay đổi trong Cài đặt › Tích hợp hoặc trong workflow. Khóa của tích hợp cũng không thể có IP được phép: tích hợp gọi từ máy chủ của nền tảng đó.'
    de: 'Der API-Schlüssel oder Webhook-Endpunkt gehört zu einer Integration (Zapier, Make, n8n, WordPress). Ändern Sie ihn unter Einstellungen › Integrationen oder im Workflow. Der Schlüssel einer Integration lässt sich auch nicht auf erlaubte IPs beschränken: Die Integration ruft von den Servern ihrer Plattform aus auf.'
    es: 'La clave de API o el endpoint de webhook pertenece a una integración (Zapier, Make, n8n, WordPress). Cámbialo en Configuración › Integraciones o en el flujo de trabajo. La clave de una integración tampoco puede tener IP permitidas: la integración llama desde los servidores de su plataforma.'
    fr: 'La clé API ou l’endpoint de webhook appartient à une intégration (Zapier, Make, n8n, WordPress). Modifiez-le dans Paramètres › Intégrations ou dans le workflow. La clé d’une intégration ne peut pas non plus être limitée à des IP autorisées : l’intégration appelle depuis les serveurs de sa plateforme.'
- id: unsubscribed
  status: 409
  area:
    en: Integration actions
    vi: Hành động tích hợp
    de: Integrationsaktionen
    es: Acciones de integración
    fr: Actions d’intégration
  description:
    en: The contact left the list, and ReputeCast doesn't add people back to a list they left.
    vi: Liên hệ đã rời danh sách, và ReputeCast không thêm lại một người vào danh sách mà họ đã rời.
    de: >-
      Der Kontakt hat sich von der Liste abgemeldet, und ReputeCast trägt niemanden wieder in eine Liste ein, von der
      sich die Person abgemeldet hat.
    es: El contacto salió de la lista, y ReputeCast no vuelve a añadir a nadie a una lista de la que salió.
    fr: Le contact a quitté la liste, et ReputeCast ne réinscrit personne à une liste qu’il a quittée.
- id: suppressed
  status: 409
  area:
    en: Integration actions
    vi: Hành động tích hợp
    de: Integrationsaktionen
    es: Acciones de integración
    fr: Actions d’intégration
  description:
    en: The address is on the suppression list, and ReputeCast doesn't add suppressed addresses. The detail gives the date and reason.
    vi: Địa chỉ nằm trong danh sách chặn gửi, và ReputeCast không thêm địa chỉ bị chặn gửi. Trường detail cho biết ngày và lý do.
    de: >-
      Die Adresse steht auf der Sperrliste, und ReputeCast fügt keine gesperrten Adressen hinzu. Das Feld detail nennt
      Datum und Grund.
    es: >-
      La dirección está en la lista de supresión, y ReputeCast no añade direcciones suprimidas. El detalle indica la
      fecha y el motivo.
    fr: >-
      L’adresse figure sur la liste de suppression, et ReputeCast n’ajoute pas les adresses exclues. Le détail en donne
      la date et le motif.
- id: private_address
  status: 422
  area:
    en: Integration actions
    vi: Hành động tích hợp
    de: Integrationsaktionen
    es: Acciones de integración
    fr: Actions d’intégration
  description:
    en: The webhook address points to a private network. It stays blocked until an instance admin allows private addresses (webhooks.allow_private_networks).
    vi: Địa chỉ webhook trỏ đến một mạng riêng. Địa chỉ này bị chặn cho đến khi quản trị viên hệ thống cho phép địa chỉ riêng (webhooks.allow_private_networks).
    de: >-
      Die Webhook-Adresse zeigt auf ein privates Netzwerk. Sie bleibt blockiert, bis ein Instanz-Admin private Adressen
      erlaubt (webhooks.allow_private_networks).
    es: >-
      La dirección del webhook apunta a una red privada. Seguirá bloqueada hasta que quien administra la instancia
      permita las direcciones privadas (webhooks.allow_private_networks).
    fr: >-
      L’adresse du webhook pointe vers un réseau privé. Elle reste bloquée tant qu’un admin de l’instance n’autorise pas
      les adresses privées (webhooks.allow_private_networks).
- id: certificate_failing
  status: 409
  area:
    en: Website
    vi: Trang web
    de: Website
    es: Sitio web
    fr: Site web
  description:
    en: The custom domain's certificate is failing, so the website can't go live there. Fix it in Branding & domain first.
    vi: Chứng chỉ của tên miền tùy chỉnh đang lỗi, nên trang web chưa thể chạy trên tên miền đó. Hãy sửa trong Thương hiệu và tên miền trước.
    de: >-
      Das Zertifikat der eigenen Domain ist fehlerhaft, daher kann die Website dort nicht online gehen. Beheben Sie das
      zuerst unter Branding & Domain.
    es: >-
      El certificado del dominio personalizado está fallando, así que el sitio web no puede publicarse en él. Corrígelo
      antes en Marca y dominio.
    fr: >-
      Le certificat du domaine personnalisé est en échec : le site web ne peut donc pas y être mis en ligne. Corrigez-le
      d’abord dans Image de marque et domaine.
- id: featured_full
  status: 409
  area:
    en: Website
    vi: Trang web
    de: Website
    es: Sitio web
    fr: Site web
  description:
    en: The home page features up to 3 posts. Unfeature one in Home & navigation first.
    vi: Trang chủ làm nổi bật tối đa 3 bài viết. Hãy bỏ nổi bật một bài trong Trang chủ và điều hướng trước.
    de: >-
      Die Startseite hebt bis zu 3 Beiträge hervor. Heben Sie zuerst unter Startseite & Navigation die Hervorhebung
      eines Beitrags auf.
    es: La página de inicio destaca hasta 3 artículos. Primero deja de destacar uno en Inicio y navegación.
    fr: >-
      La page d’accueil met 3 articles à la une au maximum. Retirez-en d’abord un de la une dans Accueil et navigation.
- id: header_full
  status: 409
  area:
    en: Website
    vi: Trang web
    de: Website
    es: Sitio web
    fr: Site web
  description:
    en: The website header holds up to 6 links. Remove one first.
    vi: Đầu trang web chứa tối đa 6 liên kết. Hãy xóa một liên kết trước.
    de: Der Kopfbereich der Website fasst bis zu 6 Links. Entfernen Sie zuerst einen.
    es: La cabecera del sitio web admite hasta 6 enlaces. Quita uno primero.
    fr: L’en-tête du site web contient 6 liens au maximum. Retirez-en d’abord un.
- id: comment_deleted
  status: 409
  area:
    en: Comments
    vi: Bình luận
    de: Kommentare
    es: Comentarios
    fr: Commentaires
  description:
    en: One of the chosen comments was deleted, and a deleted comment can't be brought back. Pick the others again.
