    vi: Phân khúc SQL đang tắt trên cơ sở dữ liệu này. Hãy tạo role reputecast_segments và cấp role đó cho người dùng của ứng dụng, rồi chạy reputecast migrate up.
    de: >-
      SQL-Segmente sind auf dieser Datenbank deaktiviert. Erstellen Sie die Rolle reputecast_segments, weisen Sie sie
      dem Datenbankbenutzer der App zu und führen Sie dann reputecast migrate up aus.
    es: >-
      Los segmentos SQL están desactivados en esta base de datos. Crea el rol reputecast_segments, concédeselo al
      usuario de la aplicación y después ejecuta reputecast migrate up.
    fr: >-
      Les segments SQL sont désactivés sur cette base de données. Créez le rôle reputecast_segments et accordez-le à
