    vi: Tệp CSV báo cáo của lần nhập đã bị xóa 30 ngày sau khi lần nhập kết thúc, vì nó liệt kê mọi địa chỉ lần nhập đã đọc.
    de: >-
      Der CSV-Bericht des Imports wurde 30 Tage nach Abschluss des Imports gelöscht, da er jede Adresse enthielt, die
      der Import gelesen hat.
    es: >-
      El CSV del informe de la importación se borró 30 días después de terminar la importación, porque listaba todas las
      direcciones que leyó.
    fr: >-
      Le CSV du rapport de l’import a été effacé 30 jours après la fin de l’import, puisqu’il listait chaque adresse lue
      par l’import.
- id: source_auth_failed
  status: 422
  area:
    en: Imports
    vi: Nhập dữ liệu
    de: Importe
    es: Importaciones
    fr: Imports
  description:
    en: The platform you import from (contacts or transactional templates) rejected the API key or credentials. meta.sourceStatus has its HTTP status.
    vi: Nền tảng nguồn mà bạn nhập dữ liệu (liên hệ hoặc mẫu giao dịch) đã từ chối khóa API hoặc thông tin xác thực. meta.sourceStatus chứa mã trạng thái HTTP của nền tảng đó.
    de: >-
      Die Plattform, von der Sie importieren (Kontakte oder Transaktionsvorlagen), hat den API-Schlüssel oder die
      Zugangsdaten abgelehnt. meta.sourceStatus enthält ihren HTTP-Status.
    es: >-
      La plataforma desde la que importas (contactos o plantillas transaccionales) rechazó la clave de API o las
      credenciales. meta.sourceStatus incluye su estado HTTP.
    fr: >-
      La plateforme depuis laquelle vous importez (contacts ou modèles transactionnels) a refusé la clé API ou les
      identifiants. meta.sourceStatus contient son statut HTTP.
- id: source_bad_response
  status: 502
  area:
    en: Imports
    vi: Nhập dữ liệu
    de: Importe
    es: Importaciones
    fr: Imports
