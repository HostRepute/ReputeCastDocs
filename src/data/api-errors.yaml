    vi: Mã giảm giá
    de: Rabattcodes
    es: Códigos de descuento
    fr: Codes de réduction
  description:
    en: The pool's discount exists in the store already, so its kind, value, minimum, end and collections can't change. Create a new pool for another discount.
    vi: Ưu đãi của kho mã đã có trong cửa hàng nên không thể đổi loại, giá trị, mức tối thiểu, thời hạn và bộ sưu tập. Hãy tạo kho mã mới cho ưu đãi khác.
    de: Der Rabatt des Pools existiert im Shop bereits, daher können sich Art, Wert, Mindestbetrag, Ende und Kollektionen nicht mehr ändern. Legen Sie für einen anderen Rabatt einen neuen Pool an.
    es: El descuento del grupo ya existe en la tienda, así que su tipo, valor, mínimo, fin y colecciones no pueden cambiar. Crea un grupo nuevo para otro descuento.
    fr: 'La réduction de la réserve existe déjà dans la boutique : son type, sa valeur, son minimum, sa fin et ses collections ne peuvent donc plus changer. Créez une nouvelle réserve pour une autre réduction.'
- id: pool_archived
  status: 409
  area:
