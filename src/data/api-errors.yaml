# Every stable `code` a client can receive in an RFC 9457 problem body: each api.Err call (and the package wrappers
# that pass a code through to it) and each `.Code = …` set on a problem anywhere in internal/**, plus the source-error
# codes of the importers and the dynamic link_* codes. status = the HTTP status the code usually comes with; the
# description names the exceptions. Codes defined in internal/api but never returned are left out (instance_not_set_up).
# Guarded by pnpm upstream:check.
- id: unauthenticated
  status: 401
  area:
    en: Authentication
  description:
    en: 'No valid session or API key: you aren''t signed in, or the key is unknown, revoked or expired (an expired key''s detail names the date). 401 answers carry WWW-Authenticate: Bearer realm="reputecast".'
- id: session_expired
  status: 401
  area:
    en: Authentication
  description:
    en: The session timed out or ended. Sign in again; unsaved work in the tab is kept.
- id: permission_denied
  status: 403
  area:
    en: Permissions
  description:
    en: The caller lacks a permission. permission names the missing key and helpers lists up to two members who hold it. Also returned for a key used in another workspace and for operations only integration keys may call.
- id: escalation_denied
  status: 403
  area:
    en: Permissions
  description:
    en: You can't grant a permission you don't hold, for example on a role, an API key or an agent. permission names the key when only one is missing.
- id: humans_only
  status: 403
  area:
    en: Permissions
  description:
    en: Only a signed-in person can take this action, not an API key or an MCP agent.
- id: forbidden
  status: 403
  area:
    en: Permissions
  description:
    en: Filtering contacts by paid status needs earn:view.
- id: workspace_not_found
  status: 404
  area:
    en: Requests
  description:
    en: The workspace in the path doesn't exist or the caller isn't a member of it.
- id: not_found
  status: 404
  area:
    en: Requests
  description:
    en: The resource in the path doesn't exist in this workspace. The detail names what is missing, such as "Campaign not found."
- id: conflict
  status: 409
  area:
    en: Requests
  description:
    en: The request conflicts with the resource's current state. The detail says what to change.
- id: validation_failed
  status: 422
  area:
    en: Requests
  description:
    en: The request body or parameters are invalid. errors[] lists each problem with its location, such as body.email. Malformed requests answer 400 with the same code.
- id: rate_limited
  status: 429
  area:
    en: Requests
  description:
    en: "Too many requests: over the rate limit of the IP or the API key, a key's own transactional or conversions rate, or a reminder sent again within the hour. Wait for the Retry-After header."
- id: idempotency_key_reused
  status: 409
  area:
    en: Requests
  description:
    en: 'The same Idempotency-Key came with a different request: within 24 hours for transactional sends, or for another conversion. Use a new key for a new request.'
- id: slug_taken
  status: 409
  area:
    en: Requests
  description:
    en: The address (slug) is used by another post, tag, page or product, now or before. Pick another address.
- id: version_conflict
  status: 409
  area:
    en: Requests
  description:
    en: Someone saved a newer version since you opened it (a campaign, text, email, language version, page or transactional draft). Reload to see their changes, then save again.
- id: provider_unavailable
  status: 502
  area:
    en: Service
  description:
    en: A sending provider or another outside service didn't accept the change or couldn't be reached. The detail has the provider's answer; nothing else was changed. Some actions answer 409 or 503 with this code.
- id: unavailable
  status: 503
  area:
    en: Service
  description:
    en: A part of the server can't answer right now, for example the sign-in policy check. Try again in a moment. A feature missing from this build answers 501.
- id: password_change_required
  status: 403
  area:
    en: Sign-in and account
  description:
    en: The account still has its temporary password. Replace it to continue.
- id: two_factor_setup_required
  status: 403
  area:
    en: Sign-in and account
  description:
    en: The instance requires two-factor authentication. Add a passkey or an authenticator app to continue.
- id: locked
  status: 429
  area:
    en: Sign-in and account
  description:
    en: 'Too many failed sign-ins: the account is locked until the time in the detail. meta carries lockedUntil and failures.'
- id: invalid_credentials
  status: 401
  area:
    en: Sign-in and account
  description:
    en: The email or password is wrong (the detail says how many attempts are left). Connecting a sending provider answers 422 with this code when the provider rejects the credentials.
- id: account_deactivated
  status: 403
  area:
    en: Sign-in and account
  description:
    en: The account is deactivated. An instance admin can reactivate it; nothing was deleted.
- id: challenge_expired
  status: 401
  area:
    en: Sign-in and account
  description:
    en: The sign-in or passkey request expired, or there were too many wrong codes. Start again. Passkey requests answer 400.
- id: email_change_expired
  status: 410
  area:
    en: Sign-in and account
  description:
    en: The email change confirmation link expired, was already used or belongs to another account. Change the email again from Account & security.
- id: identity_managed
  status: 409
  area:
    en: Sign-in and account
  description:
    en: Single sign-on is enforced for the email domain, so the sign-in identity is managed by the organization and can't be unlinked.
- id: invalid_code
  status: 401
  area:
    en: Sign-in and account
  description:
    en: The two-factor code is wrong. meta.attemptsLeft says how many tries are left.
- id: invite_accepted
  status: 410
  area:
    en: Sign-in and account
  description:
    en: The invitation was already used. Sign in to continue.
- id: invite_expired
  status: 410
  area:
    en: Sign-in and account
  description:
    en: The invitation expired. Ask the person who invited you for a new one.
- id: invite_not_found
  status: 404
  area:
    en: Sign-in and account
  description:
    en: The invitation link isn't valid. Check that the whole link was copied, or ask for a new invitation.
- id: invite_revoked
  status: 410
  area:
    en: Sign-in and account
  description:
    en: The invitation was revoked, so the link no longer works.
- id: invite_sign_in
  status: 409
  area:
    en: Sign-in and account
  description:
    en: The invited email already has an account. Sign in to accept the invitation.
- id: invite_wrong_account
  status: 409
  area:
    en: Sign-in and account
  description:
    en: The invitation is for another email than the account you are signed in with. Sign out and continue, or ask for an invitation for this account.
- id: last_method
  status: 409
  area:
    en: Sign-in and account
  description:
    en: This is the account's only way to sign in. Add a passkey or a password before removing or unlinking it.
- id: last_second_factor
  status: 409
  area:
    en: Sign-in and account
  description:
    en: Two-factor is required for the account, and this is its last second factor. Set up an authenticator app or another passkey first.
- id: method_disabled
  status: 403
  area:
    en: Sign-in and account
  description:
    en: This sign-in method (password or passkey) is turned off on the instance. Use another one, such as single sign-on.
- id: passkey_failed
  status: 401
  area:
    en: Sign-in and account
  description:
    en: The passkey didn't work for this account. Try again, or sign in with email and password.
- id: passkey_rejected
  status: 422
  area:
    en: Sign-in and account
  description:
    en: The passkey couldn't be verified. Try again, or use another device or security key.
- id: public_url_invalid
  status: 409
  area:
    en: Sign-in and account
  description:
    en: Passkeys need the instance's public URL, with a domain name rather than an IP address. An instance admin sets it in Instance admin.
- id: reset_expired
  status: 410
  area:
    en: Sign-in and account
  description:
    en: The password reset link is older than 15 minutes or was already used. Request a new one; the current password keeps working.
- id: setup_incomplete
  status: 409
  area:
    en: Sign-in and account
  description:
    en: 'An earlier setup step is not done: replace the temporary password, add a passkey or authenticator app and confirm the instance basics first.'
- id: sso_required
  status: 403
  area:
    en: Sign-in and account
  description:
    en: The email's domain signs in with single sign-on, so password and passkey sign-in are turned off for it.
- id: agency_off
  status: 403
  area:
    en: Instance admin
  description:
    en: Agency mode is off on this instance. An instance admin turns it on in Instance admin › Instance & updates.
- id: last_admin
  status: 409
  area:
    en: Instance admin
  description:
    en: The user is the last instance admin. Make someone else an instance admin first.
- id: lockout_risk
  status: 409
  area:
    en: Instance admin
  description:
    en: The sign-in policy change would leave you no way to sign in. Add a passkey or link a sign-in that stays on, then save again.
- id: reauth_required
  status: 403
  area:
    en: Instance admin
  description:
    en: "Sign in again first: with your identity provider before transferring ownership (within 10 minutes), or with two-factor before resetting someone's two-factor."
- id: restore_expired
  status: 410
  area:
    en: Instance admin
  description:
    en: The workspace was deleted more than 7 days ago and can't be restored.
- id: sso_incomplete
  status: 409
  area:
    en: Single sign-on
  description:
    en: The SSO connection is missing settings needed for a test sign-in or to enable it. The detail lists them.
- id: sso_unreachable
  status: 502
  area:
    en: Single sign-on
  description:
    en: The identity provider couldn't be reached for a test sign-in. The detail has the error.
- id: last_owner
  status: 409
  area:
    en: Team
  description:
    en: "The member is the last Owner: a workspace always keeps at least one Owner, so their role can't be changed and they can't be removed or deactivated. Transfer ownership first."
- id: bulk_terms
  status: 409
  area:
    en: Sending providers and routing
  description:
    en: The provider's terms don't allow bulk or marketing mail on this route. Choose another provider, or keep it and acknowledge the terms. meta.issues lists the routes.
- id: no_route
  status: 422
  area:
    en: Sending providers and routing
  description:
    en: 'The route tester found no provider for this mail: the route has no primary provider yet, or it points at a provider that is no longer connected.'
- id: accessibility_unchecked
  status: 422
  area:
    en: Campaigns and Send Readiness
  description:
    en: The email's accessibility couldn't be checked because the MJML doesn't compile. Edits are saved.
- id: readiness_blocked
  status: 409
  area:
    en: Campaigns and Send Readiness
  description:
    en: Send Readiness still blocks the send (a campaign, digest issue, text, push or WhatsApp campaign). Fix every blocking check first.
- id: readiness_changed
  status: 409
  area:
    en: Campaigns and Send Readiness
  description:
    en: Send Readiness ran again since you looked. Review the new results and confirm again.
- id: readiness_incomplete
  status: 409
  area:
    en: Campaigns and Send Readiness
  description:
    en: Some checks couldn't run. Retry them, or continue with provider data only.
- id: readiness_running
  status: 409
  area:
    en: Campaigns and Send Readiness
  description:
    en: Send Readiness is already running. Try again when it finishes.
- id: readiness_stale
  status: 409
  area:
    en: Campaigns and Send Readiness
  description:
    en: The campaign changed since the checks ran. Run them again before sending.
- id: readiness_unavailable
  status: 503
  area:
    en: Campaigns and Send Readiness
  description:
    en: Send Readiness isn't available in this server process. Try again on a process that runs it.
- id: sending_unavailable
  status: 503
  area:
    en: Campaigns and Send Readiness
  description:
    en: The sending engine isn't running in this installation, so nothing was scheduled. The checks, the schedule and the approval are kept.
- id: approval_invalidated
  status: 409
  area:
    en: Approvals
  description:
    en: The approval no longer covers the campaign because something changed since it was approved. Ask for approval again.
- id: approval_not_required
  status: 409
  area:
    en: Approvals
  description:
    en: No approval rule matches this send, so you can schedule it yourself.
- id: approval_required
  status: 409
  area:
    en: Approvals
  description:
    en: The send or publish needs an approval first. The detail names the rule; ask for approval, then try again. Also returned when publishing a post, a landing page or a transactional template that an approval rule covers.
- id: no_approvers
  status: 409
  area:
    en: Approvals
  description:
    en: The send needs more approvals from other people than the workspace has approvers. An Owner can give campaigns:approve to another role.
- id: no_client_approver
  status: 409
  area:
    en: Approvals
  description:
    en: The send needs client sign-off, and nobody in the client workspace holds the Client approver role yet. Invite the client's approver in Settings › Team.
- id: restore_incomplete
  status: 409
  area:
    en: Approvals
  description:
    en: The campaign still differs from the approved version. Ask for approval again.
- id: no_system_provider
  status: 409
  area:
    en: Audience
  description:
    en: No sending provider is connected to the System stream, so opt-in confirmation emails can't go out yet. Connect one in Sending providers.
- id: file_columns
  status: 422
  area:
    en: Imports
  description:
    en: Some rows of the file don't match its columns. The detail lists them; fix the file or skip those rows.
- id: file_unreadable
  status: 422
  area:
    en: Imports
  description:
    en: The uploaded CSV or XLSX file can't be read. The detail says why.
- id: source_auth_failed
  status: 422
  area:
    en: Imports
  description:
    en: The platform you import from (contacts or transactional templates) rejected the API key or credentials. meta.sourceStatus has its HTTP status.
- id: source_bad_response
  status: 502
  area:
    en: Imports
  description:
    en: The platform you import from answered with something ReputeCast can't read. The detail has what it answered.
- id: source_not_found
  status: 422
  area:
    en: Imports
  description:
    en: The transactional template platform has no such template or version, or the account has nothing to import.
- id: source_rate_limited
  status: 429
  area:
    en: Imports
  description:
    en: The platform you import from is limiting requests. The import slows down; try again later. meta.sourceStatus has its HTTP status.
- id: source_unavailable
  status: 502
  area:
    en: Imports
  description:
    en: The platform you import from didn't answer. Try again in a few minutes.
- id: count_timeout
  status: 504
  area:
    en: Segments
  description:
    en: Counting the segment took longer than 10 seconds. The segment still works at send time.
- id: sql_disabled
  status: 409
  area:
    en: Segments
  description:
    en: SQL segments are turned off on this database. Create the reputecast_segments role and grant it to the app user, then run reputecast migrate up.
- id: sql_error
  status: 422
  area:
    en: Segments
  description:
    en: The SQL segment's query is invalid. The detail has the database message and, when known, the position of the error.
- id: no_verification_service
  status: 409
  area:
    en: Address verification
  description:
    en: No address verification service is connected. Connect one in Settings › Integrations.
- id: nothing_to_check
  status: 409
  area:
    en: Address verification
  description:
    en: 'There is nothing to verify: every selected address was checked in the last 90 days, or the selection is empty.'
- id: accessibility_blocked
  status: 409
  area:
    en: Automations
  description:
    en: The workspace accessibility policy is set to Block and an email in the flow has serious accessibility issues. The detail names the email; fix it, then publish.
- id: template_not_found
  status: 422
  area:
    en: Transactional API
  description:
    en: The template ID doesn't exist in this workspace. Check the ID on Templates.
- id: template_not_published
  status: 422
  area:
    en: Transactional API
  description:
    en: The template has a draft but no live version. Publish it first.
- id: missing_variables
  status: 422
  area:
    en: Transactional API
  description:
    en: A required variable isn't in data. The answer lists which ones.
- id: invalid_recipient
  status: 422
  area:
    en: Transactional API
  description:
    en: The address isn't a valid email address. Validate it in your app.
- id: recipient_suppressed
  status: 422
  area:
    en: Transactional API
  description:
    en: The address bounced, complained or is a spam trap. The answer gives the reason and date.
- id: sender_not_verified
  status: 422
  area:
    en: Transactional API
  description:
    en: The from address isn't a verified Transactional sender. Verify it in Settings › Senders.
- id: attachments_too_large
  status: 422
  area:
    en: Transactional API
  description:
    en: "The message, attachments included, is over the route's size limit: the smallest limit of the route's sending providers."
- id: no_healthy_route
  status: 503
  area:
    en: Transactional API
  description:
    en: Every sending provider in the route is down. Retry with the same idempotency key.
- id: template_not_allowed
  status: 403
  area:
    en: Transactional API
  description:
    en: The key can't send this template or category. Use a key that can, or widen the key's scope.
- id: agents_never_send
  status: 403
  area:
    en: Transactional API
  description:
    en: MCP agents never send transactional mail. Send from your app with a send-only key.
- id: content_removed
  status: 410
  area:
    en: Transactional API
  description:
    en: The message's rendered content is no longer kept (content retention), or it was never rendered. The summary and events stay until metadata retention ends.
- id: resend_unavailable
  status: 409
  area:
    en: Transactional API
  description:
    en: "The message can't be sent again from ReputeCast: sensitive variables or attachments weren't stored, or it arrived by SMTP. Send it again from your app."
- id: breaking_change
  status: 409
  area:
    en: Transactional templates
  description:
    en: The draft changes variables in a way that would break calls made in the last 7 days. Make the variable optional with a default, update your app first, or publish anyway. meta.breaking lists the changes.
- id: template_does_not_render
  status: 422
  area:
    en: Transactional templates
  description:
    en: The template doesn't render with the given data, or the draft can't be published yet. The detail says what fails. Publishing and asking for approval answer 409.
- id: key_revoked
  status: 401
  area:
    en: Integration keys
  description:
    en: The integration's key was revoked. Reconnect the integration in Settings › Integrations to get a new key.
- id: key_expired
  status: 401
  area:
    en: Integration keys
  description:
    en: The integration's key expired. Reconnect the integration in Settings › Integrations to get a new key.
- id: owner_deactivated
  status: 403
  area:
    en: Integration keys
  description:
    en: The member who owns the integration's key left the workspace, so the key lost its permissions. Someone with integrations:manage can take it over in Settings › Integrations; the key stays the same.
- id: integration_operation_denied
  status: 403
  area:
    en: Integration keys
  description:
    en: The key belongs to an integration and works only for that integration's turned-on triggers and actions. Change what it can do in Settings › Integrations.
- id: instance_unreachable
  status: 409
  area:
    en: Integration keys
  description:
    en: The integration can't reach the instance's public URL. Give the instance a public address, or run the tool on your own network.
- id: managed_by_integration
  status: 409
  area:
    en: Integration keys
  description:
    en: The API key or webhook endpoint belongs to an integration (Zapier, Make, n8n, WordPress). Change it in Settings › Integrations or in the workflow.
- id: unsubscribed
  status: 409
  area:
    en: Integration actions
  description:
    en: The contact left the list, and ReputeCast doesn't add people back to a list they left.
- id: suppressed
  status: 409
  area:
    en: Integration actions
  description:
    en: The address is on the suppression list, and ReputeCast doesn't add suppressed addresses. The detail gives the date and reason.
- id: private_address
  status: 422
  area:
    en: Integration actions
  description:
    en: The webhook address points to a private network. It stays blocked until an instance admin allows private addresses (webhooks.allow_private_networks).
- id: certificate_failing
  status: 409
  area:
    en: Website
  description:
    en: The custom domain's certificate is failing, so the website can't go live there. Fix it in Branding & domain first.
- id: featured_full
  status: 409
  area:
    en: Website
  description:
    en: The home page features up to 3 posts. Unfeature one in Home & navigation first.
- id: header_full
  status: 409
  area:
    en: Website
  description:
    en: The website header holds up to 6 links. Remove one first.
- id: nothing_to_publish
  status: 409
  area:
    en: Landing pages
  description:
    en: Nothing changed since the live version, so there's nothing to publish.
- id: reminders_exist
  status: 409
  area:
    en: Landing pages
  description:
    en: The reminder automation for this page already exists.
- id: checks_failed
  status: 409
  area:
    en: Landing pages and products
  description:
    en: A publish check still blocks the page or product. The checks list what is missing.
- id: file_mismatch
  status: 422
  area:
    en: Digital products
  description:
    en: The file's extension doesn't match its content, so buyers would get a file their computer can't open. Upload the right file, or rename it.
- id: file_program
  status: 422
  area:
    en: Digital products
  description:
    en: The file is a program. Programs can't be sold or offered as downloads.
- id: price_change
  status: 409
  area:
    en: Digital products
  description:
    en: 'Publishing changes the price. Confirm it: existing buyers keep their access and nobody is charged again.'
- id: stripe_key_rejected
  status: 409
  area:
    en: Digital products
  description:
    en: Stripe refused the key. Replace it in Earn › Settings › Payments, then publish again.
- id: stripe_not_connected
  status: 409
  area:
    en: Digital products
  description:
    en: "Stripe is not connected. Connect it in Earn › Settings › Payments first: nothing can be bought, and Stripe coupon rewards can't be given, without it."
- id: stripe_permission
  status: 409
  area:
    en: Digital products
  description:
    en: The Stripe key can't create products and prices. Give it those permissions in Stripe, then publish again.
- id: stripe_unavailable
  status: 503
  area:
    en: Digital products
  description:
    en: Stripe didn't answer, so nothing was published or no checkout started and no payment was taken. Try again in a minute.
- id: upload_gone
  status: 404
  area:
    en: Digital products
  description:
    en: The upload stopped and nothing was kept. Choose the file again.
- id: upload_incomplete
  status: 409
  area:
    en: Digital products
  description:
    en: "The upload isn't finished: only part of the file arrived."
- id: upload_offset
  status: 409
  area:
    en: Digital products
  description:
    en: Part of the upload arrived twice. The upload continues from the offset in the detail.
- id: already_complimentary
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: The contact already has complimentary access. Change it instead.
- id: import_not_matched
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: Match the import rows with Stripe first.
- id: import_started
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: The paid members import has already started.
- id: key_format
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: The value doesn't look like a Stripe key. Restricted keys start with rk_live_ or rk_test_.
- id: key_rejected
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: "Stripe says the key isn't valid: it may have been rolled, deleted or copied only in part."
- id: missing_permissions
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: The Stripe key is missing permissions ReputeCast needs. Edit the key in Stripe, then try again.
- id: mode_connected
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: A live or test key is already connected. Replace it from Earn › Settings › Payments.
- id: no_email_column
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: No email column was found in the paid members file. Pick the column that holds addresses.
- id: not_cancelable
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: "The subscription can't be canceled here: it already ended, or it isn't billed through Stripe."
- id: not_connected
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: Stripe isn't connected, so paid members can't be imported or subscriptions canceled from ReputeCast.
- id: other_account
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: The key belongs to another Stripe account than the one connected. Use a key from that account, or disconnect first.
- id: provider_not_available
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: This payment provider isn't available yet. Stripe is the supported provider.
- id: public_url_unreachable
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: Stripe can't reach the instance's public URL to register the webhook. Set REPUTECAST_PUBLIC_URL to an address on the internet, or add the webhook by hand.
- id: secret_key
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: Stripe secret keys are refused because they give full access to the Stripe account. Create a restricted key instead; nothing was sent to Stripe or stored.
- id: tier_has_members
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: "Members have this tier, so it can't be deleted. Archive it instead: they keep access and nobody new can buy it."
- id: unmapped_price
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: A Stripe price in the import isn't mapped to a tier yet. Map it, or keep it as a legacy price.
- id: unsettled_conflict
  status: 422
  area:
    en: Earn and Stripe
  description:
    en: A row matches more than one Stripe customer. Pick the customer the person pays with, or skip the row.
- id: webhook_first
  status: 409
  area:
    en: Earn and Stripe
  description:
    en: Set up the Stripe webhook first. Without it, paid status can't stay in step with Stripe.
- id: invalid_currency
  status: 422
  area:
    en: Conversions
  description:
    en: Send an ISO 4217 currency code, such as USD, EUR or GBP.
- id: invalid_value
  status: 422
  area:
    en: Conversions
  description:
    en: Send the value as a decimal string, such as "29.00", with no more decimals than its currency allows.
- id: missing_identity
  status: 422
  area:
    en: Conversions
  description:
    en: "The conversion names nobody: send the reader's email, the click token (rc_click), or both."
- id: occurred_at_out_of_range
  status: 422
  area:
    en: Conversions
  description:
    en: occurred_at must be within the last 30 days and not in the future.
- id: checks_failing
  status: 409
  area:
    en: Referrals
  description:
    en: Fix the failing checks to turn the referral program on.
- id: last_milestone
  status: 409
  area:
    en: Referrals
  description:
    en: The program needs at least one milestone while it is on. Add another one first, or turn the program off.
- id: link_active
  status: 409
  area:
    en: Referrals
  description:
    en: The referrer's link is already active.
- id: link_paused
  status: 409
  area:
    en: Referrals
  description:
    en: The referrer's link is already paused.
- id: list_fixed
  status: 409
  area:
    en: Referrals
  description:
    en: A program's list can't change once the program has been on.
- id: not_codes
  status: 409
  area:
    en: Referrals
  description:
    en: The milestone's reward isn't a code from a list.
- id: not_held
  status: 409
  area:
    en: Referrals
  description:
    en: Some of the referrals aren't held for review any more. Reload the queue.
- id: program_exists
  status: 409
  area:
    en: Referrals
  description:
    en: The list already has a referral program. Each list has one.
- id: program_on
  status: 409
  area:
    en: Referrals
  description:
    en: Turn the referral program off before deleting it.
- id: stale_settings
  status: 409
  area:
    en: Referrals
  description:
    en: Someone saved the program settings since you opened them. Reload to see their changes, then save yours.
- id: undo_late
  status: 409
  area:
    en: Referrals
  description:
    en: 'Undo is no longer possible: the decision was made more than 10 seconds ago, or a reward has gone out.'
- id: code_expired
  status: 422
  area:
    en: Recommendations and partners
  description:
    en: The partner code expired. Partner codes work for 7 days; ask the newsletter for a new one.
- id: code_revoked
  status: 422
  area:
    en: Recommendations and partners
  description:
    en: The newsletter revoked the partner code. Ask them for a new one.
- id: code_unknown
  status: 422
  area:
    en: Recommendations and partners
  description:
    en: The partner instance doesn't know the code. Check that all of it was copied.
- id: code_used
  status: 422
  area:
    en: Recommendations and partners
  description:
    en: The partner code was already used. Each code connects once; ask for a new one.
- id: link_ended
  status: 409
  area:
    en: Recommendations and partners
  description:
    en: The partnership has ended. Reconnecting needs a new partner code.
- id: link_invalid
  status: 409
  area:
    en: Recommendations and partners
  description:
    en: The partner link is no longer valid, so it can't be paused, resumed or given a new secret. Reconnecting needs a new partner code.
- id: no_public_url
  status: 409
  area:
    en: Recommendations and partners
  description:
    en: Partner links need the instance's public URL. An instance admin sets it.
- id: not_a_code
  status: 422
  area:
    en: Recommendations and partners
  description:
    en: The value isn't a partner code (it may be a link to a subscribe page). Partner codes look like https://reputecast.example/p/XXXX-XXXX-XXXX.
- id: not_recommending_you
  status: 409
  area:
    en: Recommendations and partners
  description:
    en: Only partners that recommend you have a daily limit you set.
- id: partner_link
  status: 409
  area:
    en: Recommendations and partners
  description:
    en: A partner recommendation is paused with its partner link, which needs grow:connect.
- id: partner_private
  status: 422
  area:
    en: Recommendations and partners
  description:
    en: The partner address is private. Partner instances must answer at a public HTTPS address.
- id: partner_unreachable
  status: 422
  area:
    en: Recommendations and partners
  description:
    en: The partner instance didn't answer over HTTPS. Check the address, or try again in a few minutes. Answers 502 for an existing link.
- id: partner_unsupported
  status: 422
  area:
    en: Recommendations and partners
  description:
    en: The partner instance runs a ReputeCast version without partner links. Ask them to update, or recommend their subscribe page as a link.
- id: paused_by_partner
  status: 409
  area:
    en: Recommendations and partners
  description:
    en: The partner paused this link. Only they can resume it.
- id: not_a_push_site
  status: 409
  area:
    en: Web push
  description:
    en: The prompt's site isn't a push site yet. Add it in Push setup; readers can't subscribe until it is.
- id: push_off
  status: 409
  area:
    en: Web push
  description:
    en: "Turn push on in Sending providers › Push first: prompts subscribe readers with the workspace's keys."
- id: stale_version
  status: 409
  area:
    en: Web push and WhatsApp
  description:
    en: The campaign changed since you opened or reviewed it. Reload or review it again.
- id: credentials_rejected
  status: 422
  area:
    en: SMS
  description:
    en: The SMS provider rejected the credentials. Check them and try again.
- id: no_sender
  status: 409
  area:
    en: SMS
  description:
    en: No sender can text the country of this number yet. Add a route for it in Routing & rules.
- id: opted_out_by_text
  status: 409
  area:
    en: SMS
  description:
    en: The number opted out by text. Only the person can come back, by texting START.
- id: provider_unreachable
  status: 502
  area:
    en: SMS
  description:
    en: The SMS provider didn't answer. Try again in a minute.
- id: review_changed
  status: 409
  area:
    en: SMS
  description:
    en: The text, audience, routes or costs changed since you reviewed them. Look again and confirm.
- id: meta_error
  status: 502
  area:
    en: WhatsApp
  description:
    en: Meta answered with an error. The detail has its message.
- id: meta_unavailable
  status: 502
  area:
    en: WhatsApp
  description:
    en: Meta's Graph API didn't answer. Try again in a moment.
- id: token_rejected
  status: 502
  area:
    en: WhatsApp
  description:
    en: Meta rejected the access token. Replace it to sync templates.
- id: window_closed
  status: 409
  area:
    en: WhatsApp
  description:
    en: The 24-hour customer service window is closed, so a free-form reply can't be sent. Send an approved template instead.
- id: ai_cap_reached
  status: 409
  area:
    en: AI assistant
  description:
    en: This month's AI token cap or budget is used up. AI features return on the date in the detail, or someone with integrations:manage can raise the cap.
- id: ai_demo_model
  status: 409
  area:
    en: AI assistant
  description:
    en: The demo's sample model only answers in development and only translates into Spanish and German. Connect your own model.
- id: ai_feature_off
  status: 409
  area:
    en: AI assistant
  description:
    en: This AI feature is turned off for the workspace. Someone with integrations:manage can turn it on in Settings › Integrations · AI assistant.
- id: ai_key_rejected
  status: 409
  area:
    en: AI assistant
  description:
    en: The model provider rejected the workspace's key, so nothing was sent. Someone with integrations:manage can replace it. A key rejected during the call answers 502.
- id: ai_no_image_input
  status: 409
  area:
    en: AI assistant
  description:
    en: Alt text needs a model that reads images, and the connected model does not.
- id: ai_not_configured
  status: 409
  area:
    en: AI assistant
  description:
    en: No AI model is connected to the workspace. Connect one in Settings › Integrations · AI assistant.
- id: ai_not_sent
  status: 409
  area:
    en: AI assistant
  description:
    en: The campaign hasn't sent anything yet, so there are no results to summarize.
- id: ai_one_model
  status: 409
  area:
    en: AI assistant
  description:
    en: A workspace has one AI model. Disconnect the current provider first to switch.
- id: ai_private_address
  status: 422
  area:
    en: AI assistant
  description:
    en: The model's address is private and the instance doesn't allow private addresses. An instance admin can allow them. Answers 502 when found during a call.
- id: ai_provider_error
  status: 502
  area:
    en: AI assistant
  description:
    en: The model provider's answer couldn't be read or it failed, so nothing was changed. A timeout answers 504.
- id: ai_rate_limited
  status: 503
  area:
    en: AI assistant
  description:
    en: The model provider is limiting requests from the workspace. Try again after the time in the detail; nothing was changed.
- id: ai_source_changed
  status: 409
  area:
    en: AI assistant
  description:
    en: The email changed since the translation was made. Translate it again.
- id: ai_suggestion_gone
  status: 409
  area:
    en: AI assistant
  description:
    en: The suggestion isn't yours or is older than a day. Ask for a new one.
- id: ai_test_failed
  status: 422
  area:
    en: AI assistant
  description:
    en: The test call to the model failed, so the settings were not saved. meta.test has the result.
- id: hostrepute_error
  status: 502
  area:
    en: HostRepute and deliverability
  description:
    en: HostRepute answered with an error. Nothing was saved.
- id: hostrepute_reconnect
  status: 409
  area:
    en: HostRepute and deliverability
  description:
    en: HostRepute rejected the token. Reconnect HostRepute, then try again.
- id: hostrepute_required
  status: 409
  area:
    en: HostRepute and deliverability
  description:
    en: Delisting requests go through HostRepute, which isn't connected. Request delisting on the blocklist's own page instead (meta.delistUrl).
- id: hostrepute_scope
  status: 409
  area:
    en: HostRepute and deliverability
  description:
    en: The HostRepute connection lacks the assets:write scope, so assets can't be added to monitoring. Reconnect HostRepute and approve it.
- id: hostrepute_unavailable
  status: 503
  area:
    en: HostRepute and deliverability
  description:
    en: HostRepute couldn't be reached. Nothing was saved.
- id: monitor_limit_reached
  status: 409
  area:
    en: HostRepute and deliverability
  description:
    en: The HostRepute team's plan monitors no more assets. This is a HostRepute limit, not a ReputeCast one.
- id: oauth_not_set_up
  status: 409
  area:
    en: Placement tests
  description:
    en: The provider's sign-in app isn't set up for seed mailboxes. An instance admin adds its client ID and secret in Instance admin › Authentication.
- id: placement_copies_gone
  status: 409
  area:
    en: Placement tests
  description:
    en: The copies were already deleted from the seed mailboxes.
- id: placement_not_ready
  status: 409
  area:
    en: Placement tests
  description:
    en: The placement test can't start yet. The detail and meta.problems say what is missing.
- id: placement_not_waiting
  status: 409
  area:
    en: Placement tests
  description:
    en: The test isn't waiting for copies any more.
- id: digest_feed_unread
  status: 409
  area:
    en: Recurring digests
  description:
    en: The digest's feed hasn't been read yet. Read it once before turning the digest on.
- id: digest_needs_audience
  status: 409
  area:
    en: Recurring digests
  description:
    en: Pick an audience before turning the digest on.
- id: tests_unavailable
  status: 503
  area:
    en: Recurring digests
  description:
    en: Test sends aren't available in this server process.
- id: survey_incomplete
  status: 422
  area:
    en: Polls and surveys
  description:
    en: Every survey question must be complete before publishing. The detail lists what is missing.
- id: store_not_connected
  status: 409
  area:
    en: Stores
  description:
    en: No WooCommerce store is connected at the address the plugin calls from. Connect it in Settings › Integrations first.
- id: store_rate_limited
  status: 429
  area:
    en: Stores
  description:
    en: Shopify or WooCommerce is limiting requests. The sync slows down and carries on by itself.
- id: store_unavailable
  status: 503
  area:
    en: Stores
  description:
    en: Shopify or WooCommerce didn't answer. Try again in a few minutes.
