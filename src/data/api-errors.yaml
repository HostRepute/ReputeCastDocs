      intentarlo en un minuto.
    fr: >-
      Litmus ou Mailgun Inspect n’a pas pu être joint ou a répondu par une erreur. Le détail indique lequel ; réessayez
      dans une minute.
- id: approval_covers_time
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
    de: Freigaben
    es: Aprobaciones
    fr: Approbations
  description:
    en: The campaign was approved for its time, so it can't be moved. Unschedule it and ask for approval at the new time.
    vi: Chiến dịch đã được phê duyệt cho thời điểm hiện tại, nên không thể dời lịch. Hãy hủy lịch gửi và xin phê duyệt cho thời điểm mới.
    de: >-
      Die Kampagne wurde für ihren Zeitpunkt freigegeben und kann daher nicht verschoben werden. Heben Sie die Planung
      auf und fordern Sie eine Freigabe für den neuen Zeitpunkt an.
    es: >-
      La campaña se aprobó para su hora, así que no se puede mover. Cancela su programación y pide la aprobación para la
      nueva hora.
    fr: >-
      La campagne a été approuvée pour son heure d’envoi : elle ne peut donc pas être déplacée. Déprogrammez-la et
      demandez une approbation pour la nouvelle heure.
- id: approval_invalidated
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
    de: Freigaben
    es: Aprobaciones
    fr: Approbations
  description:
    en: The approval no longer covers the campaign because something changed since it was approved. Ask for approval again.
    vi: Phê duyệt không còn áp dụng cho chiến dịch vì đã có thay đổi sau khi được phê duyệt. Hãy gửi lại yêu cầu phê duyệt.
    de: >-
      Die Freigabe deckt die Kampagne nicht mehr ab, weil sich seit der Freigabe etwas geändert hat. Fordern Sie die
      Freigabe erneut an.
    es: La aprobación ya no cubre la campaña porque algo cambió desde que se aprobó. Vuelve a pedir la aprobación.
    fr: >-
      L’approbation ne couvre plus la campagne, car quelque chose a changé depuis son approbation. Demandez de nouveau
      une approbation.
- id: approval_not_required
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
    de: Freigaben
    es: Aprobaciones
    fr: Approbations
  description:
    en: No approval rule matches this send, so you can schedule it yourself.
    vi: Không có quy tắc phê duyệt nào khớp với lần gửi này, nên bạn có thể tự lên lịch.
    de: Keine Freigaberegel trifft auf diesen Versand zu, Sie können ihn also selbst planen.
    es: Ninguna regla de aprobación se aplica a este envío, así que puedes programarlo tú.
    fr: 'Aucune règle d’approbation ne s’applique à cet envoi : vous pouvez le programmer vous-même.'
- id: approval_required
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
    de: Freigaben
    es: Aprobaciones
    fr: Approbations
  description:
    en: The send or publish needs an approval first. The detail names the rule; ask for approval, then try again. Also returned when publishing a post, a landing page or a transactional template that an approval rule covers, and when a post import would publish its posts (import them as drafts instead).
    vi: Lần gửi hoặc xuất bản này cần được phê duyệt trước. Trường detail ghi tên quy tắc; hãy gửi yêu cầu phê duyệt rồi thử lại. Mã này cũng được trả về khi xuất bản bài viết, trang đích hoặc mẫu giao dịch thuộc phạm vi của một quy tắc phê duyệt, và khi một lượt nhập bài viết sẽ xuất bản các bài (hãy nhập dưới dạng bản nháp).
    de: Der Versand oder die Veröffentlichung braucht zuerst eine Freigabe. Das Feld detail nennt die Regel; fordern Sie eine Freigabe an und versuchen Sie es dann erneut. Wird auch zurückgegeben, wenn ein Beitrag, eine Landingpage oder eine Transaktionsvorlage veröffentlicht wird, für die eine Freigaberegel gilt, und wenn ein Beitragsimport seine Beiträge veröffentlichen würde (importieren Sie sie stattdessen als Entwürfe).
    es: El envío o la publicación necesita antes una aprobación. El detalle nombra la regla; pide la aprobación y vuelve a intentarlo. También se devuelve al publicar un artículo, una página de destino o una plantilla transaccional que cubre una regla de aprobación, y cuando una importación de artículos los publicaría (impórtalos como borradores).
    fr: L’envoi ou la publication nécessite d’abord une approbation. Le détail nomme la règle ; demandez une approbation, puis réessayez. Également renvoyé lors de la publication d’un article, d’une page d’atterrissage ou d’un modèle transactionnel couvert par une règle d’approbation, et quand un import d’articles les publierait (importez-les plutôt comme brouillons).
- id: approval_would_cancel
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
    de: Freigaben
    es: Aprobaciones
    fr: Approbations
  description:
    en: Saving the content would withdraw the campaign's pending approval request or cancel its approval, so it would need approval again before it sends. meta has the request's status, approvers and version. Save again with cancelApproval set to true to go ahead.
    vi: Lưu nội dung sẽ rút lại yêu cầu phê duyệt đang chờ hoặc hủy phê duyệt của chiến dịch, nên chiến dịch cần được phê duyệt lại trước khi gửi. Trường meta có trạng thái, người phê duyệt và phiên bản của yêu cầu. Hãy lưu lại với cancelApproval đặt là true để tiếp tục.
    de: >-
      Beim Speichern des Inhalts würde die ausstehende Freigabeanfrage der Kampagne zurückgezogen oder ihre Freigabe
      aufgehoben, sodass sie vor dem Versand erneut freigegeben werden müsste. Das Feld meta enthält den Status, die
      freigebenden Personen und die Version der Anfrage. Speichern Sie erneut mit cancelApproval auf true, um
      fortzufahren.
    es: >-
      Guardar el contenido retiraría la solicitud de aprobación pendiente de la campaña o cancelaría su aprobación, así
      que necesitaría aprobarse de nuevo antes de enviarse. meta incluye el estado, los aprobadores y la versión de la
      solicitud. Vuelve a guardar con cancelApproval en true para continuar.
    fr: >-
      Enregistrer le contenu retirerait la demande d’approbation en attente de la campagne ou annulerait son
      approbation : elle devrait donc être de nouveau approuvée avant l’envoi. meta contient l’état de la demande, les
      approbateurs et la version. Enregistrez de nouveau avec cancelApproval défini sur true pour continuer.
- id: no_approvers
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
    de: Freigaben
    es: Aprobaciones
    fr: Approbations
  description:
    en: The send needs more approvals from other people than the workspace has approvers. An Owner can give campaigns:approve to another role.
    vi: Lần gửi cần nhiều lượt phê duyệt từ người khác hơn số người phê duyệt mà không gian làm việc có. Chủ sở hữu có thể cấp campaigns:approve cho một vai trò khác.
    de: >-
      Der Versand braucht mehr Freigaben von anderen Personen, als der Arbeitsbereich freigebende Personen hat. Ein
      Inhaber kann campaigns:approve einer weiteren Rolle geben.
    es: >-
      El envío necesita más aprobaciones de otras personas que aprobadores tiene el espacio de trabajo. Un Propietario
      puede dar campaigns:approve a otro rol.
    fr: >-
      L’envoi nécessite plus d’approbations d’autres personnes que l’espace de travail ne compte d’approbateurs. Un
      Propriétaire peut accorder campaigns:approve à un autre rôle.
- id: no_client_approver
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
    de: Freigaben
    es: Aprobaciones
    fr: Approbations
  description:
    en: The send needs client sign-off, and nobody in the client workspace holds the Client approver role yet. Invite the client's approver in Settings › Team.
    vi: Lần gửi cần phê duyệt của khách hàng, nhưng chưa ai trong không gian làm việc của khách hàng có vai trò Người duyệt phía khách hàng. Hãy mời người duyệt của khách hàng trong Cài đặt › Nhóm.
    de: >-
      Der Versand braucht eine Kundenfreigabe, und im Kunden-Arbeitsbereich hat noch niemand die Rolle Freigeber
      (Kunde). Laden Sie die freigebende Person des Kunden unter Einstellungen › Team ein.
    es: >-
      El envío necesita el visto bueno del cliente y nadie del espacio de trabajo del cliente tiene aún el rol Aprobador
      del cliente. Invita a quien aprueba por parte del cliente en Configuración › Equipo.
    fr: >-
      L’envoi nécessite une validation client, et personne dans l’espace de travail client n’a encore le rôle
      Approbateur client. Invitez l’approbateur du client dans Paramètres › Équipe.
- id: restore_incomplete
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
    de: Freigaben
    es: Aprobaciones
    fr: Approbations
  description:
    en: The campaign still differs from the approved version. Ask for approval again.
    vi: Chiến dịch vẫn khác phiên bản đã được phê duyệt. Hãy gửi lại yêu cầu phê duyệt.
    de: Die Kampagne weicht noch von der freigegebenen Version ab. Fordern Sie die Freigabe erneut an.
    es: La campaña sigue siendo distinta de la versión aprobada. Vuelve a pedir la aprobación.
    fr: La campagne diffère toujours de la version approuvée. Demandez de nouveau une approbation.
- id: confirm_erase
  status: 409
  area:
    en: Audience
    vi: Người đăng ký
    de: Zielgruppe
    es: Audiencia
    fr: Audience
  description:
    en: Turning on the sunset policy's erase step, or erasing sooner than before, can't be undone and needs confirmation. meta has the dry run (erase, kept, from); save again with confirmErase set to ERASE.
    vi: Bật bước xóa vĩnh viễn của chính sách ngừng gửi dần, hoặc xóa sớm hơn trước, là không thể hoàn tác nên cần xác nhận. Trường meta có kết quả chạy thử (erase, kept, from); hãy lưu lại với confirmErase đặt là ERASE.
    de: >-
      Das Aktivieren des Schritts zum endgültigen Löschen in der Auslaufregel oder ein früheres endgültiges Löschen als
      bisher kann nicht rückgängig gemacht werden und muss bestätigt werden. Das Feld meta enthält den Probelauf (erase,
      kept, from); speichern Sie erneut mit confirmErase auf ERASE.
    es: >-
      Activar el paso de borrado de la política de retirada, o borrar antes que hasta ahora, no se puede deshacer y
      requiere confirmación. meta incluye la simulación (erase, kept, from); vuelve a guardar con confirmErase en ERASE.
    fr: >-
      L’activation de l’étape d’effacement de la politique d’arrêt progressif, ou un effacement plus précoce
      qu’auparavant, est irréversible et nécessite une confirmation. meta contient la simulation (erase, kept, from) ;
      enregistrez de nouveau avec confirmErase défini sur ERASE.
- id: email_suppressed
  status: 409
  area:
    en: Audience
    vi: Người đăng ký
    de: Zielgruppe
    es: Audiencia
    fr: Audience
  description:
    en: The contact's new address is suppressed. The detail names the reason; remove the address from Suppressions first.
    vi: Địa chỉ mới của liên hệ đang bị chặn gửi. Trường detail ghi lý do; hãy gỡ địa chỉ khỏi danh sách chặn gửi trước.
    de: >-
      Die neue Adresse des Kontakts ist gesperrt. Das Feld detail nennt den Grund; entfernen Sie die Adresse zuerst von
      der Sperrliste.
    es: >-
      La nueva dirección del contacto está suprimida. El detalle indica el motivo; quita antes la dirección de la Lista
      de supresión.
    fr: >-
      La nouvelle adresse du contact est exclue. Le détail en donne le motif ; retirez d’abord l’adresse de
      Suppressions.
- id: email_taken
  status: 409
  area:
    en: Audience
    vi: Người đăng ký
    de: Zielgruppe
    es: Audiencia
    fr: Audience
  description:
    en: Another contact already has the new address. meta has that contact's contactId and name.
    vi: Một liên hệ khác đã dùng địa chỉ mới này. Trường meta có contactId và name của liên hệ đó.
    de: Ein anderer Kontakt hat bereits die neue Adresse. Das Feld meta enthält contactId und name dieses Kontakts.
    es: Otro contacto ya tiene la nueva dirección. meta incluye el contactId y el nombre de ese contacto.
    fr: Un autre contact a déjà la nouvelle adresse. meta contient le contactId et le name de ce contact.
- id: field_deleted
  status: 409
  area:
    en: Audience
    vi: Người đăng ký
    de: Zielgruppe
    es: Audiencia
    fr: Audience
  description:
    en: A deleted custom field keeps its key until its values are removed, 30 days after it was deleted. Restore that field (meta.fieldId), or wait until the date the detail names.
    vi: Trường tùy chỉnh đã xóa vẫn giữ khóa của nó cho đến khi giá trị bị xóa, 30 ngày sau khi trường bị xóa. Hãy khôi phục trường đó (meta.fieldId), hoặc đợi đến ngày ghi trong trường detail.
    de: >-
      Ein gelöschtes eigenes Feld behält seinen Schlüssel, bis seine Werte entfernt werden, 30 Tage nach dem Löschen.
      Stellen Sie dieses Feld wieder her (meta.fieldId), oder warten Sie bis zu dem Datum, das das Feld detail nennt.
    es: >-
      Un campo personalizado eliminado conserva su clave hasta que se quitan sus valores, 30 días después de eliminarlo.
      Restaura ese campo (meta.fieldId) o espera hasta la fecha que indica el detalle.
    fr: >-
      Un champ personnalisé supprimé conserve sa clé jusqu’à ce que ses valeurs soient retirées, 30 jours après sa
      suppression. Restaurez ce champ (meta.fieldId), ou attendez la date indiquée dans le détail.
- id: no_system_provider
  status: 409
  area:
    en: Audience
    vi: Người đăng ký
    de: Zielgruppe
    es: Audiencia
    fr: Audience
  description:
    en: No sending provider is connected to the System stream, so opt-in confirmation emails can't go out yet. Connect one in Sending providers.
    vi: Chưa có nhà cung cấp gửi thư nào được kết nối với luồng Hệ thống, nên chưa gửi được email xác nhận đăng ký. Hãy kết nối một nhà cung cấp trong Nhà cung cấp gửi thư.
    de: >-
      Mit dem Stream System ist kein Versandanbieter verbunden, daher können noch keine Opt-in-Bestätigungen per E-Mail
      versendet werden. Verbinden Sie einen unter Versandanbieter.
    es: >-
      No hay ningún proveedor de envío conectado al flujo Sistema, así que aún no pueden salir los correos de
      confirmación de alta. Conecta uno en Proveedores de envío.
    fr: >-
      Aucun fournisseur d’envoi n’est connecté au flux Système : les e-mails de confirmation d’inscription ne peuvent
      donc pas encore partir. Connectez-en un dans Fournisseurs d’envoi.
- id: paid_members
  status: 409
  area:
    en: Audience
    vi: Người đăng ký
    de: Zielgruppe
    es: Audiencia
    fr: Audience
  description:
    en: "Some selected contacts still pay through Stripe, so nothing was erased. Cancel their paid subscription in Earn › Paid members first: erasing them wouldn't stop Stripe from charging. meta has refused and matched."
    vi: 'Một số liên hệ đã chọn vẫn đang trả phí qua Stripe, nên không liên hệ nào bị xóa vĩnh viễn. Hãy hủy gói trả phí của họ trong Earn › Hội viên trả phí trước: xóa vĩnh viễn ở đây không khiến Stripe ngừng thu tiền. Trường meta có refused và matched.'
    de: >-
      Einige ausgewählte Kontakte zahlen noch über Stripe, daher wurde nichts endgültig gelöscht. Kündigen Sie zuerst
      ihr Bezahlabo unter Einnahmen › Zahlende Mitglieder: Ein endgültiges Löschen würde nicht verhindern, dass Stripe
      weiter Zahlungen einzieht. Das Feld meta enthält refused und matched.
    es: >-
      Algunos contactos seleccionados aún pagan a través de Stripe, así que no se borró nada. Cancela antes su
      suscripción de pago en Monetización › Suscriptores de pago: borrarlos no impediría que Stripe les siguiera
      cobrando. meta incluye refused y matched.
    fr: >-
      Certains contacts sélectionnés paient encore via Stripe : rien n’a donc été effacé. Résiliez d’abord leur
      abonnement payant dans Monétisation › Abonnés payants : les effacer n’empêcherait pas Stripe de les débiter. meta
      contient refused et matched.
- id: file_columns
  status: 422
  area:
    en: Imports
    vi: Nhập dữ liệu
    de: Importe
    es: Importaciones
    fr: Imports
