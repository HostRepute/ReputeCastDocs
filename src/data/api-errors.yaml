    de: >-
      Einige Zeilen der Datei passen nicht zu ihren Spalten. Das Feld detail listet sie auf; korrigieren Sie die Datei
      oder überspringen Sie diese Zeilen.
    es: >-
      Algunas filas del archivo no coinciden con sus columnas. El detalle las lista; corrige el archivo u omite esas
      filas.
    fr: >-
      Certaines lignes du fichier ne correspondent pas à ses colonnes. Le détail les liste ; corrigez le fichier ou
      ignorez ces lignes.
- id: file_unreadable
  status: 422
  area:
    en: Imports
    vi: Nhập dữ liệu
    de: Importe
    es: Importaciones
    fr: Imports
  description:
    en: The uploaded CSV or XLSX file can't be read. The detail says why.
    vi: Không đọc được tệp CSV hoặc XLSX đã tải lên. Trường detail cho biết lý do.
    de: Die hochgeladene CSV- oder XLSX-Datei kann nicht gelesen werden. Das Feld detail nennt den Grund.
    es: El archivo CSV o XLSX subido no se puede leer. El detalle indica por qué.
    fr: Le fichier CSV ou XLSX importé ne peut pas être lu. Le détail indique pourquoi.
- id: report_cleared
  status: 410
  area:
    en: Imports
    vi: Nhập dữ liệu
    de: Importe
    es: Importaciones
    fr: Imports
  description:
