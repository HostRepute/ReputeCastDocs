    vi: Nền tảng nguồn mà bạn nhập dữ liệu đang giới hạn yêu cầu. Quá trình nhập chậm lại; hãy thử lại sau. meta.sourceStatus chứa mã trạng thái HTTP của nền tảng đó.
    de: >-
      Die Plattform, von der Sie importieren, drosselt die Anfragen. Der Import wird langsamer; versuchen Sie es später
      erneut. meta.sourceStatus enthält ihren HTTP-Status.
    es: >-
      La plataforma desde la que importas está limitando las solicitudes. La importación se ralentiza; vuelve a
      intentarlo más tarde. meta.sourceStatus incluye su estado HTTP.
    fr: >-
      La plateforme depuis laquelle vous importez limite les requêtes. L’import ralentit ; réessayez plus tard.
      meta.sourceStatus contient son statut HTTP.
- id: source_unavailable
  status: 502
  area:
    en: Imports
    vi: Nhập dữ liệu
