# Every stable `code` a client can receive in an RFC 9457 problem body: each api.Err call (and the package wrappers
# that pass a code through to it) and each `.Code = …` set on a problem anywhere in internal/**, plus the source-error
# codes of the importers and the dynamic link_* codes. status = the HTTP status the code usually comes with; the
# description names the exceptions. Codes defined in internal/api but never returned are left out (instance_not_set_up).
# Guarded by pnpm upstream:check.
- id: unauthenticated
  status: 401
  area:
    en: Authentication
    vi: Xác thực
    de: Authentifizierung
    es: Autenticación
    fr: Authentification
  description:
    en: 'No valid session or API key: you aren''t signed in, or the key is unknown, revoked or expired (an expired key''s detail names the date). 401 answers carry WWW-Authenticate: Bearer realm="reputecast".'
    vi: 'Không có phiên đăng nhập hoặc khóa API hợp lệ: bạn chưa đăng nhập, hoặc khóa không tồn tại, đã bị thu hồi hay đã hết hạn (với khóa hết hạn, trường detail ghi ngày hết hạn). Phản hồi 401 có header WWW-Authenticate: Bearer realm="reputecast".'
    de: >-
      Keine gültige Sitzung und kein gültiger API-Schlüssel: Sie sind nicht angemeldet, oder der Schlüssel ist
      unbekannt, widerrufen oder abgelaufen (bei einem abgelaufenen Schlüssel nennt das Feld detail das Datum).
      Antworten mit 401 enthalten den Header WWW-Authenticate: Bearer realm="reputecast".
    es: >-
      No hay una sesión ni una clave de API válidas: no has iniciado sesión, o la clave es desconocida, está revocada o
      ha caducado (el detalle de una clave caducada indica la fecha). Las respuestas 401 llevan WWW-Authenticate: Bearer
      realm="reputecast".
    fr: >-
      Aucune session ni clé API valide : vous n’êtes pas connecté, ou la clé est inconnue, révoquée ou expirée (le
      détail d’une clé expirée indique la date). Les réponses 401 portent WWW-Authenticate: Bearer realm="reputecast".
- id: session_expired
  status: 401
  area:
    en: Authentication
    vi: Xác thực
    de: Authentifizierung
    es: Autenticación
    fr: Authentification
  description:
    en: The session timed out or ended. Sign in again; unsaved work in the tab is kept.
    vi: Phiên đăng nhập đã hết hạn hoặc đã kết thúc. Hãy đăng nhập lại; nội dung chưa lưu trong thẻ vẫn được giữ.
    de: >-
      Die Sitzung ist abgelaufen oder wurde beendet. Melden Sie sich erneut an; nicht gespeicherte Arbeit im Tab bleibt
      erhalten.
    es: >-
      La sesión caducó por inactividad o terminó. Vuelve a iniciar sesión; el trabajo sin guardar de la pestaña se
      conserva.
    fr: La session a expiré ou s’est terminée. Reconnectez-vous ; le travail non enregistré dans l’onglet est conservé.
- id: unauthorized
  status: 401
  area:
    en: Authentication
    vi: Xác thực
    de: Authentifizierung
    es: Autenticación
    fr: Authentification
  description:
    en: Loading the sample workspace needs a signed-in person. Sign in first.
    vi: Muốn tải không gian làm việc mẫu, bạn cần đăng nhập. Hãy đăng nhập trước.
    de: Zum Laden des Demo-Arbeitsbereichs muss eine Person angemeldet sein. Melden Sie sich zuerst an.
    es: Cargar el espacio de trabajo de ejemplo requiere una persona con sesión iniciada. Inicia sesión primero.
    fr: Le chargement de l’espace de travail d’exemple nécessite une personne connectée. Connectez-vous d’abord.
- id: ip_not_allowed
  status: 403
  area:
    en: Authentication
    vi: Xác thực
    de: Authentifizierung
    es: Autenticación
    fr: Authentification
  description:
    en: The API key is limited to allowed IPs and the call came from another address, or from one ReputeCast can't tell. The detail names the address ReputeCast saw; add it to the key's allowed IPs in Settings › Keys & MCP. The check runs after the token's, so the answer never says whether a key exists. An MCP agent outside its allowed IPs gets 401 instead.
    vi: Khóa API chỉ được dùng từ các IP được phép, và lệnh gọi đến từ một địa chỉ khác, hoặc từ một địa chỉ ReputeCast không xác định được. Trường detail ghi địa chỉ ReputeCast nhận được; hãy thêm địa chỉ đó vào IP được phép của khóa trong Cài đặt › Khóa và MCP. Việc kiểm tra diễn ra sau khi token đã được xác minh, nên phản hồi không bao giờ cho biết khóa có tồn tại hay không. Agent MCP gọi từ ngoài IP được phép sẽ nhận 401.
    de: Der API-Schlüssel ist auf erlaubte IPs beschränkt, und der Aufruf kam von einer anderen Adresse oder von einer, die ReputeCast nicht erkennen kann. Das Feld detail nennt die Adresse, die ReputeCast gesehen hat; fügen Sie sie unter Einstellungen › Schlüssel & MCP den erlaubten IPs des Schlüssels hinzu. Geprüft wird erst nach dem Token, die Antwort verrät also nie, ob ein Schlüssel existiert. Ein MCP-Agent außerhalb seiner erlaubten IPs erhält stattdessen 401.
    es: La clave de API está limitada a IP permitidas y la llamada llegó desde otra dirección, o desde una que ReputeCast no puede identificar. El detalle indica la dirección que vio ReputeCast; añádela a las IP permitidas de la clave en Configuración › Claves y MCP. Se comprueba después del token, así que la respuesta nunca revela si una clave existe. Un agente MCP fuera de sus IP permitidas recibe 401 en su lugar.
    fr: 'La clé API est limitée à des IP autorisées et l’appel venait d’une autre adresse, ou d’une adresse que ReputeCast ne peut pas déterminer. Le détail indique l’adresse vue par ReputeCast ; ajoutez-la aux IP autorisées de la clé dans Paramètres › Clés et MCP. La vérification a lieu après celle du jeton : la réponse ne dit donc jamais si une clé existe. Un agent MCP hors de ses IP autorisées reçoit 401 à la place.'
- id: permission_denied
  status: 403
  area:
    en: Permissions
    vi: Quyền
    de: Berechtigungen
    es: Permisos
    fr: Autorisations
  description:
    en: The caller lacks a permission. The detail says what the role can't do and names who can help, never the key; permission names the missing key and helpers lists up to two members who hold it (Owners first, then Admins). Also returned for a key used in another workspace, for operations only integration keys may call, and for a webhook endpoint's events the caller can't see (each event needs the view permission of what it carries; events with contacts need access to every list).
    vi: Người gọi thiếu một quyền. Trường detail cho biết vai trò không làm được gì và ai có thể giúp, không bao giờ ghi khóa quyền; trường permission ghi khóa quyền còn thiếu và helpers liệt kê tối đa hai thành viên có quyền đó (Chủ sở hữu trước, rồi đến Quản trị viên). Mã này cũng được trả về khi dùng khóa ở một không gian làm việc khác, khi gọi thao tác chỉ khóa tích hợp mới được gọi, và với các sự kiện của endpoint webhook mà người gọi không được xem (mỗi sự kiện cần quyền xem dữ liệu mà nó mang; sự kiện chứa liên hệ cần quyền truy cập mọi danh sách).
    de: Dem Aufrufer fehlt eine Berechtigung. Das Feld detail sagt, was die Rolle nicht darf, und nennt, wer helfen kann, nie aber den Berechtigungsschlüssel; permission nennt den fehlenden Schlüssel, und helpers listet bis zu zwei Mitglieder auf, die diese Berechtigung haben (zuerst Inhaber, dann Admins). Wird auch zurückgegeben, wenn ein Schlüssel in einem anderen Arbeitsbereich verwendet wird, bei Vorgängen, die nur Integrationsschlüssel aufrufen dürfen, und für Ereignisse eines Webhook-Endpunkts, die der Aufrufer nicht sehen darf (jedes Ereignis braucht die Ansichtsberechtigung für das, was es enthält; Ereignisse mit Kontakten brauchen Zugriff auf alle Listen).
    es: A quien llama le falta un permiso. El detalle indica lo que el rol no puede hacer y nombra a quien puede ayudar, nunca la clave; permission nombra la clave que falta y helpers lista hasta dos miembros que la tienen (primero los Propietarios y después los Administradores). También se devuelve para una clave usada en otro espacio de trabajo, para las operaciones que solo pueden llamar las claves de integración y para los eventos de un endpoint de webhook que quien llama no puede ver (cada evento requiere el permiso de ver lo que lleva; los eventos con contactos requieren acceso a todas las listas).
    fr: L’appelant n’a pas une autorisation. Le détail indique ce que le rôle ne peut pas faire et nomme qui peut aider, jamais la clé ; permission nomme la clé manquante et helpers liste jusqu’à deux membres qui la détiennent (Propriétaires d’abord, puis Admins). Également renvoyé pour une clé utilisée dans un autre espace de travail, pour les opérations que seules les clés d’intégration peuvent appeler, et pour les événements d’un endpoint de webhook que l’appelant ne peut pas voir (chaque événement exige l’autorisation de voir ce qu’il contient ; les événements avec des contacts exigent l’accès à toutes les listes).
- id: escalation_denied
  status: 403
  area:
    en: Permissions
    vi: Quyền
    de: Berechtigungen
    es: Permisos
    fr: Autorisations
  description:
    en: You can't grant a permission you don't hold, for example on a role, an API key or an agent. permission names the key when only one is missing.
    vi: Bạn không thể cấp quyền mà chính bạn không có, ví dụ cho một vai trò, khóa API hoặc tác tử. Khi chỉ thiếu một quyền, trường permission ghi khóa quyền đó.
    de: >-
      Sie können keine Berechtigung vergeben, die Sie selbst nicht haben, etwa für eine Rolle, einen API-Schlüssel oder
      einen Agenten. Das Feld permission nennt den Schlüssel, wenn nur einer fehlt.
    es: >-
      No puedes conceder un permiso que no tienes, por ejemplo en un rol, una clave de API o un agente. permission
      nombra la clave cuando solo falta una.
    fr: >-
      Vous ne pouvez pas accorder une autorisation que vous ne détenez pas, par exemple sur un rôle, une clé API ou un
      agent. permission nomme la clé lorsqu’une seule manque.
- id: humans_only
  status: 403
  area:
    en: Permissions
    vi: Quyền
    de: Berechtigungen
    es: Permisos
    fr: Autorisations
  description:
    en: Only a signed-in person can take this action, not an API key or an MCP agent.
    vi: Chỉ người đã đăng nhập mới thực hiện được thao tác này, khóa API và tác tử MCP thì không.
    de: Diese Aktion kann nur eine angemeldete Person ausführen, kein API-Schlüssel und kein MCP-Agent.
    es: Solo una persona con sesión iniciada puede hacer esta acción, no una clave de API ni un agente MCP.
    fr: Seule une personne connectée peut effectuer cette action, pas une clé API ni un agent MCP.
- id: forbidden
  status: 403
  area:
    en: Permissions
    vi: Quyền
    de: Berechtigungen
    es: Permisos
    fr: Autorisations
  description:
    en: Filtering contacts by paid status needs earn:view.
    vi: Lọc liên hệ theo trạng thái trả phí cần quyền earn:view.
    de: Zum Filtern von Kontakten nach Zahlstatus ist earn:view erforderlich.
    es: Filtrar contactos por estado de pago requiere earn:view.
    fr: Filtrer les contacts par statut payant nécessite earn:view.
- id: workspace_not_found
  status: 404
  area:
    en: Requests
    vi: Yêu cầu
    de: Anfragen
    es: Solicitudes
    fr: Requêtes
  description:
    en: The workspace in the path doesn't exist or the caller isn't a member of it.
    vi: Không gian làm việc trong đường dẫn không tồn tại, hoặc người gọi không phải thành viên của không gian làm việc đó.
    de: Der Arbeitsbereich im Pfad existiert nicht, oder der Aufrufer ist kein Mitglied davon.
    es: El espacio de trabajo de la ruta no existe o quien llama no es miembro de él.
    fr: L’espace de travail indiqué dans le chemin n’existe pas, ou l’appelant n’en est pas membre.
- id: not_found
  status: 404
  area:
    en: Requests
    vi: Yêu cầu
    de: Anfragen
    es: Solicitudes
    fr: Requêtes
  description:
    en: The resource in the path doesn't exist in this workspace. The detail names what is missing, such as "Campaign not found."
    vi: Tài nguyên trong đường dẫn không tồn tại trong không gian làm việc này. Trường detail cho biết thứ bị thiếu, chẳng hạn "Không tìm thấy chiến dịch."
    de: >-
      Die Ressource im Pfad existiert in diesem Arbeitsbereich nicht. Das Feld detail nennt, was fehlt, etwa „Kampagne
      nicht gefunden.“
    es: >-
      El recurso de la ruta no existe en este espacio de trabajo. El detalle nombra lo que falta, como “No se encontró
      la campaña.”
    fr: >-
      La ressource indiquée dans le chemin n’existe pas dans cet espace de travail. Le détail nomme ce qui manque, par
      exemple « Campagne introuvable. »
- id: conflict
  status: 409
  area:
    en: Requests
    vi: Yêu cầu
    de: Anfragen
    es: Solicitudes
    fr: Requêtes
  description:
    en: The request conflicts with the resource's current state. The detail says what to change.
    vi: Yêu cầu xung đột với trạng thái hiện tại của tài nguyên. Trường detail cho biết cần thay đổi gì.
    de: Die Anfrage steht im Konflikt mit dem aktuellen Zustand der Ressource. Das Feld detail sagt, was zu ändern ist.
    es: La solicitud entra en conflicto con el estado actual del recurso. El detalle indica qué cambiar.
    fr: La requête entre en conflit avec l’état actuel de la ressource. Le détail indique ce qu’il faut modifier.
- id: validation_failed
  status: 422
  area:
    en: Requests
    vi: Yêu cầu
    de: Anfragen
    es: Solicitudes
    fr: Requêtes
  description:
    en: The request body or parameters are invalid. errors[] lists each problem with its location, such as body.email. Malformed requests answer 400 with the same code.
    vi: Nội dung hoặc tham số của yêu cầu không hợp lệ. errors[] liệt kê từng lỗi kèm vị trí, chẳng hạn body.email. Yêu cầu sai định dạng trả về 400 với cùng mã này.
    de: >-
      Der Body oder die Parameter der Anfrage sind ungültig. Das Feld errors[] listet jedes Problem mit seiner Stelle
      auf, etwa body.email. Bei fehlerhaft aufgebauten Anfragen antwortet die API mit 400 und demselben Code.
    es: >-
      El cuerpo o los parámetros de la solicitud no son válidos. errors[] lista cada problema con su ubicación, como
      body.email. Las solicitudes mal formadas responden 400 con el mismo código.
    fr: >-
      Le corps ou les paramètres de la requête ne sont pas valides. errors[] liste chaque problème avec son emplacement,
      par exemple body.email. Les requêtes mal formées répondent 400 avec le même code.
- id: rate_limited
  status: 429
  area:
    en: Requests
    vi: Yêu cầu
    de: Anfragen
    es: Solicitudes
    fr: Requêtes
  description:
    en: "Too many requests: over the rate limit of the IP, the API key or the signed-in session (or of all signed-in browsers at one address), a key's own transactional or conversions rate, or a reminder sent again within the hour. Wait for the Retry-After header."
    vi: 'Quá nhiều yêu cầu: vượt giới hạn tốc độ của IP, khóa API hoặc phiên đăng nhập (hoặc của mọi trình duyệt đã đăng nhập tại cùng một địa chỉ), giới hạn riêng của khóa cho email giao dịch hoặc chuyển đổi, hoặc một lời nhắc được gửi lại trong vòng một giờ. Hãy chờ theo header Retry-After.'
    de: >-
      Zu viele Anfragen: Überschritten ist das Ratenlimit der IP, des API-Schlüssels oder der angemeldeten Sitzung (oder
      aller angemeldeten Browser unter einer Adresse) oder das eigene Limit eines Schlüssels für Transaktions-E-Mails
      oder Conversions, oder eine Erinnerung wurde innerhalb der Stunde erneut gesendet. Warten Sie die Zeit aus dem
      Header Retry-After ab.
    es: >-
      Demasiadas solicitudes: se superó el límite de frecuencia de la IP, de la clave de API o de la sesión iniciada (o
      de todos los navegadores con sesión iniciada en una misma dirección), el límite propio de una clave para envíos
      transaccionales o conversiones, o se volvió a enviar un recordatorio en menos de una hora. Espera lo que indica la
      cabecera Retry-After.
    fr: >-
      Trop de requêtes : limite de débit dépassée pour l’IP, la clé API ou la session connectée (ou pour l’ensemble des
      navigateurs connectés depuis une même adresse), limite propre à une clé pour les envois transactionnels ou les
      conversions, ou rappel renvoyé dans l’heure. Attendez le délai de l’en-tête Retry-After.
- id: idempotency_key_reused
  status: 409
  area:
    en: Requests
    vi: Yêu cầu
    de: Anfragen
    es: Solicitudes
    fr: Requêtes
  description:
    en: 'The same Idempotency-Key came with a different request: within 24 hours for transactional sends, or for another conversion. Use a new key for a new request.'
    vi: 'Cùng một Idempotency-Key được gửi kèm một yêu cầu khác: trong vòng 24 giờ với lần gửi email giao dịch, hoặc cho một chuyển đổi khác. Hãy dùng khóa mới cho yêu cầu mới.'
    de: >-
      Derselbe Idempotency-Key kam mit einer anderen Anfrage an: innerhalb von 24 Stunden bei Transaktions-E-Mails oder
      für eine andere Conversion. Verwenden Sie für eine neue Anfrage einen neuen Schlüssel.
    es: >-
      La misma Idempotency-Key llegó con una solicitud distinta: en menos de 24 horas para los envíos transaccionales, o
      para otra conversión. Usa una clave nueva para cada solicitud nueva.
    fr: >-
      La même Idempotency-Key est arrivée avec une requête différente : dans les 24 heures pour les envois
      transactionnels, ou pour une autre conversion. Utilisez une nouvelle clé pour une nouvelle requête.
- id: slug_taken
  status: 409
  area:
    en: Requests
    vi: Yêu cầu
    de: Anfragen
    es: Solicitudes
    fr: Requêtes
  description:
    en: The address (slug) is used by another post, tag, page or product, now or before. Pick another address.
    vi: Địa chỉ (slug) đang hoặc đã từng được một bài viết, thẻ, trang hoặc sản phẩm khác dùng. Hãy chọn địa chỉ khác.
    de: >-
      Die Adresse (URL-Pfad) wird von einem anderen Beitrag, Tag, einer anderen Seite oder einem anderen Produkt
      verwendet oder wurde früher verwendet. Wählen Sie eine andere Adresse.
    es: La dirección (slug) la usa otro artículo, etiqueta, página o producto, ahora o antes. Elige otra dirección.
    fr: >-
      L’adresse (slug) est utilisée par un autre article, tag, page ou produit, actuellement ou par le passé. Choisissez
      une autre adresse.
- id: version_conflict
  status: 409
  area:
    en: Requests
    vi: Yêu cầu
    de: Anfragen
    es: Solicitudes
    fr: Requêtes
  description:
    en: Someone saved a newer version since you opened it (a campaign, text, email, language version, page or transactional draft). A campaign save merges edits to different sections by itself and answers this only when both sides changed the same part; meta names who saved, when, and what each side changed. Reload to see their changes, or save again with force (keep yours on top) or stash (keep yours in the history).
    vi: Có người đã lưu một phiên bản mới hơn sau khi bạn mở (chiến dịch, tin nhắn, email, phiên bản ngôn ngữ, trang hoặc bản nháp giao dịch). Khi lưu chiến dịch, các chỉnh sửa ở những phần khác nhau được tự động gộp và mã này chỉ được trả về khi cả hai bên cùng sửa một phần; trường meta ghi ai đã lưu, lúc nào và mỗi bên đã thay đổi gì. Hãy tải lại để xem thay đổi của họ, hoặc lưu lại với force (giữ bản của bạn ở trên cùng) hay stash (giữ bản của bạn trong lịch sử).
    de: >-
      Jemand hat eine neuere Version gespeichert, seit Sie sie geöffnet haben (Kampagne, SMS, E-Mail, Sprachversion,
      Seite oder Transaktionsentwurf). Beim Speichern einer Kampagne werden Änderungen an verschiedenen Abschnitten
      automatisch zusammengeführt; dieser Code kommt nur, wenn beide Seiten denselben Teil geändert haben. Das Feld meta
      nennt, wer wann gespeichert hat und was jede Seite geändert hat. Laden Sie neu, um die Änderungen der anderen
      Person zu sehen, oder speichern Sie erneut mit force (Ihre Version wird darüber gespeichert) oder stash (Ihre
      Version bleibt im Verlauf).
    es: >-
      Alguien guardó una versión más reciente desde que la abriste (una campaña, un SMS, un correo, una versión de
      idioma, una página o un borrador transaccional). Al guardar una campaña, las ediciones de secciones distintas se
      combinan solas y esta respuesta solo llega cuando ambas partes cambiaron lo mismo; meta indica quién guardó,
      cuándo y qué cambió cada parte. Recarga para ver sus cambios, o vuelve a guardar con force (los tuyos prevalecen)
      o stash (los tuyos se guardan en el historial).
    fr: >-
      Quelqu’un a enregistré une version plus récente depuis que vous l’avez ouverte (une campagne, un SMS, un e-mail,
      une version linguistique, une page ou un brouillon transactionnel). L’enregistrement d’une campagne fusionne de
      lui-même les modifications de sections différentes et ne répond ainsi que si les deux côtés ont modifié la même
      partie ; meta indique qui a enregistré, quand, et ce que chaque côté a modifié. Rechargez pour voir ses
      modifications, ou enregistrez de nouveau avec force (garder les vôtres par-dessus) ou stash (garder les vôtres
      dans l’historique).
- id: provider_unavailable
  status: 502
  area:
    en: Service
    vi: Dịch vụ
    de: Dienst
    es: Servicio
    fr: Service
  description:
    en: A sending provider or another outside service didn't accept the change or couldn't be reached. The detail has the provider's answer; nothing else was changed. Some actions answer 409 or 503 with this code.
    vi: Một nhà cung cấp gửi thư hoặc dịch vụ bên ngoài khác không chấp nhận thay đổi hoặc không kết nối được. Trường detail chứa phản hồi của nhà cung cấp; không có gì khác bị thay đổi. Một số thao tác trả về mã này với trạng thái 409 hoặc 503.
    de: >-
      Ein Versandanbieter oder ein anderer externer Dienst hat die Änderung nicht angenommen oder war nicht erreichbar.
      Das Feld detail enthält die Antwort des Anbieters; sonst wurde nichts geändert. Bei manchen Aktionen antwortet die
      API mit 409 oder 503 und diesem Code.
    es: >-
      Un proveedor de envío u otro servicio externo no aceptó el cambio o no se pudo contactar. El detalle incluye la
      respuesta del proveedor; no se cambió nada más. Algunas acciones responden 409 o 503 con este código.
    fr: >-
      Un fournisseur d’envoi ou un autre service externe n’a pas accepté la modification ou n’a pas pu être joint. Le
      détail contient la réponse du fournisseur ; rien d’autre n’a été modifié. Certaines actions répondent 409 ou 503
      avec ce code.
- id: unavailable
  status: 503
  area:
    en: Service
    vi: Dịch vụ
    de: Dienst
    es: Servicio
    fr: Service
  description:
    en: A part of the server can't answer right now, for example the sign-in policy check. Try again in a moment. A feature missing from this build answers 501.
    vi: Một phần của máy chủ hiện chưa phản hồi được, ví dụ bước kiểm tra chính sách đăng nhập. Hãy thử lại sau giây lát. Tính năng không có trong bản build này trả về 501.
    de: >-
      Ein Teil des Servers kann gerade nicht antworten, zum Beispiel die Prüfung der Anmelderichtlinie. Versuchen Sie es
      gleich noch einmal. Fehlt eine Funktion in diesem Build, antwortet die API mit 501.
    es: >-
      Una parte del servidor no puede responder ahora, por ejemplo la comprobación de la política de inicio de sesión.
      Vuelve a intentarlo en un momento. Una función que no está en esta compilación responde 501.
    fr: >-
      Une partie du serveur ne peut pas répondre pour le moment, par exemple la vérification de la politique de
      connexion. Réessayez dans un instant. Une fonctionnalité absente de cette version répond 501.
- id: maintenance
  status: 503
  area:
    en: Service
    vi: Dịch vụ
    de: Dienst
    es: Servicio
    fr: Service
  description:
    en: 'ReputeCast is being upgraded: this process waits for its migrations, so reads work and writes are refused until they finish (signing in and out and provider webhooks still go through). Retry-After says when to try again (30 seconds); meta has the version and startedAt.'
    vi: 'ReputeCast đang được nâng cấp: tiến trình này chờ các migration của nó, nên vẫn đọc được nhưng mọi thao tác ghi bị từ chối cho đến khi nâng cấp xong (đăng nhập, đăng xuất và webhook của nhà cung cấp vẫn hoạt động). Header Retry-After cho biết khi nào thử lại (30 giây); trường meta có version và startedAt.'
    de: >-
      ReputeCast wird aktualisiert: Dieser Prozess wartet auf seine Migrationen, daher funktionieren Lesezugriffe,
      während Schreibzugriffe abgelehnt werden, bis die Migrationen abgeschlossen sind (An- und Abmelden sowie Webhooks
      der Anbieter funktionieren weiterhin). Der Header Retry-After gibt an, wann Sie es erneut versuchen können (30
      Sekunden); das Feld meta enthält version und startedAt.
    es: >-
      ReputeCast se está actualizando: este proceso espera a sus migraciones, así que las lecturas funcionan y las
      escrituras se rechazan hasta que terminan (iniciar y cerrar sesión y los webhooks de los proveedores siguen
      funcionando). Retry-After indica cuándo volver a intentarlo (30 segundos); meta incluye la versión y startedAt.
    fr: >-
      ReputeCast est en cours de mise à niveau : ce processus attend ses migrations, si bien que les lectures
      fonctionnent et que les écritures sont refusées jusqu’à leur fin (la connexion, la déconnexion et les webhooks des
      fournisseurs passent toujours). Retry-After indique quand réessayer (30 secondes) ; meta contient la version et
      startedAt.
- id: internal_error
  status: 500
  area:
    en: Service
    vi: Dịch vụ
    de: Dienst
    es: Servicio
    fr: Service
  description:
    en: The server hit an unexpected error. The answer carries a reference in meta.reference (for example err_7KQ2M4XA) and never the error's own text; the server logs the error under that reference with the request ID, so quote the reference when you report the problem.
    vi: Máy chủ gặp lỗi không mong muốn. Phản hồi có mã tham chiếu trong meta.reference (ví dụ err_7KQ2M4XA) và không bao giờ chứa nguyên văn lỗi; máy chủ ghi lỗi vào nhật ký máy chủ dưới mã tham chiếu đó cùng mã yêu cầu, nên hãy gửi kèm mã tham chiếu khi báo lỗi.
    de: >-
      Auf dem Server ist ein unerwarteter Fehler aufgetreten. Die Antwort enthält eine Referenz in meta.reference (zum
      Beispiel err_7KQ2M4XA) und nie den Text des Fehlers selbst; der Server protokolliert den Fehler unter dieser
      Referenz zusammen mit der Anfrage-ID. Nennen Sie daher die Referenz, wenn Sie das Problem melden.
    es: >-
      El servidor tuvo un error inesperado. La respuesta lleva una referencia en meta.reference (por ejemplo
      err_7KQ2M4XA) y nunca el texto del error; el servidor registra el error con esa referencia y el ID de la
      solicitud, así que indica la referencia cuando informes del problema.
    fr: >-
      Le serveur a rencontré une erreur inattendue. La réponse porte une référence dans meta.reference (par exemple
      err_7KQ2M4XA), jamais le texte de l’erreur lui-même ; le serveur journalise l’erreur sous cette référence avec
      l’ID de la requête : citez donc la référence lorsque vous signalez le problème.
- id: password_change_required
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The account still has its temporary password. Replace it to continue.
    vi: Tài khoản vẫn đang dùng mật khẩu tạm thời. Hãy thay mật khẩu để tiếp tục.
    de: Das Konto hat noch sein temporäres Passwort. Ersetzen Sie es, um fortzufahren.
    es: La cuenta aún tiene su contraseña temporal. Reemplázala para continuar.
    fr: Le compte a encore son mot de passe temporaire. Remplacez-le pour continuer.
- id: two_factor_setup_required
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The instance requires two-factor authentication. Add a passkey or an authenticator app to continue.
    vi: Hệ thống yêu cầu xác thực hai lớp. Hãy thêm khóa truy cập hoặc ứng dụng xác thực để tiếp tục.
    de: >-
      Die Instanz verlangt die Zwei-Faktor-Authentifizierung. Fügen Sie einen Passkey oder eine Authenticator-App hinzu,
      um fortzufahren.
    es: >-
      La instancia exige la verificación en dos pasos. Añade una llave de acceso o una aplicación de autenticación para
      continuar.
    fr: >-
      L’instance exige l’authentification à deux facteurs. Ajoutez une clé d’accès ou une application d’authentification
      pour continuer.
- id: locked
  status: 429
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: 'Too many failed sign-ins: the account is locked until the time in the detail. meta carries lockedUntil and failures.'
    vi: 'Quá nhiều lần đăng nhập thất bại: tài khoản bị khóa đến thời điểm ghi trong trường detail. meta chứa lockedUntil và failures.'
    de: >-
      Zu viele fehlgeschlagene Anmeldungen: Das Konto ist bis zu dem Zeitpunkt gesperrt, den das Feld detail nennt. Das
      Feld meta enthält lockedUntil und failures.
    es: >-
      Demasiados inicios de sesión fallidos: la cuenta está bloqueada hasta la hora que indica el detalle. meta lleva
      lockedUntil y failures.
    fr: >-
      Trop d’échecs de connexion : le compte est bloqué jusqu’à l’heure indiquée dans le détail. meta porte lockedUntil
      et failures.
- id: invalid_credentials
  status: 401
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The email or password is wrong (the detail says how many attempts are left). Connecting a sending provider answers 422 with this code when the provider rejects the credentials.
    vi: Email hoặc mật khẩu không đúng (trường detail cho biết còn bao nhiêu lần thử). Khi kết nối nhà cung cấp gửi thư, mã này đi kèm 422 nếu nhà cung cấp từ chối thông tin xác thực.
    de: >-
      Die E-Mail-Adresse oder das Passwort ist falsch (das Feld detail sagt, wie viele Versuche noch übrig sind). Beim
      Verbinden eines Versandanbieters antwortet die API mit 422 und diesem Code, wenn der Anbieter die Zugangsdaten
      ablehnt.
    es: >-
      El correo o la contraseña no son correctos (el detalle indica cuántos intentos quedan). Al conectar un proveedor
      de envío, la respuesta es 422 con este código cuando el proveedor rechaza las credenciales.
    fr: >-
      L’adresse e-mail ou le mot de passe est incorrect (le détail indique le nombre de tentatives restantes). La
      connexion d’un fournisseur d’envoi répond 422 avec ce code lorsque le fournisseur refuse les identifiants.
- id: account_deactivated
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The account is deactivated. An instance admin can reactivate it; nothing was deleted.
    vi: Tài khoản đã bị vô hiệu hóa. Quản trị viên hệ thống có thể kích hoạt lại; không có gì bị xóa.
    de: Das Konto ist deaktiviert. Ein Instanz-Admin kann es reaktivieren; es wurde nichts gelöscht.
    es: La cuenta está desactivada. Quien administra la instancia puede reactivarla; no se eliminó nada.
    fr: Le compte est désactivé. Un admin de l’instance peut le réactiver ; rien n’a été supprimé.
- id: challenge_expired
  status: 401
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The sign-in or passkey request expired, or there were too many wrong codes. Start again. Passkey requests answer 400.
    vi: Yêu cầu đăng nhập hoặc yêu cầu khóa truy cập đã hết hạn, hoặc đã nhập sai mã quá nhiều lần. Hãy bắt đầu lại. Với yêu cầu khóa truy cập, mã này đi kèm 400.
    de: >-
      Die Anmelde- oder Passkey-Anfrage ist abgelaufen, oder es wurden zu viele falsche Codes eingegeben. Beginnen Sie
      von vorn. Bei Passkey-Anfragen antwortet die API mit 400.
    es: >-
      La solicitud de inicio de sesión o de llave de acceso caducó, o hubo demasiados códigos incorrectos. Vuelve a
      empezar. Las solicitudes de llave de acceso responden 400.
    fr: >-
      La demande de connexion ou de clé d’accès a expiré, ou trop de codes erronés ont été saisis. Recommencez. Les
      demandes de clé d’accès répondent 400.
- id: email_change_expired
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The email change confirmation link expired, was already used or belongs to another account. Change the email again from Account & security.
    vi: Liên kết xác nhận đổi email đã hết hạn, đã được dùng hoặc thuộc tài khoản khác. Hãy đổi email lại từ Tài khoản và bảo mật.
    de: >-
      Der Bestätigungslink für die Änderung der E-Mail-Adresse ist abgelaufen, wurde bereits verwendet oder gehört zu
      einem anderen Konto. Ändern Sie die E-Mail-Adresse erneut unter Konto & Sicherheit.
    es: >-
      El enlace de confirmación del cambio de correo caducó, ya se usó o pertenece a otra cuenta. Vuelve a cambiar el
      correo desde Cuenta y seguridad.
    fr: >-
      Le lien de confirmation du changement d’adresse e-mail a expiré, a déjà été utilisé ou appartient à un autre
      compte. Modifiez de nouveau l’adresse e-mail depuis Compte et sécurité.
- id: email_not_verified
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: "Joining from an invitation with Microsoft, GitHub or a single sign-on provider: the provider didn't confirm that the invited email is verified, so it can't create the account. Join another way from the invitation."
    vi: 'Khi tham gia từ lời mời bằng Microsoft, GitHub hoặc nhà cung cấp đăng nhập một lần (SSO): nhà cung cấp chưa xác nhận email được mời đã được xác minh, nên không thể tạo tài khoản. Hãy tham gia theo cách khác từ lời mời.'
    de: 'Beitritt über eine Einladung mit Microsoft, GitHub oder einem Single-Sign-on-Anbieter: Der Anbieter hat nicht bestätigt, dass die eingeladene E-Mail-Adresse verifiziert ist, daher kann damit kein Konto erstellt werden. Treten Sie über die Einladung auf anderem Weg bei.'
    es: 'Al unirte desde una invitación con Microsoft, GitHub o un proveedor de inicio de sesión único: el proveedor no confirmó que el correo invitado esté verificado, así que no puede crear la cuenta. Únete de otra forma desde la invitación.'
    fr: 'En rejoignant l’espace depuis une invitation avec Microsoft, GitHub ou un fournisseur d’authentification unique : le fournisseur n’a pas confirmé que l’adresse e-mail invitée est vérifiée, le compte ne peut donc pas être créé avec elle. Rejoignez l’espace autrement depuis l’invitation.'
- id: identity_in_use
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The Google, Microsoft, GitHub or single sign-on account used to join from an invitation already signs in to another account here. Join another way from the invitation.
    vi: Tài khoản Google, Microsoft, GitHub hoặc đăng nhập một lần (SSO) bạn dùng để tham gia từ lời mời đã được dùng để đăng nhập vào một tài khoản khác ở đây. Hãy tham gia theo cách khác từ lời mời.
    de: Mit dem Konto bei Google, Microsoft, GitHub oder dem Single-Sign-on-Anbieter, mit dem Sie über eine Einladung beitreten, meldet sich bereits ein anderes Konto hier an. Treten Sie über die Einladung auf anderem Weg bei.
    es: La cuenta de Google, Microsoft, GitHub o de inicio de sesión único con la que te unes desde una invitación ya sirve para iniciar sesión en otra cuenta de aquí. Únete de otra forma desde la invitación.
    fr: Le compte Google, Microsoft, GitHub ou d’authentification unique utilisé pour rejoindre l’espace depuis une invitation sert déjà à se connecter à un autre compte ici. Rejoignez l’espace autrement depuis l’invitation.
- id: identity_managed
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: Single sign-on is enforced for the email domain, so the sign-in identity is managed by the organization and can't be unlinked.
    vi: Tên miền email bắt buộc dùng đăng nhập một lần (SSO), nên danh tính đăng nhập do tổ chức quản lý và không thể hủy liên kết.
    de: >-
      Für die E-Mail-Domain wird Single Sign-on erzwungen, daher verwaltet die Organisation die Anmeldeidentität, und
      sie kann nicht getrennt werden.
    es: >-
      El inicio de sesión único es obligatorio en el dominio del correo, así que la identidad de inicio de sesión la
      gestiona la organización y no se puede desvincular.
    fr: >-
      L’authentification unique est imposée pour le domaine de l’adresse e-mail : l’identité de connexion est donc gérée
      par l’organisation et ne peut pas être dissociée.
- id: invalid_code
  status: 401
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The two-factor code is wrong. meta.attemptsLeft says how many tries are left.
    vi: Mã xác thực hai lớp không đúng. meta.attemptsLeft cho biết còn bao nhiêu lần thử.
    de: Der 2FA-Code ist falsch. meta.attemptsLeft gibt an, wie viele Versuche noch übrig sind.
    es: El código de verificación en dos pasos no es correcto. meta.attemptsLeft indica cuántos intentos quedan.
    fr: Le code à deux facteurs est incorrect. meta.attemptsLeft indique le nombre de tentatives restantes.
- id: invite_accepted
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The invitation was already used. Sign in to continue.
    vi: Lời mời đã được dùng. Hãy đăng nhập để tiếp tục.
    de: Die Einladung wurde bereits verwendet. Melden Sie sich an, um fortzufahren.
    es: La invitación ya se usó. Inicia sesión para continuar.
    fr: L’invitation a déjà été utilisée. Connectez-vous pour continuer.
- id: invite_expired
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The invitation expired. Ask the person who invited you for a new one.
    vi: Lời mời đã hết hạn. Hãy nhờ người đã mời bạn gửi lời mời mới.
    de: Die Einladung ist abgelaufen. Fragen Sie die Person, die Sie eingeladen hat, nach einer neuen.
    es: La invitación caducó. Pide una nueva a la persona que te invitó.
    fr: L’invitation a expiré. Demandez-en une nouvelle à la personne qui vous a invité.
- id: invite_not_found
  status: 404
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The invitation link isn't valid. Check that the whole link was copied, or ask for a new invitation.
    vi: Liên kết mời không hợp lệ. Hãy kiểm tra bạn đã sao chép đủ liên kết, hoặc xin lời mời mới.
    de: >-
      Der Einladungslink ist ungültig. Prüfen Sie, ob der ganze Link kopiert wurde, oder fragen Sie nach einer neuen
      Einladung.
    es: El enlace de invitación no es válido. Comprueba que copiaste el enlace completo o pide una invitación nueva.
    fr: >-
      Le lien d’invitation n’est pas valide. Vérifiez que le lien a été copié en entier, ou demandez une nouvelle
      invitation.
- id: invite_revoked
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The invitation was revoked, so the link no longer works.
    vi: Lời mời đã bị thu hồi, nên liên kết không còn dùng được.
    de: Die Einladung wurde widerrufen, daher funktioniert der Link nicht mehr.
    es: La invitación se revocó, así que el enlace ya no funciona.
    fr: 'L’invitation a été révoquée : le lien ne fonctionne donc plus.'
- id: invite_sign_in
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The invited email already has an account. Sign in to accept the invitation.
    vi: Email được mời đã có tài khoản. Hãy đăng nhập để chấp nhận lời mời.
    de: Für die eingeladene E-Mail-Adresse gibt es bereits ein Konto. Melden Sie sich an, um die Einladung anzunehmen.
    es: El correo invitado ya tiene una cuenta. Inicia sesión para aceptar la invitación.
    fr: L’adresse e-mail invitée a déjà un compte. Connectez-vous pour accepter l’invitation.
- id: invite_wrong_account
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
    de: Anmeldung und Konto
    es: Inicio de sesión y cuenta
    fr: Connexion et compte
  description:
    en: The invitation is for another email than the account you are signed in with. Sign out and continue, or ask for an invitation for this account.
    vi: Lời mời dành cho một email khác với tài khoản bạn đang đăng nhập. Hãy đăng xuất và tiếp tục, hoặc xin lời mời cho tài khoản này.
    de: >-
      Die Einladung gilt für eine andere E-Mail-Adresse als die des Kontos, mit dem Sie angemeldet sind. Melden Sie sich
      ab und fahren Sie fort, oder fragen Sie nach einer Einladung für dieses Konto.
    es: >-
      La invitación es para un correo distinto del de la cuenta con la que has iniciado sesión. Cierra sesión y
      continúa, o pide una invitación para esta cuenta.
    fr: >-
      L’invitation est destinée à une autre adresse e-mail que celle du compte avec lequel vous êtes connecté.
      Déconnectez-vous et continuez, ou demandez une invitation pour ce compte.
- id: last_method
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
