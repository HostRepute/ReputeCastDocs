# Every stable `code` a client can receive in an RFC 9457 problem body: each api.Err call (and the package wrappers
# that pass a code through to it) and each `.Code = …` set on a problem anywhere in internal/**, plus the source-error
# codes of the importers and the dynamic link_* codes. status = the HTTP status the code usually comes with; the
# description names the exceptions. Codes defined in internal/api but never returned are left out (instance_not_set_up).
# Guarded by pnpm upstream:check.
- id: unauthenticated
  status: 401
  area:
    en: Authentication
    vi: Xác thực
  description:
    en: 'No valid session or API key: you aren''t signed in, or the key is unknown, revoked or expired (an expired key''s detail names the date). 401 answers carry WWW-Authenticate: Bearer realm="reputecast".'
    vi: 'Không có phiên đăng nhập hoặc khóa API hợp lệ: bạn chưa đăng nhập, hoặc khóa không tồn tại, đã bị thu hồi hay đã hết hạn (với khóa hết hạn, trường detail ghi ngày hết hạn). Phản hồi 401 có header WWW-Authenticate: Bearer realm="reputecast".'
- id: session_expired
  status: 401
  area:
    en: Authentication
    vi: Xác thực
  description:
    en: The session timed out or ended. Sign in again; unsaved work in the tab is kept.
    vi: Phiên đăng nhập đã hết hạn hoặc đã kết thúc. Hãy đăng nhập lại; nội dung chưa lưu trong thẻ vẫn được giữ.
- id: unauthorized
  status: 401
  area:
    en: Authentication
    vi: Xác thực
  description:
    en: Loading the sample workspace needs a signed-in person. Sign in first.
    vi: Muốn tải không gian làm việc mẫu, bạn cần đăng nhập. Hãy đăng nhập trước.
- id: permission_denied
  status: 403
  area:
    en: Permissions
    vi: Quyền
  description:
    en: The caller lacks a permission. The detail says what the role can't do and names who can help, never the key; permission names the missing key and helpers lists up to two members who hold it (Owners first, then Admins). Also returned for a key used in another workspace and for operations only integration keys may call.
    vi: Người gọi thiếu một quyền. Trường detail cho biết vai trò không làm được gì và ai có thể giúp, không bao giờ ghi khóa quyền; trường permission ghi khóa quyền còn thiếu và helpers liệt kê tối đa hai thành viên có quyền đó (Chủ sở hữu trước, rồi đến Quản trị viên). Mã này cũng được trả về khi dùng khóa ở một không gian làm việc khác và khi gọi thao tác chỉ khóa tích hợp mới được gọi.
- id: escalation_denied
  status: 403
  area:
    en: Permissions
    vi: Quyền
  description:
    en: You can't grant a permission you don't hold, for example on a role, an API key or an agent. permission names the key when only one is missing.
    vi: Bạn không thể cấp quyền mà chính bạn không có, ví dụ cho một vai trò, khóa API hoặc tác tử. Khi chỉ thiếu một quyền, trường permission ghi khóa quyền đó.
- id: humans_only
  status: 403
  area:
    en: Permissions
    vi: Quyền
  description:
    en: Only a signed-in person can take this action, not an API key or an MCP agent.
    vi: Chỉ người đã đăng nhập mới thực hiện được thao tác này, khóa API và tác tử MCP thì không.
- id: forbidden
  status: 403
  area:
    en: Permissions
    vi: Quyền
  description:
    en: Filtering contacts by paid status needs earn:view.
    vi: Lọc liên hệ theo trạng thái trả phí cần quyền earn:view.
- id: workspace_not_found
  status: 404
  area:
    en: Requests
    vi: Yêu cầu
  description:
    en: The workspace in the path doesn't exist or the caller isn't a member of it.
    vi: Không gian làm việc trong đường dẫn không tồn tại, hoặc người gọi không phải thành viên của không gian làm việc đó.
- id: not_found
  status: 404
  area:
    en: Requests
    vi: Yêu cầu
  description:
    en: The resource in the path doesn't exist in this workspace. The detail names what is missing, such as "Campaign not found."
    vi: Tài nguyên trong đường dẫn không tồn tại trong không gian làm việc này. Trường detail cho biết thứ bị thiếu, chẳng hạn "Không tìm thấy chiến dịch."
- id: conflict
  status: 409
  area:
    en: Requests
    vi: Yêu cầu
  description:
    en: The request conflicts with the resource's current state. The detail says what to change.
    vi: Yêu cầu xung đột với trạng thái hiện tại của tài nguyên. Trường detail cho biết cần thay đổi gì.
- id: validation_failed
  status: 422
  area:
    en: Requests
    vi: Yêu cầu
  description:
    en: The request body or parameters are invalid. errors[] lists each problem with its location, such as body.email. Malformed requests answer 400 with the same code.
    vi: Nội dung hoặc tham số của yêu cầu không hợp lệ. errors[] liệt kê từng lỗi kèm vị trí, chẳng hạn body.email. Yêu cầu sai định dạng trả về 400 với cùng mã này.
- id: rate_limited
  status: 429
  area:
    en: Requests
    vi: Yêu cầu
  description:
    en: "Too many requests: over the rate limit of the IP or the API key, a key's own transactional or conversions rate, or a reminder sent again within the hour. Wait for the Retry-After header."
    vi: 'Quá nhiều yêu cầu: vượt giới hạn tốc độ của IP hoặc khóa API, giới hạn riêng của khóa cho email giao dịch hoặc chuyển đổi, hoặc một lời nhắc được gửi lại trong vòng một giờ. Hãy chờ theo header Retry-After.'
- id: idempotency_key_reused
  status: 409
  area:
    en: Requests
    vi: Yêu cầu
  description:
    en: 'The same Idempotency-Key came with a different request: within 24 hours for transactional sends, or for another conversion. Use a new key for a new request.'
    vi: 'Cùng một Idempotency-Key được gửi kèm một yêu cầu khác: trong vòng 24 giờ với lần gửi email giao dịch, hoặc cho một chuyển đổi khác. Hãy dùng khóa mới cho yêu cầu mới.'
- id: slug_taken
  status: 409
  area:
    en: Requests
    vi: Yêu cầu
  description:
    en: The address (slug) is used by another post, tag, page or product, now or before. Pick another address.
    vi: Địa chỉ (slug) đang hoặc đã từng được một bài viết, thẻ, trang hoặc sản phẩm khác dùng. Hãy chọn địa chỉ khác.
- id: version_conflict
  status: 409
  area:
    en: Requests
    vi: Yêu cầu
  description:
    en: Someone saved a newer version since you opened it (a campaign, text, email, language version, page or transactional draft). A campaign save merges edits to different sections by itself and answers this only when both sides changed the same part; meta names who saved, when, and what each side changed. Reload to see their changes, or save again with force (keep yours on top) or stash (keep yours in the history).
    vi: Có người đã lưu một phiên bản mới hơn sau khi bạn mở (chiến dịch, tin nhắn, email, phiên bản ngôn ngữ, trang hoặc bản nháp giao dịch). Khi lưu chiến dịch, các chỉnh sửa ở những phần khác nhau được tự động gộp và mã này chỉ được trả về khi cả hai bên cùng sửa một phần; trường meta ghi ai đã lưu, lúc nào và mỗi bên đã thay đổi gì. Hãy tải lại để xem thay đổi của họ, hoặc lưu lại với force (giữ bản của bạn ở trên cùng) hay stash (giữ bản của bạn trong lịch sử).
- id: provider_unavailable
  status: 502
  area:
    en: Service
    vi: Dịch vụ
  description:
    en: A sending provider or another outside service didn't accept the change or couldn't be reached. The detail has the provider's answer; nothing else was changed. Some actions answer 409 or 503 with this code.
    vi: Một nhà cung cấp gửi thư hoặc dịch vụ bên ngoài khác không chấp nhận thay đổi hoặc không kết nối được. Trường detail chứa phản hồi của nhà cung cấp; không có gì khác bị thay đổi. Một số thao tác trả về mã này với trạng thái 409 hoặc 503.
- id: unavailable
  status: 503
  area:
    en: Service
    vi: Dịch vụ
  description:
    en: A part of the server can't answer right now, for example the sign-in policy check. Try again in a moment. A feature missing from this build answers 501.
    vi: Một phần của máy chủ hiện chưa phản hồi được, ví dụ bước kiểm tra chính sách đăng nhập. Hãy thử lại sau giây lát. Tính năng không có trong bản build này trả về 501.
- id: internal_error
  status: 500
  area:
    en: Service
    vi: Dịch vụ
  description:
    en: The server hit an unexpected error. The answer carries a reference in meta.reference (for example err_7KQ2M4XA) and never the error's own text; the server logs the error under that reference with the request ID, so quote the reference when you report the problem.
    vi: Máy chủ gặp lỗi không mong muốn. Phản hồi có mã tham chiếu trong meta.reference (ví dụ err_7KQ2M4XA) và không bao giờ chứa nguyên văn lỗi; máy chủ ghi lỗi vào nhật ký máy chủ dưới mã tham chiếu đó cùng mã yêu cầu, nên hãy gửi kèm mã tham chiếu khi báo lỗi.
- id: password_change_required
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The account still has its temporary password. Replace it to continue.
    vi: Tài khoản vẫn đang dùng mật khẩu tạm thời. Hãy thay mật khẩu để tiếp tục.
- id: two_factor_setup_required
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The instance requires two-factor authentication. Add a passkey or an authenticator app to continue.
    vi: Hệ thống yêu cầu xác thực hai lớp. Hãy thêm khóa truy cập hoặc ứng dụng xác thực để tiếp tục.
- id: locked
  status: 429
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: 'Too many failed sign-ins: the account is locked until the time in the detail. meta carries lockedUntil and failures.'
    vi: 'Quá nhiều lần đăng nhập thất bại: tài khoản bị khóa đến thời điểm ghi trong trường detail. meta chứa lockedUntil và failures.'
- id: invalid_credentials
  status: 401
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The email or password is wrong (the detail says how many attempts are left). Connecting a sending provider answers 422 with this code when the provider rejects the credentials.
    vi: Email hoặc mật khẩu không đúng (trường detail cho biết còn bao nhiêu lần thử). Khi kết nối nhà cung cấp gửi thư, mã này đi kèm 422 nếu nhà cung cấp từ chối thông tin xác thực.
- id: account_deactivated
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The account is deactivated. An instance admin can reactivate it; nothing was deleted.
    vi: Tài khoản đã bị vô hiệu hóa. Quản trị viên hệ thống có thể kích hoạt lại; không có gì bị xóa.
- id: challenge_expired
  status: 401
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The sign-in or passkey request expired, or there were too many wrong codes. Start again. Passkey requests answer 400.
    vi: Yêu cầu đăng nhập hoặc yêu cầu khóa truy cập đã hết hạn, hoặc đã nhập sai mã quá nhiều lần. Hãy bắt đầu lại. Với yêu cầu khóa truy cập, mã này đi kèm 400.
- id: email_change_expired
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The email change confirmation link expired, was already used or belongs to another account. Change the email again from Account & security.
    vi: Liên kết xác nhận đổi email đã hết hạn, đã được dùng hoặc thuộc tài khoản khác. Hãy đổi email lại từ Tài khoản và bảo mật.
- id: identity_managed
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: Single sign-on is enforced for the email domain, so the sign-in identity is managed by the organization and can't be unlinked.
    vi: Tên miền email bắt buộc dùng đăng nhập một lần (SSO), nên danh tính đăng nhập do tổ chức quản lý và không thể hủy liên kết.
- id: invalid_code
  status: 401
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The two-factor code is wrong. meta.attemptsLeft says how many tries are left.
    vi: Mã xác thực hai lớp không đúng. meta.attemptsLeft cho biết còn bao nhiêu lần thử.
- id: invite_accepted
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The invitation was already used. Sign in to continue.
    vi: Lời mời đã được dùng. Hãy đăng nhập để tiếp tục.
- id: invite_expired
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The invitation expired. Ask the person who invited you for a new one.
    vi: Lời mời đã hết hạn. Hãy nhờ người đã mời bạn gửi lời mời mới.
- id: invite_not_found
  status: 404
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The invitation link isn't valid. Check that the whole link was copied, or ask for a new invitation.
    vi: Liên kết mời không hợp lệ. Hãy kiểm tra bạn đã sao chép đủ liên kết, hoặc xin lời mời mới.
- id: invite_revoked
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The invitation was revoked, so the link no longer works.
    vi: Lời mời đã bị thu hồi, nên liên kết không còn dùng được.
- id: invite_sign_in
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The invited email already has an account. Sign in to accept the invitation.
    vi: Email được mời đã có tài khoản. Hãy đăng nhập để chấp nhận lời mời.
- id: invite_wrong_account
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The invitation is for another email than the account you are signed in with. Sign out and continue, or ask for an invitation for this account.
    vi: Lời mời dành cho một email khác với tài khoản bạn đang đăng nhập. Hãy đăng xuất và tiếp tục, hoặc xin lời mời cho tài khoản này.
- id: last_method
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: This is the account's only way to sign in. Add a passkey or a password before removing or unlinking it.
    vi: Đây là cách đăng nhập duy nhất của tài khoản. Hãy thêm khóa truy cập hoặc mật khẩu trước khi xóa hay hủy liên kết cách này.
- id: last_second_factor
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: Two-factor is required for the account, and this is its last second factor. Set up an authenticator app or another passkey first.
    vi: Tài khoản bắt buộc xác thực hai lớp, và đây là yếu tố thứ hai cuối cùng. Hãy thiết lập ứng dụng xác thực hoặc thêm khóa truy cập khác trước.
- id: method_disabled
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: This sign-in method (password or passkey) is turned off on the instance. Use another one, such as single sign-on.
    vi: Cách đăng nhập này (mật khẩu hoặc khóa truy cập) đã tắt trên hệ thống. Hãy dùng cách khác, chẳng hạn đăng nhập một lần.
- id: passkey_failed
  status: 401
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The passkey didn't work for this account. Try again, or sign in with email and password.
    vi: Khóa truy cập không dùng được cho tài khoản này. Hãy thử lại, hoặc đăng nhập bằng email và mật khẩu.
- id: passkey_rejected
  status: 422
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The passkey couldn't be verified. Try again, or use another device or security key.
    vi: Không xác minh được khóa truy cập. Hãy thử lại, hoặc dùng thiết bị hay khóa bảo mật khác.
- id: public_url_invalid
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: Passkeys need the instance's public URL, with a domain name rather than an IP address. An instance admin sets it in Instance admin.
    vi: Khóa truy cập cần URL công khai của hệ thống, với tên miền thay vì địa chỉ IP. Quản trị viên hệ thống đặt URL này trong Quản trị hệ thống.
- id: reset_expired
  status: 410
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The password reset link is older than 15 minutes or was already used. Request a new one; the current password keeps working.
    vi: Liên kết đặt lại mật khẩu đã quá 15 phút hoặc đã được dùng. Hãy yêu cầu liên kết mới; mật khẩu hiện tại vẫn dùng được.
- id: setup_incomplete
  status: 409
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: 'An earlier setup step is not done: replace the temporary password, add a passkey or authenticator app and confirm the instance basics first. An instance admin who loads the sample workspace before that gets it too.'
    vi: 'Một bước thiết lập trước đó chưa xong: trước hết hãy thay mật khẩu tạm thời, thêm khóa truy cập hoặc ứng dụng xác thực và xác nhận thông tin cơ bản của hệ thống. Quản trị viên hệ thống tải không gian làm việc mẫu trước khi xong các bước đó cũng nhận mã này.'
- id: sso_required
  status: 403
  area:
    en: Sign-in and account
    vi: Đăng nhập và tài khoản
  description:
    en: The email's domain signs in with single sign-on, so password and passkey sign-in are turned off for it.
    vi: Tên miền của email này dùng đăng nhập một lần (SSO), nên đăng nhập bằng mật khẩu và khóa truy cập đã tắt cho tên miền đó.
- id: agency_off
  status: 403
  area:
    en: Instance admin
    vi: Quản trị hệ thống
  description:
    en: Agency mode is off on this instance. An instance admin turns it on in Instance admin › Instance & updates.
    vi: Chế độ agency đang tắt trên hệ thống này. Quản trị viên hệ thống bật chế độ này trong Quản trị hệ thống › Hệ thống và cập nhật.
- id: last_admin
  status: 409
  area:
    en: Instance admin
    vi: Quản trị hệ thống
  description:
    en: The user is the last instance admin. Make someone else an instance admin first.
    vi: Người dùng này là quản trị viên hệ thống cuối cùng. Hãy đưa người khác thành quản trị viên hệ thống trước.
- id: lockout_risk
  status: 409
  area:
    en: Instance admin
    vi: Quản trị hệ thống
  description:
    en: The sign-in policy change would leave you no way to sign in. Add a passkey or link a sign-in that stays on, then save again.
    vi: Thay đổi chính sách đăng nhập này sẽ khiến bạn không còn cách nào để đăng nhập. Hãy thêm khóa truy cập hoặc liên kết một cách đăng nhập vẫn được bật, rồi lưu lại.
- id: reauth_required
  status: 403
  area:
    en: Instance admin
    vi: Quản trị hệ thống
  description:
    en: "Sign in again first: with your identity provider before transferring ownership (within 10 minutes), or with two-factor before resetting someone's two-factor."
    vi: 'Hãy đăng nhập lại trước: với nhà cung cấp danh tính (IdP) trước khi chuyển quyền sở hữu (trong vòng 10 phút), hoặc bằng xác thực hai lớp trước khi đặt lại xác thực hai lớp của người khác.'
- id: restore_expired
  status: 410
  area:
    en: Instance admin
    vi: Quản trị hệ thống
  description:
    en: The workspace was deleted more than 7 days ago and can't be restored.
    vi: Không gian làm việc đã bị xóa hơn 7 ngày trước và không thể khôi phục.
- id: sso_incomplete
  status: 409
  area:
    en: Single sign-on
    vi: Đăng nhập một lần (SSO)
  description:
    en: The SSO connection is missing settings needed for a test sign-in or to enable it. The detail lists them.
    vi: Kết nối SSO còn thiếu các cài đặt cần cho lần đăng nhập thử hoặc để bật kết nối. Trường detail liệt kê các cài đặt đó.
- id: sso_unreachable
  status: 502
  area:
    en: Single sign-on
    vi: Đăng nhập một lần (SSO)
  description:
    en: The identity provider couldn't be reached for a test sign-in. The detail has the error.
    vi: Không kết nối được nhà cung cấp danh tính (IdP) cho lần đăng nhập thử. Trường detail chứa lỗi.
- id: last_owner
  status: 409
  area:
    en: Team
    vi: Nhóm
  description:
    en: "The member is the last Owner: a workspace always keeps at least one Owner, so their role can't be changed and they can't be removed or deactivated. Transfer ownership first."
    vi: 'Thành viên này là Chủ sở hữu cuối cùng: một không gian làm việc luôn cần ít nhất một Chủ sở hữu, nên không thể đổi vai trò, xóa hay vô hiệu hóa thành viên này. Hãy chuyển quyền sở hữu trước.'
- id: bulk_terms
  status: 409
  area:
    en: Sending providers and routing
    vi: Nhà cung cấp gửi thư và định tuyến
  description:
    en: The provider's terms don't allow bulk or marketing mail on this route. Choose another provider, or keep it and acknowledge the terms. meta.issues lists the routes.
    vi: Điều khoản của nhà cung cấp không cho phép thư hàng loạt hoặc thư tiếp thị trên tuyến này. Hãy chọn nhà cung cấp khác, hoặc giữ nhà cung cấp này và xác nhận đã biết điều khoản. meta.issues liệt kê các tuyến.
- id: no_route
  status: 422
  area:
    en: Sending providers and routing
    vi: Nhà cung cấp gửi thư và định tuyến
  description:
    en: 'The route tester found no provider for this mail: the route has no primary provider yet, or it points at a provider that is no longer connected.'
    vi: 'Công cụ thử tuyến không tìm thấy nhà cung cấp nào cho thư này: tuyến chưa có nhà cung cấp chính, hoặc trỏ đến một nhà cung cấp không còn được kết nối.'
- id: routing_changed
  status: 409
  area:
    en: Sending providers and routing
    vi: Nhà cung cấp gửi thư và định tuyến
  description:
    en: 'The routing changed since you opened it: someone saved it, or the warm-up planner raised a share. Nothing was saved, and meta.streams lists the streams that changed. Load the latest routing, then make your change again.'
    vi: 'Định tuyến đã thay đổi kể từ khi bạn mở: có người đã lưu, hoặc trình lập kế hoạch khởi động đã tăng tỷ trọng. Chưa có gì được lưu, và meta.streams liệt kê các luồng đã thay đổi. Hãy tải định tuyến mới nhất rồi thực hiện lại thay đổi.'
- id: accessibility_unchecked
  status: 422
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: The email's accessibility couldn't be checked because the MJML doesn't compile. Edits are saved.
    vi: Không kiểm tra được khả năng tiếp cận của email vì MJML không biên dịch được. Các thay đổi vẫn được lưu.
- id: fixes_changed
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: The campaign changed after these Send Readiness fixes (a later edit, later fixes, or an audience or route change), so undoing them would lose that change. Undo what you need by hand, or restore a version from Version history.
    vi: Chiến dịch đã thay đổi sau các bản sửa Độ sẵn sàng gửi này (một chỉnh sửa sau đó, các bản sửa sau đó, hoặc thay đổi người nhận hay tuyến gửi), nên hoàn tác sẽ làm mất thay đổi đó. Hãy tự hoàn tác phần bạn cần, hoặc khôi phục một phiên bản từ Lịch sử phiên bản.
- id: fixes_not_undoable
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: "These fixes can't be undone in one click: they were saved together with someone else's edit, or they changed language versions. Use Version history."
    vi: 'Không thể hoàn tác các bản sửa này bằng một cú nhấp: chúng được lưu cùng chỉnh sửa của người khác, hoặc đã thay đổi các phiên bản ngôn ngữ. Hãy dùng Lịch sử phiên bản.'
- id: fixes_undone
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: These Send Readiness fixes were undone already.
    vi: Các bản sửa Độ sẵn sàng gửi này đã được hoàn tác.
- id: readiness_blocked
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: Send Readiness still blocks the send (a campaign, digest issue, text, push or WhatsApp campaign). Fix every blocking check first.
    vi: Độ sẵn sàng gửi vẫn chặn lần gửi (chiến dịch, số của bản tổng hợp, tin nhắn, chiến dịch thông báo đẩy hoặc WhatsApp). Hãy sửa mọi mục kiểm tra đang chặn trước.
- id: readiness_changed
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: Send Readiness ran again since you looked. Review the new results and confirm again.
    vi: Độ sẵn sàng gửi đã được kiểm tra lại sau khi bạn xem. Hãy xem kết quả mới và xác nhận lại.
- id: readiness_incomplete
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: Some checks couldn't run. Retry them, or continue with provider data only.
    vi: Một số mục kiểm tra không chạy được. Hãy chạy lại, hoặc tiếp tục chỉ với dữ liệu của nhà cung cấp.
- id: readiness_old
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: A send that starts now needs checks from the last 15 minutes. The checks ran earlier, so they run again in the background; send when they finish.
    vi: Lần gửi bắt đầu ngay cần kết quả kiểm tra trong 15 phút gần nhất. Các kiểm tra đã chạy trước đó lâu hơn, nên chúng chạy lại ở chế độ nền; hãy gửi khi chúng hoàn tất.
- id: readiness_running
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: Send Readiness is already running. Try again when it finishes.
    vi: Độ sẵn sàng gửi đang được kiểm tra. Hãy thử lại khi kiểm tra xong.
- id: readiness_stale
  status: 409
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: The campaign changed since the checks ran. Run them again before sending.
    vi: Chiến dịch đã thay đổi sau khi kiểm tra. Hãy chạy lại kiểm tra trước khi gửi.
- id: readiness_unavailable
  status: 503
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: Send Readiness isn't available in this server process. Try again on a process that runs it.
    vi: Tiến trình máy chủ này không chạy Độ sẵn sàng gửi. Hãy thử lại trên một tiến trình có chạy kiểm tra này.
- id: sending_unavailable
  status: 503
  area:
    en: Campaigns and Send Readiness
    vi: Chiến dịch và Độ sẵn sàng gửi
  description:
    en: The sending engine isn't running in this installation, so nothing was scheduled. The checks, the schedule and the approval are kept.
    vi: Bộ máy gửi thư không chạy trong bản cài đặt này, nên chưa có gì được lên lịch. Kết quả kiểm tra, lịch gửi và phê duyệt vẫn được giữ.
- id: brand_kit_not_saved
  status: 409
  area:
    en: Brand kit
    vi: Bộ nhận diện thương hiệu
  description:
    en: 'Save the brand kit first: the synced Header and Footer start from it.'
    vi: 'Hãy lưu bộ nhận diện thương hiệu trước: Đầu trang và Chân trang đồng bộ được tạo từ đó.'
- id: synced_block_kept
  status: 409
  area:
    en: Brand kit
    vi: Bộ nhận diện thương hiệu
  description:
    en: "The synced Header and Footer can't be deleted: every brand kit has them. Edit them instead."
    vi: 'Không thể xóa Đầu trang và Chân trang đồng bộ: bộ nhận diện nào cũng có chúng. Hãy sửa chúng thay vì xóa.'
- id: website_unreachable
  status: 502
  area:
    en: Brand kit
    vi: Bộ nhận diện thương hiệu
  description:
    en: The brand kit import couldn't read the website. The detail names the site and a short reason; check the address and try again.
    vi: Không đọc được trang web để nhập vào bộ nhận diện thương hiệu. Trường detail ghi tên trang và lý do ngắn gọn; hãy kiểm tra địa chỉ rồi thử lại.
- id: render_running
  status: 409
  area:
    en: Real renders
    vi: Hiển thị thật
  description:
    en: A real render of this campaign is still running; meta.renderId names it. Its screenshots appear as they arrive.
    vi: Một lượt hiển thị thật của chiến dịch này vẫn đang chạy; meta.renderId cho biết lượt đó. Ảnh chụp sẽ hiện ra khi có.
- id: rendering_key_refused
  status: 422
  area:
    en: Real renders
    vi: Hiển thị thật
  description:
    en: Litmus or Mailgun Inspect refused the stored API key when a render started. Someone who manages integrations pastes the key again. When you connect, a refused key answers validation_failed at body.apiKey.
    vi: Litmus hoặc Mailgun Inspect từ chối khóa API đã lưu khi bắt đầu một lượt hiển thị. Người quản lý tích hợp cần dán lại khóa. Khi kết nối, khóa bị từ chối trả về validation_failed tại body.apiKey.
- id: rendering_not_connected
  status: 409
  area:
    en: Real renders
    vi: Hiển thị thật
  description:
    en: No rendering service (Litmus or Mailgun Inspect) is connected to this workspace.
    vi: Không gian làm việc này chưa kết nối dịch vụ hiển thị nào (Litmus hoặc Mailgun Inspect).
- id: rendering_unavailable
  status: 502
  area:
    en: Real renders
    vi: Hiển thị thật
  description:
    en: Litmus or Mailgun Inspect couldn't be reached or answered with an error. The detail says which; try again in a minute.
    vi: Không kết nối được tới Litmus hoặc Mailgun Inspect, hoặc dịch vụ trả về lỗi. Trường detail cho biết trường hợp nào; hãy thử lại sau một phút.
- id: approval_invalidated
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
  description:
    en: The approval no longer covers the campaign because something changed since it was approved. Ask for approval again.
    vi: Phê duyệt không còn áp dụng cho chiến dịch vì đã có thay đổi sau khi được phê duyệt. Hãy gửi lại yêu cầu phê duyệt.
- id: approval_not_required
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
  description:
    en: No approval rule matches this send, so you can schedule it yourself.
    vi: Không có quy tắc phê duyệt nào khớp với lần gửi này, nên bạn có thể tự lên lịch.
- id: approval_required
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
  description:
    en: The send or publish needs an approval first. The detail names the rule; ask for approval, then try again. Also returned when publishing a post, a landing page or a transactional template that an approval rule covers.
    vi: Lần gửi hoặc xuất bản này cần được phê duyệt trước. Trường detail ghi tên quy tắc; hãy gửi yêu cầu phê duyệt rồi thử lại. Mã này cũng được trả về khi xuất bản bài viết, trang đích hoặc mẫu giao dịch thuộc phạm vi của một quy tắc phê duyệt.
- id: approval_would_cancel
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
  description:
    en: Saving the content would withdraw the campaign's pending approval request or cancel its approval, so it would need approval again before it sends. meta has the request's status, approvers and version. Save again with cancelApproval set to true to go ahead.
    vi: Lưu nội dung sẽ rút lại yêu cầu phê duyệt đang chờ hoặc hủy phê duyệt của chiến dịch, nên chiến dịch cần được phê duyệt lại trước khi gửi. Trường meta có trạng thái, người phê duyệt và phiên bản của yêu cầu. Hãy lưu lại với cancelApproval đặt là true để tiếp tục.
- id: no_approvers
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
  description:
    en: The send needs more approvals from other people than the workspace has approvers. An Owner can give campaigns:approve to another role.
    vi: Lần gửi cần nhiều lượt phê duyệt từ người khác hơn số người phê duyệt mà không gian làm việc có. Chủ sở hữu có thể cấp campaigns:approve cho một vai trò khác.
- id: no_client_approver
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
  description:
    en: The send needs client sign-off, and nobody in the client workspace holds the Client approver role yet. Invite the client's approver in Settings › Team.
    vi: Lần gửi cần phê duyệt của khách hàng, nhưng chưa ai trong không gian làm việc của khách hàng có vai trò Người duyệt phía khách hàng. Hãy mời người duyệt của khách hàng trong Cài đặt › Nhóm.
- id: restore_incomplete
  status: 409
  area:
    en: Approvals
    vi: Phê duyệt
  description:
    en: The campaign still differs from the approved version. Ask for approval again.
    vi: Chiến dịch vẫn khác phiên bản đã được phê duyệt. Hãy gửi lại yêu cầu phê duyệt.
- id: no_system_provider
  status: 409
  area:
    en: Audience
    vi: Người đăng ký
  description:
    en: No sending provider is connected to the System stream, so opt-in confirmation emails can't go out yet. Connect one in Sending providers.
    vi: Chưa có nhà cung cấp gửi thư nào được kết nối với luồng Hệ thống, nên chưa gửi được email xác nhận đăng ký. Hãy kết nối một nhà cung cấp trong Nhà cung cấp gửi thư.
- id: file_columns
  status: 422
  area:
    en: Imports
    vi: Nhập dữ liệu
  description:
    en: Some rows of the file don't match its columns. The detail lists them; fix the file or skip those rows.
    vi: Một số dòng của tệp không khớp với các cột. Trường detail liệt kê các dòng đó; hãy sửa tệp hoặc bỏ qua những dòng này.
- id: file_unreadable
  status: 422
  area:
    en: Imports
    vi: Nhập dữ liệu
  description:
    en: The uploaded CSV or XLSX file can't be read. The detail says why.
    vi: Không đọc được tệp CSV hoặc XLSX đã tải lên. Trường detail cho biết lý do.
- id: source_auth_failed
  status: 422
  area:
    en: Imports
    vi: Nhập dữ liệu
  description:
    en: The platform you import from (contacts or transactional templates) rejected the API key or credentials. meta.sourceStatus has its HTTP status.
    vi: Nền tảng nguồn mà bạn nhập dữ liệu (liên hệ hoặc mẫu giao dịch) đã từ chối khóa API hoặc thông tin xác thực. meta.sourceStatus chứa mã trạng thái HTTP của nền tảng đó.
- id: source_bad_response
  status: 502
  area:
    en: Imports
    vi: Nhập dữ liệu
  description:
    en: The platform you import from answered with something ReputeCast can't read. The detail has what it answered.
    vi: Nền tảng nguồn mà bạn nhập dữ liệu trả về nội dung ReputeCast không đọc được. Trường detail chứa nội dung đã trả về.
- id: source_not_found
  status: 422
  area:
    en: Imports
    vi: Nhập dữ liệu
  description:
    en: The transactional template platform has no such template or version, or the account has nothing to import.
    vi: Nền tảng mẫu giao dịch không có mẫu hoặc phiên bản này, hoặc tài khoản không có gì để nhập.
- id: source_rate_limited
  status: 429
  area:
    en: Imports
    vi: Nhập dữ liệu
  description:
    en: The platform you import from is limiting requests. The import slows down; try again later. meta.sourceStatus has its HTTP status.
    vi: Nền tảng nguồn mà bạn nhập dữ liệu đang giới hạn yêu cầu. Quá trình nhập chậm lại; hãy thử lại sau. meta.sourceStatus chứa mã trạng thái HTTP của nền tảng đó.
- id: source_unavailable
  status: 502
  area:
    en: Imports
    vi: Nhập dữ liệu
  description:
    en: The platform you import from didn't answer. Try again in a few minutes.
    vi: Nền tảng nguồn mà bạn nhập dữ liệu không phản hồi. Hãy thử lại sau vài phút.
- id: count_timeout
  status: 504
  area:
    en: Segments
    vi: Phân khúc
  description:
    en: Counting the segment took longer than 10 seconds. The segment still works at send time.
    vi: Việc đếm phân khúc mất hơn 10 giây. Phân khúc vẫn hoạt động khi gửi.
- id: sql_disabled
  status: 409
  area:
    en: Segments
    vi: Phân khúc
  description:
    en: SQL segments are turned off on this database. Create the reputecast_segments role and grant it to the app user, then run reputecast migrate up.
    vi: Phân khúc SQL đang tắt trên cơ sở dữ liệu này. Hãy tạo role reputecast_segments và cấp role đó cho người dùng của ứng dụng, rồi chạy reputecast migrate up.
- id: sql_error
  status: 422
  area:
    en: Segments
    vi: Phân khúc
  description:
    en: The SQL segment's query is invalid. The detail has the database message and, when known, the position of the error.
    vi: Truy vấn của phân khúc SQL không hợp lệ. Trường detail chứa thông báo của cơ sở dữ liệu và, nếu biết, vị trí của lỗi.
- id: no_verification_service
  status: 409
  area:
    en: Address verification
    vi: Xác minh địa chỉ
  description:
    en: No address verification service is connected. Connect one in Settings › Integrations.
    vi: Chưa kết nối dịch vụ xác minh địa chỉ nào. Hãy kết nối một dịch vụ trong Cài đặt › Tích hợp.
- id: nothing_to_check
  status: 409
  area:
    en: Address verification
    vi: Xác minh địa chỉ
  description:
    en: 'There is nothing to verify: every selected address was checked in the last 90 days, or the selection is empty.'
    vi: 'Không có gì để xác minh: mọi địa chỉ đã chọn đều đã được kiểm tra trong 90 ngày qua, hoặc chưa chọn địa chỉ nào.'
- id: accessibility_blocked
  status: 409
  area:
    en: Automations
    vi: Tự động hóa
  description:
    en: The workspace accessibility policy is set to Block and an email in the flow has serious accessibility issues. The detail names the email; fix it, then publish.
    vi: Chính sách khả năng tiếp cận của không gian làm việc đang đặt là Chặn và một email trong quy trình có lỗi khả năng tiếp cận nghiêm trọng. Trường detail ghi tên email; hãy sửa email đó rồi xuất bản.
- id: template_not_found
  status: 422
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: The template ID doesn't exist in this workspace. Check the ID on Templates.
    vi: ID mẫu không tồn tại trong không gian làm việc này. Hãy kiểm tra ID trong trang Mẫu.
- id: template_not_published
  status: 422
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: The template has a draft but no live version. Publish it first.
    vi: Mẫu có bản nháp nhưng chưa có phiên bản đang chạy. Hãy xuất bản mẫu trước.
- id: missing_variables
  status: 422
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: A required variable isn't in data. The answer lists which ones.
    vi: Thiếu một biến bắt buộc trong data. Phản hồi liệt kê các biến bị thiếu.
- id: invalid_recipient
  status: 422
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: The address isn't a valid email address. Validate it in your app.
    vi: Địa chỉ không phải là địa chỉ email hợp lệ. Hãy kiểm tra địa chỉ ngay trong ứng dụng của bạn.
- id: recipient_suppressed
  status: 422
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: The address bounced, complained or is a spam trap. The answer gives the reason and date.
    vi: Thư gửi đến địa chỉ này đã bị trả lại, người nhận đã khiếu nại, hoặc địa chỉ là bẫy spam. Phản hồi cho biết lý do và ngày.
- id: sender_not_verified
  status: 422
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: The from address isn't a verified Transactional sender. Verify it in Settings › Senders.
    vi: Địa chỉ from chưa phải người gửi Giao dịch đã xác minh. Hãy xác minh địa chỉ này trong Cài đặt › Người gửi.
- id: attachments_too_large
  status: 422
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: "The message, attachments included, is over the route's size limit: the smallest limit of the route's sending providers."
    vi: 'Thư, tính cả tệp đính kèm, vượt giới hạn kích thước của tuyến: giới hạn nhỏ nhất trong các nhà cung cấp gửi thư của tuyến.'
- id: no_healthy_route
  status: 503
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: Every sending provider in the route is down. Retry with the same idempotency key.
    vi: Mọi nhà cung cấp gửi thư trong tuyến đều đang gián đoạn. Hãy thử lại với cùng Idempotency-Key.
- id: template_not_allowed
  status: 403
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: The key can't send this template or category. Use a key that can, or widen the key's scope.
    vi: Khóa này không được gửi mẫu hoặc danh mục này. Hãy dùng khóa được phép, hoặc mở rộng phạm vi của khóa.
- id: agents_never_send
  status: 403
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: MCP agents never send transactional mail. Send from your app with a send-only key.
    vi: Tác tử MCP không bao giờ gửi email giao dịch. Hãy gửi từ ứng dụng của bạn bằng khóa chỉ gửi.
- id: content_removed
  status: 410
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: The message's rendered content is no longer kept (content retention), or it was never rendered. The summary and events stay until metadata retention ends.
    vi: Nội dung đã kết xuất của thư không còn được lưu (theo thời hạn lưu nội dung), hoặc thư chưa từng được kết xuất. Phần tóm tắt và sự kiện vẫn được giữ đến hết thời hạn lưu siêu dữ liệu.
- id: resend_unavailable
  status: 409
  area:
    en: Transactional API
    vi: API email giao dịch
  description:
    en: "The message can't be sent again from ReputeCast: sensitive variables or attachments weren't stored, or it arrived by SMTP. Send it again from your app."
    vi: 'Không thể gửi lại thư này từ ReputeCast: biến nhạy cảm hoặc tệp đính kèm không được lưu, hoặc thư đến qua SMTP. Hãy gửi lại từ ứng dụng của bạn.'
- id: breaking_change
  status: 409
  area:
    en: Transactional templates
    vi: Mẫu giao dịch
  description:
    en: The draft changes variables in a way that would break calls made in the last 7 days. Make the variable optional with a default, update your app first, or publish anyway. meta.breaking lists the changes.
    vi: Bản nháp thay đổi biến theo cách sẽ làm hỏng các lệnh gọi trong 7 ngày qua. Hãy chuyển biến thành không bắt buộc với giá trị mặc định, cập nhật ứng dụng của bạn trước, hoặc vẫn xuất bản. meta.breaking liệt kê các thay đổi.
- id: template_does_not_render
  status: 422
  area:
    en: Transactional templates
    vi: Mẫu giao dịch
  description:
    en: The template doesn't render with the given data, or the draft can't be published yet. The detail says what fails. Publishing and asking for approval answer 409.
    vi: Mẫu không kết xuất được với dữ liệu đã cho, hoặc bản nháp chưa xuất bản được. Trường detail cho biết lỗi ở đâu. Khi xuất bản và khi gửi yêu cầu phê duyệt, mã này đi kèm 409.
- id: key_revoked
  status: 401
  area:
    en: Integration keys
    vi: Khóa tích hợp
  description:
    en: The integration's key was revoked. Reconnect the integration in Settings › Integrations to get a new key.
    vi: Khóa của tích hợp đã bị thu hồi. Hãy kết nối lại tích hợp trong Cài đặt › Tích hợp để nhận khóa mới.
- id: key_expired
  status: 401
  area:
    en: Integration keys
    vi: Khóa tích hợp
  description:
    en: The integration's key expired. Reconnect the integration in Settings › Integrations to get a new key.
    vi: Khóa của tích hợp đã hết hạn. Hãy kết nối lại tích hợp trong Cài đặt › Tích hợp để nhận khóa mới.
- id: owner_deactivated
  status: 403
  area:
    en: Integration keys
    vi: Khóa tích hợp
  description:
    en: The member who owns the integration's key left the workspace, so the key lost its permissions. Someone with integrations:manage can take it over in Settings › Integrations; the key stays the same.
    vi: Thành viên sở hữu khóa của tích hợp đã rời không gian làm việc, nên khóa mất các quyền. Người có quyền integrations:manage có thể tiếp quản khóa trong Cài đặt › Tích hợp; khóa vẫn giữ nguyên.
- id: integration_operation_denied
  status: 403
  area:
    en: Integration keys
    vi: Khóa tích hợp
  description:
    en: The key belongs to an integration and works only for that integration's turned-on triggers and actions. Change what it can do in Settings › Integrations.
    vi: Khóa này thuộc một tích hợp và chỉ dùng được cho các trình kích hoạt và hành động đang bật của tích hợp đó. Hãy thay đổi những gì khóa được phép làm trong Cài đặt › Tích hợp.
- id: instance_unreachable
  status: 409
  area:
    en: Integration keys
    vi: Khóa tích hợp
  description:
    en: The integration can't reach the instance's public URL. Give the instance a public address, or run the tool on your own network.
    vi: Tích hợp không truy cập được URL công khai của hệ thống. Hãy cấp cho hệ thống một địa chỉ công khai, hoặc chạy công cụ đó trong mạng của bạn.
- id: managed_by_integration
  status: 409
  area:
    en: Integration keys
    vi: Khóa tích hợp
  description:
    en: The API key or webhook endpoint belongs to an integration (Zapier, Make, n8n, WordPress). Change it in Settings › Integrations or in the workflow.
    vi: Khóa API hoặc endpoint webhook này thuộc một tích hợp (Zapier, Make, n8n, WordPress). Hãy thay đổi trong Cài đặt › Tích hợp hoặc trong workflow.
- id: unsubscribed
  status: 409
  area:
    en: Integration actions
    vi: Hành động tích hợp
  description:
    en: The contact left the list, and ReputeCast doesn't add people back to a list they left.
    vi: Liên hệ đã rời danh sách, và ReputeCast không thêm lại một người vào danh sách mà họ đã rời.
- id: suppressed
  status: 409
  area:
    en: Integration actions
    vi: Hành động tích hợp
  description:
    en: The address is on the suppression list, and ReputeCast doesn't add suppressed addresses. The detail gives the date and reason.
    vi: Địa chỉ nằm trong danh sách chặn gửi, và ReputeCast không thêm địa chỉ bị chặn gửi. Trường detail cho biết ngày và lý do.
- id: private_address
  status: 422
  area:
    en: Integration actions
    vi: Hành động tích hợp
  description:
    en: The webhook address points to a private network. It stays blocked until an instance admin allows private addresses (webhooks.allow_private_networks).
    vi: Địa chỉ webhook trỏ đến một mạng riêng. Địa chỉ này bị chặn cho đến khi quản trị viên hệ thống cho phép địa chỉ riêng (webhooks.allow_private_networks).
- id: certificate_failing
  status: 409
  area:
    en: Website
    vi: Trang web
  description:
    en: The custom domain's certificate is failing, so the website can't go live there. Fix it in Branding & domain first.
    vi: Chứng chỉ của tên miền tùy chỉnh đang lỗi, nên trang web chưa thể chạy trên tên miền đó. Hãy sửa trong Thương hiệu và tên miền trước.
- id: featured_full
  status: 409
  area:
    en: Website
    vi: Trang web
  description:
    en: The home page features up to 3 posts. Unfeature one in Home & navigation first.
    vi: Trang chủ làm nổi bật tối đa 3 bài viết. Hãy bỏ nổi bật một bài trong Trang chủ và điều hướng trước.
- id: header_full
  status: 409
  area:
    en: Website
    vi: Trang web
  description:
    en: The website header holds up to 6 links. Remove one first.
    vi: Đầu trang web chứa tối đa 6 liên kết. Hãy xóa một liên kết trước.
- id: nothing_to_publish
  status: 409
  area:
    en: Landing pages
    vi: Trang đích
  description:
    en: Nothing changed since the live version, so there's nothing to publish.
    vi: Không có thay đổi nào so với phiên bản đang chạy, nên không có gì để xuất bản.
- id: reminders_exist
  status: 409
  area:
    en: Landing pages
    vi: Trang đích
  description:
    en: The reminder automation for this page already exists.
    vi: Tự động hóa gửi lời nhắc cho trang này đã tồn tại.
- id: checks_failed
  status: 409
  area:
    en: Landing pages and products
    vi: Trang đích và sản phẩm
  description:
    en: A publish check still blocks the page or product. The checks list what is missing.
    vi: Một mục kiểm tra trước khi xuất bản vẫn chặn trang hoặc sản phẩm. Danh sách kiểm tra cho biết còn thiếu gì.
- id: file_mismatch
  status: 422
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: The file's extension doesn't match its content, so buyers would get a file their computer can't open. Upload the right file, or rename it.
    vi: Phần mở rộng của tệp không khớp với nội dung, nên người mua sẽ nhận được tệp mà máy tính của họ không mở được. Hãy tải lên đúng tệp, hoặc đổi tên tệp.
- id: file_program
  status: 422
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: The file is a program. Programs can't be sold or offered as downloads.
    vi: Tệp này là một chương trình. Không thể bán hoặc tặng chương trình dưới dạng tệp tải xuống.
- id: price_change
  status: 409
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: 'Publishing changes the price. Confirm it: existing buyers keep their access and nobody is charged again.'
    vi: 'Việc xuất bản sẽ thay đổi giá. Hãy xác nhận: người mua hiện tại vẫn giữ quyền truy cập và không ai bị tính phí lại.'
- id: stripe_key_rejected
  status: 409
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: Stripe refused the key. Replace it in Earn › Settings › Payments, then publish again.
    vi: Stripe đã từ chối khóa. Hãy thay khóa trong Kiếm tiền › Cài đặt › Thanh toán, rồi xuất bản lại.
- id: stripe_not_connected
  status: 409
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: "Stripe is not connected. Connect it in Earn › Settings › Payments first: nothing can be bought, and Stripe coupon rewards can't be given, without it."
    vi: 'Stripe chưa được kết nối. Hãy kết nối Stripe trong Kiếm tiền › Cài đặt › Thanh toán trước: không có Stripe thì không ai mua được gì và không trao được phần thưởng phiếu giảm giá Stripe.'
- id: stripe_permission
  status: 409
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: The Stripe key can't create products and prices. Give it those permissions in Stripe, then publish again.
    vi: Khóa Stripe không tạo được sản phẩm và giá. Hãy cấp các quyền đó cho khóa trong Stripe, rồi xuất bản lại.
- id: stripe_unavailable
  status: 503
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: Stripe didn't answer, so nothing was published or no checkout started and no payment was taken. Try again in a minute.
    vi: Stripe không phản hồi, nên chưa có gì được xuất bản hoặc chưa có phiên thanh toán nào bắt đầu, và không có khoản thanh toán nào bị thu. Hãy thử lại sau một phút.
- id: upload_gone
  status: 404
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: The upload stopped and nothing was kept. Choose the file again.
    vi: Quá trình tải lên đã dừng và không có gì được giữ lại. Hãy chọn lại tệp.
- id: upload_incomplete
  status: 409
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: "The upload isn't finished: only part of the file arrived."
    vi: 'Tệp chưa tải lên xong: mới nhận được một phần của tệp.'
- id: upload_offset
  status: 409
  area:
    en: Digital products
    vi: Sản phẩm số
  description:
    en: Part of the upload arrived twice. The upload continues from the offset in the detail.
    vi: Một phần của tệp tải lên được nhận hai lần. Quá trình tải lên tiếp tục từ vị trí (offset) ghi trong trường detail.
- id: already_complimentary
  status: 409
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: The contact already has complimentary access. Change it instead.
    vi: Liên hệ đã có quyền truy cập miễn phí. Hãy thay đổi quyền truy cập hiện có thay vì cấp mới.
- id: import_not_matched
  status: 409
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: Match the import rows with Stripe first.
    vi: Hãy khớp các dòng nhập với Stripe trước.
- id: import_started
  status: 409
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: The paid members import has already started.
    vi: Lần nhập hội viên trả phí này đã bắt đầu.
- id: key_format
  status: 422
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: The value doesn't look like a Stripe key. Restricted keys start with rk_live_ or rk_test_.
    vi: Giá trị này có vẻ không phải khóa Stripe. Khóa hạn chế bắt đầu bằng rk_live_ hoặc rk_test_.
- id: key_rejected
  status: 422
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: "Stripe says the key isn't valid: it may have been rolled, deleted or copied only in part."
    vi: 'Stripe báo khóa không hợp lệ: có thể khóa đã bị xoay vòng, bị xóa hoặc chỉ được sao chép một phần.'
- id: missing_permissions
  status: 422
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: The Stripe key is missing permissions ReputeCast needs. Edit the key in Stripe, then try again.
    vi: Khóa Stripe thiếu các quyền ReputeCast cần. Hãy sửa khóa trong Stripe rồi thử lại.
- id: mode_connected
  status: 409
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: A live or test key is already connected. Replace it from Earn › Settings › Payments.
    vi: Đã có một khóa chính thức hoặc thử nghiệm được kết nối. Hãy thay khóa đó trong Kiếm tiền › Cài đặt › Thanh toán.
- id: no_email_column
  status: 422
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: No email column was found in the paid members file. Pick the column that holds addresses.
    vi: Không tìm thấy cột email trong tệp hội viên trả phí. Hãy chọn cột chứa địa chỉ email.
- id: not_cancelable
  status: 409
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: "The subscription can't be canceled here: it already ended, or it isn't billed through Stripe."
    vi: 'Không thể hủy thuê bao này ở đây: thuê bao đã kết thúc, hoặc không được thanh toán qua Stripe.'
- id: not_connected
  status: 409
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: Stripe isn't connected, so paid members can't be imported or subscriptions canceled from ReputeCast.
    vi: Stripe chưa được kết nối, nên không thể nhập hội viên trả phí hoặc hủy thuê bao từ ReputeCast.
- id: other_account
  status: 422
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: The key belongs to another Stripe account than the one connected. Use a key from that account, or disconnect first.
    vi: Khóa thuộc một tài khoản Stripe khác với tài khoản đã kết nối. Hãy dùng khóa của tài khoản đó, hoặc ngắt kết nối trước.
- id: provider_not_available
  status: 422
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
  description:
    en: This payment provider isn't available yet. Stripe is the supported provider.
    vi: Nhà cung cấp thanh toán này chưa khả dụng. Stripe là nhà cung cấp được hỗ trợ.
- id: public_url_unreachable
  status: 409
  area:
    en: Earn and Stripe
    vi: Kiếm tiền và Stripe
