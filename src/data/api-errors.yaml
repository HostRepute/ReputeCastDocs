    vi: 'Kho mã đã được lưu trữ: không cấp mã mới, và không thể thêm mã vào kho hay tạo mã trong cửa hàng của kho.'
    de: 'Der Pool ist archiviert: Er vergibt keine neuen Codes, und es lassen sich weder Codes hinzufügen noch in seinem Shop erstellen.'
    es: 'El grupo está archivado: no da códigos nuevos, y no se le pueden añadir códigos ni crearlos en su tienda.'
    fr: 'La réserve est archivée : elle ne donne plus de nouveaux codes, et on ne peut plus y ajouter de codes ni en créer dans sa boutique.'
- id: pool_in_use
  status: 409
  area:
    en: Discount codes
    vi: Mã giảm giá
    de: Rabattcodes
    es: Códigos de descuento
    fr: Codes de réduction
  description:
    en: 'Live automations send codes from the pool; meta.automations names them. Archived, it gives none: their emails wait for codes, then are skipped after a day. Send confirm: true to archive it anyway.'
    vi: 'Các luồng tự động đang chạy gửi mã từ kho này; meta.automations ghi tên các luồng đó. Khi lưu trữ, kho mã không cấp mã nào nữa: email của các luồng sẽ chờ mã rồi bị bỏ qua sau một ngày. Gửi confirm: true để vẫn lưu trữ.'
    de: 'Aktive Automationen versenden Codes aus dem Pool; meta.automations nennt sie. Archiviert vergibt er keine mehr: Die E-Mails warten auf Codes und werden nach einem Tag übersprungen. Senden Sie confirm: true, um ihn trotzdem zu archivieren.'
    es: 'Hay automatizaciones activas que envían códigos del grupo; meta.automations las nombra. Archivado, no da ninguno: sus correos esperan códigos y se omiten al cabo de un día. Envía confirm: true para archivarlo de todos modos.'
    fr: 'Des automatisations actives envoient des codes de la réserve ; meta.automations les nomme. Archivée, elle n’en donne plus : leurs e-mails attendent des codes, puis sont ignorés au bout d’un jour. Envoyez confirm: true pour l’archiver quand même.'
- id: store_cannot_create
  status: 409
  area:
    en: Discount codes
    vi: Mã giảm giá
    de: Rabattcodes
    es: Códigos de descuento
    fr: Codes de réduction
  description:
    en: "The store can't create discount codes. meta.reason says why: not_connected (the store isn't connected), not_granted (the Shopify store hasn't allowed discount codes yet), read_only (the WooCommerce key can't create coupons) or unsupported. The detail says what to do."
    vi: 'Cửa hàng không tạo được mã giảm giá. meta.reason cho biết lý do: not_connected (cửa hàng chưa được kết nối), not_granted (cửa hàng Shopify chưa cho phép mã giảm giá), read_only (khóa WooCommerce không tạo được phiếu giảm giá) hoặc unsupported. Trường detail cho biết cần làm gì.'
    de: 'Der Shop kann keine Rabattcodes erstellen. meta.reason nennt den Grund: not_connected (der Shop ist nicht verbunden), not_granted (der Shopify-Shop hat Rabattcodes noch nicht erlaubt), read_only (der WooCommerce-Schlüssel kann keine Gutscheine anlegen) oder unsupported. Das Feld detail sagt, was zu tun ist.'
    es: 'La tienda no puede crear códigos de descuento. meta.reason indica por qué: not_connected (la tienda no está conectada), not_granted (la tienda de Shopify aún no permite códigos de descuento), read_only (la clave de WooCommerce no puede crear cupones) o unsupported. El detalle indica qué hacer.'
    fr: 'La boutique ne peut pas créer de codes de réduction. meta.reason indique pourquoi : not_connected (la boutique n’est pas connectée), not_granted (la boutique Shopify n’autorise pas encore les codes de réduction), read_only (la clé WooCommerce ne peut pas créer de codes promo) ou unsupported. Le détail indique quoi faire.'
