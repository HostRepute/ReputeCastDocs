      au fur et à mesure de leur arrivée.
- id: rendering_key_refused
  status: 422
  area:
    en: Real renders
    vi: Hiển thị thật
    de: Echte Renderings
    es: Renderizados reales
    fr: Rendus réels
  description:
    en: Litmus or Mailgun Inspect refused the stored API key when a render started. Someone who manages integrations pastes the key again. When you connect, a refused key answers validation_failed at body.apiKey.
    vi: Litmus hoặc Mailgun Inspect từ chối khóa API đã lưu khi bắt đầu một lượt hiển thị. Người quản lý tích hợp cần dán lại khóa. Khi kết nối, khóa bị từ chối trả về validation_failed tại body.apiKey.
    de: >-
      Litmus oder Mailgun Inspect hat beim Start eines Renderings den gespeicherten API-Schlüssel abgelehnt. Jemand, der
      Integrationen verwaltet, fügt den Schlüssel erneut ein. Beim Verbinden antwortet die API bei einem abgelehnten
      Schlüssel mit validation_failed bei body.apiKey.
    es: >-
      Litmus o Mailgun Inspect rechazaron la clave de API guardada al empezar un renderizado. Alguien que gestione las
      integraciones debe volver a pegar la clave. Al conectar, una clave rechazada responde validation_failed en
      body.apiKey.
    fr: >-
      Litmus ou Mailgun Inspect a refusé la clé API enregistrée au démarrage d’un rendu. Une personne qui gère les
      intégrations colle de nouveau la clé. Lors de la connexion, une clé refusée répond validation_failed sur
      body.apiKey.
