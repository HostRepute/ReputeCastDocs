  description:
    en: The model provider's answer couldn't be read or it failed, so nothing was changed. A timeout answers 504.
    vi: Không đọc được phản hồi của nhà cung cấp mô hình hoặc nhà cung cấp gặp lỗi, nên không có gì bị thay đổi. Khi hết thời gian chờ, mã này đi kèm 504.
- id: ai_rate_limited
  status: 503
  area:
    en: AI assistant
    vi: Trợ lý AI
  description:
    en: The model provider is limiting requests from the workspace. Try again after the time in the detail; nothing was changed.
    vi: Nhà cung cấp mô hình đang giới hạn yêu cầu từ không gian làm việc. Hãy thử lại sau thời điểm ghi trong trường detail; không có gì bị thay đổi.
- id: ai_source_changed
  status: 409
  area:
    en: AI assistant
    vi: Trợ lý AI
  description:
    en: The email changed since the translation was made. Translate it again.
    vi: Email đã thay đổi sau khi bản dịch được tạo. Hãy dịch lại.
- id: ai_suggestion_gone
  status: 409
  area:
    en: AI assistant
    vi: Trợ lý AI
  description:
    en: The suggestion isn't yours or is older than a day. Ask for a new one.
    vi: Gợi ý không phải của bạn hoặc đã quá một ngày. Hãy yêu cầu gợi ý mới.
- id: ai_test_failed
  status: 422
  area:
    en: AI assistant
    vi: Trợ lý AI
  description:
    en: The test call to the model failed, so the settings were not saved. meta.test has the result.
    vi: Lệnh gọi thử đến mô hình thất bại, nên cài đặt chưa được lưu. meta.test chứa kết quả.
- id: hostrepute_error
  status: 502
  area:
    en: HostRepute and deliverability
    vi: HostRepute và khả năng vào hộp thư
  description:
    en: HostRepute answered with an error. Nothing was saved.
    vi: HostRepute trả về lỗi. Chưa có gì được lưu.
- id: hostrepute_reconnect
  status: 409
  area:
    en: HostRepute and deliverability
    vi: HostRepute và khả năng vào hộp thư
  description:
    en: HostRepute rejected the token. Reconnect HostRepute, then try again.
    vi: HostRepute đã từ chối token. Hãy kết nối lại HostRepute rồi thử lại.
- id: hostrepute_required
  status: 409
  area:
    en: HostRepute and deliverability
    vi: HostRepute và khả năng vào hộp thư
  description:
    en: Delisting requests go through HostRepute, which isn't connected. Request delisting on the blocklist's own page instead (meta.delistUrl).
    vi: Yêu cầu gỡ khỏi danh sách được gửi qua HostRepute, mà HostRepute chưa được kết nối. Hãy yêu cầu gỡ khỏi danh sách trên trang riêng của danh sách chặn đó (meta.delistUrl).
- id: hostrepute_scope
  status: 409
  area:
    en: HostRepute and deliverability
    vi: HostRepute và khả năng vào hộp thư
  description:
    en: The HostRepute connection lacks the assets:write scope, so assets can't be added to monitoring. Reconnect HostRepute and approve it.
    vi: Kết nối HostRepute thiếu phạm vi assets:write, nên không thêm được tài sản vào giám sát. Hãy kết nối lại HostRepute và chấp thuận phạm vi này.
- id: hostrepute_unavailable
  status: 503
  area:
    en: HostRepute and deliverability
    vi: HostRepute và khả năng vào hộp thư
  description:
    en: HostRepute couldn't be reached. Nothing was saved.
    vi: Không kết nối được HostRepute. Chưa có gì được lưu.
- id: monitor_limit_reached
  status: 409
  area:
    en: HostRepute and deliverability
    vi: HostRepute và khả năng vào hộp thư
  description:
    en: The HostRepute team's plan monitors no more assets. This is a HostRepute limit, not a ReputeCast one.
    vi: Gói của nhóm HostRepute không giám sát thêm tài sản được nữa. Đây là giới hạn của HostRepute, không phải của ReputeCast.
- id: oauth_not_set_up
  status: 409
  area:
    en: Placement tests
    vi: Kiểm tra vị trí thư
  description:
    en: The provider's sign-in app isn't set up for seed mailboxes. An instance admin adds its client ID and secret in Instance admin › Authentication.
    vi: Ứng dụng đăng nhập của nhà cung cấp chưa được thiết lập cho hộp thư thử. Quản trị viên hệ thống thêm client ID và client secret của ứng dụng đó trong Quản trị hệ thống › Xác thực.
- id: placement_copies_gone
  status: 409
  area:
    en: Placement tests
    vi: Kiểm tra vị trí thư
  description:
    en: The copies were already deleted from the seed mailboxes.
    vi: Các bản sao đã bị xóa khỏi hộp thư thử.
- id: placement_not_ready
  status: 409
  area:
    en: Placement tests
    vi: Kiểm tra vị trí thư
  description:
    en: The placement test can't start yet. The detail and meta.problems say what is missing.
    vi: Chưa thể bắt đầu kiểm tra vị trí thư. Trường detail và meta.problems cho biết còn thiếu gì.
- id: placement_not_waiting
  status: 409
  area:
    en: Placement tests
    vi: Kiểm tra vị trí thư
  description:
    en: The test isn't waiting for copies any more.
    vi: Lần kiểm tra không còn chờ bản sao nữa.
- id: digest_feed_unread
  status: 409
  area:
    en: Recurring digests
    vi: Bản tin định kỳ
  description:
    en: The digest's feed hasn't been read yet. Read it once before turning the digest on.
    vi: Nguồn cấp của bản tổng hợp chưa được đọc. Hãy đọc nguồn cấp một lần trước khi bật bản tổng hợp.
- id: digest_needs_audience
  status: 409
  area:
    en: Recurring digests
    vi: Bản tin định kỳ
  description:
    en: Pick an audience before turning the digest on.
    vi: Hãy chọn người nhận trước khi bật bản tổng hợp.
- id: tests_unavailable
  status: 503
  area:
    en: Recurring digests
    vi: Bản tin định kỳ
  description:
    en: Test sends aren't available in this server process.
    vi: Tiến trình máy chủ này không gửi thử được.
- id: survey_incomplete
  status: 422
  area:
    en: Polls and surveys
    vi: Thăm dò và khảo sát
  description:
    en: Every survey question must be complete before publishing. The detail lists what is missing.
    vi: Mọi câu hỏi của khảo sát phải hoàn chỉnh trước khi xuất bản. Trường detail liệt kê những gì còn thiếu.
- id: store_not_connected
  status: 409
  area:
    en: Stores
    vi: Cửa hàng
  description:
    en: No WooCommerce store is connected at the address the plugin calls from. Connect it in Settings › Integrations first.
    vi: Không có cửa hàng WooCommerce nào được kết nối ứng với địa chỉ mà plugin gửi lệnh gọi. Hãy kết nối cửa hàng trong Cài đặt › Tích hợp trước.
- id: store_rate_limited
  status: 429
  area:
    en: Stores
    vi: Cửa hàng
  description:
    en: Shopify or WooCommerce is limiting requests. The sync slows down and carries on by itself.
    vi: Shopify hoặc WooCommerce đang giới hạn yêu cầu. Quá trình đồng bộ chậm lại và tự tiếp tục.
- id: store_unavailable
  status: 503
  area:
    en: Stores
    vi: Cửa hàng
  description:
    en: Shopify or WooCommerce didn't answer. Try again in a few minutes.
    vi: Shopify hoặc WooCommerce không phản hồi. Hãy thử lại sau vài phút.
