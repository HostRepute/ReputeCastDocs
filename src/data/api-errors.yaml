    vi: Bộ máy gửi thư không chạy trong bản cài đặt này, nên chưa có gì được lên lịch. Kết quả kiểm tra, lịch gửi và phê duyệt vẫn được giữ.
    de: >-
      Die Versand-Engine läuft in dieser Installation nicht, daher wurde nichts geplant. Die Prüfungen, die Planung und
      die Freigabe bleiben erhalten.
    es: >-
      El motor de envío no se está ejecutando en esta instalación, así que no se programó nada. Las comprobaciones, la
      programación y la aprobación se conservan.
    fr: >-
      Le moteur d’envoi ne tourne pas dans cette installation : rien n’a donc été programmé. Les contrôles, la
      programmation et l’approbation sont conservés.
