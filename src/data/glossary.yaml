# Product glossary, rendered by <Glossary /> on /reference/glossary/ (anchor = id).
# term.vi and definition.vi follow docs/i18n/glossary-vi.md and the app's wording (web/src/**/messages.vi.ts).

- id: a-b-test
  term:
    en: A/B test
    vi: Thử nghiệm A/B
    de: A/B-Test
    es: Prueba A/B
    fr: Test A/B
  definition:
    en: Sending two or three variants of a subject line, content or send time to a test share of the audience, then sending the winning variant to everyone else.
    vi: Gửi hai hoặc ba biến thể của tiêu đề, nội dung hoặc thời điểm gửi cho một phần người nhận để thử nghiệm, rồi gửi biến thể thắng cho tất cả những người còn lại.
    de: >-
      Zwei oder drei Varianten von Betreff, Inhalt oder Versandzeit werden an einen Testanteil der Zielgruppe gesendet;
      anschließend erhalten alle anderen die Gewinnervariante.
    es: >-
      Enviar dos o tres variantes de un asunto, un contenido o una hora de envío a una parte de prueba de la audiencia y
      después enviar la variante ganadora a todos los demás.
    fr: >-
      Envoi de deux ou trois variantes d’un objet, d’un contenu ou d’une heure d’envoi à une part de test de l’audience,
      puis envoi de la variante gagnante à tous les autres.
  link: /campaigns/ab-testing/
- id: adapter
  term:
    en: Adapter
    vi: Adapter
    de: Adapter
    es: Adaptador
    fr: Adaptateur
  definition:
    en: "The code that connects ReputeCast to one sending provider. It sends mail, verifies and normalizes the provider's webhooks, and declares what the provider can do."
    vi: Phần mã kết nối ReputeCast với một nhà cung cấp gửi thư. Adapter gửi thư, xác minh và chuẩn hóa webhook của nhà cung cấp, đồng thời khai báo những gì nhà cung cấp đó làm được.
    de: >-
      Der Code, der ReputeCast mit einem Versandanbieter verbindet. Er sendet E-Mails, prüft und normalisiert die
      Webhooks des Anbieters und gibt an, was der Anbieter kann.
    es: >-
      El código que conecta ReputeCast con un proveedor de envío. Envía el correo, verifica y normaliza los webhooks del
      proveedor y declara lo que puede hacer el proveedor.
    fr: >-
      Le code qui relie ReputeCast à un fournisseur d’envoi. Il envoie les e-mails, vérifie et normalise les webhooks du
      fournisseur, et déclare ce dont le fournisseur est capable.
  link: /adapters/overview/
- id: agency-mode
  term:
    en: Agency mode
    vi: Chế độ agency
    de: Agenturmodus
    es: Modo agencia
    fr: Mode agence
  definition:
    en: An instance setting for businesses that run newsletters for clients. It adds agency staff, client workspaces, client roles and the agency area (Overview, Staff, Library, Usage).
    vi: Một cài đặt của hệ thống dành cho doanh nghiệp vận hành bản tin cho khách hàng. Chế độ này thêm nhân sự agency, không gian làm việc của khách hàng, vai trò phía khách hàng và khu vực Agency (Tổng quan, Nhân sự, Thư viện, Mức sử dụng).
    de: >-
      Eine Einstellung der Instanz für Unternehmen, die Newsletter für Kunden betreiben. Sie ergänzt das Agenturteam,
      Kunden-Arbeitsbereiche, Kundenrollen und den Bereich Agentur (Übersicht, Agenturteam, Bibliothek, Nutzung).
    es: >-
      Una opción de la instancia para empresas que gestionan boletines para clientes. Añade el personal de la agencia,
      los espacios de trabajo de clientes, los roles de cliente y el área Agencia (Resumen, Personal, Biblioteca, Uso).
    fr: >-
      Un paramètre d’instance pour les entreprises qui gèrent des newsletters pour des clients. Il ajoute le personnel
      de l’agence, les espaces de travail client, les rôles client et l’espace Agence (Vue d’ensemble, Personnel,
      Bibliothèque, Consommation).
  link: /team/agencies/
- id: alignment
  term:
    en: Alignment
    vi: Căn chỉnh
    de: Ausrichtung
    es: Alineación
    fr: Alignement
  definition:
    en: DMARC passes only when the domain that SPF or DKIM authenticates matches the domain in the From address. That match is called alignment.
    vi: DMARC chỉ đạt khi tên miền mà SPF hoặc DKIM xác thực khớp với tên miền trong địa chỉ From. Sự trùng khớp đó gọi là căn chỉnh.
    de: >-
      DMARC gilt nur dann als bestanden, wenn die Domain, die SPF oder DKIM authentifiziert, mit der Domain in der
      From-Adresse übereinstimmt. Diese Übereinstimmung heißt Ausrichtung.
    es: >-
      DMARC solo pasa cuando el dominio que autentica SPF o DKIM coincide con el dominio de la dirección From. Esa
      coincidencia se llama alineación.
    fr: >-
      DMARC ne réussit que si le domaine authentifié par SPF ou DKIM correspond au domaine de l’adresse From. Cette
      correspondance s’appelle l’alignement.
  link: /deliverability/spf-dkim-dmarc/
- id: api-key
  term:
    en: API key
    vi: Khóa API
    de: API-Schlüssel
    es: Clave de API
    fr: Clé API
  definition:
    en: A token that lets a program call the ReputeCast API with a set of permissions. It is shown once, stored as a SHA-256 hash, and can be limited to lists or sender domains.
    vi: Một token cho phép chương trình gọi API của ReputeCast với một tập quyền. Khóa chỉ hiện một lần, được lưu dưới dạng hash SHA-256 và có thể giới hạn trong một số danh sách hoặc tên miền gửi thư.
    de: >-
      Ein Token, mit dem ein Programm die ReputeCast-API mit bestimmten Berechtigungen aufrufen kann. Der Schlüssel wird
      nur einmal angezeigt, als SHA-256-Hash gespeichert und lässt sich auf Listen oder Absender-Domains beschränken.
    es: >-
      Un token que permite a un programa llamar a la API de ReputeCast con un conjunto de permisos. Se muestra una sola
      vez, se guarda como hash SHA-256 y se puede limitar a listas o a dominios de remitente.
    fr: >-
      Un jeton qui permet à un programme d’appeler l’API de ReputeCast avec un ensemble d’autorisations. Elle n’est
      affichée qu’une fois, stockée sous forme de hachage SHA-256, et peut être limitée à des listes ou à des domaines
      d’expéditeur.
  link: /developers/api-authentication/
- id: approval
  term:
    en: Approval
    vi: Phê duyệt
    de: Freigabe
    es: Aprobación
    fr: Approbation
  definition:
    en: A sign-off an approval policy requires before a risky send goes out. Approvers review a snapshot of the campaign; changing the campaign after approval invalidates it.
    vi: Sự chấp thuận mà chính sách phê duyệt yêu cầu trước khi một lần gửi có rủi ro được gửi đi. Người phê duyệt xem xét bản chụp của chiến dịch; sửa chiến dịch sau khi đã được phê duyệt sẽ làm phê duyệt mất hiệu lực.
    de: >-
      Eine Zustimmung, die eine Freigaberichtlinie verlangt, bevor ein riskanter Versand hinausgeht. Freigebende
      Personen prüfen eine Momentaufnahme der Kampagne; wird die Kampagne nach der Freigabe geändert, wird die Freigabe
      ungültig.
    es: >-
      El visto bueno que exige una política de aprobación antes de que salga un envío de riesgo. Quien aprueba revisa
      una instantánea de la campaña; cambiar la campaña después de la aprobación la invalida.
    fr: >-
      Une validation qu’exige une politique d’approbation avant le départ d’un envoi risqué. Les approbateurs examinent
      un instantané de la campagne ; modifier la campagne après approbation invalide celle-ci.
  link: /campaigns/approvals/
- id: archive
  term:
    en: Archive
    vi: Trang lưu trữ
    de: Archiv
    es: Archivo
    fr: Archives
  definition:
    en: The public page that lists past campaigns, with an RSS feed and a sitemap.
    vi: Trang công khai liệt kê các chiến dịch đã gửi, kèm nguồn cấp RSS và sitemap.
    de: Die öffentliche Seite, die vergangene Kampagnen auflistet, mit RSS-Feed und Sitemap.
    es: La página pública que lista las campañas anteriores, con un feed RSS y un mapa del sitio.
    fr: La page publique qui liste les campagnes passées, avec un flux RSS et un plan du site.
  link: /forms/public-pages/
- id: audit-log
  term:
    en: Audit log
    vi: Nhật ký kiểm tra
    de: Audit-Protokoll
    es: Registro de auditoría
    fr: Journal d’audit
  definition:
    en: "The record of who did what in a workspace or in the instance, including attempts that were denied. Entries can't be edited or deleted."
    vi: Bản ghi ai đã làm gì trong một không gian làm việc hoặc trên hệ thống, kể cả những lần thử bị từ chối. Không thể sửa hay xóa các mục trong nhật ký.
    de: >-
      Die Aufzeichnung darüber, wer in einem Arbeitsbereich oder in der Instanz was getan hat, einschließlich
      verweigerter Versuche. Einträge lassen sich weder bearbeiten noch löschen.
    es: >-
      El registro de quién hizo qué en un espacio de trabajo o en la instancia, incluidos los intentos denegados. Las
      entradas no se pueden editar ni eliminar.
    fr: >-
      L’historique de qui a fait quoi dans un espace de travail ou dans l’instance, y compris les tentatives refusées.
      Les entrées ne peuvent être ni modifiées ni supprimées.
  link: /team/audit-log/
- id: auto-pause
  term:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  definition:
    en: Guarded sending pauses a running send when bounce, complaint, deferral or provider error rates cross the auto-pause thresholds. The campaign shows Auto-paused until someone resumes or cancels it.
    vi: Gửi có bảo vệ tạm dừng một lần gửi đang chạy khi tỷ lệ trả thư, khiếu nại, hoãn nhận hoặc lỗi của nhà cung cấp vượt ngưỡng tự động tạm dừng. Chiến dịch hiển thị Tự tạm dừng cho đến khi có người tiếp tục gửi hoặc hủy lần gửi.
    de: >-
      Der abgesicherte Versand pausiert einen laufenden Versand, wenn die Raten von Bounces, Beschwerden,
      Zurückstellungen oder Anbieterfehlern die Schwellenwerte für Auto-Pause überschreiten. Die Kampagne zeigt
      „Automatisch pausiert“, bis jemand sie fortsetzt oder abbricht.
    es: >-
      El envío protegido pausa un envío en curso cuando las tasas de rebote, de quejas, de aplazamientos o de errores
      del proveedor superan los umbrales de pausa automática. La campaña muestra En pausa automática hasta que alguien
      la reanuda o la cancela.
    fr: >-
      L’envoi protégé met en pause un envoi en cours lorsque les taux de rebond, de plainte, de report ou d’erreur du
      fournisseur dépassent les seuils de pause automatique. La campagne affiche En pause auto jusqu’à ce que quelqu’un
      la reprenne ou l’annule.
  link: /campaigns/live-monitor/
- id: auto-pause-thresholds
  term:
    en: Auto-pause thresholds
    vi: Ngưỡng tự động tạm dừng
    de: Schwellenwerte für Auto-Pause
    es: Umbrales de pausa automática
    fr: Seuils de pause automatique
  definition:
    en: 'The rates that pause, slow down or warn about a send. By default: bounces 2.0%; complaints 0.10% overall and per mailbox provider, counted only where mailbox providers report them; block/policy bounces 0.5% per mailbox provider; unknown users 3% (warn) and 5% (pause); deferrals 15% (slow down) and 40% (pause) over 10 minutes; sending provider API errors 5.0%. Workspaces and campaigns can set their own.'
    vi: 'Các tỷ lệ khiến một lần gửi tạm dừng, giảm tốc hoặc phát cảnh báo. Mặc định: thư trả lại 2,0%; khiếu nại 0,10% trên tổng và theo từng nhà cung cấp hộp thư, chỉ tính ở nơi nhà cung cấp hộp thư báo cáo khiếu nại; thư trả lại do chặn hoặc chính sách 0,5% theo từng nhà cung cấp hộp thư; người nhận không tồn tại 3% (cảnh báo) và 5% (tạm dừng); hoãn nhận 15% (giảm tốc) và 40% (tạm dừng) trong 10 phút; lỗi API của nhà cung cấp gửi thư 5,0%. Không gian làm việc và chiến dịch có thể đặt ngưỡng riêng.'
    de: >-
      Die Raten, bei denen ein Versand pausiert, verlangsamt wird oder eine Warnung auslöst. Standardmäßig: Bounces 2,0
      %; Beschwerden 0,10 % insgesamt und je Postfachanbieter, nur dort gezählt, wo Postfachanbieter sie melden;
      Block-/Richtlinien-Bounces 0,5 % je Postfachanbieter; unbekannte Empfänger 3 % (Warnung) und 5 % (Pause);
      Zurückstellungen 15 % (Verlangsamung) und 40 % (Pause) über 10 Minuten; API-Fehler des Versandanbieters 5,0 %.
      Arbeitsbereiche und Kampagnen können eigene Werte festlegen.
    es: >-
      Las tasas que pausan un envío, lo ralentizan o avisan sobre él. Por defecto: rebotes 2,0 %; quejas 0,10 % en total
      y por proveedor de buzón, contadas solo donde los proveedores de buzón las notifican; rebotes por bloqueo o
      política 0,5 % por proveedor de buzón; usuarios desconocidos 3 % (aviso) y 5 % (pausa); aplazamientos 15 %
      (ralentización) y 40 % (pausa) en 10 minutos; errores de la API del proveedor de envío 5,0 %. Los espacios de
      trabajo y las campañas pueden definir los suyos.
    fr: >-
      Les taux qui mettent en pause, ralentissent ou signalent un envoi. Par défaut : rebonds 2,0 % ; plaintes 0,10 % au
      total et par fournisseur de messagerie, comptées uniquement là où les fournisseurs de messagerie les signalent ;
      rebonds pour blocage ou politique 0,5 % par fournisseur de messagerie ; utilisateurs inconnus 3 % (avertissement)
      et 5 % (pause) ; reports 15 % (ralentissement) et 40 % (pause) sur 10 minutes ; erreurs d’API du fournisseur
      d’envoi 5,0 %. Les espaces de travail et les campagnes peuvent définir les leurs.
  link: /providers/workspace-defaults/
- id: automation
  term:
    en: Automation
    vi: Tự động hóa
    de: Automation
    es: Automatización
    fr: Automatisation
  definition:
    en: A flow that starts with a trigger and moves each contact through steps such as delays, emails and branches until it reaches a goal or the end. Automations are Draft, Live or Paused.
    vi: Một quy trình bắt đầu bằng trình kích hoạt và đưa từng liên hệ qua các bước như trì hoãn, email và rẽ nhánh cho đến khi đạt mục tiêu hoặc đi hết quy trình. Tự động hóa ở trạng thái Bản nháp, Đang chạy hoặc Đã tạm dừng.
    de: >-
      Ein Ablauf, der mit einem Auslöser beginnt und jeden Kontakt durch Schritte wie Verzögerungen, E-Mails und
      Verzweigungen führt, bis er ein Ziel oder das Ende erreicht. Automationen haben den Status Entwurf, Live oder
      Pausiert.
    es: >-
      Un recorrido que empieza con un disparador y lleva a cada contacto por pasos como esperas, correos y bifurcaciones
      hasta que alcanza un objetivo o el final. Las automatizaciones están en Borrador, Publicada o En pausa.
    fr: >-
      Un scénario qui commence par un déclencheur et fait passer chaque contact par des étapes comme des délais, des
      e-mails et des embranchements, jusqu’à ce qu’il atteigne un objectif ou la fin. Une automatisation est Brouillon,
      Active ou En pause.
  link: /automations/overview/
- id: bimi
  term:
    en: BIMI
    vi: BIMI
    de: BIMI
    es: BIMI
    fr: BIMI
  definition:
    en: 'Brand Indicators for Message Identification: a DNS record that lets supporting mailbox providers show your logo next to authenticated mail. It requires a DMARC policy that enforces quarantine or reject.'
    vi: 'Brand Indicators for Message Identification: bản ghi DNS cho phép các nhà cung cấp hộp thư có hỗ trợ hiển thị logo của bạn cạnh thư đã được xác thực. BIMI yêu cầu chính sách DMARC thực thi quarantine hoặc reject.'
    de: >-
      Brand Indicators for Message Identification: ein DNS-Eintrag, mit dem Postfachanbieter, die ihn unterstützen, Ihr
      Logo neben authentifizierten E-Mails anzeigen. Er setzt eine DMARC-Richtlinie voraus, die quarantine oder reject
      erzwingt.
    es: >-
      Brand Indicators for Message Identification: un registro DNS que permite a los proveedores de buzón compatibles
      mostrar tu logotipo junto al correo autenticado. Requiere una política DMARC que aplique quarantine o reject.
    fr: >-
      Brand Indicators for Message Identification : un enregistrement DNS qui permet aux fournisseurs de messagerie
      compatibles d’afficher votre logo à côté des e-mails authentifiés. Il nécessite une politique DMARC qui impose
      quarantine ou reject.
  link: /deliverability/bimi/
- id: blocklist
  term:
    en: Blocklist
    vi: Danh sách chặn
    de: Blockliste
    es: Lista de bloqueo
    fr: Liste de blocage
  definition:
    en: A list of IP addresses or domains (a DNSBL) that receiving servers use to refuse or filter mail. ReputeCast checks your sending domains and dedicated IPs against public blocklists.
    vi: Danh sách địa chỉ IP hoặc tên miền (DNSBL) mà máy chủ nhận dùng để từ chối hoặc lọc thư. ReputeCast kiểm tra tên miền gửi thư và IP riêng của bạn trên các danh sách chặn công khai.
    de: >-
      Eine Liste von IP-Adressen oder Domains (eine DNSBL), anhand derer empfangende Server E-Mails ablehnen oder
      filtern. ReputeCast prüft Ihre Versand-Domains und dedizierten IPs auf öffentlichen Blocklisten.
    es: >-
      Una lista de direcciones IP o dominios (una DNSBL) que los servidores receptores usan para rechazar o filtrar el
      correo. ReputeCast comprueba tus dominios de envío y tus IP dedicadas en las listas de bloqueo públicas.
    fr: >-
      Une liste d’adresses IP ou de domaines (une DNSBL) que les serveurs de réception utilisent pour refuser ou filtrer
      des e-mails. ReputeCast vérifie vos domaines d’envoi et vos IP dédiées dans les listes de blocage publiques.
  link: /deliverability/blocklists/
- id: bot-filter
  term:
    en: Bot filter
    vi: Bộ lọc bot
    de: Bot-Filter
    es: Filtro de bots
    fr: Filtre anti-robots
  definition:
    en: "The rules, networks and user agents that tell machines' opens and clicks (privacy proxies, mail scanners, scripts, link previews) from people's, the same in every workspace. Instance admins add networks and user agents in Instance admin › Bot filter."
    vi: Các quy tắc, mạng và user agent dùng để tách lượt mở và lượt nhấp của máy (proxy bảo vệ quyền riêng tư, trình quét thư, script, bản xem trước liên kết) khỏi lượt của người thật, giống nhau ở mọi không gian làm việc. Quản trị viên hệ thống thêm mạng và user agent trong Quản trị hệ thống › Bộ lọc bot.
    de: >-
      Die Regeln, Netzwerke und User-Agents, die Öffnungen und Klicks von Maschinen (Datenschutz-Proxys, E-Mail-Scanner,
      Skripte, Linkvorschauen) von denen von Menschen unterscheiden, in jedem Arbeitsbereich gleich. Instanz-Admins
      fügen Netzwerke und User-Agents unter Instanzverwaltung › Bot-Filter hinzu.
    es: >-
      Las reglas, redes y user agents que distinguen las aperturas y los clics de máquinas (proxies de privacidad,
      escáneres de correo, scripts, vistas previas de enlaces) de los de personas, igual en todos los espacios de
      trabajo. Quien administra la instancia añade redes y user agents en Administración de la instancia › Filtro de
      bots.
    fr: >-
      Les règles, réseaux et user agents qui distinguent les ouvertures et les clics des machines (proxys de
      confidentialité, scanners d’e-mails, scripts, aperçus de liens) de ceux des personnes, de la même façon dans tous
      les espaces de travail. Les admins de l’instance ajoutent des réseaux et des user agents dans Administration de
      l’instance › Filtre anti-robots.
  link: /self-hosting/instance-admin/
- id: bounce
  term:
    en: Bounce
    vi: Thư trả lại
    de: Bounce
    es: Rebote
    fr: Rebond
  definition:
    en: "A message the receiving server refused. A hard bounce is permanent, such as an address that doesn't exist; a soft bounce is temporary, such as a full mailbox."
    vi: Thư bị máy chủ nhận từ chối. Trả thư vĩnh viễn là lỗi lâu dài, chẳng hạn địa chỉ không tồn tại; trả thư tạm thời là lỗi nhất thời, chẳng hạn hộp thư đầy.
    de: >-
      Eine Nachricht, die der empfangende Server abgelehnt hat. Ein Hard Bounce ist dauerhaft, etwa bei einer Adresse,
      die nicht existiert; ein Soft Bounce ist vorübergehend, etwa bei einem vollen Postfach.
    es: >-
      Un mensaje que el servidor receptor rechazó. Un rebote permanente es definitivo, como una dirección que no existe;
      un rebote temporal es pasajero, como un buzón lleno.
    fr: >-
      Un message refusé par le serveur de réception. Un rebond définitif est permanent, par exemple une adresse qui
      n’existe pas ; un rebond temporaire est passager, par exemple une boîte pleine.
  link: /deliverability/bounces-and-complaints/
- id: bounce-class
  term:
    en: Bounce class
    vi: Loại thư trả lại
    de: Bounce-Klasse
    es: Clase de rebote
    fr: Classe de rebond
  definition:
    en: "The reason ReputeCast gives every bounce, whichever provider reported it: mailbox unknown, mailbox full, domain invalid, policy block, spam block, reputation, temporary or other. The provider's original code is kept with it."
    vi: 'Lý do ReputeCast gán cho mỗi thư trả lại, dù nhà cung cấp nào báo về: hộp thư không tồn tại, hộp thư đầy, tên miền không hợp lệ, chặn theo chính sách, chặn vì spam, uy tín, tạm thời hoặc khác. Mã gốc của nhà cung cấp được giữ kèm theo.'
    de: >-
      Der Grund, den ReputeCast jedem Bounce zuordnet, gleich welcher Anbieter ihn gemeldet hat: Postfach unbekannt,
      Postfach voll, Domain ungültig, Blockierung durch Richtlinie, Blockierung wegen Spam, Reputation, vorübergehend
      oder Sonstiges. Der ursprüngliche Code des Anbieters wird mit aufbewahrt.
    es: >-
      El motivo que ReputeCast asigna a cada rebote, sea cual sea el proveedor que lo notificó: buzón desconocido, buzón
      lleno, dominio no válido, bloqueo por política, bloqueo por spam, reputación, temporal u otro. El código original
      del proveedor se conserva junto a él.
    fr: >-
      Le motif que ReputeCast attribue à chaque rebond, quel que soit le fournisseur qui l’a signalé : boîte
      inexistante, boîte pleine, domaine non valide, blocage par politique, blocage pour spam, réputation, temporaire ou
      autre. Le code d’origine du fournisseur est conservé avec lui.
  link: /providers/events-and-sync/
- id: bounce-mailbox
  term:
    en: Bounce mailbox
    vi: Hộp thư nhận thư trả lại
    de: Bounce-Postfach
    es: Buzón de rebotes
    fr: Boîte de réception des rebonds
  definition:
    en: A mailbox ReputeCast reads over IMAP or POP3 to learn about bounces, for providers that report none through webhooks, such as an SMTP server.
    vi: Hộp thư mà ReputeCast đọc qua IMAP hoặc POP3 để biết về thư trả lại, dành cho những nhà cung cấp không báo thư trả lại qua webhook, chẳng hạn một máy chủ SMTP.
    de: >-
      Ein Postfach, das ReputeCast über IMAP oder POP3 liest, um von Bounces zu erfahren, für Anbieter, die keine über
      Webhooks melden, etwa ein SMTP-Server.
    es: >-
      Un buzón que ReputeCast lee por IMAP o POP3 para conocer los rebotes, en los proveedores que no los notifican
      mediante webhooks, como un servidor SMTP.
    fr: >-
      Une boîte que ReputeCast lit via IMAP ou POP3 pour connaître les rebonds, pour les fournisseurs qui n’en signalent
      aucun par webhook, comme un serveur SMTP.
  link: /providers/smtp/
- id: brand-kit
  term:
    en: Brand kit
    vi: Bộ nhận diện thương hiệu
    de: Brand-Kit
    es: Kit de marca
    fr: Kit de marque
  definition:
    en: "A workspace's logo, colours, fonts and button style, under Settings › Brand kit. New emails, templates and blocks start from it, and it holds the synced Header and Footer."
    vi: 'Logo, màu sắc, phông chữ và kiểu nút của một không gian làm việc, trong Cài đặt › Bộ nhận diện. Email, mẫu và khối mới bắt đầu từ bộ nhận diện, và bộ nhận diện chứa Đầu trang và Chân trang đồng bộ.'
    de: >-
      Logo, Farben, Schriften und Button-Stil eines Arbeitsbereichs, unter Einstellungen › Brand-Kit. Neue E-Mails,
      Vorlagen und Blöcke basieren darauf, und es enthält die synchronisierte Kopfzeile und Fußzeile.
    es: >-
      El logotipo, los colores, las fuentes y el estilo de botón de un espacio de trabajo, en Configuración › Kit de
      marca. Los correos, las plantillas y los bloques nuevos parten de él, y contiene la Cabecera y el Pie
      sincronizados.
    fr: >-
      Le logo, les couleurs, les polices et le style de bouton d’un espace de travail, dans Paramètres › Kit de marque.
      Les nouveaux e-mails, modèles et blocs partent de lui, et il contient l’en-tête et le pied de page synchronisés.
  link: /campaigns/brand-kit/
- id: campaign
  term:
    en: Campaign
    vi: Chiến dịch
    de: Kampagne
    es: Campaña
    fr: Campagne
  definition:
    en: A message sent once to an audience, by email, SMS, push or WhatsApp. Email campaigns go on the Broadcasts stream.
    vi: Một thư gửi một lần cho một nhóm người nhận, qua email, SMS, thông báo đẩy hoặc WhatsApp. Chiến dịch email đi trên luồng Gửi hàng loạt.
    de: >-
      Eine Nachricht, die einmal an eine Zielgruppe gesendet wird, per E-Mail, SMS, Push oder WhatsApp. E-Mail-Kampagnen
      laufen über den Stream Massenversand.
    es: >-
      Un mensaje que se envía una vez a una audiencia, por correo, SMS, push o WhatsApp. Las campañas de correo van por
      el flujo Envíos masivos.
    fr: >-
      Un message envoyé une fois à une audience, par e-mail, SMS, push ou WhatsApp. Les campagnes e-mail passent par le
      flux Diffusions.
  link: /campaigns/overview/
- id: canary
  term:
    en: Canary
    vi: Gửi thử (canary)
    de: Canary
    es: Envío canario
    fr: Canari
  definition:
    en: 'The first phase of a send in which only the most engaged few percent, plus the seed mailboxes, get the email while everyone else waits. After a watch, gates on bounces, deferrals, complaints and seed placement decide whether the send continues by itself or waits for a person.'
    vi: Giai đoạn đầu của một lần gửi, khi chỉ vài phần trăm người nhận tương tác nhiều nhất cùng các hộp thư thử nhận email, còn mọi người khác chờ. Sau thời gian theo dõi, các điều kiện về thư trả lại, hoãn nhận, khiếu nại và vị trí ở hộp thư thử quyết định lần gửi tự tiếp tục hay chờ một người quyết định.
    de: >-
      Die erste Phase eines Versands, in der nur die aktivsten wenigen Prozent der Empfänger und die Testpostfächer die
      E-Mail erhalten, während alle anderen warten. Nach einer Beobachtungszeit entscheiden Kriterien zu Bounces,
      Zurückstellungen, Beschwerden und der Platzierung in den Testpostfächern, ob der Versand von selbst weiterläuft
      oder auf eine Person wartet.
    es: >-
      La primera fase de un envío, en la que solo el pequeño porcentaje con más interacción, más los buzones de prueba,
      recibe el correo mientras todos los demás esperan. Tras un periodo de vigilancia, unos controles de rebotes,
      aplazamientos, quejas y ubicación en los buzones de prueba deciden si el envío continúa por sí solo o espera a una
      persona.
    fr: >-
      La première phase d’un envoi, pendant laquelle seuls les quelques pour cent de contacts les plus engagés, plus les
      boîtes témoins, reçoivent l’e-mail tandis que tous les autres attendent. Après une période d’observation, des
      critères portant sur les rebonds, les reports, les plaintes et le placement dans les boîtes témoins décident si
      l’envoi se poursuit seul ou attend une personne.
  link: /campaigns/live-monitor/
- id: channel
  term:
    en: Channel
    vi: Kênh
    de: Kanal
    es: Canal
    fr: Canal
  definition:
    en: 'How a message reaches a contact: email, SMS, push or WhatsApp.'
    vi: 'Cách một thư đến với liên hệ: email, SMS, thông báo đẩy hoặc WhatsApp.'
    de: 'Der Weg, auf dem eine Nachricht einen Kontakt erreicht: E-Mail, SMS, Push oder WhatsApp.'
    es: 'Cómo llega un mensaje a un contacto: correo, SMS, push o WhatsApp.'
    fr: 'Le moyen par lequel un message parvient à un contact : e-mail, SMS, push ou WhatsApp.'
  link: /channels/sms/
- id: click-map
  term:
    en: Click map
    vi: Bản đồ lượt nhấp
    de: Klickkarte
    es: Mapa de clics
    fr: Carte des clics
  definition:
    en: "The report view that draws each link's share of human clicks over the email that was sent, per A/B variant when a test ran, with the bot clicks one switch away."
    vi: Chế độ xem trong báo cáo thể hiện tỷ lệ lượt nhấp của người đọc trên từng liên kết ngay trên email đã gửi, theo từng biến thể A/B khi có thử nghiệm, và chỉ cần một nút chuyển để xem lượt nhấp của bot.
    de: >-
      Die Berichtsansicht, die den Anteil jedes Links an den menschlichen Klicks direkt auf der gesendeten E-Mail
      darstellt, bei einem Test je A/B-Variante; die Bot-Klicks lassen sich mit einem Schalter einblenden.
    es: >-
      La vista del informe que dibuja la proporción de clics humanos de cada enlace sobre el correo enviado, por
      variante A/B cuando hubo una prueba, con los clics de bots a un interruptor de distancia.
    fr: >-
      La vue du rapport qui affiche, sur l’e-mail envoyé, la part des clics humains de chaque lien, par variante A/B
      quand un test a eu lieu, les clics des robots étant à un interrupteur près.
  link: /campaigns/reports/
- id: client-workspace
  term:
    en: Client workspace
    vi: Không gian làm việc của khách hàng
    de: Kunden-Arbeitsbereich
    es: Espacio de trabajo del cliente
    fr: Espace de travail client
  definition:
    en: A workspace that belongs to one client of an agency, with its own lists, providers and team.
    vi: Không gian làm việc thuộc về một khách hàng của agency, với danh sách, nhà cung cấp và nhóm riêng.
    de: Ein Arbeitsbereich, der einem Kunden einer Agentur gehört, mit eigenen Listen, Anbietern und eigenem Team.
    es: Un espacio de trabajo que pertenece a un cliente de una agencia, con sus propias listas, proveedores y equipo.
    fr: Un espace de travail qui appartient à un client d’une agence, avec ses propres listes, fournisseurs et équipe.
  link: /team/agencies/
- id: command-palette
  term:
    en: Command palette
    vi: Bảng lệnh
    de: Befehlspalette
    es: Paleta de comandos
    fr: Palette de commandes
  definition:
    en: The search that ⌘K (Ctrl+K) opens from every page. It finds campaigns, contacts, automations, lists, segments, forms, pages, places to go and single settings, only among what your role can open.
    vi: Ô tìm kiếm mà ⌘K (Ctrl+K) mở ra từ mọi trang. Bảng lệnh tìm chiến dịch, liên hệ, tự động hóa, danh sách, phân khúc, biểu mẫu, trang, nơi cần đến và từng cài đặt riêng lẻ, chỉ trong những gì vai trò của bạn được mở.
    de: >-
      Die Suche, die ⌘K (Strg+K) auf jeder Seite öffnet. Sie findet Kampagnen, Kontakte, Automationen, Listen, Segmente,
      Formulare, Seiten, Sprungziele und einzelne Einstellungen, und zwar nur unter dem, was Ihre Rolle öffnen darf.
    es: >-
      La búsqueda que abre ⌘K (Ctrl+K) desde cualquier página. Encuentra campañas, contactos, automatizaciones, listas,
      segmentos, formularios, páginas, lugares a los que ir y opciones de configuración concretas, solo entre lo que tu
      rol puede abrir.
    fr: >-
      La recherche qu’ouvre ⌘K (Ctrl+K) depuis n’importe quelle page. Elle trouve les campagnes, contacts,
      automatisations, listes, segments, formulaires, pages, destinations et paramètres individuels, uniquement parmi ce
      que votre rôle peut ouvrir.
  link: /reference/keyboard-shortcuts/
- id: community-adapter
  term:
    en: Community adapter
    vi: Adapter cộng đồng
    de: Community-Adapter
    es: Adaptador de la comunidad
    fr: Adaptateur communautaire
  definition:
    en: An adapter installed for the whole instance that runs in its own process and speaks the signed adapter protocol. You can write one with the TypeScript adapter SDK.
    vi: Adapter được cài cho toàn hệ thống, chạy trong tiến trình riêng và giao tiếp bằng giao thức adapter có chữ ký. Bạn có thể tự viết một adapter bằng adapter SDK cho TypeScript.
    de: >-
      Ein Adapter, der für die ganze Instanz installiert ist, in einem eigenen Prozess läuft und das signierte
      Adapter-Protokoll spricht. Sie können einen mit dem Adapter-SDK für TypeScript selbst schreiben.
    es: >-
      Un adaptador instalado para toda la instancia que se ejecuta en su propio proceso y habla el protocolo de
      adaptadores firmado. Puedes escribir uno con el SDK de adaptadores para TypeScript.
    fr: >-
      Un adaptateur installé pour toute l’instance, qui s’exécute dans son propre processus et parle le protocole
      d’adaptateur signé. Vous pouvez en écrire un avec le SDK d’adaptateur TypeScript.
  link: /adapters/community/
- id: complaint
  term:
    en: Complaint
    vi: Khiếu nại
    de: Beschwerde
    es: Queja
    fr: Plainte
  definition:
    en: A recipient marked your message as spam, and the mailbox provider reported it back through a feedback loop. ReputeCast adds the address to the suppression list.
    vi: Người nhận đã đánh dấu thư của bạn là spam, và nhà cung cấp hộp thư báo lại điều đó qua vòng phản hồi. ReputeCast thêm địa chỉ này vào danh sách chặn gửi.
    de: >-
      Ein Empfänger hat Ihre Nachricht als Spam markiert, und der Postfachanbieter hat das über einen Feedback-Loop
      zurückgemeldet. ReputeCast setzt die Adresse auf die Sperrliste.
    es: >-
      Un destinatario marcó tu mensaje como spam y el proveedor de buzón lo notificó mediante un bucle de
      retroalimentación. ReputeCast añade la dirección a la lista de supresión.
    fr: >-
      Un destinataire a marqué votre message comme spam, et le fournisseur de messagerie l’a signalé via une boucle de
      rétroaction. ReputeCast ajoute l’adresse à la liste de suppression.
  link: /deliverability/bounces-and-complaints/
- id: composer
  term:
    en: Composer
    vi: Trình soạn thảo
    de: Editor
    es: Editor
    fr: Éditeur
  definition:
    en: The email editor. It builds emails from blocks on MJML and also offers MJML and HTML code views, previews, test sends and version history.
    vi: Trình chỉnh sửa email. Trình soạn thảo dựng email từ các khối trên nền MJML, đồng thời có chế độ mã MJML và HTML, xem trước, gửi thử và lịch sử phiên bản.
    de: >-
      Der E-Mail-Editor. Er baut E-Mails aus Blöcken auf Basis von MJML und bietet außerdem Codeansichten für MJML und
      HTML, Vorschauen, Testversand und einen Versionsverlauf.
    es: >-
      El editor de correos. Construye los correos con bloques sobre MJML y también ofrece vistas de código MJML y HTML,
      vistas previas, envíos de prueba e historial de versiones.
    fr: >-
      L’éditeur d’e-mails. Il construit les e-mails à partir de blocs en MJML et propose aussi des vues code MJML et
      HTML, des aperçus, des envois de test et l’historique des versions.
  link: /campaigns/composer/
- id: consent
  term:
    en: Consent
    vi: Sự đồng ý
    de: Einwilligung
    es: Consentimiento
    fr: Consentement
  definition:
    en: 'Permission to email a contact, recorded per list with its evidence: how and when it was given and the text the contact agreed to.'
    vi: 'Sự cho phép gửi email cho một liên hệ, được ghi nhận theo từng danh sách kèm bằng chứng: đồng ý bằng cách nào, khi nào và với nội dung đồng ý nào.'
    de: >-
      Die Erlaubnis, einem Kontakt E-Mails zu senden, je Liste erfasst mit ihrem Nachweis: wie und wann sie erteilt
      wurde und welchem Text der Kontakt zugestimmt hat.
    es: >-
      El permiso para enviar correo a un contacto, registrado por lista con su evidencia: cómo y cuándo se dio y el
      texto que aceptó el contacto.
    fr: >-
      L’autorisation d’envoyer des e-mails à un contact, enregistrée par liste avec sa preuve : comment et quand elle a
      été donnée, et le texte que le contact a accepté.
  link: /audience/lists-and-consent/
- id: contact
  term:
    en: Contact
    vi: Liên hệ
    de: Kontakt
    es: Contacto
    fr: Contact
  definition:
    en: 'A person in your audience. The app says contact; permission keys say subscribers, as in subscribers:view.'
    vi: Một người trong nhóm người đăng ký của bạn. Ứng dụng gọi là liên hệ; khóa quyền dùng chữ subscribers, như trong subscribers:view.
    de: >-
      Eine Person in Ihrer Zielgruppe. Die App spricht von Kontakten; Berechtigungsschlüssel verwenden subscribers, wie
      in subscribers:view.
    es: >-
      Una persona de tu audiencia. La aplicación dice contacto; las claves de permiso dicen subscribers, como en
      subscribers:view.
    fr: >-
      Une personne de votre audience. L’application dit contact ; les clés d’autorisation disent subscribers, comme dans
      subscribers:view.
  link: /audience/contacts/
- id: custom-role
  term:
    en: Custom role
    vi: Vai trò tùy chỉnh
    de: Eigene Rolle
    es: Rol personalizado
    fr: Rôle personnalisé
  definition:
    en: A role you build from any set of permission keys, usually by duplicating a built-in role.
    vi: Vai trò bạn tạo từ một tập khóa quyền bất kỳ, thường bằng cách nhân bản một vai trò có sẵn.
    de: >-
      Eine Rolle, die Sie aus beliebigen Berechtigungsschlüsseln zusammenstellen, meist indem Sie eine integrierte Rolle
      duplizieren.
    es: Un rol que creas con cualquier conjunto de claves de permiso, normalmente duplicando un rol integrado.
    fr: >-
      Un rôle que vous composez à partir de n’importe quel ensemble de clés d’autorisation, généralement en dupliquant
      un rôle intégré.
  link: /team/roles-and-permissions/
- id: dedicated-ip
  term:
    en: Dedicated IP
    vi: IP riêng
    de: Dedizierte IP
    es: IP dedicada
    fr: IP dédiée
  definition:
    en: "An IP address only your mail is sent from, as opposed to a sending provider's shared pool. A new dedicated IP needs warming up."
    vi: Địa chỉ IP chỉ dùng để gửi thư của bạn, khác với nhóm IP dùng chung của nhà cung cấp gửi thư. Một IP riêng mới cần được khởi động.
    de: >-
      Eine IP-Adresse, von der nur Ihre E-Mails gesendet werden, im Gegensatz zum gemeinsamen Pool eines
      Versandanbieters. Eine neue dedizierte IP braucht ein Warm-up.
    es: >-
      Una dirección IP desde la que solo se envía tu correo, a diferencia del grupo de IP compartido de un proveedor de
      envío. Una IP dedicada nueva necesita calentamiento.
    fr: >-
      Une adresse IP depuis laquelle seuls vos e-mails partent, par opposition au pool d’IP partagé d’un fournisseur
      d’envoi. Une nouvelle IP dédiée doit passer par une chauffe.
  link: /providers/warm-up/
- id: deferral
  term:
    en: Deferral
    vi: Hoãn nhận
    de: Zurückstellung
    es: Aplazamiento
    fr: Report
  definition:
    en: A temporary refusal, usually a 4xx SMTP reply, after which the sending provider retries later. A high deferral rate can auto-pause a send.
    vi: Lần từ chối tạm thời, thường là phản hồi SMTP 4xx, sau đó nhà cung cấp gửi thư sẽ thử lại. Tỷ lệ hoãn nhận cao có thể khiến lần gửi tự động tạm dừng.
    de: >-
      Eine vorübergehende Ablehnung, meist eine SMTP-Antwort 4xx, nach der der Versandanbieter es später erneut
      versucht. Eine hohe Zurückstellungsrate kann einen Versand automatisch pausieren.
    es: >-
      Un rechazo temporal, normalmente una respuesta SMTP 4xx, tras el cual el proveedor de envío vuelve a intentarlo
      más tarde. Una tasa de aplazamientos alta puede pausar automáticamente un envío.
    fr: >-
      Un refus temporaire, généralement une réponse SMTP 4xx, après lequel le fournisseur d’envoi réessaie plus tard. Un
      taux de report élevé peut mettre un envoi en pause automatiquement.
  link: /deliverability/bounces-and-complaints/
- id: dkim
  term:
    en: DKIM
    vi: DKIM
    de: DKIM
    es: DKIM
    fr: DKIM
  definition:
    en: "DomainKeys Identified Mail: a signature added to each message that receivers check against a public key published in your domain's DNS."
    vi: 'DomainKeys Identified Mail: chữ ký gắn vào mỗi thư, được máy chủ nhận đối chiếu với khóa công khai công bố trong DNS của tên miền bạn.'
    de: >-
      DomainKeys Identified Mail: eine Signatur, die jeder Nachricht hinzugefügt wird und die empfangende Server anhand
      eines öffentlichen Schlüssels im DNS Ihrer Domain prüfen.
    es: >-
      DomainKeys Identified Mail: una firma añadida a cada mensaje que los receptores comprueban con una clave pública
      publicada en el DNS de tu dominio.
    fr: >-
      DomainKeys Identified Mail : une signature ajoutée à chaque message, que les destinataires vérifient avec une clé
      publique publiée dans le DNS de votre domaine.
  link: /deliverability/spf-dkim-dmarc/
- id: dmarc
  term:
    en: DMARC
    vi: DMARC
    de: DMARC
    es: DMARC
    fr: DMARC
  definition:
    en: 'Domain-based Message Authentication, Reporting and Conformance: a DNS record that tells receivers what to do with mail from your domain that fails aligned SPF and DKIM, and where to send reports.'
    vi: 'Domain-based Message Authentication, Reporting and Conformance: bản ghi DNS cho máy chủ nhận biết cần xử lý thế nào với thư từ tên miền của bạn không đạt SPF và DKIM đã căn chỉnh, và gửi báo cáo về đâu.'
    de: >-
      Domain-based Message Authentication, Reporting and Conformance: ein DNS-Eintrag, der empfangenden Servern sagt,
      wie sie mit E-Mails Ihrer Domain umgehen sollen, die ausgerichtetes SPF und DKIM nicht bestehen, und wohin sie
      Berichte senden sollen.
    es: >-
      Domain-based Message Authentication, Reporting and Conformance: un registro DNS que indica a los receptores qué
      hacer con el correo de tu dominio que no supera SPF y DKIM alineados, y adónde enviar los informes.
    fr: >-
      Domain-based Message Authentication, Reporting and Conformance : un enregistrement DNS qui indique aux
      destinataires que faire des e-mails de votre domaine qui échouent à SPF et DKIM alignés, et où envoyer les
      rapports.
  link: /deliverability/spf-dkim-dmarc/
- id: dmarc-aggregate-report
  term:
    en: DMARC aggregate report
    vi: Báo cáo tổng hợp
    de: DMARC-Sammelbericht
    es: Informe agregado de DMARC
    fr: Rapport agrégé DMARC
  definition:
    en: An XML report a receiver sends, usually once a day, listing the sources that sent mail with your domain and whether they passed SPF, DKIM and DMARC.
    vi: Báo cáo XML do máy chủ nhận gửi, thường mỗi ngày một lần, liệt kê các nguồn đã gửi thư bằng tên miền của bạn và việc chúng có đạt SPF, DKIM và DMARC hay không.
    de: >-
      Ein XML-Bericht, den ein empfangender Server meist einmal täglich sendet. Er listet die Quellen auf, die E-Mails
      mit Ihrer Domain gesendet haben, und ob sie SPF, DKIM und DMARC bestanden haben.
    es: >-
      Un informe XML que envía un receptor, normalmente una vez al día, con las fuentes que enviaron correo con tu
      dominio y si superaron SPF, DKIM y DMARC.
    fr: >-
      Un rapport XML qu’envoie un destinataire, généralement une fois par jour, qui liste les sources ayant envoyé des
      e-mails avec votre domaine et indique si elles ont réussi SPF, DKIM et DMARC.
  link: /deliverability/dmarc-reports/
- id: double-opt-in
  term:
    en: Double opt-in
    vi: Xác nhận hai bước
    de: Double-Opt-in
    es: Doble confirmación
    fr: Double opt-in
  definition:
    en: A signup that counts only after the person clicks a confirmation link sent by email.
    vi: Lượt đăng ký chỉ được tính sau khi người đăng ký nhấp vào liên kết xác nhận gửi qua email.
    de: >-
      Eine Anmeldung, die erst zählt, nachdem die Person auf einen per E-Mail gesendeten Bestätigungslink geklickt hat.
    es: >-
      Una suscripción que solo cuenta después de que la persona hace clic en un enlace de confirmación enviado por
      correo.
    fr: >-
      Une inscription qui ne compte qu’une fois que la personne a cliqué sur un lien de confirmation envoyé par e-mail.
  link: /audience/lists-and-consent/
- id: engagement-tier
  term:
    en: Engagement tier
    vi: Nhóm tương tác
    de: Engagement-Stufe
    es: Grupo de interacción
    fr: Niveau d’engagement
  definition:
    en: 'How recently a contact opened your mail: Active (opened in the last 30 days), Cooling (31 to 90 days), At risk (91 to 180 days) or Sunset (no open in 180 days).'
    vi: 'Mức độ gần đây liên hệ mở thư của bạn: Tích cực (có mở trong 30 ngày qua), Nguội dần (31 đến 90 ngày), Có nguy cơ (91 đến 180 ngày) hoặc Ngừng gửi dần (không mở thư nào trong 180 ngày).'
    de: >-
      Wie kürzlich ein Kontakt Ihre E-Mails geöffnet hat: Aktiv (in den letzten 30 Tagen geöffnet), Nachlassend (31 bis
      90 Tage), Gefährdet (91 bis 180 Tage) oder Auslaufend (seit 180 Tagen keine Öffnung).
    es: >-
      Hace cuánto abrió un contacto tu correo por última vez: Activo (abrió en los últimos 30 días), Enfriándose (de 31
      a 90 días), En riesgo (de 91 a 180 días) o En retirada (sin aperturas en 180 días).
    fr: >-
      Le degré de récence des ouvertures d’un contact : Actif (ouverture dans les 30 derniers jours), En baisse (31 à 90
      jours), À risque (91 à 180 jours) ou Arrêt progressif (aucune ouverture depuis 180 jours).
  link: /audience/list-health/
- id: failover
  term:
    en: Failover
    vi: Chuyển dự phòng
    de: Failover
    es: Conmutación por error
    fr: Basculement
  definition:
    en: "Moving a route's mail to a fallback sending provider when the primary one fails. Each stream's failover policy is automatic, pause and ask, or automatic, warmed-up only."
    vi: Chuyển thư của một tuyến sang nhà cung cấp gửi thư dự phòng khi nhà cung cấp chính gặp lỗi. Chính sách chuyển dự phòng của mỗi luồng là tự động, tạm dừng và hỏi, hoặc tự động, chỉ sang nhà cung cấp đã khởi động xong.
    de: >-
      Das Verschieben der E-Mails einer Route zu einem Ersatzanbieter, wenn der Hauptanbieter ausfällt. Die
      Failover-Richtlinie jedes Streams lautet „automatisch“, „pausieren und nachfragen“ oder „automatisch, nur
      aufgewärmte“.
    es: >-
      Pasar el correo de una ruta a un proveedor de envío de respaldo cuando falla el principal. La política de
      conmutación de cada flujo es automática, pausar y preguntar, o automática, solo con calentamiento completado.
    fr: >-
      Le transfert des e-mails d’une route vers un fournisseur d’envoi de secours lorsque le fournisseur principal tombe
      en panne. La politique de basculement de chaque flux est automatique, mettre en pause et demander, ou automatique,
      chauffe terminée uniquement.
  link: /providers/routing/
- id: fallback-language
  term:
    en: Fallback language
    vi: Ngôn ngữ dự phòng
    de: Ersatzsprache
    es: Idioma alternativo
    fr: Langue de repli
  definition:
    en: The language a contact gets when no ready version exists in their own language.
    vi: Ngôn ngữ mà liên hệ nhận được khi chưa có phiên bản sẵn sàng bằng ngôn ngữ của họ.
    de: Die Sprache, die ein Kontakt erhält, wenn es in seiner eigenen Sprache keine fertige Version gibt.
    es: El idioma que recibe un contacto cuando no hay ninguna versión preparada en su propio idioma.
    fr: La langue que reçoit un contact lorsqu’aucune version prête n’existe dans sa propre langue.
  link: /campaigns/languages/
- id: feedback-loop
  term:
    en: Feedback loop
    vi: Vòng phản hồi
    de: Feedback-Loop
    es: Bucle de retroalimentación
    fr: Boucle de rétroaction
  definition:
    en: "A mailbox provider's report of the messages its users marked as spam, sent back to the sender through the sending provider."
    vi: Báo cáo của nhà cung cấp hộp thư về những thư người dùng của họ đánh dấu là spam, được gửi về người gửi thông qua nhà cung cấp gửi thư.
    de: >-
      Der Bericht eines Postfachanbieters über die Nachrichten, die bei ihm als Spam markiert wurden; er geht über den
      Versandanbieter an den Absender zurück.
    es: >-
      El informe de un proveedor de buzón con los mensajes que sus usuarios marcaron como spam, devuelto al remitente a
      través del proveedor de envío.
    fr: >-
      Le rapport d’un fournisseur de messagerie sur les messages que ses utilisateurs ont marqués comme spam, renvoyé à
      l’expéditeur via le fournisseur d’envoi.
  link: /deliverability/bounces-and-complaints/
- id: generic-http-adapter
  term:
    en: Generic HTTP adapter
    vi: Adapter HTTP chung
    de: Generischer HTTP-Adapter
    es: Adaptador HTTP genérico
    fr: Adaptateur HTTP générique
  definition:
    en: A built-in adapter that connects any HTTP email API through a manifest that maps the request, the response and the webhooks, without code.
    vi: Adapter có sẵn kết nối bất kỳ API email HTTP nào thông qua một manifest ánh xạ yêu cầu, phản hồi và webhook, không cần viết mã.
    de: >-
      Ein integrierter Adapter, der jede HTTP-E-Mail-API ohne Code anbindet, über ein Manifest, das Anfrage, Antwort und
      Webhooks zuordnet.
    es: >-
      Un adaptador integrado que conecta cualquier API de correo HTTP mediante un manifest que asigna la solicitud, la
      respuesta y los webhooks, sin código.
    fr: >-
      Un adaptateur intégré qui connecte n’importe quelle API d’e-mail HTTP grâce à un manifest qui fait correspondre la
      requête, la réponse et les webhooks, sans code.
  link: /providers/generic-http/
- id: goal
  term:
    en: Goal
    vi: Mục tiêu
    de: Ziel
    es: Objetivo
    fr: Objectif
  definition:
    en: An automation condition that takes a contact out of the flow once they meet it and counts toward the goal rate.
    vi: Điều kiện trong tự động hóa đưa liên hệ ra khỏi quy trình ngay khi họ đáp ứng điều kiện đó, và được tính vào tỷ lệ đạt mục tiêu.
    de: >-
      Eine Bedingung einer Automation, die einen Kontakt aus dem Ablauf nimmt, sobald er sie erfüllt, und in die
      Zielquote einfließt.
    es: >-
      Una condición de la automatización que saca a un contacto del recorrido en cuanto la cumple y cuenta para la tasa
      de objetivo cumplido.
    fr: >-
      Une condition d’automatisation qui fait sortir un contact du scénario dès qu’il la remplit, et qui compte dans le
      taux d’atteinte de l’objectif.
  link: /automations/triggers-and-steps/
- id: guarded-sending
  term:
    en: Guarded sending
    vi: Gửi có bảo vệ
    de: Abgesicherter Versand
    es: Envío protegido
    fr: Envoi protégé
  definition:
    en: "ReputeCast's protection of a send while it runs and after: it watches bounces by type, complaints, deferrals, mailbox provider replies and sending provider errors per sending provider and mailbox provider, slows down or auto-pauses only the part that caused a problem, never sends a message twice, and watches complaints for 72 hours after the send."
    vi: 'Việc ReputeCast bảo vệ một lần gửi trong lúc chạy và sau đó: theo dõi thư trả lại theo loại, khiếu nại, hoãn nhận, phản hồi của nhà cung cấp hộp thư và lỗi của nhà cung cấp gửi thư theo từng nhà cung cấp gửi thư và nhà cung cấp hộp thư, giảm tốc hoặc tự động tạm dừng chỉ phần gây ra vấn đề, không bao giờ gửi một thư hai lần, và theo dõi khiếu nại trong 72 giờ sau khi gửi.'
    de: >-
      Der Schutz, den ReputeCast einem Versand während des Laufs und danach gibt: Er überwacht Bounces nach Typ,
      Beschwerden, Zurückstellungen, Antworten der Postfachanbieter und Fehler der Versandanbieter je Versandanbieter
      und Postfachanbieter, verlangsamt oder pausiert automatisch nur den Teil, der ein Problem verursacht hat, sendet
      nie eine Nachricht doppelt und überwacht Beschwerden noch 72 Stunden nach dem Versand.
    es: >-
      La protección que ReputeCast da a un envío mientras se ejecuta y después: vigila los rebotes por tipo, las quejas,
      los aplazamientos, las respuestas de los proveedores de buzón y los errores de los proveedores de envío, por
      proveedor de envío y por proveedor de buzón; ralentiza o pausa automáticamente solo la parte que causó un
      problema; nunca envía un mensaje dos veces, y vigila las quejas durante las 72 horas posteriores al envío.
    fr: >-
      La protection qu’applique ReputeCast à un envoi pendant son déroulement et après : il surveille les rebonds par
      type, les plaintes, les reports, les réponses des fournisseurs de messagerie et les erreurs des fournisseurs
      d’envoi, par fournisseur d’envoi et par fournisseur de messagerie, ralentit ou met en pause automatiquement
      uniquement la partie qui a causé un problème, n’envoie jamais un message deux fois, et surveille les plaintes
      pendant 72 heures après l’envoi.
  link: /campaigns/live-monitor/
- id: hard-bounce
  term:
    en: Hard bounce
    vi: Trả thư vĩnh viễn
    de: Hard Bounce
    es: Rebote permanente
    fr: Rebond définitif
  definition:
    en: "A permanent refusal, such as an address or domain that doesn't exist. The address goes on the suppression list."
    vi: Lần từ chối vĩnh viễn, chẳng hạn địa chỉ hoặc tên miền không tồn tại. Địa chỉ đó được đưa vào danh sách chặn gửi.
    de: >-
      Eine dauerhafte Ablehnung, etwa bei einer Adresse oder Domain, die nicht existiert. Die Adresse kommt auf die
      Sperrliste.
    es: Un rechazo definitivo, como una dirección o un dominio que no existe. La dirección pasa a la lista de supresión.
    fr: >-
      Un refus permanent, par exemple une adresse ou un domaine qui n’existe pas. L’adresse est ajoutée à la liste de
      suppression.
  link: /deliverability/bounces-and-complaints/
- id: held-route
  term:
    en: Held route
    vi: Tuyến bị giữ
    de: Zurückgehaltene Route
    es: Ruta retenida
    fr: Route retenue
  definition:
    en: "A sending provider's share of a running send that waits instead of going out: while the provider can't take mail, or at a warm-up plan's daily cap or pause. The live monitor offers its choices, such as wait, move it to a provider that passes the checks, or cancel the rest; a share held at the warm-up cap goes on by itself with the next day's cap."
    vi: 'Phần của một nhà cung cấp gửi thư trong một lần gửi đang chạy phải chờ thay vì được gửi đi: trong lúc nhà cung cấp không nhận được thư, hoặc khi chạm giới hạn mỗi ngày hay lúc tạm dừng của một kế hoạch khởi động. Màn hình theo dõi trực tiếp đưa ra các lựa chọn, chẳng hạn chờ, chuyển sang một nhà cung cấp vượt qua các bước kiểm tra, hoặc hủy phần còn lại; phần bị giữ ở giới hạn khởi động tự tiếp tục với giới hạn của ngày hôm sau.'
    de: >-
      Der Anteil eines Versandanbieters an einem laufenden Versand, der wartet, statt hinauszugehen: solange der
      Anbieter keine E-Mails annehmen kann oder wenn ein Warm-up-Plan sein Tageslimit oder eine Pause erreicht. Der
      Live-Monitor bietet dafür Optionen an, etwa warten, den Anteil zu einem Anbieter verschieben, der die Prüfungen
      besteht, oder den Rest abbrechen; ein am Warm-up-Limit zurückgehaltener Anteil geht mit dem Limit des nächsten
      Tages von selbst weiter.
    es: >-
      La parte de un envío en curso de un proveedor de envío que espera en lugar de salir: mientras el proveedor no
      puede aceptar correo, o al llegar al límite diario o a una pausa de un plan de calentamiento. El monitor en tiempo
      real ofrece sus opciones, como esperar, pasarla a un proveedor que supere las comprobaciones o cancelar el resto;
      una parte retenida por el límite de calentamiento continúa por sí sola con el límite del día siguiente.
    fr: >-
      La part d’un envoi en cours confiée à un fournisseur d’envoi, qui attend au lieu de partir : tant que le
      fournisseur ne peut pas accepter d’e-mails, ou lorsqu’elle atteint le plafond quotidien ou une pause d’un plan de
      chauffe. Le suivi en direct propose ses options, comme attendre, la transférer vers un fournisseur qui réussit les
      contrôles, ou annuler le reste ; une part retenue au plafond de chauffe repart d’elle-même avec le plafond du jour
      suivant.
  link: /providers/warm-up/
- id: hold-period
  term:
    en: Hold period
    vi: Thời gian chờ
    de: Wartezeit
    es: Periodo de espera
    fr: Délai de validation
  definition:
    en: "How many days a confirmed referral waits before it counts toward the referrer's rewards."
    vi: Số ngày một lượt giới thiệu đã xác nhận phải chờ trước khi được tính vào phần thưởng của người giới thiệu.
    de: Wie viele Tage eine bestätigte Weiterempfehlung wartet, bevor sie für die Prämien der empfehlenden Person zählt.
    es: Cuántos días espera un referido confirmado antes de contar para las recompensas del referidor.
    fr: >-
      Le nombre de jours pendant lesquels un parrainage confirmé attend avant de compter pour les récompenses du
      parrain.
  link: /grow/referrals/
- id: hostrepute
  term:
    en: HostRepute
    vi: HostRepute
    de: HostRepute
    es: HostRepute
    fr: HostRepute
  definition:
    en: "HostRepute's reputation-monitoring service. Connecting it is optional and adds more blocklists, Postmaster and SNDS data and DMARC report collection; no ReputeCast feature requires it."
    vi: Dịch vụ giám sát uy tín của HostRepute. Kết nối là tùy chọn và bổ sung thêm danh sách chặn, dữ liệu Postmaster và SNDS cùng việc thu thập báo cáo DMARC; không tính năng nào của ReputeCast bắt buộc phải có nó.
    de: >-
      Der Dienst von HostRepute zur Überwachung der Reputation. Die Verbindung ist optional und ergänzt weitere
      Blocklisten, Daten aus Postmaster und SNDS sowie das Sammeln von DMARC-Berichten; keine Funktion von ReputeCast
      setzt sie voraus.
    es: >-
      El servicio de supervisión de la reputación de HostRepute. Conectarlo es opcional y añade más listas de bloqueo,
      datos de Postmaster y SNDS y la recogida de informes DMARC; ninguna función de ReputeCast lo requiere.
    fr: >-
      Le service de surveillance de la réputation de HostRepute. Sa connexion est facultative et ajoute davantage de
      listes de blocage, des données Postmaster et SNDS et la collecte des rapports DMARC ; aucune fonctionnalité de
      ReputeCast n’en dépend.
  link: /deliverability/hostrepute/
- id: human-opens
  term:
    en: Human opens
    vi: Lượt mở bởi người đọc
    de: Menschliche Öffnungen
    es: Aperturas humanas
    fr: Ouvertures humaines
  definition:
    en: Opens by people, counted apart from privacy-protected opens (Apple Mail Privacy Protection prefetches) and machine opens such as image proxies on arrival and security scanners. A person's settled click counts as a human open too.
    vi: Lượt mở do người thật thực hiện, được tính riêng với lượt mở được bảo vệ quyền riêng tư (lượt tải trước của Apple Mail Privacy Protection) và lượt mở tự động như proxy hình ảnh lúc thư đến và trình quét bảo mật. Một lượt nhấp đã xác định của người thật cũng được tính là lượt mở bởi người đọc.
    de: >-
      Öffnungen durch Menschen, getrennt gezählt von datenschutzgeschützten Öffnungen (Vorabrufe durch Apple Mail
      Privacy Protection) und maschinellen Öffnungen wie Abrufen durch Bild-Proxys beim Eingang und durch
      Sicherheitsscanner. Ein bestätigter Klick einer Person zählt ebenfalls als menschliche Öffnung.
    es: >-
      Aperturas de personas, contadas aparte de las aperturas con protección de privacidad (las precargas de Apple Mail
      Privacy Protection) y de las aperturas automáticas, como los proxies de imágenes al llegar el correo y los
      escáneres de seguridad. El clic confirmado de una persona también cuenta como apertura humana.
    fr: >-
      Les ouvertures par des personnes, comptées à part des ouvertures à confidentialité protégée (préchargements
      d’Apple Mail Privacy Protection) et des ouvertures automatiques, comme les proxys d’images à l’arrivée et les
      scanners de sécurité. Un clic confirmé d’une personne compte aussi comme une ouverture humaine.
  link: /campaigns/reports/
- id: idempotency-key
  term:
    en: Idempotency key
    vi: Khóa idempotency
    de: Idempotenzschlüssel
    es: Clave de idempotencia
    fr: Clé d’idempotence
  definition:
    en: "A value you send in the Idempotency-Key header so that retrying a transactional API call within 24 hours doesn't send the message twice."
    vi: Giá trị bạn gửi trong header Idempotency-Key để khi thử lại một lệnh gọi API giao dịch trong vòng 24 giờ, thư không bị gửi hai lần.
    de: >-
      Ein Wert, den Sie im Header Idempotency-Key senden, damit ein wiederholter Aufruf der Transaktions-API innerhalb
      von 24 Stunden die Nachricht nicht doppelt sendet.
    es: >-
      Un valor que envías en la cabecera Idempotency-Key para que, si repites una llamada a la API transaccional en un
      plazo de 24 horas, el mensaje no se envíe dos veces.
    fr: >-
      Une valeur que vous envoyez dans l’en-tête Idempotency-Key pour qu’une nouvelle tentative d’un appel à l’API
      transactionnelle dans les 24 heures n’envoie pas le message deux fois.
  link: /developers/transactional-api/
- id: instance
  term:
    en: Instance
    vi: Hệ thống
    de: Instanz
    es: Instancia
    fr: Instance
  definition:
    en: 'One ReputeCast installation: the server, its PostgreSQL database and every workspace on it.'
    vi: 'Một bản cài đặt ReputeCast: máy chủ, cơ sở dữ liệu PostgreSQL và mọi không gian làm việc trên đó.'
    de: 'Eine ReputeCast-Installation: der Server, seine PostgreSQL-Datenbank und jeder Arbeitsbereich darauf.'
    es: >-
      Una instalación de ReputeCast: el servidor, su base de datos PostgreSQL y todos los espacios de trabajo que
      contiene.
    fr: >-
      Une installation de ReputeCast : le serveur, sa base de données PostgreSQL et tous les espaces de travail qu’elle
      héberge.
  link: /getting-started/concepts/
- id: instance-admin
  term:
    en: Instance admin
    vi: Quản trị hệ thống
    de: Instanz-Admin
    es: Administración de la instancia
    fr: Admin de l’instance
  definition:
    en: 'A person who manages the whole instance: users, workspaces, sign-in methods, SSO, security policies and updates. Also the name of the area where they do it.'
    vi: 'Quản trị viên hệ thống là người quản lý toàn bộ hệ thống: người dùng, không gian làm việc, phương thức đăng nhập, SSO, chính sách bảo mật và bản cập nhật. Quản trị hệ thống cũng là tên khu vực nơi họ làm những việc này.'
    de: >-
      Eine Person, die die ganze Instanz verwaltet: Konten, Arbeitsbereiche, Anmeldemethoden, SSO,
      Sicherheitsrichtlinien und Updates. Der Bereich, in dem sie das tut, heißt Instanzverwaltung.
    es: >-
      Quien gestiona toda la instancia: usuarios, espacios de trabajo, métodos de inicio de sesión, SSO, políticas de
      seguridad y actualizaciones. También es el nombre del área donde lo hace.
    fr: >-
      Une personne qui gère toute l’instance : utilisateurs, espaces de travail, méthodes de connexion, SSO, politiques
      de sécurité et mises à jour. C’est aussi le nom de l’espace où elle le fait, l’administration de l’instance.
  link: /self-hosting/instance-admin/
- id: integration-key
  term:
    en: Integration key
    vi: Khóa tích hợp
    de: Integrationsschlüssel
    es: Clave de integración
    fr: Clé d’intégration
  definition:
    en: "An API key created for one integration, such as a Zapier connection, that works only for that integration's operations."
    vi: Khóa API được tạo riêng cho một tích hợp, chẳng hạn một kết nối Zapier, và chỉ dùng được cho các thao tác của tích hợp đó.
    de: >-
      Ein API-Schlüssel, der für eine einzelne Integration erstellt wurde, etwa eine Zapier-Verbindung, und nur für die
      Vorgänge dieser Integration funktioniert.
    es: >-
      Una clave de API creada para una integración, como una conexión de Zapier, que solo sirve para las operaciones de
      esa integración.
    fr: >-
      Une clé API créée pour une intégration, comme une connexion Zapier, qui ne fonctionne que pour les opérations de
      cette intégration.
  link: /developers/integration-api/
- id: language-version
  term:
    en: Language version
    vi: Phiên bản ngôn ngữ
    de: Sprachversion
    es: Versión de idioma
    fr: Version linguistique
  definition:
    en: "A campaign's or template's copy in one language. Each version is Up to date, Outdated, Draft or Missing compared with the source language."
    vi: Bản nội dung của một chiến dịch hoặc mẫu bằng một ngôn ngữ. So với ngôn ngữ gốc, mỗi phiên bản ở trạng thái Đã cập nhật, Lỗi thời, Bản nháp hoặc Thiếu.
    de: >-
      Der Text einer Kampagne oder Vorlage in einer Sprache. Jede Version hat im Vergleich zur Ausgangssprache den
      Status Aktuell, Veraltet, Entwurf oder Fehlt.
    es: >-
      La versión de una campaña o una plantilla en un idioma. Cada versión está Actualizada, Desactualizada, en Borrador
      o Falta respecto al idioma original.
    fr: >-
      Le texte d’une campagne ou d’un modèle dans une langue. Chaque version est À jour, Obsolète, Brouillon ou
      Manquante par rapport à la langue source.
  link: /campaigns/languages/
- id: list
  term:
    en: List
    vi: Danh sách
    de: Liste
    es: Lista
    fr: Liste
  definition:
    en: A group of contacts who subscribed to the same thing. Consent is recorded per list.
    vi: Nhóm liên hệ cùng đăng ký nhận một nội dung. Sự đồng ý được ghi nhận theo từng danh sách.
    de: Eine Gruppe von Kontakten, die dasselbe abonniert haben. Die Einwilligung wird je Liste erfasst.
    es: Un grupo de contactos que se suscribieron a lo mismo. El consentimiento se registra por lista.
    fr: Un groupe de contacts qui se sont abonnés à la même chose. Le consentement est enregistré par liste.
  link: /audience/lists-and-consent/
- id: list-health
  term:
    en: List health
    vi: Sức khỏe danh sách
    de: Listenqualität
    es: Salud de la lista
    fr: Santé de la liste
  definition:
    en: The Audience screen that shows how engagement tiers change over time and how healthy each list is.
    vi: Màn hình trong mục Người đăng ký cho thấy các nhóm tương tác thay đổi theo thời gian và mức độ lành mạnh của từng danh sách.
    de: >-
      Der Bildschirm unter Zielgruppe, der zeigt, wie sich die Engagement-Stufen im Lauf der Zeit verändern und in
      welchem Zustand jede Liste ist.
    es: >-
      La pantalla de Audiencia que muestra cómo cambian los grupos de interacción con el tiempo y lo sana que está cada
      lista.
    fr: L’écran d’Audience qui montre l’évolution des niveaux d’engagement dans le temps et la santé de chaque liste.
  link: /audience/list-health/
- id: live-monitor
  term:
    en: Live monitor
    vi: Theo dõi trực tiếp
    de: Live-Monitor
    es: Monitor en tiempo real
    fr: Suivi en direct
  definition:
    en: The real-time view of a running send, with delivery, bounce and complaint rates per sending provider and mailbox provider, the thresholds, any canary phase, and the 72-hour complaint watch after the send ends.
    vi: Chế độ xem theo thời gian thực của một lần gửi đang chạy, với tỷ lệ gửi thành công, trả thư và khiếu nại theo từng nhà cung cấp gửi thư và nhà cung cấp hộp thư, các ngưỡng, giai đoạn gửi thử (canary) nếu có, và việc theo dõi khiếu nại trong 72 giờ sau khi lần gửi kết thúc.
    de: >-
      Die Echtzeitansicht eines laufenden Versands mit Zustell-, Bounce- und Beschwerderaten je Versandanbieter und
      Postfachanbieter, den Schwellenwerten, einer etwaigen Canary-Phase und der 72-stündigen Beschwerdeüberwachung nach
      Ende des Versands.
    es: >-
      La vista en tiempo real de un envío en curso, con las tasas de entrega, de rebote y de quejas por proveedor de
      envío y por proveedor de buzón, los umbrales, la fase de envío canario si la hay y la vigilancia de quejas de 72
      horas una vez terminado el envío.
    fr: >-
      La vue en temps réel d’un envoi en cours, avec les taux de livraison, de rebond et de plainte par fournisseur
      d’envoi et par fournisseur de messagerie, les seuils, l’éventuelle phase canari, et la surveillance des plaintes
      pendant 72 heures après la fin de l’envoi.
  link: /campaigns/live-monitor/
- id: mailbox-provider
  term:
    en: Mailbox provider
    vi: Nhà cung cấp hộp thư
    de: Postfachanbieter
    es: Proveedor de buzón
    fr: Fournisseur de messagerie
  definition:
    en: "The service where recipients read their mail, such as Gmail, Outlook, Yahoo or iCloud, found from each domain's MX records: Google Workspace counts as Gmail and Microsoft 365 as Outlook. Not to be confused with a sending provider."
    vi: 'Dịch vụ nơi người nhận đọc thư, chẳng hạn Gmail, Outlook, Yahoo hoặc iCloud, xác định từ bản ghi MX của từng tên miền: Google Workspace được tính là Gmail và Microsoft 365 là Outlook. Đừng nhầm với nhà cung cấp gửi thư.'
    de: >-
      Der Dienst, bei dem Empfänger ihre E-Mails lesen, etwa Gmail, Outlook, Yahoo oder iCloud, ermittelt aus den
      MX-Einträgen jeder Domain: Google Workspace zählt als Gmail und Microsoft 365 als Outlook. Nicht zu verwechseln
      mit einem Versandanbieter.
    es: >-
      El servicio donde los destinatarios leen su correo, como Gmail, Outlook, Yahoo o iCloud, que se identifica por los
      registros MX de cada dominio: Google Workspace cuenta como Gmail y Microsoft 365 como Outlook. No hay que
      confundirlo con un proveedor de envío.
    fr: >-
      Le service où les destinataires lisent leurs e-mails, comme Gmail, Outlook, Yahoo ou iCloud, déterminé d’après les
      enregistrements MX de chaque domaine : Google Workspace compte comme Gmail et Microsoft 365 comme Outlook. À ne
      pas confondre avec un fournisseur d’envoi.
  link: /getting-started/concepts/
- id: marketing-cap
  term:
    en: Marketing cap
    vi: Giới hạn email marketing
    de: Marketing-Limit
    es: Límite de marketing
    fr: Plafond marketing
  definition:
    en: 'The most campaign and automation emails one contact gets in a number of days, set in Settings › Sending rules. Campaigns leave out contacts over it; automation emails wait or are skipped. Transactional and System mail never count.'
    vi: 'Số email chiến dịch và tự động hóa tối đa mà một liên hệ nhận trong một số ngày, đặt trong Cài đặt › Quy tắc gửi. Chiến dịch bỏ qua liên hệ vượt giới hạn; email tự động sẽ chờ hoặc bị bỏ qua. Thư Giao dịch và thư Hệ thống không bao giờ được tính.'
    de: >-
      Die Höchstzahl an E-Mails aus Kampagnen und Automationen, die ein Kontakt innerhalb einer bestimmten Anzahl von
      Tagen erhält, festgelegt unter Einstellungen › Versandregeln. Kampagnen lassen Kontakte aus, die darüber liegen;
      E-Mails aus Automationen warten oder werden übersprungen. E-Mails aus den Streams Transaktional und System zählen
      nie mit.
    es: >-
      El máximo de correos de campañas y automatizaciones que recibe un contacto en un número de días, definido en
      Configuración › Reglas de envío. Las campañas excluyen a los contactos que lo superan; los correos de
      automatizaciones esperan o se omiten. El correo transaccional y el de Sistema nunca cuentan.
    fr: >-
      Le nombre maximal d’e-mails de campagne et d’automatisation qu’un contact reçoit sur un nombre de jours donné,
      défini dans Paramètres › Règles d’envoi. Les campagnes excluent les contacts qui le dépassent ; les e-mails
      d’automatisation attendent ou sont ignorés. Les e-mails Transactionnel et Système ne comptent jamais.
  link: /campaigns/sending-rules/
- id: mcp
  term:
    en: MCP
    vi: MCP
    de: MCP
    es: MCP
    fr: MCP
  definition:
    en: The Model Context Protocol, an open protocol AI agents use to call tools. ReputeCast runs an MCP server at /mcp on your instance.
    vi: Model Context Protocol, giao thức mở mà các tác tử AI dùng để gọi công cụ. ReputeCast chạy một máy chủ MCP tại /mcp trên hệ thống của bạn.
    de: >-
      Das Model Context Protocol, ein offenes Protokoll, über das KI-Agenten Tools aufrufen. ReputeCast betreibt einen
      MCP-Server unter /mcp auf Ihrer Instanz.
    es: >-
      El Model Context Protocol, un protocolo abierto que usan los agentes de IA para llamar a herramientas. ReputeCast
      ejecuta un servidor MCP en /mcp en tu instancia.
    fr: >-
      Le Model Context Protocol, un protocole ouvert qu’utilisent les agents IA pour appeler des outils. ReputeCast fait
      tourner un serveur MCP sur /mcp de votre instance.
  link: /developers/mcp/
- id: mcp-agent
  term:
    en: MCP agent
    vi: Tác tử MCP
    de: MCP-Agent
    es: Agente MCP
    fr: Agent MCP
  definition:
    en: An AI agent that connects to the MCP server with its own token (rc_agent_…) and the permissions you give it. Scheduling a send becomes a proposal that a person approves.
    vi: Tác tử AI kết nối với máy chủ MCP bằng token riêng (rc_agent_…) và các quyền bạn cấp. Việc lên lịch gửi sẽ trở thành một đề xuất để một người phê duyệt.
    de: >-
      Ein KI-Agent, der sich mit seinem eigenen Token (rc_agent_…) und den Berechtigungen, die Sie ihm geben, mit dem
      MCP-Server verbindet. Plant er einen Versand, wird daraus ein Vorschlag, den eine Person freigibt.
    es: >-
      Un agente de IA que se conecta al servidor MCP con su propio token (rc_agent_…) y los permisos que le das.
      Programar un envío se convierte en una propuesta que aprueba una persona.
    fr: >-
      Un agent IA qui se connecte au serveur MCP avec son propre jeton (rc_agent_…) et les autorisations que vous lui
      donnez. La programmation d’un envoi devient une proposition qu’une personne approuve.
  link: /developers/mcp/
- id: measurable-open-rate
  term:
    en: Measurable open rate
    vi: Tỷ lệ mở trên số đo được
    de: Messbare Öffnungsrate
    es: Tasa de apertura medible
    fr: Taux d’ouverture mesurable
  definition:
    en: "Human opens divided by the recipients whose opens can be seen: delivered minus privacy-protected. Apple Mail opens every email on download, so those readers can't be measured either way."
    vi: Số lượt mở bởi người đọc chia cho số người nhận mà ta thấy được lượt mở, tức số thư gửi thành công trừ số được bảo vệ quyền riêng tư. Apple Mail mở mọi email khi tải về, nên không thể đo được những người đọc này theo hướng nào.
    de: >-
      Menschliche Öffnungen geteilt durch die Empfänger, deren Öffnungen sichtbar sind: zugestellt minus
      datenschutzgeschützt. Apple Mail öffnet jede E-Mail beim Herunterladen, daher lässt sich bei diesen Empfängern
      weder das Lesen noch das Nichtlesen messen.
    es: >-
      Las aperturas humanas divididas entre los destinatarios cuyas aperturas se pueden ver: los entregados menos los
      que tienen protección de privacidad. Apple Mail abre todos los correos al descargarlos, así que esos lectores no
      se pueden medir en ningún sentido.
    fr: >-
      Les ouvertures humaines divisées par les destinataires dont les ouvertures sont observables : les délivrés moins
      ceux à confidentialité protégée. Apple Mail ouvre chaque e-mail au téléchargement : ses lecteurs ne peuvent donc
      être mesurés ni dans un sens ni dans l’autre.
  link: /campaigns/reports/
- id: member
  term:
    en: Member
    vi: Thành viên
    de: Mitglied
    es: Miembro
    fr: Membre
  definition:
    en: A person who belongs to a workspace, with exactly one role in it.
    vi: Người thuộc một không gian làm việc, có đúng một vai trò trong đó.
    de: Eine Person, die zu einem Arbeitsbereich gehört und darin genau eine Rolle hat.
    es: Una persona que pertenece a un espacio de trabajo, con exactamente un rol en él.
    fr: Une personne qui fait partie d’un espace de travail, avec exactement un rôle dans celui-ci.
  link: /team/members/
- id: messages-in-doubt
  term:
    en: Messages in doubt
    vi: Thư chưa rõ trạng thái
    de: Nachrichten mit unklarem Status
    es: Mensajes en duda
    fr: Messages incertains
  definition:
    en: 'Messages whose call to the sending provider ended without a recorded answer, so nobody knows whether the provider took them. They are never sent again on a guess: a person sends them again or leaves them out, unless the provider still recognizes them or reports an event for them.'
    vi: Những thư mà lệnh gọi tới nhà cung cấp gửi thư kết thúc mà không ghi nhận được phản hồi, nên không ai biết nhà cung cấp đã nhận chúng hay chưa. Chúng không bao giờ được gửi lại theo phỏng đoán; một người quyết định gửi lại hoặc bỏ qua, trừ khi nhà cung cấp vẫn nhận ra chúng hoặc báo một sự kiện cho chúng.
    de: >-
      Nachrichten, deren Aufruf beim Versandanbieter ohne erfasste Antwort endete, sodass niemand weiß, ob der Anbieter
      sie angenommen hat. Sie werden nie auf gut Glück erneut gesendet: Eine Person sendet sie erneut oder lässt sie
      aus, es sei denn, der Anbieter erkennt sie noch wieder oder meldet ein Ereignis zu ihnen.
    es: >-
      Mensajes cuya llamada al proveedor de envío terminó sin una respuesta registrada, así que nadie sabe si el
      proveedor los aceptó. Nunca se vuelven a enviar por suposición: una persona los reenvía o los excluye, salvo que
      el proveedor aún los reconozca o notifique un evento sobre ellos.
    fr: >-
      Des messages dont l’appel au fournisseur d’envoi s’est terminé sans réponse enregistrée : personne ne sait si le
      fournisseur les a pris en charge. Ils ne sont jamais renvoyés au hasard : une personne les renvoie ou les écarte,
      sauf si le fournisseur les reconnaît encore ou signale un événement pour eux.
  link: /campaigns/live-monitor/
- id: milestone
  term:
    en: Milestone
    vi: Mốc thưởng
    de: Meilenstein
    es: Hito
    fr: Palier
  definition:
    en: A number of counted referrals that earns the referrer a reward.
    vi: Số lượt giới thiệu được tính mà người giới thiệu cần đạt để nhận một phần thưởng.
    de: Eine Anzahl gezählter Weiterempfehlungen, für die die empfehlende Person eine Prämie erhält.
    es: Un número de referidos contados que da una recompensa al referidor.
    fr: Un nombre de parrainages comptés qui vaut une récompense au parrain.
  link: /grow/referrals/
- id: normalized-event
  term:
    en: Normalized event
    vi: Sự kiện chuẩn hóa
    de: Normalisiertes Ereignis
    es: Evento normalizado
    fr: Événement normalisé
  definition:
    en: "A provider event translated to ReputeCast's own types (delivered, deferred, hard bounce, soft bounce, complaint, rejected, open, click, unsubscribe), with the provider's original type and code kept."
    vi: Sự kiện của nhà cung cấp được chuyển sang các loại của riêng ReputeCast (gửi thành công, hoãn nhận, trả thư vĩnh viễn, trả thư tạm thời, khiếu nại, bị từ chối, mở, nhấp, hủy đăng ký), vẫn giữ loại và mã gốc của nhà cung cấp.
    de: >-
      Ein Ereignis eines Anbieters, übersetzt in die eigenen Typen von ReputeCast (zugestellt, zurückgestellt, Hard
      Bounce, Soft Bounce, Beschwerde, abgelehnt, Öffnung, Klick, Abmeldung); ursprünglicher Typ und Code des Anbieters
      bleiben erhalten.
    es: >-
      Un evento del proveedor traducido a los tipos propios de ReputeCast (entregado, aplazado, rebote permanente,
      rebote temporal, queja, rechazado, apertura, clic, baja), conservando el tipo y el código originales del
      proveedor.
    fr: >-
      Un événement de fournisseur traduit dans les types propres à ReputeCast (délivré, différé, rebond définitif,
      rebond temporaire, plainte, rejeté, ouverture, clic, désabonnement), avec le type et le code d’origine du
      fournisseur conservés.
  link: /providers/events-and-sync/
- id: one-click-fix
  term:
    en: One-click fix
    vi: Sửa bằng một lần nhấp
    de: Korrektur mit einem Klick
    es: Corrección con un clic
    fr: Correction en un clic
  definition:
    en: A fix that Send Readiness applies for you from a check, such as inserting the footer. It says what it changes before you apply it, is recorded in the audit log, can be undone with the fixes applied with it, and the checks run again.
    vi: Bản sửa mà Độ sẵn sàng gửi áp dụng giúp bạn ngay từ một mục kiểm tra, chẳng hạn chèn chân thư. Bản sửa cho biết nó thay đổi gì trước khi bạn áp dụng, được ghi vào nhật ký kiểm tra, có thể hoàn tác cùng các bản sửa áp dụng chung với nó, và các mục kiểm tra chạy lại.
    de: >-
      Eine Korrektur, die die Versandbereitschaft aus einer Prüfung heraus für Sie anwendet, etwa das Einfügen der
      Fußzeile. Sie sagt vorher, was sie ändert, wird im Audit-Protokoll erfasst und lässt sich zusammen mit den
      gleichzeitig angewendeten Korrekturen rückgängig machen; danach laufen die Prüfungen erneut.
    es: >-
      Una corrección que la revisión previa aplica por ti desde una comprobación, como insertar el pie. Indica lo que
      cambia antes de aplicarla, queda en el registro de auditoría, se puede deshacer junto con las correcciones
      aplicadas con ella, y las comprobaciones vuelven a ejecutarse.
    fr: >-
      Une correction que le contrôle avant envoi applique pour vous depuis un contrôle, comme l’insertion du pied de
      page. Elle indique ce qu’elle modifie avant que vous l’appliquiez, est inscrite au journal d’audit, peut être
      annulée avec les corrections appliquées en même temps, et les contrôles sont relancés.
  link: /campaigns/send-readiness/
- id: one-click-unsubscribe
  term:
    en: One-click unsubscribe
    vi: Hủy đăng ký một lần nhấp
    de: Abmeldung mit einem Klick
    es: Baja con un clic
    fr: Désabonnement en un clic
  definition:
    en: "Unsubscribing straight from the mail app's unsubscribe button, defined by RFC 8058 through the List-Unsubscribe and List-Unsubscribe-Post headers."
    vi: Hủy đăng ký ngay bằng nút hủy đăng ký của ứng dụng thư, theo định nghĩa của RFC 8058 qua hai header List-Unsubscribe và List-Unsubscribe-Post.
    de: >-
      Die Abmeldung direkt über den Abmelde-Button des E-Mail-Programms, festgelegt in RFC 8058 über die Header
      List-Unsubscribe und List-Unsubscribe-Post.
    es: >-
      Darse de baja directamente con el botón de baja de la aplicación de correo, definido por RFC 8058 mediante las
      cabeceras List-Unsubscribe y List-Unsubscribe-Post.
    fr: >-
      Le désabonnement directement depuis le bouton de désabonnement de l’application de messagerie, défini par la RFC
      8058 via les en-têtes List-Unsubscribe et List-Unsubscribe-Post.
  link: /deliverability/one-click-unsubscribe/
- id: outage
  term:
    en: Outage
    vi: Sự cố gián đoạn
    de: Ausfall
    es: Caída
    fr: Panne
  definition:
    en: A sending provider that stops accepting mail. ReputeCast detects it and holds the affected share of a send until you move it to another provider, wait for recovery or cancel.
    vi: Tình trạng một nhà cung cấp gửi thư ngừng nhận thư. ReputeCast phát hiện sự cố và tạm giữ phần bị ảnh hưởng của lần gửi cho đến khi bạn chuyển sang nhà cung cấp khác, chờ khôi phục hoặc hủy.
    de: >-
      Ein Versandanbieter nimmt keine E-Mails mehr an. ReputeCast erkennt das und hält den betroffenen Anteil eines
      Versands zurück, bis Sie ihn zu einem anderen Anbieter verschieben, auf die Wiederherstellung warten oder
      abbrechen.
    es: >-
      Un proveedor de envío que deja de aceptar correo. ReputeCast la detecta y retiene la parte afectada de un envío
      hasta que la pasas a otro proveedor, esperas a que se recupere o cancelas.
    fr: >-
      Un fournisseur d’envoi qui cesse d’accepter des e-mails. ReputeCast la détecte et retient la part d’envoi
      concernée jusqu’à ce que vous la transfériez vers un autre fournisseur, attendiez le rétablissement ou annuliez.
  link: /providers/health-and-outages/
- id: page-copy
  term:
    en: Page copy
    vi: Nội dung trang
    de: Seitentexte
    es: Textos de la página
    fr: Textes de la page
  definition:
    en: "The text of your public pages and forms in one language. Each language's page copy is Live, Incomplete or Not set up."
    vi: Văn bản của các trang công khai và biểu mẫu bằng một ngôn ngữ. Nội dung trang của mỗi ngôn ngữ ở trạng thái Đang dùng, Chưa đủ hoặc Chưa thiết lập.
    de: >-
      Der Text Ihrer öffentlichen Seiten und Formulare in einer Sprache. Die Seitentexte jeder Sprache haben den Status
      Live, Unvollständig oder Nicht eingerichtet.
    es: >-
      El texto de tus páginas públicas y formularios en un idioma. Los textos de la página de cada idioma están En uso,
      Incompletos o Sin configurar.
    fr: >-
      Le texte de vos pages publiques et formulaires dans une langue. Les textes de chaque langue sont En ligne,
      Incomplet ou Non configuré.
  link: /forms/public-pages/
- id: paid-member
  term:
    en: Paid member
    vi: Hội viên trả phí
    de: Zahlendes Mitglied
    es: Suscriptor de pago
    fr: Abonné payant
  definition:
    en: A contact with paid access through a Stripe subscription, a complimentary grant or a gift.
    vi: Liên hệ có quyền truy cập trả phí qua thuê bao Stripe, quyền truy cập miễn phí được cấp hoặc quà tặng.
    de: Ein Kontakt mit Bezahlzugang über ein Stripe-Abo, einen Gratiszugang oder ein Geschenk.
    es: Un contacto con acceso de pago mediante una suscripción de Stripe, un acceso de cortesía o un regalo.
    fr: Un contact qui dispose d’un accès payant via un abonnement Stripe, un accès offert ou un cadeau.
  link: /earn/paid-members/
- id: passkey
  term:
    en: Passkey
    vi: Khóa truy cập
    de: Passkey
    es: Llave de acceso
    fr: Clé d’accès
  definition:
    en: A sign-in credential stored on your device or security key that replaces the password, based on WebAuthn.
    vi: Thông tin đăng nhập lưu trên thiết bị hoặc khóa bảo mật của bạn, thay cho mật khẩu, dựa trên WebAuthn.
    de: >-
      Ein auf Ihrem Gerät oder Sicherheitsschlüssel gespeichertes Anmeldemittel auf Basis von WebAuthn, das das Passwort
      ersetzt.
    es: >-
      Una credencial de inicio de sesión guardada en tu dispositivo o en tu llave de seguridad que sustituye a la
      contraseña, basada en WebAuthn.
    fr: >-
      Un identifiant de connexion stocké sur votre appareil ou votre clé de sécurité, qui remplace le mot de passe, basé
      sur WebAuthn.
  link: /team/account-security/
- id: permission
  term:
    en: Permission
    vi: Quyền
    de: Berechtigung
    es: Permiso
    fr: Autorisation
  definition:
    en: "One thing a role, API key or MCP agent may do, written as a key such as campaigns:send. Nobody can grant a permission they don't hold themselves."
    vi: Một việc mà vai trò, khóa API hoặc tác tử MCP được phép làm, viết dưới dạng khóa như campaigns:send. Không ai cấp được quyền mà chính họ không có.
    de: >-
      Eine einzelne Aktion, die eine Rolle, ein API-Schlüssel oder ein MCP-Agent ausführen darf, geschrieben als
      Schlüssel wie campaigns:send. Eine Berechtigung kann nur vergeben, wer sie selbst hat.
    es: >-
      Algo que puede hacer un rol, una clave de API o un agente MCP, escrito como una clave, por ejemplo campaigns:send.
      Nadie puede conceder un permiso que no tiene.
    fr: >-
      Une action qu’un rôle, une clé API ou un agent MCP peut effectuer, écrite sous forme de clé comme campaigns:send.
      Personne ne peut accorder une autorisation qu’il ne détient pas lui-même.
  link: /team/roles-and-permissions/
- id: personalization-token
  term:
    en: Personalization token
    vi: Thẻ cá nhân hóa
    de: Platzhalter
    es: Etiqueta de personalización
    fr: Variable de personnalisation
  definition:
    en: 'A Liquid placeholder replaced with each contact''s data when the email is sent, such as {{ first_name | default: "there" }}.'
    vi: 'Một biến Liquid được thay bằng dữ liệu của từng liên hệ khi email được gửi, chẳng hạn {{ first_name | default: "there" }}.'
    de: >-
      Ein Liquid-Platzhalter, der beim Senden der E-Mail durch die Daten des jeweiligen Kontakts ersetzt wird, etwa {{
      first_name | default: "there" }}.
    es: >-
      Un marcador de Liquid que se sustituye por los datos de cada contacto al enviar el correo, como {{ first_name |
      default: "there" }}.
    fr: >-
      Un espace réservé Liquid remplacé par les données de chaque contact au moment de l’envoi de l’e-mail, comme {{
      first_name | default: "there" }}.
  link: /campaigns/personalization/
- id: placement-test
  term:
    en: Placement test
    vi: Kiểm tra vị trí thư
    de: Platzierungstest
    es: Prueba de ubicación
    fr: Test de placement
  definition:
    en: A test send to your seed mailboxes that shows how many copies landed in the inbox, in spam or in another tab, per mailbox provider.
    vi: Một lần gửi thử đến các hộp thư thử của bạn, cho thấy bao nhiêu bản sao vào Hộp thư đến, vào Thư rác hoặc vào một tab khác, theo từng nhà cung cấp hộp thư.
    de: >-
      Ein Testversand an Ihre Testpostfächer, der je Postfachanbieter zeigt, wie viele Kopien im Posteingang, im Spam
      oder in einem anderen Tab gelandet sind.
    es: >-
      Un envío de prueba a tus buzones de prueba que muestra cuántas copias llegaron a la bandeja de entrada, a spam o a
      otra pestaña, por proveedor de buzón.
    fr: >-
      Un envoi de test vers vos boîtes témoins qui montre combien de copies sont arrivées en boîte de réception, en spam
      ou dans un autre onglet, par fournisseur de messagerie.
  link: /deliverability/placement-tests/
- id: poll
  term:
    en: Poll
    vi: Bình chọn
    de: Abstimmung
    es: Votación
    fr: Sondage
  definition:
    en: "An email block with a question and answer links. Each answer opens a page that records it, so link scanners can't vote."
    vi: Khối email có một câu hỏi và các liên kết trả lời. Mỗi câu trả lời mở một trang ghi nhận lựa chọn, nên trình quét liên kết không thể bình chọn thay người đọc.
    de: >-
      Ein E-Mail-Block mit einer Frage und Antwortlinks. Jede Antwort öffnet eine Seite, die sie erfasst, sodass
      Link-Scanner nicht abstimmen können.
    es: >-
      Un bloque de correo con una pregunta y enlaces de respuesta. Cada respuesta abre una página que la registra, así
      que los escáneres de enlaces no pueden votar.
    fr: >-
      Un bloc d’e-mail avec une question et des liens de réponse. Chaque réponse ouvre une page qui l’enregistre, si
      bien que les scanners de liens ne peuvent pas voter.
  link: /campaigns/polls-and-surveys/
- id: preference-center
  term:
    en: Preference center
    vi: Trung tâm tùy chọn
    de: Präferenzcenter
    es: Centro de preferencias
    fr: Centre de préférences
  definition:
    en: The public page where a contact chooses their lists, how often they hear from you, a pause and their language.
    vi: Trang công khai nơi liên hệ chọn danh sách, tần suất nhận thư, tạm dừng nhận thư và ngôn ngữ của họ.
    de: >-
      Die öffentliche Seite, auf der ein Kontakt seine Listen wählt, wie oft er von Ihnen hört, eine Pause und seine
      Sprache.
    es: La página pública donde un contacto elige sus listas, con qué frecuencia sabe de ti, una pausa y su idioma.
    fr: La page publique où un contact choisit ses listes, la fréquence de vos envois, une pause et sa langue.
  link: /forms/public-pages/
- id: preview-as
  term:
    en: Preview as
    vi: Xem trước dưới dạng
    de: Vorschau als
    es: Vista previa como
    fr: Prévisualiser en tant que
  definition:
    en: Rendering an email as a chosen contact would receive it, with their data, language and conditional blocks.
    vi: Hiển thị email đúng như một liên hệ được chọn sẽ nhận, với dữ liệu, ngôn ngữ và các khối có điều kiện của người đó.
    de: >-
      Das Rendern einer E-Mail so, wie ein ausgewählter Kontakt sie erhalten würde, mit seinen Daten, seiner Sprache und
      den für ihn geltenden bedingten Blöcken.
    es: >-
      Renderizar un correo tal como lo recibiría un contacto elegido, con sus datos, su idioma y sus bloques
      condicionales.
    fr: >-
      Le rendu d’un e-mail tel qu’un contact choisi le recevrait, avec ses données, sa langue et les blocs
      conditionnels.
  link: /campaigns/personalization/
- id: privacy-protected-open
  term:
    en: Privacy-protected open
    vi: Lượt mở được bảo vệ quyền riêng tư
    de: Datenschutzgeschützte Öffnung
    es: Apertura con protección de privacidad
    fr: Ouverture à confidentialité protégée
  definition:
    en: 'An open fetched by Apple Mail Privacy Protection, or another privacy proxy, when the email arrives, whether or not anyone reads it. Reports count these in their own bucket, apart from human opens and scanner opens.'
    vi: Lượt mở do Apple Mail Privacy Protection hoặc một proxy bảo vệ quyền riêng tư khác tải về khi email đến, dù có ai đọc hay không. Báo cáo tính các lượt này thành một nhóm riêng, tách khỏi lượt mở bởi người đọc và lượt mở của trình quét.
    de: >-
      Eine Öffnung, die Apple Mail Privacy Protection oder ein anderer Datenschutz-Proxy beim Eingang der E-Mail abruft,
      ob jemand sie liest oder nicht. Berichte zählen diese Öffnungen in einer eigenen Gruppe, getrennt von menschlichen
      Öffnungen und Scanner-Öffnungen.
    es: >-
      Una apertura que obtiene Apple Mail Privacy Protection, u otro proxy de privacidad, cuando llega el correo, lo lea
      alguien o no. Los informes las cuentan en su propio grupo, aparte de las aperturas humanas y de las de escáneres.
    fr: >-
      Une ouverture déclenchée par Apple Mail Privacy Protection, ou par un autre proxy de confidentialité, à l’arrivée
      de l’e-mail, que quelqu’un le lise ou non. Les rapports les comptent dans une catégorie à part, distincte des
      ouvertures humaines et des ouvertures par des scanners.
  link: /campaigns/reports/
- id: production-access
  term:
    en: Production access (Amazon SES)
    vi: Quyền gửi chính thức
    de: Produktionszugriff (Amazon SES)
    es: Acceso de producción (Amazon SES)
    fr: Accès production (Amazon SES)
  definition:
    en: Amazon SES approval to leave the sandbox and send to any address. Until then, SES sends only to verified addresses.
    vi: Sự chấp thuận của Amazon SES cho phép rời sandbox và gửi đến mọi địa chỉ. Trước khi được chấp thuận, SES chỉ gửi đến các địa chỉ đã xác minh.
    de: >-
      Die Genehmigung von Amazon SES, die Sandbox zu verlassen und an beliebige Adressen zu senden. Bis dahin sendet SES
      nur an verifizierte Adressen.
    es: >-
      La aprobación de Amazon SES para salir del sandbox y enviar a cualquier dirección. Hasta entonces, SES solo envía
      a direcciones verificadas.
    fr: >-
      L’approbation d’Amazon SES pour quitter le sandbox et envoyer à n’importe quelle adresse. D’ici là, SES n’envoie
      qu’aux adresses vérifiées.
  link: /deliverability/amazon-ses-production-access/
- id: quiet-hours
  term:
    en: Quiet hours
    vi: Giờ yên lặng
    de: Ruhezeiten
    es: Horas de silencio
    fr: Heures de silence
  definition:
    en: "The hours, in each recipient's time zone, when no texts are sent."
    vi: Khoảng giờ, theo múi giờ của từng người nhận, không có tin nhắn nào được gửi.
    de: Die Stunden in der Zeitzone des jeweiligen Empfängers, in denen keine SMS gesendet werden.
    es: Las horas, en la zona horaria de cada destinatario, en las que no se envían SMS.
    fr: Les heures, dans le fuseau horaire de chaque destinataire, pendant lesquelles aucun SMS n’est envoyé.
  link: /channels/sms/
- id: recommendation
  term:
    en: Recommendation
    vi: Đề xuất
    de: Empfehlung
    es: Recomendación
    fr: Recommandation
  definition:
    en: A newsletter you recommend to new subscribers, as a plain link or through a partner link with another ReputeCast instance.
    vi: Bản tin bạn đề xuất cho người đăng ký mới, dưới dạng liên kết thường hoặc qua liên kết đối tác với một hệ thống ReputeCast khác.
    de: >-
      Ein Newsletter, den Sie neuen Abonnenten empfehlen, als einfacher Link oder über einen Partnerlink mit einer
      anderen ReputeCast-Instanz.
    es: >-
      Un boletín que recomiendas a los suscriptores nuevos, como un enlace sencillo o mediante un enlace de socio con
      otra instancia de ReputeCast.
    fr: >-
      Une newsletter que vous recommandez aux nouveaux abonnés, sous forme de simple lien ou via un lien partenaire avec
      une autre instance ReputeCast.
  link: /grow/recommendations/
- id: recovery-code
  term:
    en: Recovery code
    vi: Mã khôi phục
    de: Wiederherstellungscode
    es: Código de recuperación
    fr: Code de récupération
  definition:
    en: "A one-time code that signs you in when your passkey or authenticator app isn't available."
    vi: Mã dùng một lần để đăng nhập khi bạn không dùng được khóa truy cập hoặc ứng dụng xác thực.
    de: Ein Einmalcode, mit dem Sie sich anmelden, wenn Ihr Passkey oder Ihre Authenticator-App nicht verfügbar ist.
    es: >-
      Un código de un solo uso con el que inicias sesión cuando tu llave de acceso o tu aplicación de autenticación no
      están disponibles.
    fr: >-
      Un code à usage unique qui vous connecte lorsque votre clé d’accès ou votre application d’authentification n’est
      pas disponible.
  link: /team/account-security/
- id: recurring-digest
  term:
    en: Recurring digest
    vi: Bản tin định kỳ
    de: Wiederkehrender Newsletter
    es: Boletín periódico
    fr: Récapitulatif récurrent
  definition:
    en: A campaign that ReputeCast builds on a schedule from the new items in a feed. Each edition is its own campaign.
    vi: Chiến dịch mà ReputeCast tự tạo theo lịch từ các mục mới trong một nguồn cấp. Mỗi số là một chiến dịch riêng.
    de: >-
      Eine Kampagne, die ReputeCast nach Zeitplan aus den neuen Einträgen eines Feeds erstellt. Jede Ausgabe ist eine
      eigene Kampagne.
    es: >-
      Una campaña que ReputeCast construye según una programación a partir de los elementos nuevos de un feed. Cada
      edición es una campaña propia.
    fr: >-
      Une campagne que ReputeCast construit selon un calendrier à partir des nouveaux éléments d’un flux. Chaque numéro
      est une campagne à part entière.
  link: /campaigns/recurring-digests/
- id: referral-program
  term:
    en: Referral program
    vi: Chương trình giới thiệu
    de: Empfehlungsprogramm
    es: Programa de referidos
    fr: Programme de parrainage
  definition:
    en: Rewards for subscribers who bring in new subscribers through their personal referral link. One program per list.
    vi: Phần thưởng cho người đăng ký mang về người đăng ký mới qua liên kết giới thiệu riêng của họ. Mỗi danh sách có một chương trình.
    de: >-
      Prämien für Abonnenten, die über ihren persönlichen Empfehlungslink neue Abonnenten gewinnen. Ein Programm je
      Liste.
    es: >-
      Recompensas para los suscriptores que traen suscriptores nuevos con su enlace de referido personal. Un programa
      por lista.
    fr: >-
      Des récompenses pour les abonnés qui amènent de nouveaux abonnés grâce à leur lien de parrainage personnel. Un
      programme par liste.
  link: /grow/referrals/
- id: reply-rule
  term:
    en: Reply rule
    vi: Quy tắc phản hồi
    de: Antwortregel
    es: Regla de respuesta
    fr: Règle de réponse
  definition:
    en: "A traffic rule that counts a mailbox provider's SMTP replies containing a text, such as Yahoo's TSS04, and at its count slows that mailbox provider down, pauses it or alerts, for a while or until someone resumes."
    vi: Một quy tắc lưu lượng đếm các phản hồi SMTP của một nhà cung cấp hộp thư có chứa một đoạn văn bản, chẳng hạn TSS04 của Yahoo, và khi đạt số lần đã đặt thì giảm tốc độ gửi tới nhà cung cấp hộp thư đó, tạm dừng nó hoặc cảnh báo, trong một khoảng thời gian hoặc cho đến khi có người tiếp tục.
    de: >-
      Eine Traffic-Regel, die SMTP-Antworten eines Postfachanbieters mit einem bestimmten Text zählt, etwa TSS04 von
      Yahoo, und bei Erreichen ihrer Anzahl den Versand an diesen Postfachanbieter verlangsamt, pausiert oder eine
      Benachrichtigung auslöst, für eine gewisse Zeit oder bis jemand den Versand fortsetzt.
    es: >-
      Una regla de tráfico que cuenta las respuestas SMTP de un proveedor de buzón que contienen un texto, como TSS04 de
      Yahoo, y al llegar a su recuento ralentiza o pausa ese proveedor de buzón o avisa, durante un tiempo o hasta que
      alguien lo reanuda.
    fr: >-
      Une règle de trafic qui compte les réponses SMTP d’un fournisseur de messagerie contenant un texte donné, comme le
      TSS04 de Yahoo, et, une fois son nombre atteint, ralentit ce fournisseur de messagerie, le met en pause ou envoie
      une alerte, pour un temps ou jusqu’à ce que quelqu’un reprenne l’envoi.
  link: /providers/traffic-rules/
- id: restricted-key
  term:
    en: Restricted key
    vi: Khóa hạn chế
    de: Eingeschränkter Schlüssel
    es: Clave restringida
    fr: Clé restreinte
  definition:
    en: A Stripe API key limited to the permissions ReputeCast needs (rk_live_ or rk_test_). ReputeCast refuses full secret keys.
    vi: Khóa API Stripe chỉ có những quyền ReputeCast cần (rk_live_ hoặc rk_test_). ReputeCast từ chối khóa bí mật đầy đủ quyền.
    de: >-
      Ein Stripe-API-Schlüssel, der auf die Berechtigungen beschränkt ist, die ReputeCast braucht (rk_live_ oder
      rk_test_). ReputeCast lehnt vollständige geheime Schlüssel ab.
    es: >-
      Una clave de API de Stripe limitada a los permisos que necesita ReputeCast (rk_live_ o rk_test_). ReputeCast
      rechaza las claves secretas completas.
    fr: >-
      Une clé API Stripe limitée aux autorisations dont ReputeCast a besoin (rk_live_ ou rk_test_). ReputeCast refuse
      les clés secrètes complètes.
  link: /earn/connect-stripe/
- id: review-and-send
  term:
    en: 'Review & send'
    vi: Kiểm tra và gửi
    de: Prüfen & senden
    es: Revisar y enviar
    fr: Vérifier et envoyer
  definition:
    en: 'The screen before a campaign goes out: Send Readiness results, the route, estimates, scheduling, test sends and the final confirmation.'
    vi: 'Màn hình trước khi chiến dịch được gửi đi: kết quả Độ sẵn sàng gửi, tuyến, ước tính, lên lịch, gửi thử và bước xác nhận cuối cùng.'
    de: >-
      Der Bildschirm, bevor eine Kampagne hinausgeht: Ergebnisse der Versandbereitschaft, die Route, Schätzungen,
      Planung, Testversand und die abschließende Bestätigung.
    es: >-
      La pantalla previa a la salida de una campaña: resultados de la revisión previa, la ruta, las estimaciones, la
      programación, los envíos de prueba y la confirmación final.
    fr: >-
      L’écran qui précède le départ d’une campagne : résultats du contrôle avant envoi, route, estimations,
      programmation, envois de test et confirmation finale.
  link: /campaigns/schedule-and-send/
- id: review-link
  term:
    en: Review link
    vi: Liên kết góp ý
    de: Prüflink
    es: Enlace de revisión
    fr: Lien de relecture
  definition:
    en: A link that shows one saved version of a campaign's email to people without an account, who can comment on it without signing in. It stops working when it expires or someone revokes it.
    vi: Liên kết cho người không có tài khoản xem một phiên bản đã lưu của email trong chiến dịch và nhận xét mà không cần đăng nhập. Liên kết ngừng hoạt động khi hết hạn hoặc khi có người thu hồi.
    de: >-
      Ein Link, der Personen ohne Konto eine gespeicherte Version der E-Mail einer Kampagne zeigt; sie können sie ohne
      Anmeldung kommentieren. Er funktioniert nicht mehr, wenn er abläuft oder jemand ihn widerruft.
    es: >-
      Un enlace que muestra una versión guardada del correo de una campaña a personas sin cuenta, que pueden comentarlo
      sin iniciar sesión. Deja de funcionar cuando caduca o alguien lo revoca.
    fr: >-
      Un lien qui montre une version enregistrée de l’e-mail d’une campagne à des personnes sans compte, qui peuvent la
      commenter sans se connecter. Il cesse de fonctionner lorsqu’il expire ou que quelqu’un le révoque.
  link: /campaigns/comments-and-review-links/
- id: role
  term:
    en: Role
    vi: Vai trò
    de: Rolle
    es: Rol
    fr: Rôle
  definition:
    en: "The set of permissions a member has in a workspace. The built-in workspace roles are Owner, Admin, Editor and Viewer; they can't be edited, but you can duplicate one into a custom role."
    vi: Tập quyền mà một thành viên có trong không gian làm việc. Các vai trò có sẵn của không gian làm việc là Chủ sở hữu, Quản trị viên, Biên tập viên và Người xem; bạn không thể sửa các vai trò này, nhưng có thể nhân bản một vai trò thành vai trò tùy chỉnh.
    de: >-
      Die Berechtigungen, die ein Mitglied in einem Arbeitsbereich hat. Die integrierten Rollen eines Arbeitsbereichs
      sind Inhaber, Admin, Bearbeiter und Betrachter; sie lassen sich nicht bearbeiten, aber Sie können eine davon zu
      einer eigenen Rolle duplizieren.
    es: >-
      El conjunto de permisos que tiene un miembro en un espacio de trabajo. Los roles integrados del espacio de trabajo
      son Propietario, Administrador, Editor y Lector; no se pueden editar, pero puedes duplicar uno para crear un rol
      personalizado.
    fr: >-
      L’ensemble des autorisations dont dispose un membre dans un espace de travail. Les rôles d’espace de travail
      intégrés sont Propriétaire, Admin, Éditeur et Observateur ; ils ne peuvent pas être modifiés, mais vous pouvez en
      dupliquer un pour créer un rôle personnalisé.
  link: /team/roles-and-permissions/
- id: role-address
  term:
    en: Role address
    vi: Địa chỉ chức danh
    de: Rollenadresse
    es: Dirección genérica
    fr: Adresse générique
  definition:
    en: 'An address for a function rather than a person, such as info@ or sales@. ReputeCast keeps role addresses out of marketing mail.'
    vi: Địa chỉ dành cho một chức năng thay vì một người, chẳng hạn info@ hoặc sales@. ReputeCast không gửi thư tiếp thị đến địa chỉ chức danh.
    de: >-
      Eine Adresse für eine Funktion statt für eine Person, etwa info@ oder sales@. ReputeCast hält Rollenadressen aus
      Marketing-E-Mails heraus.
    es: >-
      Una dirección de una función y no de una persona, como info@ o ventas@. ReputeCast deja las direcciones genéricas
      fuera del correo de marketing.
    fr: >-
      Une adresse qui correspond à une fonction plutôt qu’à une personne, comme info@ ou sales@. ReputeCast écarte les
      adresses génériques des e-mails marketing.
  link: /audience/suppressions/
- id: route
  term:
    en: Route
    vi: Tuyến
    de: Route
    es: Ruta
    fr: Route
  definition:
    en: "The rule that decides which sending provider delivers an email, by stream, list, sender domain or the recipient's mailbox provider."
    vi: Quy tắc quyết định nhà cung cấp gửi thư nào gửi một email, theo luồng, danh sách, tên miền gửi thư hoặc nhà cung cấp hộp thư của người nhận.
    de: >-
      Die Regel, die entscheidet, welcher Versandanbieter eine E-Mail zustellt, nach Stream, Liste, Absender-Domain oder
      dem Postfachanbieter des Empfängers.
    es: >-
      La regla que decide qué proveedor de envío entrega un correo, según el flujo, la lista, el dominio del remitente o
      el proveedor de buzón del destinatario.
    fr: >-
      La règle qui décide quel fournisseur d’envoi délivre un e-mail, selon le flux, la liste, le domaine d’expéditeur
      ou le fournisseur de messagerie du destinataire.
  link: /providers/routing/
- id: route-tester
  term:
    en: Route tester
    vi: Công cụ thử tuyến
    de: Routentester
    es: Probador de rutas
    fr: Testeur de routes
  definition:
    en: 'A tool on the Routing & failover tab that answers which provider would send a given email.'
    vi: Công cụ trên tab Định tuyến và chuyển dự phòng cho biết nhà cung cấp nào sẽ gửi một email cụ thể.
    de: Ein Tool im Tab Routing & Failover, das beantwortet, welcher Anbieter eine bestimmte E-Mail senden würde.
    es: Una herramienta de la pestaña Enrutamiento y conmutación que responde qué proveedor enviaría un correo concreto.
    fr: Un outil de l’onglet Routage et basculement qui indique quel fournisseur enverrait un e-mail donné.
  link: /providers/routing/
- id: scope
  term:
    en: Scope
    vi: Phạm vi
    de: Bereich
    es: Ámbito
    fr: Portée
  definition:
    en: A limit on a role, member or API key to certain lists or sender domains.
    vi: Giới hạn một vai trò, thành viên hoặc khóa API trong một số danh sách hoặc tên miền gửi thư.
    de: >-
      Eine Beschränkung einer Rolle, eines Mitglieds oder eines API-Schlüssels auf bestimmte Listen oder
      Absender-Domains.
    es: Un límite de un rol, un miembro o una clave de API a determinadas listas o dominios de remitente.
    fr: >-
      Une limite qui restreint un rôle, un membre ou une clé API à certaines listes ou à certains domaines d’expéditeur.
  link: /team/roles-and-permissions/
- id: score
  term:
    en: Score
    vi: Điểm
    de: Score
    es: Puntuación
    fr: Score
  definition:
    en: "A 0 to 100 measure of a contact's interest, built from rules you set. Scores fall into the bands Cold, Warm and Hot and never start or stop mail by themselves."
    vi: Thước đo từ 0 đến 100 về mức quan tâm của một liên hệ, tính từ các quy tắc bạn đặt. Điểm được xếp vào các mức Lạnh, Ấm và Nóng, và không bao giờ tự bắt đầu hay dừng gửi thư.
    de: >-
      Ein Maß von 0 bis 100 für das Interesse eines Kontakts, gebildet aus Regeln, die Sie festlegen. Scores fallen in
      die Stufen Kalt, Warm und Heiß und starten oder stoppen nie von selbst einen Versand.
    es: >-
      Una medida de 0 a 100 del interés de un contacto, construida con las reglas que defines. Las puntuaciones se
      agrupan en los tramos Frío, Templado y Caliente y nunca inician ni detienen el correo por sí solas.
    fr: >-
      Une mesure de 0 à 100 de l’intérêt d’un contact, construite à partir des règles que vous définissez. Les scores se
      répartissent entre les niveaux Froid, Tiède et Chaud, et ne déclenchent ni n’arrêtent jamais d’eux-mêmes l’envoi
      d’e-mails.
  link: /audience/scoring/
- id: seed-mailbox
  term:
    en: Seed mailbox
    vi: Hộp thư thử
    de: Testpostfach
    es: Buzón de prueba
    fr: Boîte témoin
  definition:
    en: A mailbox you own at a mailbox provider that receives placement test copies, so ReputeCast can see where they landed.
    vi: Hộp thư bạn sở hữu tại một nhà cung cấp hộp thư, dùng để nhận bản sao của các lần kiểm tra vị trí thư, nhờ đó ReputeCast biết thư đã vào đâu.
    de: >-
      Ein Postfach, das Ihnen bei einem Postfachanbieter gehört und Kopien von Platzierungstests erhält, damit
      ReputeCast sehen kann, wo sie gelandet sind.
    es: >-
      Un buzón tuyo en un proveedor de buzón que recibe las copias de las pruebas de ubicación, para que ReputeCast
      pueda ver dónde llegaron.
    fr: >-
      Une boîte vous appartenant chez un fournisseur de messagerie, qui reçoit les copies des tests de placement pour
      que ReputeCast voie où elles sont arrivées.
  link: /deliverability/placement-tests/
- id: segment
  term:
    en: Segment
    vi: Phân khúc
    de: Segment
    es: Segmento
    fr: Segment
  definition:
    en: A saved set of conditions that selects contacts. SQL segments select them with a read-only SQL query instead.
    vi: Tập điều kiện đã lưu để chọn liên hệ. Phân khúc SQL thì chọn liên hệ bằng một truy vấn SQL chỉ đọc.
    de: >-
      Ein gespeicherter Satz von Bedingungen, der Kontakte auswählt. SQL-Segmente wählen sie stattdessen mit einer
      SQL-Abfrage aus, die nur liest.
    es: >-
      Un conjunto guardado de condiciones que selecciona contactos. Los segmentos SQL los seleccionan con una consulta
      SQL de solo lectura.
    fr: >-
      Un ensemble enregistré de conditions qui sélectionne des contacts. Les segments SQL les sélectionnent plutôt par
      une requête SQL en lecture seule.
  link: /audience/segments/
- id: send-readiness
  term:
    en: Send Readiness
    vi: Độ sẵn sàng gửi
    de: Versandbereitschaft
    es: Revisión previa
    fr: Contrôle avant envoi
  definition:
    en: The checks ReputeCast runs before a send, in up to 11 groups from sender reputation to the workspace's own sending rules. Each check passes, warns, blocks or is unknown, and the send gets one verdict. The checks run again at the send time.
    vi: Các mục kiểm tra ReputeCast chạy trước một lần gửi, chia thành tối đa 11 nhóm, từ uy tín người gửi đến các quy tắc gửi riêng của không gian làm việc. Mỗi mục có kết quả Đạt, Cảnh báo, Chặn hoặc Không rõ, và lần gửi nhận một kết luận chung. Các mục kiểm tra chạy lại vào thời điểm gửi.
    de: >-
      Die Prüfungen, die ReputeCast vor einem Versand ausführt, in bis zu 11 Gruppen von der Absenderreputation bis zu
      den eigenen Versandregeln des Arbeitsbereichs. Jede Prüfung ist bestanden, warnt, blockiert oder ist unbekannt,
      und der Versand erhält ein einziges Ergebnis. Zur Versandzeit laufen die Prüfungen erneut.
    es: >-
      Las comprobaciones que ReputeCast ejecuta antes de un envío, en hasta 11 grupos, desde la reputación del remitente
      hasta las reglas de envío propias del espacio de trabajo. Cada comprobación da Correcto, Aviso, Bloqueo o
      Desconocido, y el envío recibe un único veredicto. Las comprobaciones vuelven a ejecutarse a la hora de envío.
    fr: >-
      Les contrôles que ReputeCast exécute avant un envoi, répartis en 11 groupes au plus, de la réputation de
      l’expéditeur aux règles d’envoi propres à l’espace de travail. Chaque contrôle est réussi, donne un avertissement,
      est bloquant ou reste inconnu, et l’envoi reçoit un verdict unique. Les contrôles sont relancés à l’heure d’envoi.
  link: /campaigns/send-readiness/
- id: send-time-hold
  term:
    en: Send-time hold
    vi: Lần gửi bị tạm giữ
    de: Zurückgehaltener Versand
    es: Retención al enviar
    fr: Envoi retenu à l’heure d’envoi
  definition:
    en: 'A scheduled send the send-time recheck stopped before it started: a check now blocks, a new warning or Unknown nobody confirmed, the audience moved by more than 10%, or the content, audience, sender or route changed after scheduling. Nothing goes out until someone reviews it again, and a held send nobody reviews goes back to Draft.'
    vi: 'Lần gửi đã lên lịch bị lần kiểm tra lại lúc gửi dừng trước khi bắt đầu: một mục kiểm tra giờ chặn, có cảnh báo hoặc mục Không rõ mới chưa ai xác nhận, số người nhận thay đổi hơn 10%, hoặc nội dung, người nhận, người gửi hay tuyến gửi đã thay đổi sau khi lên lịch. Không có gì được gửi cho đến khi có người xem lại, và lần gửi bị tạm giữ mà không ai xem lại sẽ trở về Bản nháp.'
    de: >-
      Ein geplanter Versand, den die erneute Prüfung zur Versandzeit vor dem Start gestoppt hat: Eine Prüfung blockiert
      jetzt, eine neue Warnung oder ein neues „Unbekannt“ hat niemand bestätigt, die Zielgruppe hat sich um mehr als 10
      % verändert, oder Inhalt, Zielgruppe, Absender oder Route wurden nach der Planung geändert. Nichts geht hinaus,
      bis jemand den Versand erneut prüft, und ein zurückgehaltener Versand, den niemand prüft, wird wieder zum Entwurf.
    es: >-
      Un envío programado que la nueva comprobación al enviar detuvo antes de empezar: una comprobación ahora bloquea,
      hay un aviso nuevo o un Desconocido que nadie confirmó, la audiencia cambió más de un 10 %, o el contenido, la
      audiencia, el remitente o la ruta cambiaron después de programarlo. No sale nada hasta que alguien lo vuelve a
      revisar, y un envío retenido que nadie revisa vuelve a Borrador.
    fr: >-
      Un envoi programmé que la revérification à l’envoi a arrêté avant son démarrage : un contrôle est désormais
      bloquant, un nouvel avertissement ou un résultat Inconnu n’a été confirmé par personne, l’audience a varié de plus
      de 10 %, ou le contenu, l’audience, l’expéditeur ou la route a changé après la programmation. Rien ne part tant
      que quelqu’un ne l’a pas réexaminé, et un envoi retenu que personne n’examine repasse en Brouillon.
  link: /campaigns/send-readiness/
- id: send-only-key
  term:
    en: Send-only key
    vi: Khóa chỉ gửi
    de: Nur-Senden-Schlüssel
    es: Clave solo de envío
    fr: Clé d’envoi uniquement
  definition:
    en: An API key that can only send transactional email. SMTP relay credentials are send-only keys.
    vi: Khóa API chỉ dùng được để gửi email giao dịch. Thông tin đăng nhập SMTP relay là khóa chỉ gửi.
    de: >-
      Ein API-Schlüssel, der nur Transaktions-E-Mails senden kann. Zugangsdaten für das SMTP-Relay sind
      Nur-Senden-Schlüssel.
    es: >-
      Una clave de API que solo puede enviar correo transaccional. Las credenciales del SMTP relay son claves solo de
      envío.
    fr: >-
      Une clé API qui ne peut qu’envoyer des e-mails transactionnels. Les identifiants du SMTP relay sont des clés
      d’envoi uniquement.
  link: /transactional/first-send/
- id: sender
  term:
    en: Sender
    vi: Người gửi
    de: Absender
    es: Remitente
    fr: Expéditeur
  definition:
    en: The From name and address a message is sent as, on one of your sending domains.
    vi: Tên và địa chỉ From dùng để gửi thư, trên một trong các tên miền gửi thư của bạn.
    de: Name und Adresse im From-Feld, unter denen eine Nachricht gesendet wird, auf einer Ihrer Versand-Domains.
    es: El nombre y la dirección From con los que se envía un mensaje, en uno de tus dominios de envío.
    fr: Le nom et l’adresse From sous lesquels un message est envoyé, sur l’un de vos domaines d’envoi.
  link: /providers/senders-and-domains/
- id: sender-reputation
  term:
    en: Sender reputation
    vi: Uy tín người gửi
    de: Absenderreputation
    es: Reputación del remitente
    fr: Réputation de l’expéditeur
  definition:
    en: How mailbox providers rate mail from your domains and IP addresses, based on complaints, bounces, spam traps and engagement.
    vi: Cách các nhà cung cấp hộp thư đánh giá thư từ tên miền và địa chỉ IP của bạn, dựa trên khiếu nại, thư trả lại, bẫy spam và mức độ tương tác.
    de: >-
      Wie Postfachanbieter E-Mails von Ihren Domains und IP-Adressen bewerten, anhand von Beschwerden, Bounces,
      Spamfallen und Interaktion.
    es: >-
      Cómo valoran los proveedores de buzón el correo de tus dominios y direcciones IP, según las quejas, los rebotes,
      las trampas de spam y la interacción.
    fr: >-
      La façon dont les fournisseurs de messagerie évaluent les e-mails de vos domaines et adresses IP, d’après les
      plaintes, les rebonds, les pièges à spam et l’engagement.
  link: /deliverability/overview/
- id: sending-domain
  term:
    en: Sending domain
    vi: Tên miền gửi thư
    de: Versand-Domain
    es: Dominio de envío
    fr: Domaine d’envoi
  definition:
    en: A domain you send from, with the DNS records (SPF, DKIM, DMARC, MAIL FROM) your sending providers need.
    vi: Tên miền bạn dùng để gửi thư, với các bản ghi DNS (SPF, DKIM, DMARC, MAIL FROM) mà các nhà cung cấp gửi thư của bạn cần.
    de: >-
      Eine Domain, von der Sie senden, mit den DNS-Einträgen (SPF, DKIM, DMARC, MAIL FROM), die Ihre Versandanbieter
      brauchen.
    es: >-
      Un dominio desde el que envías, con los registros DNS (SPF, DKIM, DMARC, MAIL FROM) que necesitan tus proveedores
      de envío.
    fr: >-
      Un domaine depuis lequel vous envoyez, avec les enregistrements DNS (SPF, DKIM, DMARC, MAIL FROM) dont vos
      fournisseurs d’envoi ont besoin.
  link: /providers/senders-and-domains/
- id: sending-ip
  term:
    en: Sending IP
    vi: IP gửi thư
    de: Versand-IP
    es: IP de envío
    fr: IP d’envoi
  definition:
    en: "An IP address a sending provider sends your mail from: its shared pool, or dedicated IPs that ReputeCast reads from the provider's API (Amazon SES, SendGrid, Mailgun, SparkPost, Brevo) or that you list by hand. Send Readiness checks dedicated IPs on blocklists, and one that never sent for the workspace starts a canary."
    vi: 'Địa chỉ IP mà nhà cung cấp gửi thư dùng để gửi thư của bạn: nhóm IP dùng chung của nhà cung cấp, hoặc các IP riêng mà ReputeCast đọc từ API của nhà cung cấp (Amazon SES, SendGrid, Mailgun, SparkPost, Brevo) hay bạn tự nhập. Độ sẵn sàng gửi kiểm tra các IP riêng trên danh sách chặn, và một IP chưa từng gửi cho không gian làm việc sẽ bắt đầu bằng giai đoạn gửi thử (canary).'
    de: >-
      Eine IP-Adresse, von der ein Versandanbieter Ihre E-Mails sendet: sein gemeinsamer Pool oder dedizierte IPs, die
      ReputeCast über die API des Anbieters ausliest (Amazon SES, SendGrid, Mailgun, SparkPost, Brevo) oder die Sie von
      Hand angeben. Die Versandbereitschaft prüft dedizierte IPs auf Blocklisten, und für eine, die für den
      Arbeitsbereich noch nie gesendet hat, startet ein Canary-Versand.
    es: >-
      Una dirección IP desde la que un proveedor de envío envía tu correo: su grupo de IP compartido, o IP dedicadas que
      ReputeCast lee de la API del proveedor (Amazon SES, SendGrid, Mailgun, SparkPost, Brevo) o que indicas a mano. La
      revisión previa comprueba las IP dedicadas en las listas de bloqueo, y una que nunca ha enviado para el espacio de
      trabajo inicia un envío canario.
    fr: >-
      Une adresse IP depuis laquelle un fournisseur d’envoi envoie vos e-mails : son pool d’IP partagé, ou des IP
      dédiées que ReputeCast lit dans l’API du fournisseur (Amazon SES, SendGrid, Mailgun, SparkPost, Brevo) ou que vous
      indiquez à la main. Le contrôle avant envoi vérifie les IP dédiées dans les listes de blocage, et une IP qui n’a
      jamais envoyé pour l’espace de travail déclenche un canari.
  link: /providers/senders-and-domains/
- id: sending-provider
  term:
    en: Sending provider
    vi: Nhà cung cấp gửi thư
    de: Versandanbieter
    es: Proveedor de envío
    fr: Fournisseur d’envoi
  definition:
    en: The service that delivers your mail, such as Amazon SES, Postmark, Mailgun, your own Postal server or an SMTP server. Not to be confused with a mailbox provider.
    vi: Dịch vụ chuyển thư của bạn đi, chẳng hạn Amazon SES, Postmark, Mailgun, máy chủ Postal của riêng bạn hoặc một máy chủ SMTP. Đừng nhầm với nhà cung cấp hộp thư.
    de: >-
      Der Dienst, der Ihre E-Mails zustellt, etwa Amazon SES, Postmark, Mailgun, Ihr eigener Postal-Server oder ein
      SMTP-Server. Nicht zu verwechseln mit einem Postfachanbieter.
    es: >-
      El servicio que entrega tu correo, como Amazon SES, Postmark, Mailgun, tu propio servidor Postal o un servidor
      SMTP. No hay que confundirlo con un proveedor de buzón.
    fr: >-
      Le service qui délivre vos e-mails, comme Amazon SES, Postmark, Mailgun, votre propre serveur Postal ou un serveur
      SMTP. À ne pas confondre avec un fournisseur de messagerie.
  link: /providers/choose/
- id: sending-rules
  term:
    en: Sending rules
    vi: Quy tắc gửi
    de: Versandregeln
    es: Reglas de envío
    fr: Règles d’envoi
  definition:
    en: 'Checks a workspace adds to Send Readiness in Settings › Sending rules, such as a UTM tag on every link or no URL shorteners. A broken rule warns or blocks, as the rule says, in the Workspace rules group.'
    vi: 'Các mục kiểm tra mà một không gian làm việc thêm vào Độ sẵn sàng gửi trong Cài đặt › Quy tắc gửi, chẳng hạn mọi liên kết phải có thẻ UTM hoặc không dùng dịch vụ rút gọn liên kết. Quy tắc bị vi phạm sẽ cảnh báo hoặc chặn, tùy theo quy tắc, trong nhóm Quy tắc của không gian làm việc.'
    de: >-
      Prüfungen, die ein Arbeitsbereich unter Einstellungen › Versandregeln zur Versandbereitschaft hinzufügt, etwa ein
      UTM-Tag an jedem Link oder keine URL-Kürzer. Eine verletzte Regel warnt oder blockiert, je nachdem, was die Regel
      vorgibt, in der Gruppe Regeln des Arbeitsbereichs.
    es: >-
      Comprobaciones que un espacio de trabajo añade a la revisión previa en Configuración › Reglas de envío, como una
      etiqueta UTM en cada enlace o ningún acortador de URL. Una regla incumplida avisa o bloquea, según diga la regla,
      en el grupo Reglas del espacio de trabajo.
    fr: >-
      Les contrôles qu’un espace de travail ajoute au contrôle avant envoi dans Paramètres › Règles d’envoi, comme une
      balise UTM sur chaque lien ou l’interdiction des raccourcisseurs d’URL. Une règle enfreinte donne un avertissement
      ou bloque, selon ce que prévoit la règle, dans le groupe Règles de l’espace de travail.
  link: /campaigns/sending-rules/
- id: sensitive-permission
  term:
    en: Sensitive permission
    vi: Quyền nhạy cảm
    de: Sensible Berechtigung
    es: Permiso delicado
    fr: Autorisation sensible
  definition:
    en: 'A permission flagged as sensitive, such as campaigns:send or subscribers:export. Holding one can require two-factor authentication.'
    vi: Quyền được đánh dấu là nhạy cảm, chẳng hạn campaigns:send hoặc subscribers:export. Người giữ quyền này có thể phải dùng xác thực hai lớp.
    de: >-
      Eine als sensibel gekennzeichnete Berechtigung, etwa campaigns:send oder subscribers:export. Wer eine davon hat,
      braucht unter Umständen die Zwei-Faktor-Authentifizierung.
    es: >-
      Un permiso marcado como delicado, como campaigns:send o subscribers:export. Tener uno puede exigir la verificación
      en dos pasos.
    fr: >-
      Une autorisation marquée comme sensible, comme campaigns:send ou subscribers:export. La détenir peut exiger
      l’authentification à deux facteurs.
  link: /reference/permissions/
- id: settled-click
  term:
    en: Settled click
    vi: Lượt nhấp đã xác định
    de: Bestätigter Klick
    es: Clic confirmado
    fr: Clic confirmé
  definition:
    en: "A click that waited a minute and was then judged a person's: no burst across the email's links and no hidden link followed around it. Only settled human clicks count in reports, segments, scores, engagement tiers and automations."
    vi: Lượt nhấp đã chờ một phút rồi được xác định là của người thật, vì quanh nó không có loạt nhấp dồn dập qua các liên kết của email và không có ai đi theo liên kết ẩn. Chỉ lượt nhấp của người đọc đã xác định mới được tính trong báo cáo, phân khúc, điểm, nhóm tương tác và tự động hóa.
    de: >-
      Ein Klick, der eine Minute gewartet hat und dann als Klick einer Person gewertet wurde: keine Häufung über die
      Links der E-Mail und kein versteckter Link, der in seinem Umfeld aufgerufen wurde. Nur bestätigte menschliche
      Klicks zählen in Berichten, Segmenten, Scores, Engagement-Stufen und Automationen.
    es: >-
      Un clic que esperó un minuto y después se consideró de una persona: sin ráfagas en los enlaces del correo y sin
      seguir ningún enlace oculto a su alrededor. Solo los clics humanos confirmados cuentan en los informes, los
      segmentos, las puntuaciones, los grupos de interacción y las automatizaciones.
    fr: >-
      Un clic qui a attendu une minute avant d’être attribué à une personne : aucune rafale sur les liens de l’e-mail et
      aucun lien masqué suivi autour de lui. Seuls les clics humains confirmés comptent dans les rapports, les segments,
      les scores, les niveaux d’engagement et les automatisations.
  link: /campaigns/reports/
- id: single-opt-in
  term:
    en: Single opt-in
    vi: Xác nhận một bước
    de: Single-Opt-in
    es: Suscripción simple
    fr: Opt-in simple
  definition:
    en: A signup that counts as soon as the form is submitted, without a confirmation email.
    vi: Lượt đăng ký được tính ngay khi biểu mẫu được gửi, không cần email xác nhận.
    de: Eine Anmeldung, die zählt, sobald das Formular abgeschickt ist, ohne Bestätigungs-E-Mail.
    es: Una suscripción que cuenta en cuanto se envía el formulario, sin correo de confirmación.
    fr: Une inscription qui compte dès l’envoi du formulaire, sans e-mail de confirmation.
  link: /audience/lists-and-consent/
- id: sso
  term:
    en: Single sign-on (SSO)
    vi: Đăng nhập một lần (SSO)
    de: Single Sign-on (SSO)
    es: Inicio de sesión único (SSO)
    fr: Authentification unique (SSO)
  definition:
    en: "Signing in through your organization's identity provider with OpenID Connect. ReputeCast can create accounts on first sign-in and map groups to workspaces and roles."
    vi: Đăng nhập qua nhà cung cấp danh tính (IdP) của tổ chức bạn bằng OpenID Connect. ReputeCast có thể tạo tài khoản ở lần đăng nhập đầu tiên và ánh xạ nhóm sang không gian làm việc và vai trò.
    de: >-
      Die Anmeldung über den Identitätsanbieter Ihrer Organisation mit OpenID Connect. ReputeCast kann bei der ersten
      Anmeldung Konten erstellen und Gruppen Arbeitsbereichen und Rollen zuordnen.
    es: >-
      Iniciar sesión a través del proveedor de identidad de tu organización con OpenID Connect. ReputeCast puede crear
      las cuentas en el primer inicio de sesión y asignar grupos a espacios de trabajo y roles.
    fr: >-
      La connexion via le fournisseur d’identité de votre organisation avec OpenID Connect. ReputeCast peut créer les
      comptes à la première connexion et faire correspondre des groupes à des espaces de travail et à des rôles.
  link: /self-hosting/sso/
- id: sms-segment
  term:
    en: SMS segment
    vi: Đoạn tin
    de: SMS-Teil
    es: Fragmento de SMS
    fr: Segment SMS
  definition:
    en: 'The unit texts are delivered and billed in: up to 160 GSM-7 characters, or 70 UCS-2 characters when the text has emoji or other characters outside GSM-7.'
    vi: 'Đơn vị dùng để gửi và tính phí tin nhắn: tối đa 160 ký tự GSM-7, hoặc 70 ký tự UCS-2 khi tin nhắn có emoji hay ký tự khác nằm ngoài GSM-7.'
    de: >-
      Die Einheit, in der SMS zugestellt und abgerechnet werden: bis zu 160 GSM-7-Zeichen oder 70 UCS-2-Zeichen, wenn
      die SMS Emoji oder andere Zeichen außerhalb von GSM-7 enthält.
    es: >-
      La unidad en la que se entregan y se facturan los SMS: hasta 160 caracteres GSM-7, o 70 caracteres UCS-2 cuando el
      texto tiene emoji u otros caracteres fuera de GSM-7.
    fr: >-
      L’unité dans laquelle les SMS sont délivrés et facturés : jusqu’à 160 caractères GSM-7, ou 70 caractères UCS-2
      lorsque le SMS contient des emoji ou d’autres caractères hors GSM-7.
  link: /channels/sms/
- id: smtp-relay
  term:
    en: SMTP relay
    vi: SMTP relay
    de: SMTP-Relay
    es: SMTP relay
    fr: SMTP relay
  definition:
    en: An SMTP server built into ReputeCast for apps that send transactional mail over SMTP instead of the HTTP API.
    vi: Máy chủ SMTP tích hợp sẵn trong ReputeCast cho các ứng dụng gửi thư giao dịch qua SMTP thay vì API HTTP.
    de: >-
      Ein in ReputeCast integrierter SMTP-Server für Apps, die Transaktions-E-Mails über SMTP statt über die HTTP-API
      senden.
    es: >-
      Un servidor SMTP integrado en ReputeCast para las aplicaciones que envían correo transaccional por SMTP en lugar
      de por la API HTTP.
    fr: >-
      Un serveur SMTP intégré à ReputeCast pour les applications qui envoient des e-mails transactionnels en SMTP plutôt
      que via l’API HTTP.
  link: /transactional/smtp-relay/
- id: soft-bounce
  term:
    en: Soft bounce
    vi: Trả thư tạm thời
    de: Soft Bounce
    es: Rebote temporal
    fr: Rebond temporaire
  definition:
    en: A temporary refusal, such as a full mailbox or a server that is down for a while.
    vi: Lần từ chối tạm thời, chẳng hạn hộp thư đầy hoặc máy chủ tạm ngừng hoạt động một thời gian.
    de: >-
      Eine vorübergehende Ablehnung, etwa bei einem vollen Postfach oder einem Server, der zeitweise nicht erreichbar
      ist.
    es: Un rechazo pasajero, como un buzón lleno o un servidor caído durante un tiempo.
    fr: Un refus temporaire, par exemple une boîte pleine ou un serveur indisponible pendant un moment.
  link: /deliverability/bounces-and-complaints/
- id: spam-trap
  term:
    en: Spam trap
    vi: Bẫy spam
    de: Spamfalle
    es: Trampa de spam
    fr: Piège à spam
  definition:
    en: An address that never signed up for anything, used by mailbox providers and blocklists to catch senders with poor list hygiene.
    vi: Địa chỉ chưa từng đăng ký nhận bất cứ thứ gì, được nhà cung cấp hộp thư và danh sách chặn dùng để phát hiện người gửi không giữ danh sách sạch.
    de: >-
      Eine Adresse, die sich nie für irgendetwas angemeldet hat und mit der Postfachanbieter und Blocklisten Absender
      mit schlechter Listenhygiene erkennen.
    es: >-
      Una dirección que nunca se suscribió a nada, que usan los proveedores de buzón y las listas de bloqueo para
      detectar a los remitentes con una mala higiene de listas.
    fr: >-
      Une adresse qui ne s’est jamais inscrite à quoi que ce soit, utilisée par les fournisseurs de messagerie et les
      listes de blocage pour repérer les expéditeurs dont l’hygiène de liste laisse à désirer.
  link: /deliverability/overview/
- id: spf
  term:
    en: SPF
    vi: SPF
    de: SPF
    es: SPF
    fr: SPF
  definition:
    en: 'Sender Policy Framework: a DNS record listing the servers allowed to send mail for your domain.'
    vi: 'Sender Policy Framework: bản ghi DNS liệt kê các máy chủ được phép gửi thư cho tên miền của bạn.'
    de: 'Sender Policy Framework: ein DNS-Eintrag, der die Server auflistet, die für Ihre Domain E-Mails senden dürfen.'
    es: >-
      Sender Policy Framework: un registro DNS que lista los servidores autorizados a enviar correo en nombre de tu
      dominio.
    fr: >-
      Sender Policy Framework : un enregistrement DNS qui liste les serveurs autorisés à envoyer des e-mails pour votre
      domaine.
  link: /deliverability/spf-dkim-dmarc/
- id: sponsor
  term:
    en: Sponsor
    vi: Nhà tài trợ
    de: Sponsor
    es: Patrocinador
    fr: Sponsor
  definition:
    en: A company that pays for a placement in one or more issues of your newsletter.
    vi: Công ty trả tiền cho một vị trí trong một hoặc nhiều số bản tin của bạn.
    de: Ein Unternehmen, das für eine Platzierung in einer oder mehreren Ausgaben Ihres Newsletters bezahlt.
    es: Una empresa que paga por un espacio en una o varias ediciones de tu boletín.
    fr: Une entreprise qui paie un emplacement dans un ou plusieurs numéros de votre newsletter.
  link: /earn/sponsors/
- id: sticky-split
  term:
    en: Sticky split
    vi: Phần chia cố định
    de: Fest zugeordnete Aufteilung
    es: Reparto estable
    fr: Répartition stable
  definition:
    en: "A weighted split in which each recipient keeps the same sending provider from send to send. Reordering the split moves nobody, and raising one provider's weight moves only about the difference to it."
    vi: Phần chia theo tỷ trọng trong đó mỗi người nhận giữ cùng một nhà cung cấp gửi thư qua các lần gửi. Sắp xếp lại phần chia không chuyển ai, và tăng tỷ trọng của một nhà cung cấp chỉ chuyển sang nó khoảng phần chênh lệch.
    de: >-
      Eine gewichtete Aufteilung, bei der jeder Empfänger von Versand zu Versand denselben Versandanbieter behält. Ein
      Umsortieren der Aufteilung verschiebt niemanden, und wird die Gewichtung eines Anbieters erhöht, wechselt nur etwa
      die Differenz zu ihm.
    es: >-
      Un reparto ponderado en el que cada destinatario mantiene el mismo proveedor de envío de un envío a otro.
      Reordenar el reparto no mueve a nadie, y subir el peso de un proveedor solo le pasa aproximadamente la diferencia.
    fr: >-
      Une répartition pondérée dans laquelle chaque destinataire garde le même fournisseur d’envoi d’un envoi à l’autre.
      Réordonner la répartition ne déplace personne, et augmenter la pondération d’un fournisseur ne lui transfère qu’à
      peu près la différence.
  link: /providers/routing/
- id: stream
  term:
    en: Stream
    vi: Luồng
    de: Stream
    es: Flujo
    fr: Flux
  definition:
    en: 'The kind of mail a message is: Broadcasts (campaigns), Automations (flows), System (confirmations, preference links, invitations, password resets) or Transactional (product mail). Each stream has its own route.'
    vi: 'Loại thư mà một thư thuộc về: Gửi hàng loạt (chiến dịch), Tự động hóa (quy trình tự động), Hệ thống (thư xác nhận, liên kết tùy chọn, lời mời, đặt lại mật khẩu) hoặc Giao dịch (thư sản phẩm). Mỗi luồng có tuyến riêng.'
    de: >-
      Die Art der E-Mail, zu der eine Nachricht gehört: Massenversand (Kampagnen), Automationen (Abläufe), System
      (Bestätigungen, Links zu den E-Mail-Einstellungen, Einladungen, Zurücksetzen von Passwörtern) oder Transaktional
      (E-Mails Ihres Produkts). Jeder Stream hat seine eigene Route.
    es: >-
      El tipo de correo que es un mensaje: Envíos masivos (campañas), Automatizaciones (recorridos), Sistema
      (confirmaciones, enlaces de preferencias, invitaciones, restablecimientos de contraseña) o Transaccional (correo
      del producto). Cada flujo tiene su propia ruta.
    fr: >-
      Le type d’e-mail auquel appartient un message : Diffusions (campagnes), Automatisations (scénarios), Système
      (confirmations, liens de préférences, invitations, réinitialisations de mot de passe) ou Transactionnel (e-mails
      du produit). Chaque flux a sa propre route.
  link: /getting-started/concepts/
- id: suppression-list
  term:
    en: Suppression list
    vi: Danh sách chặn gửi
    de: Sperrliste
    es: Lista de supresión
    fr: Liste de suppression
  definition:
    en: 'The addresses ReputeCast never sends to, shared by every sending provider: hard bounces, complaints, unsubscribes and addresses you add. Each entry applies to all mail or to marketing only.'
    vi: 'Các địa chỉ ReputeCast không bao giờ gửi tới, dùng chung cho mọi nhà cung cấp gửi thư: trả thư vĩnh viễn, khiếu nại, hủy đăng ký và địa chỉ bạn tự thêm. Mỗi mục áp dụng cho mọi thư hoặc chỉ cho thư tiếp thị.'
    de: >-
      Die Adressen, an die ReputeCast nie sendet, gemeinsam für alle Versandanbieter: Hard Bounces, Beschwerden,
      Abmeldungen und Adressen, die Sie hinzufügen. Jeder Eintrag gilt für alle E-Mails oder nur für Marketing.
    es: >-
      Las direcciones a las que ReputeCast nunca envía, compartidas por todos los proveedores de envío: rebotes
      permanentes, quejas, bajas y direcciones que añades tú. Cada entrada se aplica a todo el correo o solo al de
      marketing.
    fr: >-
      Les adresses auxquelles ReputeCast n’envoie jamais, partagées par tous les fournisseurs d’envoi : rebonds
      définitifs, plaintes, désabonnements et adresses que vous ajoutez. Chaque entrée s’applique à tous les e-mails ou
      au marketing uniquement.
  link: /audience/suppressions/
- id: suppression-sync
  term:
    en: Suppression sync
    vi: Đồng bộ danh sách chặn gửi
    de: Sperrlisten-Synchronisierung
    es: Sincronización de supresiones
    fr: Synchronisation de la liste de suppression
  definition:
    en: "Keeping the suppression list and each sending provider's own suppressions in step: two-way, pull only, or local only when the provider has no suppression API."
    vi: 'Giữ danh sách chặn gửi và danh sách chặn riêng của từng nhà cung cấp gửi thư khớp nhau: hai chiều, chỉ kéo về, hoặc chỉ cục bộ khi nhà cung cấp không có API danh sách chặn.'
    de: >-
      Das Abgleichen der Sperrliste mit den eigenen Sperrlisten jedes Versandanbieters: beidseitig, nur abrufen oder nur
      lokal, wenn der Anbieter keine API für Sperrlisten hat.
    es: >-
      Mantener al día la lista de supresión y las supresiones propias de cada proveedor de envío: bidireccional, solo
      recibir, o solo local cuando el proveedor no tiene API de supresiones.
    fr: >-
      La mise en cohérence de la liste de suppression et des exclusions propres à chaque fournisseur d’envoi :
      bidirectionnelle, import seul, ou locale uniquement lorsque le fournisseur n’a pas d’API de suppression.
  link: /providers/events-and-sync/
- id: synced-block
  term:
    en: Synced block
    vi: Khối đồng bộ
    de: Synchronisierter Block
    es: Bloque sincronizado
    fr: Bloc synchronisé
  definition:
    en: 'A section kept in the brand kit and reused across emails: the Header, the Footer, or any section saved as a named synced block. Edit it once and every draft and scheduled email holding it follows; sent emails keep what they went out with.'
    vi: 'Một phần được lưu trong bộ nhận diện thương hiệu và dùng lại trong nhiều email: Đầu trang, Chân trang hoặc bất kỳ phần nào được lưu thành khối đồng bộ có tên. Sửa một lần là mọi bản nháp và email đã lên lịch chứa khối đó đều thay đổi theo; email đã gửi giữ nguyên như lúc gửi.'
    de: >-
      Ein Abschnitt, der im Brand-Kit liegt und in mehreren E-Mails wiederverwendet wird: die Kopfzeile, die Fußzeile
      oder ein beliebiger Abschnitt, der als benannter synchronisierter Block gespeichert wurde. Bearbeiten Sie ihn
      einmal, und jeder Entwurf und jede geplante E-Mail mit diesem Block übernimmt die Änderung; gesendete E-Mails
      behalten den Stand, mit dem sie hinausgegangen sind.
    es: >-
      Una sección guardada en el kit de marca y reutilizada en varios correos: la Cabecera, el Pie o cualquier sección
      guardada como bloque sincronizado con nombre. Edítala una vez y todos los borradores y correos programados que la
      contienen la siguen; los correos enviados conservan lo que tenían al salir.
    fr: >-
      Une section conservée dans le kit de marque et réutilisée d’un e-mail à l’autre : l’en-tête, le pied de page, ou
      toute section enregistrée comme bloc synchronisé nommé. Modifiez-la une fois, et chaque brouillon et e-mail
      programmé qui la contient suit ; les e-mails envoyés gardent la version avec laquelle ils sont partis.
  link: /campaigns/brand-kit/
- id: tag
  term:
    en: Tag
    vi: Thẻ
    de: Tag
    es: Etiqueta
    fr: Tag
  definition:
    en: A label on a contact that you can filter, segment and trigger automations on.
    vi: Nhãn gắn trên một liên hệ, dùng để lọc, tạo phân khúc và kích hoạt tự động hóa.
    de: >-
      Eine Kennzeichnung an einem Kontakt, nach der Sie filtern und segmentieren und mit der Sie Automationen auslösen
      können.
    es: Una marca en un contacto por la que puedes filtrar, segmentar y disparar automatizaciones.
    fr: Une étiquette sur un contact, sur laquelle vous pouvez filtrer, segmenter et déclencher des automatisations.
  link: /audience/contacts/
- id: throttle
  term:
    en: Throttle
    vi: Giới hạn tốc độ
    de: Drosselung
    es: Limitación de velocidad
    fr: Limitation de débit
  definition:
    en: A limit on how fast mail goes to one mailbox provider, applied on every route.
    vi: Giới hạn tốc độ gửi thư đến một nhà cung cấp hộp thư, áp dụng trên mọi tuyến.
    de: Ein Limit dafür, wie schnell E-Mails an einen Postfachanbieter gehen, angewendet auf jeder Route.
    es: Un límite de la velocidad a la que sale el correo hacia un proveedor de buzón, aplicado en todas las rutas.
    fr: Une limite de vitesse d’envoi des e-mails vers un fournisseur de messagerie, appliquée sur chaque route.
  link: /providers/workspace-defaults/
- id: tier
  term:
    en: Tier
    vi: Gói
    de: Tarif
    es: Nivel
    fr: Formule
  definition:
    en: 'What a paid subscriber pays for: a set of prices, lists and access.'
    vi: 'Những gì người đăng ký trả phí được hưởng: một tập giá, danh sách và quyền truy cập.'
    de: 'Wofür ein zahlender Abonnent bezahlt: eine Reihe von Preisen, Listen und Zugang.'
    es: 'Lo que paga un suscriptor de pago: un conjunto de precios, listas y acceso.'
    fr: 'Ce que paie un abonné payant : un ensemble de prix, de listes et d’accès.'
  link: /earn/paid-subscriptions/
- id: traffic-rules
  term:
    en: Traffic rules
    vi: Quy tắc lưu lượng
    de: Traffic-Regeln
    es: Reglas de tráfico
    fr: Règles de trafic
  definition:
    en: "A workspace's rules for guarded sending, under Sending providers › Traffic rules: thresholds by bounce type, reply rules, when a send starts with a canary, and the complaint watch after a send."
    vi: Các quy tắc gửi có bảo vệ của một không gian làm việc, trong Nhà cung cấp gửi thư › Quy tắc lưu lượng gồm ngưỡng theo loại thư trả lại, quy tắc phản hồi, khi nào một lần gửi bắt đầu bằng gửi thử, và việc theo dõi khiếu nại sau khi gửi.
    de: >-
      Die Regeln eines Arbeitsbereichs für den abgesicherten Versand, unter Versandanbieter › Traffic-Regeln:
      Schwellenwerte nach Bounce-Typ, Antwortregeln, wann ein Versand mit einem Canary beginnt, und die
      Beschwerdeüberwachung nach einem Versand.
    es: >-
      Las reglas de envío protegido de un espacio de trabajo, en Proveedores de envío › Reglas de tráfico: umbrales por
      tipo de rebote, reglas de respuesta, cuándo empieza un envío con un envío canario y la vigilancia de quejas
      después de un envío.
    fr: >-
      Les règles d’envoi protégé d’un espace de travail, dans Fournisseurs d’envoi › Règles de trafic : seuils par type
      de rebond, règles de réponse, conditions dans lesquelles un envoi commence par un canari, et surveillance des
      plaintes après un envoi.
  link: /providers/traffic-rules/
- id: transactional-email
  term:
    en: Transactional email
    vi: Email giao dịch
    de: Transaktions-E-Mail
    es: Correo transaccional
    fr: E-mail transactionnel
  definition:
    en: Mail your product sends to one person because of something they did, such as a receipt or a password reset. It goes on the Transactional stream with its own route.
    vi: Thư sản phẩm của bạn gửi cho một người vì việc họ đã làm, chẳng hạn biên lai hoặc thư đặt lại mật khẩu. Thư này đi trên luồng Giao dịch với tuyến riêng.
    de: >-
      Eine E-Mail, die Ihr Produkt an eine einzelne Person sendet, weil sie etwas getan hat, etwa ein Beleg oder das
      Zurücksetzen eines Passworts. Sie läuft über den Stream Transaktional mit eigener Route.
    es: >-
      El correo que tu producto envía a una persona por algo que ha hecho, como un recibo o un restablecimiento de
      contraseña. Va por el flujo Transaccional con su propia ruta.
    fr: >-
      Un e-mail que votre produit envoie à une personne en raison d’une action qu’elle a effectuée, comme un reçu ou une
      réinitialisation de mot de passe. Il passe par le flux Transactionnel, avec sa propre route.
  link: /transactional/overview/
- id: transactional-template
  term:
    en: Transactional template
    vi: Mẫu giao dịch
    de: Transaktionsvorlage
    es: Plantilla transaccional
    fr: Modèle transactionnel
  definition:
    en: A versioned email your product sends through the API, with declared variables. Publishing makes a draft the live version, and you can roll back to an earlier one.
    vi: Email có phiên bản mà sản phẩm của bạn gửi qua API, với các biến đã khai báo. Xuất bản sẽ biến bản nháp thành phiên bản đang chạy, và bạn có thể quay lại một phiên bản trước đó.
    de: >-
      Eine versionierte E-Mail mit deklarierten Variablen, die Ihr Produkt über die API sendet. Beim Veröffentlichen
      wird ein Entwurf zur Live-Version, und Sie können zu einer früheren Version zurückkehren.
    es: >-
      Un correo con versiones que tu producto envía a través de la API, con variables declaradas. Publicar convierte un
      borrador en la versión publicada, y puedes volver a una anterior.
    fr: >-
      Un e-mail versionné que votre produit envoie via l’API, avec des variables déclarées. La publication fait d’un
      brouillon la version en ligne, et vous pouvez revenir à une version antérieure.
  link: /transactional/templates/
- id: trigger
  term:
    en: Trigger
    vi: Trình kích hoạt
    de: Auslöser
    es: Disparador
    fr: Déclencheur
  definition:
    en: The event that starts an automation for a contact, such as joining a list or an event sent through the API.
    vi: Sự kiện bắt đầu một tự động hóa cho một liên hệ, chẳng hạn tham gia một danh sách hoặc một sự kiện gửi qua API.
    de: >-
      Das Ereignis, das eine Automation für einen Kontakt startet, etwa die Aufnahme in eine Liste oder ein über die API
      gesendetes Ereignis.
    es: >-
      El evento que inicia una automatización para un contacto, como unirse a una lista o un evento enviado a través de
      la API.
    fr: >-
      L’événement qui démarre une automatisation pour un contact, comme l’arrivée dans une liste ou un événement envoyé
      via l’API.
  link: /automations/triggers-and-steps/
- id: two-factor-authentication
  term:
    en: Two-factor authentication
    vi: Xác thực hai lớp (2FA)
    de: Zwei-Faktor-Authentifizierung
    es: Verificación en dos pasos
    fr: Authentification à deux facteurs
  definition:
    en: 'A second sign-in step after the password: a passkey or a code from an authenticator app.'
    vi: 'Bước đăng nhập thứ hai sau mật khẩu: khóa truy cập hoặc mã từ ứng dụng xác thực.'
    de: 'Ein zweiter Anmeldeschritt nach dem Passwort: ein Passkey oder ein Code aus einer Authenticator-App.'
    es: >-
      Un segundo paso al iniciar sesión, después de la contraseña: una llave de acceso o un código de una aplicación de
      autenticación.
    fr: >-
      Une seconde étape de connexion après le mot de passe : une clé d’accès ou un code d’une application
      d’authentification.
  link: /team/account-security/
- id: unengaged-contact
  term:
    en: Unengaged contact
    vi: Liên hệ không tương tác
    de: Kontakt ohne Interaktion
    es: Contacto sin interacción
    fr: Contact non engagé
  definition:
    en: 'A contact in the Sunset engagement tier: no human open or click for as many days as the sunset policy says. Campaigns leave unengaged contacts out by default; Review & send can include them for one send.'
    vi: 'Liên hệ thuộc nhóm tương tác Ngừng gửi dần: không có lượt mở hay nhấp của người đọc trong số ngày mà chính sách ngừng gửi dần quy định. Theo mặc định, chiến dịch loại liên hệ không tương tác ra; trang Kiểm tra và gửi có thể đưa họ vào cho một lần gửi.'
    de: >-
      Ein Kontakt in der Engagement-Stufe Auslaufend: keine menschliche Öffnung und kein Klick seit so vielen Tagen, wie
      die Auslaufregel vorgibt. Kampagnen lassen Kontakte ohne Interaktion standardmäßig aus; unter Prüfen & senden
      lassen sie sich für einen einzelnen Versand einbeziehen.
    es: >-
      Un contacto del grupo de interacción En retirada: sin aperturas ni clics humanos durante los días que indica la
      política de retirada. Las campañas excluyen por defecto a los contactos sin interacción; Revisar y enviar puede
      incluirlos en un envío concreto.
    fr: >-
      Un contact du niveau d’engagement Arrêt progressif : aucune ouverture ni aucun clic humain pendant le nombre de
      jours fixé par la politique d’arrêt progressif. Les campagnes excluent par défaut les contacts non engagés ;
      Vérifier et envoyer peut les inclure pour un envoi.
  link: /audience/list-health/
- id: verdict
  term:
    en: Verdict
    vi: Kết luận
    de: Ergebnis
    es: Veredicto
    fr: Verdict
  definition:
    en: 'The overall result of Send Readiness: Ready, Ready with warnings or Blocked.'
    vi: 'Kết quả chung của Độ sẵn sàng gửi: “Sẵn sàng”, “Sẵn sàng, có cảnh báo” hoặc “Bị chặn”.'
    de: 'Das Gesamtergebnis der Versandbereitschaft: Bereit, Bereit mit Warnungen oder Blockiert.'
    es: 'El resultado global de la revisión previa: Preparada, “Preparada, con avisos” o Bloqueada.'
    fr: 'Le résultat global du contrôle avant envoi : « Prête », « Prête, avec avertissements » ou « Bloquée ».'
  link: /campaigns/send-readiness/
- id: visibility
  term:
    en: Visibility
    vi: Hiển thị
    de: Sichtbarkeit
    es: Visibilidad
    fr: Visibilité
  definition:
    en: A block setting that shows the block to everyone, only to contacts who match conditions, or to everyone except them.
    vi: Cài đặt của khối để hiện khối đó cho mọi người, chỉ cho liên hệ khớp điều kiện, hoặc cho mọi người trừ những liên hệ đó.
    de: >-
      Eine Einstellung eines Blocks, die ihn allen zeigt, nur Kontakten, die Bedingungen erfüllen, oder allen außer
      diesen.
    es: >-
      Una opción de bloque que muestra el bloque a todos, solo a los contactos que cumplen unas condiciones o a todos
      excepto a ellos.
    fr: >-
      Un réglage de bloc qui affiche le bloc à tout le monde, uniquement aux contacts qui remplissent des conditions, ou
      à tout le monde sauf eux.
  link: /campaigns/conditional-content/
- id: warm-up
  term:
    en: Warm-up
    vi: Khởi động
    de: Warm-up
    es: Calentamiento
    fr: Chauffe
  definition:
    en: Raising the daily volume of a new sending provider or IP step by step, sending to the most engaged contacts first, so mailbox providers learn to trust it.
    vi: Tăng dần lượng gửi mỗi ngày của một nhà cung cấp gửi thư hoặc IP mới, gửi cho những liên hệ tương tác nhiều nhất trước, để các nhà cung cấp hộp thư dần tin tưởng.
    de: >-
      Das schrittweise Steigern des täglichen Volumens eines neuen Versandanbieters oder einer neuen IP, wobei zuerst an
      die aktivsten Kontakte gesendet wird, damit Postfachanbieter Vertrauen fassen.
    es: >-
      Aumentar paso a paso el volumen diario de un proveedor de envío o de una IP nuevos, enviando primero a los
      contactos con más interacción, para que los proveedores de buzón aprendan a confiar en ellos.
    fr: >-
      L’augmentation progressive du volume quotidien d’un nouveau fournisseur d’envoi ou d’une nouvelle IP, en envoyant
      d’abord aux contacts les plus engagés, pour que les fournisseurs de messagerie apprennent à lui faire confiance.
  link: /providers/warm-up/
- id: webhook
  term:
    en: Webhook
    vi: Webhook
    de: Webhook
    es: Webhook
    fr: Webhook
  definition:
    en: An HTTPS request one system sends to another when something happens. Sending providers send ReputeCast delivery events this way, and ReputeCast sends your endpoints signed events.
    vi: Yêu cầu HTTPS mà một dịch vụ gửi đến dịch vụ khác khi có sự việc xảy ra. Nhà cung cấp gửi thư gửi sự kiện giao nhận cho ReputeCast theo cách này, và ReputeCast gửi sự kiện có chữ ký đến các endpoint của bạn.
    de: >-
      Eine HTTPS-Anfrage, die ein System an ein anderes sendet, wenn etwas passiert. Versandanbieter senden ReputeCast
      auf diesem Weg Zustellereignisse, und ReputeCast sendet signierte Ereignisse an Ihre Endpunkte.
    es: >-
      Una solicitud HTTPS que un sistema envía a otro cuando ocurre algo. Los proveedores de envío envían así a
      ReputeCast los eventos de entrega, y ReputeCast envía eventos firmados a tus endpoints.
    fr: >-
      Une requête HTTPS qu’un système envoie à un autre lorsqu’un événement se produit. Les fournisseurs d’envoi
      transmettent ainsi les événements de livraison à ReputeCast, et ReputeCast envoie des événements signés à vos
      endpoints.
  link: /developers/webhooks/
- id: weighted-split
  term:
    en: Weighted split
    vi: Chia theo tỷ trọng
    de: Gewichtete Aufteilung
    es: Reparto ponderado
    fr: Répartition pondérée
  definition:
    en: "Sharing a route's mail across sending providers by percentage, such as 90/10, for migrations and warm-up. ReputeCast's splits are sticky: each recipient keeps the same provider from send to send."
    vi: 'Chia thư của một tuyến cho các nhà cung cấp gửi thư theo tỷ lệ phần trăm, chẳng hạn 90/10, khi chuyển nhà cung cấp và khi khởi động. Các phần chia của ReputeCast là cố định: mỗi người nhận giữ cùng một nhà cung cấp qua các lần gửi.'
    de: >-
      Das Aufteilen der E-Mails einer Route auf mehrere Versandanbieter nach Prozentsätzen, etwa 90/10, für Migrationen
      und Warm-up. Die Aufteilungen von ReputeCast sind fest zugeordnet: Jeder Empfänger behält von Versand zu Versand
      denselben Anbieter.
    es: >-
      Repartir el correo de una ruta entre proveedores de envío por porcentaje, como 90/10, para migraciones y
      calentamientos. Los repartos de ReputeCast son estables: cada destinatario mantiene el mismo proveedor de un envío
      a otro.
    fr: >-
      La répartition des e-mails d’une route entre plusieurs fournisseurs d’envoi par pourcentage, par exemple 90/10,
      pour les migrations et la chauffe. Les répartitions de ReputeCast sont stables : chaque destinataire garde le même
      fournisseur d’un envoi à l’autre.
  link: /providers/routing/
- id: workspace
  term:
    en: Workspace
    vi: Không gian làm việc
    de: Arbeitsbereich
    es: Espacio de trabajo
    fr: Espace de travail
  definition:
    en: A separate space with its own lists, campaigns, automations, sending providers and team. An instance can have any number of workspaces.
    vi: Không gian riêng với danh sách, chiến dịch, tự động hóa, nhà cung cấp gửi thư và nhóm của riêng nó. Một hệ thống có thể có bao nhiêu không gian làm việc tùy ý.
    de: >-
      Ein abgetrennter Bereich mit eigenen Listen, Kampagnen, Automationen, Versandanbietern und eigenem Team. Eine
      Instanz kann beliebig viele Arbeitsbereiche haben.
    es: >-
      Un espacio independiente con sus propias listas, campañas, automatizaciones, proveedores de envío y equipo. Una
      instancia puede tener cualquier número de espacios de trabajo.
    fr: >-
      Un espace distinct avec ses propres listes, campagnes, automatisations, fournisseurs d’envoi et équipe. Une
      instance peut compter autant d’espaces de travail que nécessaire.
  link: /team/workspaces/
- id: write-mode
  term:
    en: Write mode
    vi: Chế độ Viết
    de: Schreibmodus
    es: Modo Escribir
    fr: Mode Rédaction
  definition:
    en: 'The composer''s document view: you type the email''s words like a document, with "/" to insert blocks and markdown shortcuts, over the same blocks Design mode edits.'
    vi: 'Chế độ xem dạng văn bản của trình soạn thảo: bạn gõ chữ của email như soạn một tài liệu, dùng "/" để chèn khối và các phím tắt markdown, trên đúng những khối mà chế độ Thiết kế chỉnh sửa.'
    de: >-
      Die Dokumentansicht des Editors: Sie schreiben den Text der E-Mail wie in einem Dokument, mit „/“ zum Einfügen von
      Blöcken und mit Markdown-Kürzeln, auf denselben Blöcken, die der Designmodus bearbeitet.
    es: >-
      La vista de documento del editor: escribes el texto del correo como en un documento, con “/” para insertar bloques
      y atajos de markdown, sobre los mismos bloques que edita el modo Diseño.
    fr: >-
      La vue document de l’éditeur : vous tapez le texte de l’e-mail comme dans un document, avec « / » pour insérer des
      blocs et des raccourcis markdown, sur les mêmes blocs que modifie le mode Design.
  link: /campaigns/composer/
