- id: draft_weekly_digest
  type: prompt
  area:
    en: Campaigns
    vi: Chiến dịch
    de: Kampagnen
    es: Campañas
    fr: Campagnes
  description:
    en: Draft the next Weekly Digest from what performed well recently. The agent reads the last issues' reports, writes MJML and creates a draft; it never schedules it.
    vi: Soạn bản nháp số Weekly Digest tiếp theo dựa trên những nội dung hiệu quả gần đây. Tác tử đọc báo cáo của các số gần nhất, viết MJML và tạo bản nháp; tác tử không bao giờ lên lịch gửi.
    de: >-
      Den nächsten Weekly Digest aus dem entwerfen, was zuletzt gut funktioniert hat. Der Agent liest die Berichte der
      letzten Ausgaben, schreibt MJML und erstellt einen Entwurf; er plant ihn nie.
    es: >-
      Redactar el próximo Weekly Digest a partir de lo que ha funcionado bien últimamente. El agente lee los informes de
      las últimas ediciones, escribe el MJML y crea un borrador; nunca lo programa.
    fr: >-
      Rédiger le prochain Weekly Digest à partir de ce qui a bien fonctionné récemment. L’agent lit les rapports des
      derniers numéros, écrit le MJML et crée un brouillon ; il ne le programme jamais.
  params:
    - name: topics
      description:
        en: Topics or links to include, comma-separated. Optional.
        vi: Các chủ đề hoặc liên kết cần đưa vào, phân tách bằng dấu phẩy. Không bắt buộc.
        de: Themen oder Links, die aufgenommen werden sollen, kommagetrennt. Optional.
        es: Temas o enlaces que incluir, separados por comas. Opcional.
        fr: Sujets ou liens à inclure, séparés par des virgules. Facultatif.
- id: explain_auto_pause
  type: prompt
  area:
    en: Campaigns
    vi: Chiến dịch
    de: Kampagnen
    es: Campañas
    fr: Campagnes
  description:
    en: 'Explain why a send paused automatically and what the options are: the threshold that tripped, the recipients held, and resume, adjust the audience, move to another provider or cancel.'
    vi: 'Giải thích vì sao một lượt gửi tự động tạm dừng và có những lựa chọn nào: ngưỡng đã bị vượt, số người nhận bị tạm giữ, và tiếp tục, điều chỉnh người nhận, chuyển sang nhà cung cấp khác hoặc hủy.'
    de: >-
      Erklären, warum ein Versand automatisch pausiert wurde und welche Möglichkeiten es gibt: der ausgelöste
      Schwellenwert, die zurückgehaltenen Empfänger sowie Fortsetzen, Zielgruppe anpassen, zu einem anderen Anbieter
      verschieben oder Abbrechen.
    es: >-
      Explicar por qué un envío se pausó automáticamente y qué opciones hay: el umbral que se superó, los destinatarios
      retenidos, y reanudar, ajustar la audiencia, pasar a otro proveedor o cancelar.
    fr: >-
      Expliquer pourquoi un envoi s’est mis en pause automatiquement et quelles sont les options : le seuil qui s’est
      déclenché, les destinataires retenus, et reprendre, ajuster l’audience, transférer vers un autre fournisseur ou
      annuler.
  params:
    - name: campaign
      description:
        en: The paused campaign's name or ID.
        vi: Tên hoặc ID của chiến dịch đã tạm dừng.
        de: Der Name oder die ID der pausierten Kampagne.
        es: El nombre o el ID de la campaña en pausa.
        fr: Le nom ou l’ID de la campagne en pause.
