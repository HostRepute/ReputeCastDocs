    vi: Đề xuất gửi một bản nháp tin nhắn, thông báo đẩy hoặc WhatsApp, ngay bây giờ hoặc vào một thời điểm. Một thành viên trong nhóm xác nhận trong ReputeCast. Chiến dịch email dùng schedule_campaign.
