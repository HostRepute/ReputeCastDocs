- id: create_segment
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
    de: Zielgruppe
    es: Audiencia
    fr: Audience
  permission: segments:edit
  effect: write
  description:
    en: Create a segment from condition-builder JSON.
    vi: Tạo phân khúc từ JSON của trình tạo điều kiện.
    de: Ein Segment aus JSON des Bedingungseditors erstellen.
    es: Crear un segmento a partir del JSON del generador de condiciones.
    fr: Créer un segment à partir du JSON de l’éditeur de conditions.
  params:
    - name: name
      description:
        en: The segment's name.
        vi: Tên phân khúc.
        de: Der Name des Segments.
        es: El nombre del segmento.
        fr: Le nom du segment.
    - name: description
      description:
        en: The segment's description. Optional.
        vi: Mô tả phân khúc. Không bắt buộc.
        de: Die Beschreibung des Segments. Optional.
        es: La descripción del segmento. Opcional.
        fr: La description du segment. Facultatif.
    - name: definition
      description:
        en: 'Condition-builder JSON: {"groups":[{"match":"all","conditions":[{"field":…,"op":…,"value":…}]}]}. Checked before the segment is stored.'
        vi: 'JSON của trình tạo điều kiện: {"groups":[{"match":"all","conditions":[{"field":…,"op":…,"value":…}]}]}. Được kiểm tra trước khi lưu phân khúc.'
        de: >-
          JSON des Bedingungseditors: {"groups":[{"match":"all","conditions":[{"field":…,"op":…,"value":…}]}]}. Wird
          geprüft, bevor das Segment gespeichert wird.
        es: >-
          JSON del generador de condiciones: {"groups":[{"match":"all","conditions":[{"field":…,"op":…,"value":…}]}]}.
          Se comprueba antes de guardar el segmento.
        fr: >-
          JSON de l’éditeur de conditions : {"groups":[{"match":"all","conditions":[{"field":…,"op":…,"value":…}]}]}.
          Vérifié avant l’enregistrement du segment.
- id: add_to_suppression
  type: tool
