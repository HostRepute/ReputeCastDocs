# MCP server catalogue (internal/mcpserver): tools in the Tools catalogue order within each area, then the
# resources (id = URI) and prompts. effect: read = reads only; write = changes something; proposal = asks a person to
# confirm in ReputeCast. A tool's permission is the one its registration checks. Guarded by pnpm upstream:check.
- id: list_campaigns
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: List campaigns with status, audience and headline results.
    vi: Liệt kê chiến dịch kèm trạng thái, người nhận và kết quả chính.
  params:
    - name: status
      description:
        en: 'Which campaigns: all, drafts, scheduled, sending or sent (default all). Optional.'
        vi: 'Chiến dịch nào: all, drafts, scheduled, sending hoặc sent (mặc định all). Không bắt buộc.'
    - name: query
      description:
        en: Search by name. Optional.
        vi: Tìm theo tên. Không bắt buộc.
    - name: limit
      description:
        en: At most this many campaigns (default 25, max 100). Optional.
        vi: Số chiến dịch tối đa (mặc định 25, tối đa 100). Không bắt buộc.
- id: get_campaign_report
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: reports:view
  effect: read
  description:
    en: Results of a campaign by sending provider and mailbox provider.
    vi: Kết quả của một chiến dịch theo nhà cung cấp gửi thư và nhà cung cấp hộp thư.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
        vi: Tên chính xác hoặc ID của chiến dịch.
- id: get_send_readiness
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: The latest Send Readiness verdict and checks of a campaign.
    vi: Kết luận và các mục kiểm tra Độ sẵn sàng gửi gần nhất của một chiến dịch.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
        vi: Tên chính xác hoặc ID của chiến dịch.
- id: create_campaign_draft
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:edit
  effect: write
  description:
    en: Create a draft campaign from MJML.
    vi: Tạo bản nháp chiến dịch từ MJML.
  params:
    - name: name
      description:
        en: The campaign's name.
        vi: Tên chiến dịch.
    - name: subject
      description:
        en: The subject line. Optional.
        vi: Tiêu đề. Không bắt buộc.
    - name: preheader
      description:
        en: The preheader text. Optional.
        vi: Dòng xem trước. Không bắt buộc.
    - name: mjml
      description:
        en: MJML 4 source. Optional.
        vi: Mã nguồn MJML 4. Không bắt buộc.
- id: update_campaign_content
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:edit
  effect: write
  description:
    en: Change the subject, preheader or MJML of a draft, or of one of its language versions.
    vi: Đổi tiêu đề, dòng xem trước hoặc MJML của một bản nháp, hoặc của một trong các phiên bản ngôn ngữ của nó.
  params:
    - name: campaign
      description:
        en: The draft's name or ID.
        vi: Tên hoặc ID của bản nháp.
    - name: subject
      description:
        en: A new subject line. Optional.
        vi: Tiêu đề mới. Không bắt buộc.
    - name: preheader
      description:
        en: A new preheader. Optional.
        vi: Dòng xem trước mới. Không bắt buộc.
    - name: mjml
      description:
        en: New MJML 4 source. Optional.
        vi: Mã nguồn MJML 4 mới. Không bắt buộc.
    - name: language
      description:
        en: Change this language version (its code, such as de) instead of the source; get_campaign_languages lists them. Optional.
        vi: Đổi phiên bản ngôn ngữ này (theo mã ngôn ngữ, ví dụ de) thay vì bản gốc; get_campaign_languages liệt kê các phiên bản. Không bắt buộc.
- id: schedule_campaign
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:send
  effect: proposal
  description:
    en: Propose a send time. A team member confirms it in ReputeCast.
    vi: Đề xuất thời điểm gửi. Một thành viên trong nhóm xác nhận trong ReputeCast.
  params:
    - name: campaign
      description:
        en: The campaign's name or ID.
        vi: Tên hoặc ID của chiến dịch.
    - name: at
      description:
        en: The send time in RFC 3339, such as 2026-11-04T09:00:00-05:00.
        vi: Thời điểm gửi theo RFC 3339, ví dụ 2026-11-04T09:00:00-05:00.
- id: pause_campaign
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:pause
  effect: write
  description:
    en: Pause a running send.
    vi: Tạm dừng một lượt gửi đang chạy.
  params:
    - name: campaign
      description:
        en: The campaign's name or ID.
        vi: Tên hoặc ID của chiến dịch.
    - name: reason
      description:
        en: Why, recorded in the audit log. Optional.
        vi: Lý do, được ghi vào nhật ký kiểm tra. Không bắt buộc.
- id: resume_campaign
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:send
  effect: write
  description:
    en: Resume a paused send.
    vi: Tiếp tục một lượt gửi đã tạm dừng.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
        vi: Tên chính xác hoặc ID của chiến dịch.
- id: get_campaign_live_stats
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: Live counters and routes of a running send.
    vi: Bộ đếm trực tiếp và các tuyến của một lượt gửi đang chạy.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
        vi: Tên chính xác hoặc ID của chiến dịch.
- id: send_test_email
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:edit
  effect: write
  description:
    en: Send a test of a campaign to a member of the workspace.
    vi: Gửi thử một chiến dịch đến một thành viên của không gian làm việc.
  params:
    - name: campaign
      description:
        en: The campaign's name or ID.
        vi: Tên hoặc ID của chiến dịch.
    - name: to
      description:
        en: The email address of a member of this workspace.
        vi: Địa chỉ email của một thành viên trong không gian làm việc này.
- id: get_campaign_languages
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: "A campaign's language versions: each one's status (up to date, outdated, draft, missing) and who gets it."
    vi: 'Các phiên bản ngôn ngữ của một chiến dịch: trạng thái của từng phiên bản (đã cập nhật, lỗi thời, bản nháp, thiếu) và ai nhận phiên bản đó.'
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
        vi: Tên chính xác hoặc ID của chiến dịch.
- id: get_accessibility_issues
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: 'Accessibility issues of a campaign in every language: what is serious, where it is and how to fix it.'
    vi: 'Các lỗi khả năng tiếp cận của một chiến dịch ở mọi ngôn ngữ: lỗi nào nghiêm trọng, nằm ở đâu và cách sửa.'
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
        vi: Tên chính xác hoặc ID của chiến dịch.
- id: search_contacts
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
  permission: subscribers:view
  effect: read
  description:
    en: Find contacts by email or name.
    vi: Tìm liên hệ theo email hoặc tên.
  params:
    - name: query
      description:
        en: Part of an email address or name.
        vi: Một phần của địa chỉ email hoặc tên.
    - name: limit
      description:
        en: At most this many contacts (default 20, max 100). Optional.
        vi: Số liên hệ tối đa (mặc định 20, tối đa 100). Không bắt buộc.
- id: create_segment
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
  permission: segments:edit
  effect: write
  description:
    en: Create a segment from condition-builder JSON.
    vi: Tạo phân khúc từ JSON của trình tạo điều kiện.
  params:
    - name: name
      description:
        en: The segment's name.
        vi: Tên phân khúc.
    - name: description
      description:
        en: The segment's description. Optional.
        vi: Mô tả phân khúc. Không bắt buộc.
    - name: definition
      description:
        en: 'Condition-builder JSON: {"match":"all","conditions":[…]}.'
        vi: 'JSON của trình tạo điều kiện: {"match":"all","conditions":[…]}.'
- id: add_to_suppression
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
  permission: subscribers:edit
  effect: write
  description:
    en: Suppress an address so nothing is sent to it again.
    vi: Chặn gửi một địa chỉ để không gửi gì đến địa chỉ đó nữa.
  params:
    - name: email
      description:
        en: The email address to suppress.
        vi: Địa chỉ email cần chặn gửi.
    - name: reason
      description:
        en: Why, kept with the suppression. Optional.
        vi: Lý do, được lưu cùng mục chặn gửi. Không bắt buộc.
- id: get_growth_sources
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
  permission: subscribers:view
  effect: read
  description:
    en: Joins, departures, quality and cohort retention per growth source over a period (totals only, no addresses).
    vi: Lượt tham gia, lượt rời đi, chất lượng và giữ chân theo nhóm của từng nguồn tăng trưởng trong một khoảng thời gian (chỉ số tổng, không có địa chỉ).
  params:
    - name: period
      description:
        en: 'The period: 30d (default), 90d or 12m. Optional.'
        vi: 'Khoảng thời gian: 30d (mặc định), 90d hoặc 12m. Không bắt buộc.'
    - name: list
      description:
        en: A list name or ID, to count its members instead of contacts. Optional.
        vi: Tên hoặc ID của một danh sách, để chỉ đếm những người trong danh sách đó thay vì mọi liên hệ. Không bắt buộc.
- id: get_provider_health
  type: tool
  area:
    en: Sending and deliverability
    vi: Gửi thư và khả năng vào hộp thư
  permission: providers:view
  effect: read
  description:
    en: Status, bounce and complaint rates and quota of each sending provider.
    vi: Trạng thái, tỷ lệ trả thư, tỷ lệ khiếu nại và hạn mức của từng nhà cung cấp gửi thư.
- id: get_routing
  type: tool
  area:
    en: Sending and deliverability
    vi: Gửi thư và khả năng vào hộp thư
  permission: providers:view
  effect: read
  description:
    en: Routing rules per stream with weights and fallbacks.
    vi: Quy tắc định tuyến theo từng luồng, kèm tỷ trọng và dự phòng.
- id: update_routing
  type: tool
  area:
    en: Sending and deliverability
    vi: Gửi thư và khả năng vào hộp thư
  permission: providers:manage
  effect: write
  description:
    en: Change the weights of a stream's default route.
    vi: Đổi tỷ trọng của tuyến mặc định của một luồng.
  params:
    - name: stream
      description:
        en: 'The stream: broadcast, automation or system.'
        vi: 'Luồng: broadcast, automation hoặc system.'
    - name: weights
      description:
        en: Sending provider name → percent; the weights add up to 100.
        vi: Tên nhà cung cấp gửi thư → phần trăm; tổng tỷ trọng bằng 100.
- id: get_deliverability
  type: tool
  area:
    en: Sending and deliverability
    vi: Gửi thư và khả năng vào hộp thư
  permission: deliverability:view
  effect: read
  description:
    en: Domain authentication, blocklists and Postmaster reputation.
    vi: Xác thực tên miền, danh sách chặn và uy tín Postmaster.
- id: list_placement_tests
  type: tool
  area:
    en: Sending and deliverability
    vi: Gửi thư và khả năng vào hộp thư
  permission: deliverability:view
  effect: read
  description:
    en: 'Placement tests people ran: the email, the providers and where the copies landed.'
    vi: 'Các lượt kiểm tra vị trí thư mọi người đã chạy: email, các nhà cung cấp và nơi các bản sao rơi vào.'
- id: get_placement_test
  type: tool
  area:
    en: Sending and deliverability
    vi: Gửi thư và khả năng vào hộp thư
  permission: deliverability:view
  effect: read
  description:
    en: "One placement test: each copy's folder, time to arrive and SPF, DKIM and DMARC, with the guidance."
    vi: 'Một lượt kiểm tra vị trí thư: thư mục của từng bản sao, thời gian đến và kết quả SPF, DKIM, DMARC, kèm hướng dẫn.'
  params:
    - name: test
      description:
        en: "The test's ID or its name (such as Weekly Digest #142 · SES vs Postal)."
        vi: 'ID hoặc tên của lượt kiểm tra (ví dụ Weekly Digest #142 · SES vs Postal).'
- id: list_automations
  type: tool
  area:
    en: Automations, digests and polls
    vi: Tự động hóa, bản tin định kỳ và bình chọn
  permission: automations:view
  effect: read
  description:
    en: Automations with their status.
    vi: Các tự động hóa kèm trạng thái.
- id: list_digests
  type: tool
  area:
    en: Automations, digests and polls
    vi: Tự động hóa, bản tin định kỳ và bình chọn
  permission: campaigns:view
  effect: read
  description:
    en: Recurring digests with their status, schedule, next issue and owner. Agents can't turn a digest on.
    vi: Các bản tin định kỳ kèm trạng thái, lịch, số tiếp theo và người sở hữu. Tác tử không bật được bản tin định kỳ.
- id: get_digest_issues
  type: tool
  area:
    en: Automations, digests and polls
    vi: Tự động hóa, bản tin định kỳ và bình chọn
  permission: campaigns:view
  effect: read
  description:
    en: "A digest's issues: sent, skipped, held and waiting, each with its posts and results. Agents can't release or skip an issue."
    vi: 'Các số của một bản tin định kỳ: đã gửi, bị bỏ qua, bị tạm giữ và đang chờ, mỗi số kèm bài viết và kết quả. Tác tử không cho gửi hay bỏ qua được một số.'
  params:
    - name: digest
      description:
        en: The digest's exact name or ID.
        vi: Tên chính xác hoặc ID của bản tin định kỳ.
- id: get_poll_results
  type: tool
  area:
    en: Automations, digests and polls
    vi: Tự động hóa, bản tin định kỳ và bình chọn
  permission: reports:view
  effect: read
  description:
    en: "Results of a campaign's polls or of a survey: answers by answer, NPS, by tier and language. Aggregate only."
    vi: 'Kết quả các bình chọn của một chiến dịch hoặc của một khảo sát: số câu trả lời theo từng lựa chọn, NPS, theo gói và ngôn ngữ. Chỉ số liệu tổng hợp.'
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID, for the results of its polls. Give a campaign or a survey.
        vi: Tên chính xác hoặc ID của chiến dịch, để lấy kết quả các bình chọn của nó. Hãy cung cấp một chiến dịch hoặc một khảo sát.
    - name: survey
      description:
        en: A survey's exact name or ID, for its results. Give a campaign or a survey.
        vi: Tên chính xác hoặc ID của một khảo sát, để lấy kết quả của nó. Hãy cung cấp một chiến dịch hoặc một khảo sát.
- id: list_transactional_templates
  type: tool
  area:
    en: Transactional email
    vi: Email giao dịch
  permission: transactional:view
  effect: read
  description:
    en: Transactional templates with their category, live version and numbers.
    vi: Các mẫu giao dịch kèm loại, phiên bản đang chạy và số liệu.
  params:
    - name: period
      description:
        en: 'The period of the numbers: 24h, 7d (default) or 30d. Optional.'
        vi: 'Khoảng thời gian của số liệu: 24h, 7d (mặc định) hoặc 30d. Không bắt buộc.'
- id: render_transactional_template
  type: tool
  area:
    en: Transactional email
    vi: Email giao dịch
  permission: transactional:view
  effect: read
  description:
    en: Render a transactional template with test data or given data. Nothing is sent or stored.
    vi: Kết xuất một mẫu giao dịch với dữ liệu thử hoặc dữ liệu được truyền vào. Không có gì được gửi hay lưu lại.
  params:
    - name: template
      description:
        en: The template's ID, such as password-reset.
        vi: ID của mẫu, ví dụ password-reset.
    - name: version
      description:
        en: 'The version: live (default), draft or a version number. Optional.'
        vi: 'Phiên bản: live (mặc định), draft hoặc một số phiên bản. Không bắt buộc.'
    - name: test_data
      description:
        en: The name of one of the template's test data sets. Optional.
        vi: Tên của một bộ dữ liệu thử của mẫu. Không bắt buộc.
    - name: data
      description:
        en: Variables to render with instead of a test data set; nothing is stored or sent. Optional.
        vi: Các biến dùng để kết xuất thay cho bộ dữ liệu thử; không có gì được lưu hay gửi. Không bắt buộc.
- id: search_transactional_messages
  type: tool
  area:
    en: Transactional email
    vi: Email giao dịch
  permission: transactional:view
  effect: read
  description:
    en: Search the transactional message log by status, template or recipient, without message content.
    vi: Tìm trong nhật ký thư giao dịch theo trạng thái, mẫu hoặc người nhận, không kèm nội dung thư.
  params:
    - name: status
      description:
        en: 'The status: queued, sent, delivered, deferred, bounced, complained, rejected, failed or test (default all). Optional.'
        vi: 'Trạng thái: queued, sent, delivered, deferred, bounced, complained, rejected, failed hoặc test (mặc định là tất cả). Không bắt buộc.'
    - name: template
      description:
        en: A template's ID, or raw for mail that arrived by SMTP. Optional.
        vi: ID của một mẫu, hoặc raw cho thư đến qua SMTP. Không bắt buộc.
    - name: query
      description:
        en: Recipient, message ID, idempotency key, tag or metadata value. Optional.
        vi: Người nhận, mã thư, khóa idempotency, thẻ hoặc giá trị metadata. Không bắt buộc.
    - name: range
      description:
        en: 'The time range: 1h, 24h (default), 7d or 30d. Optional.'
        vi: 'Khoảng thời gian: 1h, 24h (mặc định), 7d hoặc 30d. Không bắt buộc.'
    - name: limit
      description:
        en: At most this many messages (default 25, max 100). Optional.
        vi: Số thư tối đa (mặc định 25, tối đa 100). Không bắt buộc.
- id: get_referral_results
  type: tool
  area:
    en: Grow
    vi: Tăng trưởng
  permission: grow:view
  effect: read
  description:
    en: "A referral program's results: visits, signups, confirmations, counted referrals, channels, top referrers and rewards."
    vi: 'Kết quả của một chương trình giới thiệu: lượt truy cập, lượt đăng ký, lượt xác nhận, lượt giới thiệu đã tính, kênh, người giới thiệu hàng đầu và phần thưởng.'
  params:
    - name: list
      description:
        en: "The program's list name (default: the first program). Optional."
        vi: 'Tên danh sách của chương trình (mặc định: chương trình đầu tiên). Không bắt buộc.'
    - name: period
      description:
        en: 'The period: 7d, 30d or all (default all). Optional.'
