- id: render_transactional_template
  type: tool
  area:
    en: Transactional email
    vi: Email giao dịch
    de: Transaktions-E-Mails
    es: Correo transaccional
    fr: E-mail transactionnel
  permission: transactional:view
  effect: read
  description:
    en: Render a transactional template with test data or given data. Nothing is sent or stored.
    vi: Kết xuất một mẫu giao dịch với dữ liệu thử hoặc dữ liệu được truyền vào. Không có gì được gửi hay lưu lại.
    de: Eine Transaktionsvorlage mit Testdaten oder übergebenen Daten rendern. Nichts wird gesendet oder gespeichert.
    es: >-
      Renderizar una plantilla transaccional con datos de prueba o con los datos indicados. No se envía ni se guarda
      nada.
    fr: >-
      Faire le rendu d’un modèle transactionnel avec des données de test ou des données fournies. Rien n’est envoyé ni
      enregistré.
  params:
    - name: template
      description:
        en: The template's ID, such as password-reset.
        vi: ID của mẫu, ví dụ password-reset.
        de: Die ID der Vorlage, etwa password-reset.
        es: El ID de la plantilla, por ejemplo password-reset.
        fr: L’ID du modèle, par exemple password-reset.
    - name: version
      description:
        en: 'The version: live (default), draft or a version number. Optional.'
        vi: 'Phiên bản: live (mặc định), draft hoặc một số phiên bản. Không bắt buộc.'
        de: 'Die Version: live (Standard), draft oder eine Versionsnummer. Optional.'
        es: 'La versión: live (por defecto), draft o un número de versión. Opcional.'
        fr: 'La version : live (par défaut), draft ou un numéro de version. Facultatif.'
    - name: test_data
      description:
        en: The name of one of the template's test data sets. Optional.
        vi: Tên của một bộ dữ liệu thử của mẫu. Không bắt buộc.
        de: Der Name eines der Testdatensätze der Vorlage. Optional.
        es: El nombre de uno de los conjuntos de datos de prueba de la plantilla. Opcional.
        fr: Le nom de l’un des jeux de données de test du modèle. Facultatif.
    - name: data
      description:
        en: Variables to render with instead of a test data set; nothing is stored or sent. Optional.
        vi: Các biến dùng để kết xuất thay cho bộ dữ liệu thử; không có gì được lưu hay gửi. Không bắt buộc.
        de: >-
          Variablen, mit denen statt eines Testdatensatzes gerendert wird; nichts wird gespeichert oder gesendet.
          Optional.
        es: >-
          Variables con las que renderizar en lugar de un conjunto de datos de prueba; no se guarda ni se envía nada.
          Opcional.
        fr: >-
          Les variables à utiliser pour le rendu au lieu d’un jeu de données de test ; rien n’est enregistré ni envoyé.
          Facultatif.
- id: search_transactional_messages
  type: tool
  area:
    en: Transactional email
    vi: Email giao dịch
    de: Transaktions-E-Mails
    es: Correo transaccional
    fr: E-mail transactionnel
  permission: transactional:view
  effect: read
  description:
    en: Search the transactional message log by status, template or recipient, without message content.
    vi: Tìm trong nhật ký thư giao dịch theo trạng thái, mẫu hoặc người nhận, không kèm nội dung thư.
    de: >-
      Das Protokoll der Transaktionsnachrichten nach Status, Vorlage oder Empfänger durchsuchen, ohne Nachrichteninhalt.
    es: >-
      Buscar en el registro de mensajes transaccionales por estado, plantilla o destinatario, sin el contenido de los
      mensajes.
    fr: >-
      Rechercher dans le journal des messages transactionnels par état, modèle ou destinataire, sans le contenu des
      messages.
  params:
    - name: status
      description:
        en: 'The status: queued, sent, delivered, deferred, bounced, complained, rejected, failed or test (default all). Optional.'
        vi: 'Trạng thái: queued, sent, delivered, deferred, bounced, complained, rejected, failed hoặc test (mặc định là tất cả). Không bắt buộc.'
        de: >-
          Der Status: queued, sent, delivered, deferred, bounced, complained, rejected, failed oder test (Standard:
          alle). Optional.
        es: >-
          El estado: queued, sent, delivered, deferred, bounced, complained, rejected, failed o test (todos por
          defecto). Opcional.
        fr: >-
          L’état : queued, sent, delivered, deferred, bounced, complained, rejected, failed ou test (tous par défaut).
          Facultatif.
    - name: template
      description:
        en: A template's ID, or raw for mail that arrived by SMTP. Optional.
        vi: ID của một mẫu, hoặc raw cho thư đến qua SMTP. Không bắt buộc.
        de: Die ID einer Vorlage, oder raw für E-Mails, die per SMTP eingegangen sind. Optional.
        es: El ID de una plantilla, o raw para el correo que llegó por SMTP. Opcional.
        fr: L’ID d’un modèle, ou raw pour les e-mails arrivés par SMTP. Facultatif.
    - name: query
      description:
        en: Recipient, message ID, idempotency key, tag or metadata value. Optional.
        vi: Người nhận, mã thư, khóa idempotency, thẻ hoặc giá trị metadata. Không bắt buộc.
        de: Empfänger, Nachrichten-ID, Idempotenzschlüssel, Tag oder Metadatenwert. Optional.
        es: Destinatario, ID del mensaje, clave de idempotencia, etiqueta o valor de metadatos. Opcional.
        fr: Destinataire, ID du message, clé d’idempotence, tag ou valeur de métadonnée. Facultatif.
    - name: range
      description:
        en: 'The time range: 1h, 24h (default), 7d or 30d. Optional.'
        vi: 'Khoảng thời gian: 1h, 24h (mặc định), 7d hoặc 30d. Không bắt buộc.'
        de: 'Der Zeitraum: 1h, 24h (Standard), 7d oder 30d. Optional.'
        es: 'El intervalo de tiempo: 1h, 24h (por defecto), 7d o 30d. Opcional.'
        fr: 'La plage de temps : 1h, 24h (par défaut), 7d ou 30d. Facultatif.'
    - name: limit
      description:
        en: At most this many messages (default 25, max 100). Optional.
        vi: Số thư tối đa (mặc định 25, tối đa 100). Không bắt buộc.
        de: Höchstens so viele Nachrichten (Standard 25, maximal 100). Optional.
        es: Como máximo este número de mensajes (25 por defecto, 100 como máximo). Opcional.
        fr: Au plus ce nombre de messages (25 par défaut, 100 au maximum). Facultatif.
