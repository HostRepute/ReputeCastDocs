# MCP server catalogue (internal/mcpserver): tools in the Tools catalogue order within each area, then the
# resources (id = URI) and prompts. effect: read = reads only; write = changes something; proposal = asks a person to
# confirm in ReputeCast. A tool's permission is the one its registration checks. Guarded by pnpm upstream:check.
- id: list_campaigns
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: List campaigns with status, audience and headline results.
  params:
    - name: status
      description:
        en: 'Which campaigns: all, drafts, scheduled, sending or sent (default all). Optional.'
    - name: query
      description:
        en: Search by name. Optional.
    - name: limit
      description:
        en: At most this many campaigns (default 25, max 100). Optional.
- id: get_campaign_report
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: reports:view
  effect: read
  description:
    en: Results of a campaign by sending provider and mailbox provider.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
- id: get_send_readiness
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: The latest Send Readiness verdict and checks of a campaign.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
- id: create_campaign_draft
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:edit
  effect: write
  description:
    en: Create a draft campaign from MJML.
  params:
    - name: name
      description:
        en: The campaign's name.
    - name: subject
      description:
        en: The subject line. Optional.
    - name: preheader
      description:
        en: The preheader text. Optional.
    - name: mjml
      description:
        en: MJML 4 source. Optional.
- id: update_campaign_content
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:edit
  effect: write
  description:
    en: Change the subject, preheader or MJML of a draft, or of one of its language versions.
  params:
    - name: campaign
      description:
        en: The draft's name or ID.
    - name: subject
      description:
        en: A new subject line. Optional.
    - name: preheader
      description:
        en: A new preheader. Optional.
    - name: mjml
      description:
        en: New MJML 4 source. Optional.
    - name: language
      description:
        en: Change this language version (its code, such as de) instead of the source; get_campaign_languages lists them. Optional.
- id: schedule_campaign
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:send
  effect: proposal
  description:
    en: Propose a send time. A team member confirms it in ReputeCast.
  params:
    - name: campaign
      description:
        en: The campaign's name or ID.
    - name: at
      description:
        en: The send time in RFC 3339, such as 2026-11-04T09:00:00-05:00.
- id: pause_campaign
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:pause
  effect: write
  description:
    en: Pause a running send.
  params:
    - name: campaign
      description:
        en: The campaign's name or ID.
    - name: reason
      description:
        en: Why, recorded in the audit log. Optional.
- id: resume_campaign
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:send
  effect: write
  description:
    en: Resume a paused send.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
- id: get_campaign_live_stats
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: Live counters and routes of a running send.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
- id: send_test_email
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:edit
  effect: write
  description:
    en: Send a test of a campaign to a member of the workspace.
  params:
    - name: campaign
      description:
        en: The campaign's name or ID.
    - name: to
      description:
        en: The email address of a member of this workspace.
- id: get_campaign_languages
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: "A campaign's language versions: each one's status (up to date, outdated, draft, missing) and who gets it."
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
- id: get_accessibility_issues
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: 'Accessibility issues of a campaign in every language: what is serious, where it is and how to fix it.'
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
- id: search_contacts
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
  permission: subscribers:view
  effect: read
  description:
    en: Find contacts by email or name.
  params:
    - name: query
      description:
        en: Part of an email address or name.
    - name: limit
      description:
        en: At most this many contacts (default 20, max 100). Optional.
- id: create_segment
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
  permission: segments:edit
  effect: write
  description:
    en: Create a segment from condition-builder JSON.
  params:
    - name: name
      description:
        en: The segment's name.
    - name: description
      description:
        en: The segment's description. Optional.
    - name: definition
      description:
        en: 'Condition-builder JSON: {"match":"all","conditions":[…]}.'
- id: add_to_suppression
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
  permission: subscribers:edit
  effect: write
  description:
    en: Suppress an address so nothing is sent to it again.
  params:
    - name: email
      description:
        en: The email address to suppress.
    - name: reason
      description:
        en: Why, kept with the suppression. Optional.
- id: get_growth_sources
  type: tool
  area:
    en: Audience
    vi: Người đăng ký
  permission: subscribers:view
  effect: read
  description:
    en: Joins, departures, quality and cohort retention per growth source over a period (totals only, no addresses).
  params:
    - name: period
      description:
        en: 'The period: 30d (default), 90d or 12m. Optional.'
    - name: list
      description:
        en: A list name or ID, to count its members instead of contacts. Optional.
- id: get_provider_health
  type: tool
  area:
    en: Sending and deliverability
  permission: providers:view
  effect: read
  description:
    en: Status, bounce and complaint rates and quota of each sending provider.
- id: get_routing
  type: tool
  area:
    en: Sending and deliverability
  permission: providers:view
  effect: read
  description:
    en: Routing rules per stream with weights and fallbacks.
- id: update_routing
  type: tool
  area:
    en: Sending and deliverability
  permission: providers:manage
  effect: write
  description:
    en: Change the weights of a stream's default route.
  params:
    - name: stream
      description:
        en: 'The stream: broadcast, automation or system.'
    - name: weights
      description:
        en: Sending provider name → percent; the weights add up to 100.
- id: get_deliverability
  type: tool
  area:
    en: Sending and deliverability
  permission: deliverability:view
  effect: read
  description:
    en: Domain authentication, blocklists and Postmaster reputation.
- id: list_placement_tests
  type: tool
  area:
    en: Sending and deliverability
  permission: deliverability:view
  effect: read
  description:
    en: 'Placement tests people ran: the email, the providers and where the copies landed.'
- id: get_placement_test
  type: tool
  area:
    en: Sending and deliverability
  permission: deliverability:view
  effect: read
  description:
    en: "One placement test: each copy's folder, time to arrive and SPF, DKIM and DMARC, with the guidance."
  params:
    - name: test
      description:
        en: "The test's ID or its name (such as Weekly Digest #142 · SES vs Postal)."
- id: list_automations
  type: tool
  area:
    en: Automations, digests and polls
  permission: automations:view
  effect: read
  description:
    en: Automations with their status.
- id: list_digests
  type: tool
  area:
    en: Automations, digests and polls
  permission: campaigns:view
  effect: read
  description:
    en: Recurring digests with their status, schedule, next issue and owner. Agents can't turn a digest on.
- id: get_digest_issues
  type: tool
  area:
    en: Automations, digests and polls
  permission: campaigns:view
  effect: read
  description:
    en: "A digest's issues: sent, skipped, held and waiting, each with its posts and results. Agents can't release or skip an issue."
  params:
    - name: digest
      description:
        en: The digest's exact name or ID.
- id: get_poll_results
  type: tool
  area:
    en: Automations, digests and polls
  permission: reports:view
  effect: read
  description:
    en: "Results of a campaign's polls or of a survey: answers by answer, NPS, by tier and language. Aggregate only."
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID, for the results of its polls. Give a campaign or a survey.
    - name: survey
      description:
        en: A survey's exact name or ID, for its results. Give a campaign or a survey.
- id: list_transactional_templates
  type: tool
  area:
    en: Transactional email
  permission: transactional:view
  effect: read
  description:
    en: Transactional templates with their category, live version and numbers.
  params:
    - name: period
      description:
        en: 'The period of the numbers: 24h, 7d (default) or 30d. Optional.'
- id: render_transactional_template
  type: tool
  area:
    en: Transactional email
  permission: transactional:view
  effect: read
  description:
    en: Render a transactional template with test data or given data. Nothing is sent or stored.
  params:
    - name: template
      description:
        en: The template's ID, such as password-reset.
    - name: version
      description:
        en: 'The version: live (default), draft or a version number. Optional.'
    - name: test_data
      description:
        en: The name of one of the template's test data sets. Optional.
    - name: data
      description:
        en: Variables to render with instead of a test data set; nothing is stored or sent. Optional.
- id: search_transactional_messages
  type: tool
  area:
    en: Transactional email
  permission: transactional:view
  effect: read
  description:
    en: Search the transactional message log by status, template or recipient, without message content.
  params:
    - name: status
      description:
        en: 'The status: queued, sent, delivered, deferred, bounced, complained, rejected, failed or test (default all). Optional.'
    - name: template
      description:
        en: A template's ID, or raw for mail that arrived by SMTP. Optional.
    - name: query
      description:
        en: Recipient, message ID, idempotency key, tag or metadata value. Optional.
    - name: range
      description:
        en: 'The time range: 1h, 24h (default), 7d or 30d. Optional.'
    - name: limit
      description:
        en: At most this many messages (default 25, max 100). Optional.
- id: get_referral_results
  type: tool
  area:
    en: Grow
    vi: Tăng trưởng
  permission: grow:view
  effect: read
  description:
    en: "A referral program's results: visits, signups, confirmations, counted referrals, channels, top referrers and rewards."
  params:
    - name: list
      description:
        en: "The program's list name (default: the first program). Optional."
    - name: period
      description:
        en: 'The period: 7d, 30d or all (default all). Optional.'
- id: list_referrers
  type: tool
  area:
    en: Grow
    vi: Tăng trưởng
  permission: grow:view
  effect: read
  description:
    en: Referrers with their counted, in-hold and held referrals and the milestones they reached (no addresses).
  params:
    - name: list
      description:
        en: "The program's list name (default: the first program). Optional."
    - name: query
      description:
        en: A name to look for. Optional.
    - name: held
      description:
        en: Only referrers with referrals held for review. Optional.
- id: list_held_referrals
  type: tool
  area:
    en: Grow
    vi: Tăng trưởng
  permission: grow:view
  effect: read
  description:
    en: Referrals held for review, grouped by referrer, with the signals and addresses masked to their network.
  params:
    - name: list
      description:
        en: "The program's list name (default: the first program). Optional."
    - name: period
      description:
        en: 'The period: 7d, 30d or all (default all). Optional.'
- id: propose_referral_decision
  type: tool
  area:
    en: Grow
    vi: Tăng trưởng
  permission: grow:view
  effect: proposal
  description:
    en: Propose counting or not counting a referrer's held referrals. A person with grow:review decides in ReputeCast.
  params:
    - name: list
      description:
        en: "The program's list name (default: the first program). Optional."
    - name: referrer
      description:
        en: The referrer's name, as list_held_referrals shows it.
    - name: decision
      description:
        en: count, dont (not count) or dont_pause (not count, and pause the referrer's link).
    - name: reason
      description:
        en: Why, for the person who decides. Optional.
- id: list_recommendations
  type: tool
  area:
    en: Grow
    vi: Tăng trưởng
  permission: grow:view
  effect: read
  description:
    en: The newsletters you recommend and the partners that recommend you, with their numbers. Agents can't change them or touch partner links.
- id: get_sms_overview
  type: tool
  area:
    en: SMS, push and WhatsApp
  permission: providers:view
  effect: read
  description:
    en: SMS providers, senders and their registrations, routes by country and the month's spend against the budget.
- id: get_sms_campaign_report
  type: tool
  area:
    en: SMS, push and WhatsApp
  permission: reports:view
  effect: read
  description:
    en: "A text campaign's results by country: delivery, failures with the providers' codes, clicks, opt-outs, replies and cost. Counts only."
  params:
    - name: campaign
      description:
        en: "The text campaign's ID or its name (such as Summit: 8 days to go)."
- id: create_sms_draft
  type: tool
  area:
    en: SMS, push and WhatsApp
  permission: campaigns:edit
  effect: write
  description:
    en: Draft a text campaign with its lists. A person with sms:send reviews and sends it.
  params:
    - name: name
      description:
        en: The campaign's name.
    - name: body
      description:
        en: 'The text, without the brand prefix and opt-out text the rules add. Personalization tokens such as {{ first_name | default: "there" }} work.'
    - name: lists
      description:
        en: Lists by name or ID; texts go to their members with SMS consent. Optional.
- id: create_push_draft
  type: tool
  area:
    en: SMS, push and WhatsApp
  permission: campaigns:edit
  effect: write
  description:
    en: 'Draft a push campaign: a title, a message and the page it opens. It stays a draft: a person reviews and sends it.'
  params:
    - name: name
      description:
        en: The campaign's name.
    - name: title
      description:
        en: The notification's title (about 40 characters show everywhere).
    - name: message
      description:
        en: The notification's text (up to 120 characters). Optional.
    - name: link
      description:
        en: The page the notification opens.
- id: get_push_report
  type: tool
  area:
    en: SMS, push and WhatsApp
  permission: reports:view
  effect: read
  description:
    en: "A push campaign's results: sent, shown, clicks, unsubscribes and expired subscriptions, by browser and site."
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
- id: create_whatsapp_draft
  type: tool
  area:
    en: SMS, push and WhatsApp
  permission: campaigns:edit
  effect: write
  description:
    en: 'Draft a WhatsApp campaign with an approved template and the lists it goes to. It stays a draft: a person reviews and sends it.'
  params:
    - name: name
      description:
        en: The campaign's name.
    - name: template
      description:
        en: The name of an approved template.
    - name: lists
      description:
        en: The names or IDs of the lists it goes to (people with WhatsApp consent). Optional.
- id: get_whatsapp_report
  type: tool
  area:
    en: SMS, push and WhatsApp
  permission: reports:view
  effect: read
  description:
    en: "A WhatsApp campaign's results and cost: sent, delivered, read, failed with Meta's codes, replies and opt-outs."
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
- id: get_paid_member_counts
  type: tool
  area:
    en: Earn
    vi: Kiếm tiền
  permission: earn:view
  effect: read
  description:
    en: 'Paid members by status and tier, and the MRR: counts only, never names or emails.'
- id: get_revenue_overview
  type: tool
  area:
    en: Earn
    vi: Kiếm tiền
  permission: earn:view
  effect: read
  description:
    en: "Earn's numbers for the last 30 days, 90 days or 12 months: MRR, ARR, paid members, new and churned, churn rate, free-to-paid rate, gift and sponsor income. Totals only, never names or emails."
  params:
    - name: period
      description:
        en: 'The period: 30d (default), 90d or 12m. Optional.'
- id: list_sponsor_bookings
  type: tool
  area:
    en: Earn
    vi: Kiếm tiền
  permission: earn:view
  effect: read
  description:
    en: "Sponsor bookings by issue and slot, from 30 days ago on: the sponsor, the status, the creative's state and the payment's. Never contact data."
  params:
    - name: sponsor
      description:
        en: Only this sponsor's bookings (its name). Optional.
- id: propose_sponsor_booking
  type: tool
  area:
    en: Earn
    vi: Kiếm tiền
  permission: sponsors:manage
  effect: proposal
  description:
    en: Propose a sponsor for an open issue of a slot. A team member confirms it before it's booked.
  params:
    - name: slot
      description:
        en: The slot's name (such as Main sponsor) or ID.
    - name: issue
      description:
        en: The issue number, such as 146.
    - name: sponsor
      description:
        en: The sponsor's name or ID, from the sponsor library.
    - name: price_cents
      description:
        en: The price in cents; the slot's price by default. Optional.
    - name: note
      description:
        en: Why, for the person who confirms it (up to 500 characters). Optional.
- id: list_posts
  type: tool
  area:
    en: Website, pages and products
  permission: website:view
  effect: read
  description:
    en: The website's posts with their status, visibility, address and 30-day views. No member data.
  params:
    - name: status
      description:
        en: 'Which posts: all (default), published, scheduled, draft or unpublished. Optional.'
    - name: query
      description:
        en: Words of the title. Optional.
- id: get_post
  type: tool
  area:
    en: Website, pages and products
  permission: website:view
  effect: read
  description:
    en: 'One post: its settings, tags, web checks and, for a web-only post, its MJML.'
  params:
    - name: post
      description:
        en: The post's ID or its address (the slug after /posts/).
- id: create_post_draft
  type: tool
  area:
    en: Website, pages and products
  permission: website:edit
  effect: write
  description:
    en: 'Draft a web-only post from a title and MJML. It stays a draft: agents never publish.'
  params:
    - name: title
      description:
        en: The post's title.
    - name: mjml
      description:
        en: The post's content as MJML (mjml > mj-body > sections). Optional.
- id: propose_post_publish
  type: tool
  area:
    en: Website, pages and products
  permission: website:edit
  effect: proposal
  description:
    en: Propose publishing a post. A person with website:publish publishes it in ReputeCast (approvals still apply).
  params:
    - name: post
      description:
        en: The post's ID or its address (the slug after /posts/).
    - name: note
      description:
        en: Why it's ready, for the person who publishes it. Optional.
- id: list_pages
  type: tool
  area:
    en: Website, pages and products
  permission: website:view
  effect: read
  description:
    en: The workspace's landing and sales pages with their status, address, visibility and 30-day views and results.
- id: get_page
  type: tool
  area:
    en: Website, pages and products
  permission: website:view
  effect: read
  description:
    en: 'One page: its settings, status, publish checks and numbers. No visitor data.'
  params:
    - name: page
      description:
        en: The page's ID or its address (the slug, such as field-guide).
- id: list_products
  type: tool
  area:
    en: Website, pages and products
  permission: products:view
  effect: read
  description:
    en: 'Digital products with their price, status and 30-day orders and gross: counts only, never buyers.'
- id: get_product
  type: tool
  area:
    en: Website, pages and products
  permission: products:view
  effect: read
  description:
    en: 'One product: its description, files, price, delivery settings and publish checks. No buyer data.'
  params:
    - name: product
      description:
        en: The product's ID or its address (the slug, such as deliverability-field-guide).
- id: reputecast://campaigns/{id}.mjml
  type: resource
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: campaigns:view
  effect: read
  description:
    en: 'Campaign MJML: the MJML source of a campaign (text/mjml).'
- id: reputecast://campaigns/{id}/report.csv
  type: resource
  area:
    en: Campaigns
    vi: Chiến dịch
  permission: reports:view
  effect: read
  description:
    en: 'Campaign report (CSV): results by sending and mailbox provider (sent, delivered, human and machine opens, clicks, bounces, complaints, unsubscribes).'
- id: reputecast://audit/recent.json
  type: resource
  area:
    en: Audit log
    vi: Nhật ký kiểm tra
  permission: audit:view
  effect: read
  description:
    en: 'Audit log (latest 100 entries): the workspace audit log, newest first (application/json).'
- id: draft_weekly_digest
  type: prompt
  area:
    en: Campaigns
    vi: Chiến dịch
  description:
    en: Draft the next Weekly Digest from what performed well recently. The agent reads the last issues' reports, writes MJML and creates a draft; it never schedules it.
  params:
    - name: topics
      description:
        en: Topics or links to include, comma-separated. Optional.
- id: explain_auto_pause
  type: prompt
  area:
    en: Campaigns
    vi: Chiến dịch
  description:
    en: 'Explain why a send paused automatically and what the options are: the threshold that tripped, the recipients held, and resume, adjust the audience, move to another provider or cancel.'
  params:
    - name: campaign
      description:
        en: The paused campaign's name or ID.
