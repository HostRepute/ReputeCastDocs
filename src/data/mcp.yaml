# MCP server catalogue (internal/mcpserver): tools in the Tools catalogue order within each area, then the
# resources (id = URI) and prompts. effect: read = reads only; write = changes something; proposal = asks a person to
# confirm in ReputeCast. A tool's permission is the one its registration checks. Guarded by pnpm upstream:check.
- id: list_campaigns
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
    de: Kampagnen
    es: Campañas
    fr: Campagnes
  permission: campaigns:view
  effect: read
  description:
    en: List campaigns with status, audience and headline results.
    vi: Liệt kê chiến dịch kèm trạng thái, người nhận và kết quả chính.
    de: Kampagnen mit Status, Zielgruppe und wichtigsten Ergebnissen auflisten.
    es: Listar las campañas con su estado, su audiencia y sus resultados principales.
    fr: Lister les campagnes avec leur état, leur audience et leurs principaux résultats.
  params:
    - name: status
      description:
        en: 'Which campaigns: all, drafts, scheduled, sending or sent (default all). Optional.'
        vi: 'Chiến dịch nào: all, drafts, scheduled, sending hoặc sent (mặc định all). Không bắt buộc.'
        de: 'Welche Kampagnen: all, drafts, scheduled, sending oder sent (Standard: all). Optional.'
        es: 'Qué campañas: all, drafts, scheduled, sending o sent (all por defecto). Opcional.'
        fr: 'Quelles campagnes : all, drafts, scheduled, sending ou sent (all par défaut). Facultatif.'
    - name: query
      description:
        en: Search by name. Optional.
        vi: Tìm theo tên. Không bắt buộc.
        de: Nach Namen suchen. Optional.
        es: Buscar por nombre. Opcional.
        fr: Recherche par nom. Facultatif.
    - name: limit
      description:
        en: At most this many campaigns (default 25, max 100). Optional.
        vi: Số chiến dịch tối đa (mặc định 25, tối đa 100). Không bắt buộc.
        de: Höchstens so viele Kampagnen (Standard 25, maximal 100). Optional.
        es: Como máximo este número de campañas (25 por defecto, 100 como máximo). Opcional.
        fr: Au plus ce nombre de campagnes (25 par défaut, 100 au maximum). Facultatif.
- id: get_campaign_report
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
    de: Kampagnen
    es: Campañas
    fr: Campagnes
  permission: reports:view
  effect: read
  description:
    en: >-
      A campaign's report as the app shows it: human, privacy-protected and scanner opens apart, the measurable open
      rate, complaints where reported, results by mailbox and sending provider, links, the A/B decision and growth.
    vi: >-
      Báo cáo của một chiến dịch đúng như ứng dụng hiển thị: lượt mở của người thật, lượt mở được bảo vệ quyền riêng tư
      và lượt mở của trình quét được tách riêng, tỷ lệ mở đo được, khiếu nại ở nơi có báo cáo, kết quả theo nhà cung
      cấp hộp thư và nhà cung cấp gửi thư, liên kết, quyết định A/B và mức tăng trưởng.
    de: >-
      Der Bericht einer Kampagne, wie die App ihn zeigt: menschliche, datenschutzgeschützte und Scanner-Öffnungen
      getrennt, die messbare Öffnungsrate, Beschwerden, wo sie gemeldet werden, Ergebnisse nach Postfachanbieter und
      Versandanbieter, Links, die A/B-Entscheidung und der Zuwachs.
    es: >-
      El informe de una campaña tal como lo muestra la aplicación: aperturas humanas, con protección de la privacidad y
      de escáneres por separado, la tasa de apertura medible, las quejas donde se notifican, los resultados por
      proveedor de buzón y por proveedor de envío, los enlaces, la decisión A/B y el crecimiento.
    fr: >-
      Le rapport d’une campagne tel que l’affiche l’application : ouvertures humaines, à confidentialité protégée et par
      des scanners comptées à part, taux d’ouverture mesurable, plaintes là où elles sont signalées, résultats par
      fournisseur de messagerie et par fournisseur d’envoi, liens, décision du test A/B et croissance.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
        vi: Tên chính xác hoặc ID của chiến dịch.
        de: Der genaue Name oder die ID der Kampagne.
        es: El nombre exacto o el ID de la campaña.
        fr: Le nom exact ou l’ID de la campagne.
- id: share_campaign_report
  type: tool
  area:
    en: Campaigns
    vi: Chiến dịch
    de: Kampagnen
    es: Campañas
    fr: Campagnes
  permission: reports:share
  effect: write
  description:
    en: >-
      Make a read-only link to a campaign's report that expires (30 days by default), choosing whether it shows the
      cost, warm-up and the email. Anyone with the link sees the report's numbers without signing in until it expires
      or is revoked, never the AI summary.
    vi: >-
      Tạo liên kết chỉ xem đến báo cáo của một chiến dịch, có thời hạn (mặc định 30 ngày), kèm lựa chọn có hiển thị chi
      phí, giai đoạn khởi động và email hay không. Ai có liên kết đều xem được số liệu của báo cáo mà không cần đăng
      nhập cho đến khi liên kết hết hạn hoặc bị thu hồi, nhưng không bao giờ thấy bản tóm tắt AI.
    de: >-
      Einen Ansichtslink zum Bericht einer Kampagne erstellen, der abläuft (standardmäßig nach 30 Tagen), und wählen, ob
      er die Kosten, das Warm-up und die E-Mail zeigt. Wer den Link hat, sieht die Zahlen des Berichts ohne Anmeldung,
      bis er abläuft oder widerrufen wird, aber nie die KI-Zusammenfassung.
    es: >-
      Crear un enlace de solo lectura al informe de una campaña que caduca (a los 30 días por defecto), eligiendo si
      muestra el costo, el calentamiento y el correo. Cualquiera con el enlace ve las cifras del informe sin iniciar
      sesión hasta que caduca o se revoca, nunca el resumen de IA.
    fr: >-
      Créer un lien en lecture seule vers le rapport d’une campagne, qui expire (30 jours par défaut), en choisissant
      s’il affiche le coût, la chauffe et l’e-mail. Toute personne disposant du lien voit les chiffres du rapport sans
      se connecter jusqu’à ce qu’il expire ou soit révoqué, mais jamais le résumé de l’IA.
  params:
    - name: campaign
      description:
        en: The campaign's exact name or ID.
        vi: Tên chính xác hoặc ID của chiến dịch.
        de: Der genaue Name oder die ID der Kampagne.
        es: El nombre exacto o el ID de la campaña.
        fr: Le nom exact ou l’ID de la campagne.
    - name: expires_in_days
      description:
        en: How long the link works, 1 to 90 days (30 by default). Optional.
        vi: Thời gian liên kết hoạt động, từ 1 đến 90 ngày (mặc định 30). Không bắt buộc.
        de: Wie lange der Link funktioniert, 1 bis 90 Tage (standardmäßig 30). Optional.
        es: Cuánto tiempo funciona el enlace, de 1 a 90 días (30 por defecto). Opcional.
        fr: Durée de validité du lien, de 1 à 90 jours (30 par défaut). Facultatif.
    - name: include_cost
      description:
        en: Also show the cost per sending provider. Optional.
        vi: Hiển thị thêm chi phí theo từng nhà cung cấp gửi thư. Không bắt buộc.
        de: Auch die Kosten je Versandanbieter zeigen. Optional.
        es: Mostrar también el costo por proveedor de envío. Opcional.
        fr: Afficher aussi le coût par fournisseur d’envoi. Facultatif.
    - name: include_warmup
      description:
        en: Also show each sending provider's warm-up day. Optional.
        vi: Hiển thị thêm ngày khởi động của từng nhà cung cấp gửi thư. Không bắt buộc.
        de: Auch den Warm-up-Tag jedes Versandanbieters zeigen. Optional.
        es: Mostrar también el día de calentamiento de cada proveedor de envío. Opcional.
        fr: Afficher aussi le jour de chauffe de chaque fournisseur d’envoi. Facultatif.
    - name: include_email
      description:
        en: Also show the email as sent, in the click map. Optional.
        vi: Hiển thị thêm email đúng như đã gửi, trong bản đồ lượt nhấp. Không bắt buộc.
        de: Auch die E-Mail wie gesendet zeigen, in der Klickkarte. Optional.
        es: Mostrar también el correo tal como se envió, en el mapa de clics. Opcional.
        fr: Afficher aussi l’e-mail tel qu’il a été envoyé, dans la carte des clics. Facultatif.
