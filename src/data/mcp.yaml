        de: >-
          Diese Sprachversion (ihr Code, etwa de) statt des Originals ändern; get_campaign_languages listet sie auf.
          Optional.
        es: >-
          Cambiar esta versión de idioma (su código, por ejemplo de) en lugar del original; get_campaign_languages las
          lista. Opcional.
        fr: >-
          Modifier cette version linguistique (son code, par exemple de) au lieu de la source ; get_campaign_languages
          les liste. Facultatif.
