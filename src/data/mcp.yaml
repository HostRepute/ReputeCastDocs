- id: propose_referral_decision
  type: tool
  area:
    en: Grow
    vi: Tăng trưởng
    de: Wachstum
    es: Crecimiento
    fr: Croissance
  permission: grow:view
  effect: proposal
  description:
    en: Propose counting or not counting a referrer's held referrals. A person with grow:review decides in ReputeCast.
    vi: Đề xuất tính hoặc không tính các lượt giới thiệu bị tạm giữ của một người giới thiệu. Một người có quyền grow:review sẽ quyết định trong ReputeCast.
    de: >-
      Vorschlagen, die zurückgehaltenen Weiterempfehlungen einer empfehlenden Person zu zählen oder nicht zu zählen.
      Eine Person mit grow:review entscheidet in ReputeCast.
    es: >-
      Proponer contar o no contar los referidos retenidos de un referidor. Decide en ReputeCast una persona con
      grow:review.
    fr: >-
      Proposer de compter ou de ne pas compter les parrainages retenus d’un parrain. Une personne disposant de
      grow:review décide dans ReputeCast.
  params:
    - name: list
      description:
        en: "The program's list name (default: the first program). Optional."
        vi: 'Tên danh sách của chương trình (mặc định: chương trình đầu tiên). Không bắt buộc.'
        de: 'Der Listenname des Programms (Standard: das erste Programm). Optional.'
        es: El nombre de la lista del programa (por defecto, el primer programa). Opcional.
        fr: 'Le nom de la liste du programme (par défaut : le premier programme). Facultatif.'
    - name: referrer
      description:
        en: The referrer's name, as list_held_referrals shows it.
        vi: Tên người giới thiệu, như list_held_referrals hiển thị.
        de: Der Name der empfehlenden Person, wie list_held_referrals ihn zeigt.
        es: El nombre del referidor, tal como lo muestra list_held_referrals.
        fr: Le nom du parrain, tel que list_held_referrals l’affiche.
    - name: decision
      description:
        en: count, dont (not count) or dont_pause (not count, and pause the referrer's link).
        vi: count, dont (không tính) hoặc dont_pause (không tính, và tạm dừng liên kết của người giới thiệu).
        de: count, dont (nicht zählen) oder dont_pause (nicht zählen und den Link der empfehlenden Person pausieren).
        es: count, dont (no contar) o dont_pause (no contar y pausar el enlace del referidor).
        fr: count, dont (ne pas compter) ou dont_pause (ne pas compter, et mettre en pause le lien du parrain).
    - name: reason
      description:
        en: Why, for the person who decides. Optional.
        vi: Lý do, để người quyết định tham khảo. Không bắt buộc.
        de: Der Grund, für die Person, die entscheidet. Optional.
        es: El motivo, para la persona que decide. Opcional.
        fr: Le motif, pour la personne qui décide. Facultatif.
