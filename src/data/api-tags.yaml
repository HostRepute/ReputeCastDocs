# OpenAPI tags of the API reference (/api/), in reading order. One row per upstream tag that holds at least one
# operation an API key can call; tags with only session (web app) operations are left out.
# Used by scripts/upstream/sync-openapi.ts, which fails when a tag is missing here or no longer has such operations.
- id: Workspaces
  description: Change a workspace's name, timezone and default sender, and show or hide sections in its sidebar.
  order: 10
- id: Account
  description: Read the caller's role, permissions and scope in a workspace.
  order: 20
- id: Overview
  description: Read the workspace overview, including subscriber growth, the next campaign, provider status and sender health.
  order: 30
- id: Campaigns
  description: Create, edit, preview and test email campaigns, with their content versions and language versions.
  order: 40
- id: Templates
  description: List, save, rename and delete email templates and saved sections.
  order: 50
- id: Media
  description: List, upload and remove images in the workspace's media library.
  order: 60
- id: Languages
  description: Add and remove workspace languages and change the default and fallback language.
  order: 70
- id: Accessibility
  description: Check email content for accessibility issues, apply fixes and manage the accessibility policy.
  order: 80
- id: Conditional content
  description: Count and preview the versions that an email's conditional blocks produce.
  order: 90
- id: Polls
  description: Read poll results and comments, download answers, and close or reopen polls.
  order: 100
- id: Surveys
  description: Create, publish, close and reopen surveys, and read their responses and results.
  order: 110
- id: Review & send
  description: Run Send Readiness on a campaign, read its review, and change its schedule and auto-pause thresholds.
  order: 120
- id: Approvals
  description: Read the approval policy, approval requests and the email each request covers.
  order: 130
- id: Live sending
  description: Follow a running send and pause, resume, retry, move or cancel it.
  order: 140
- id: Reports
  description: Read and export campaign reports, and manage their read-only links.
  order: 150
- id: Digests
  description: Create and manage recurring digests that build issues from a feed or a connected WordPress site.
  order: 160
- id: Automations
  description: Build, publish, pause and resume automations, edit their emails, and send the API events they listen to.
  order: 170
- id: Transactional messages
  description: Send transactional email one message or up to 100 at a time, and read the message log.
  order: 180
- id: Transactional templates
  description: Create, edit, preview, publish, archive and roll back transactional templates.
  order: 190
- id: Transactional settings
  description: Manage transactional categories, contact linking, content retention and delivery alerts.
  order: 200
- id: Contacts
  description: Create or update a contact by email, add tags, add a contact to a list, and read a contact's website membership.
  order: 210
- id: Audience
  description: List, add, edit, export and erase contacts, and manage lists, custom fields, saved views and the sunset policy.
  order: 220
- id: Segments
  description: Build, count and save segments of contacts.
  order: 230
- id: Suppressions
  description: Read, add, upload, pull, export and remove addresses on the shared suppression list.
  order: 240
- id: Imports
  description: Import contacts from a CSV or XLSX file or from another platform, with field and consent mapping.
  order: 250
- id: Scoring
  description: Manage the scoring rules, decay and bands, and read a contact's score.
  order: 260
- id: Growth
  description: Read where contacts joined from, with UTM parameters, referring pages and retention by source.
  order: 270
- id: Verification
  description: Connect email verification services and check addresses one at a time, in jobs or on signup forms.
  order: 280
- id: Grow
  description: Read and preview referral programs, milestones, referrers and recommendations.
  order: 290
- id: Earn
  description: Record conversions and read paid members, plans, payments, revenue and the Earn settings.
  order: 300
- id: Offers
  description: Create, change and end offers, with their coupons in the payment provider.
  order: 310
- id: Gifts
  description: Manage gift options and the gift page, and resend or reschedule gifts.
  order: 320
- id: Sponsors
  description: Manage sponsors, slots, bookings, creatives and sponsor reports.
  order: 330
- id: Products
  description: Create, publish and archive digital products, upload their files, and manage orders and downloads.
  order: 340
- id: Stores
  description: Read connected stores, their products and activity, and the store revenue credited to email.
  order: 350
- id: Forms
  description: Create, publish, pause and translate signup forms, and publish the text message terms page.
  order: 360
- id: Signup forms
  description: Offer a file download after a signup form's confirmation, and find the pages that use a form.
  order: 370
- id: Public pages
  description: Set the branding, text, custom domain and Turnstile keys of the subscribe, preference, unsubscribe and archive pages.
  order: 380
- id: Pages
  description: Build, preview, publish and schedule landing and sales pages, with their version history.
  order: 390
- id: Website
  description: Manage the newsletter website, including posts, the home page and navigation, access settings and tags.
  order: 400
- id: Channels
  description: Read which channels the workspace can send on.
  order: 410
- id: SMS campaigns
  description: Create, test, send, pause and report on SMS campaigns.
  order: 420
- id: SMS audience
  description: Manage contacts' phone numbers and SMS consent, and the SMS suppression list.
  order: 430
- id: SMS providers
  description: Connect SMS providers and manage senders, registrations, routes by country, rules and test numbers.
  order: 440
- id: Push campaigns
  description: Create, send, schedule and report on web push campaigns.
  order: 450
- id: Push
  description: Set up web push, including keys, sites, prompts and contacts' browser subscriptions.
  order: 460
- id: WhatsApp campaigns
  description: Create, send, schedule and report on WhatsApp campaigns.
  order: 470
- id: WhatsApp
  description: Read the WhatsApp account, templates, consent, costs and events, and sync the templates from Meta.
  order: 480
- id: Deliverability
  description: Read domain, IP and provider health, run checks, upload DMARC reports and request delistings.
  order: 490
- id: Placement tests
  description: Plan inbox placement tests, read their results and seed mailboxes, and set when copies are deleted.
  order: 500
- id: Sending providers
  description: Manage connected sending providers, their webhooks and credentials, the provider event log and suppression sync.
  order: 510
- id: Connect a provider
  description: Connect a sending provider step by step, from credentials and sending domain to a test send and streams.
  order: 520
- id: Routing
  description: Read, replace and test the routing rules of each stream.
  order: 530
- id: Warm-up
  description: Start, change, pause and resume warm-up plans for a provider or a dedicated IP.
  order: 540
- id: Senders & domains
  description: Add sending domains and check their DNS records, and manage sender identities and sending defaults.
  order: 550
- id: Adapters
  description: List the built-in and community provider adapters.
  order: 560
- id: Integration API
  description: Test an API key's connection, and give integrations the fields, forms, lists, templates and REST hooks they use.
  order: 570
- id: Integrations
  description: Read the integrations catalog, connections and call logs, and connect, sync or disconnect HostRepute.
  order: 580
- id: WordPress plugin
  description: The operations the WordPress plugin calls for signup forms, post drafts, abandoned checkouts and site reports.
  order: 590
- id: Webhooks
  description: Manage outgoing webhook endpoints and read, retry, replay or test their deliveries.
  order: 600
- id: API keys
  description: List, revoke and delete API keys.
  order: 610
- id: MCP agents
  description: Read the MCP server settings, agents and their recent tool calls, and revoke or delete agents.
  order: 620
- id: AI assistant
  description: Read the AI assistant's settings and activity log, and a campaign's AI summary and translations.
  order: 630
- id: Team
  description: List members with their effective permissions, and pending invitations.
  order: 640
- id: Roles
  description: List roles and the permission catalog, and preview who gains or loses what before a role changes.
  order: 650
- id: Audit log
  description: Read, filter and export the workspace's audit log, and read its retention settings.
  order: 660
- id: Agency
  description: Read the agency that manages the workspace.
  order: 670
