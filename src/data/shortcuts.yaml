- id: app.search
  keys: ['⌘K']
  action:
    en: Search everything
    vi: Tìm mọi thứ

- id: app.new-campaign
  keys: ['N']
  action:
    en: New campaign
    vi: Chiến dịch mới

- id: app.save
  keys: ['⌘S']
  action:
    en: Save version
    vi: Lưu phiên bản

- id: app.readiness
  keys: ['⌘Enter']
  action:
    en: Open Send Readiness
    vi: Mở Độ sẵn sàng gửi

- id: app.go-overview
  keys: ['G', 'O']
  action:
    en: Go to Overview
    vi: Đi đến Tổng quan

- id: app.go-campaigns
  keys: ['G', 'C']
  action:
    en: Go to Campaigns
    vi: Đi đến Chiến dịch

- id: app.go-automations
  keys: ['G', 'U']
  action:
    en: Go to Automations
    vi: Đi đến Tự động hóa

- id: app.go-audience
  keys: ['G', 'A']
  action:
    en: Go to Audience
    vi: Đi đến Người đăng ký

- id: app.go-forms
  keys: ['G', 'F']
  action:
    en: Go to Forms & pages
    vi: Đi đến Biểu mẫu và trang

- id: app.go-deliverability
  keys: ['G', 'D']
  action:
    en: Go to Deliverability
    vi: Đi đến Khả năng vào hộp thư

- id: app.go-providers
  keys: ['G', 'P']
  action:
    en: Go to Sending providers
    vi: Đi đến Nhà cung cấp gửi thư

- id: app.go-settings
  keys: ['G', 'S']
  action:
    en: Go to Settings
    vi: Đi đến Cài đặt

- id: app.close
  keys: ['Esc']
  action:
    en: Close panel or dialog
    vi: Đóng bảng hoặc hộp thoại

- id: app.help
  keys: ['?']
  action:
    en: Show the keyboard shortcuts
    vi: Hiện bảng phím tắt

- id: composer.save
  keys: ['⌘S']
  action:
    en: Save a version now
    vi: Lưu một phiên bản ngay

- id: composer.undo
  keys: ['⌘Z']
  action:
    en: Undo, the subject, preheader and A/B test included
    vi: Hoàn tác, cả tiêu đề, dòng xem trước và thử nghiệm A/B

- id: composer.redo
  keys: ['⇧⌘Z']
  action:
    en: Redo
    vi: Làm lại

- id: composer.copy-paste
  keys: ['⌘C · ⌘V']
  action:
    en: Copy and paste the selected component
    vi: Sao chép và dán thành phần đang chọn

- id: composer.delete
  keys: ['Delete']
  action:
    en: Delete the selected component
    vi: Xóa thành phần đang chọn

- id: composer.enter
  keys: ['Enter']
  action:
    en: Edit the selected text, or select the first element inside the selection
    vi: Sửa văn bản đang chọn, hoặc chọn thành phần đầu tiên bên trong

- id: composer.stop-editing
  keys: ['Esc']
  action:
    en: Stop editing text, or select the parent
    vi: Dừng sửa văn bản, hoặc chọn thành phần cha

- id: composer.move
  keys: ['↑ ↓']
  action:
    en: Move the selected component up or down, with its Move button focused
    vi: Đưa thành phần đang chọn lên hoặc xuống khi nút Di chuyển của nó đang có tiêu điểm

- id: composer.layers
  keys: ['↑ ↓ → ←']
  action:
    en: In Layers, move between layers, open and close them; Enter selects one on the email
    vi: Trong Lớp, di chuyển giữa các lớp, mở và đóng chúng; Enter chọn lớp đó trên email

- id: composer.bold-italic
  keys: ['⌘B · ⌘I']
  action:
    en: Bold and italic while editing text
    vi: Đậm và nghiêng khi đang sửa văn bản

- id: composer.write-move
  keys: ['Alt ↑ ↓']
  action:
    en: In Write mode, move the block you are in up or down
    vi: Ở chế độ Viết, đưa khối đang soạn lên hoặc xuống

- id: composer.help
  keys: ['⌘/']
  action:
    en: Show the composer's shortcuts
    vi: Hiện các phím tắt của trình soạn thảo
