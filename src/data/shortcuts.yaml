- id: app.search
  keys: ['⌘K']
  action:
    en: Open the command palette to search everything
    vi: Mở bảng lệnh để tìm mọi thứ
    de: Befehlspalette öffnen, um alles zu durchsuchen
    es: Abrir la paleta de comandos para buscar en todo
    fr: Ouvrir la palette de commandes pour tout rechercher

- id: app.palette-move
  keys: ['↑ ↓']
  action:
    en: In the command palette, move between results
    vi: Trong bảng lệnh, di chuyển giữa các kết quả
    de: In der Befehlspalette zwischen den Ergebnissen wechseln
    es: En la paleta de comandos, moverse entre los resultados
    fr: Dans la palette de commandes, passer d’un résultat à l’autre

- id: app.palette-open
  keys: ['Enter']
  action:
    en: In the command palette, open the highlighted result
    vi: Trong bảng lệnh, mở kết quả đang được chọn
    de: In der Befehlspalette das markierte Ergebnis öffnen
    es: En la paleta de comandos, abrir el resultado resaltado
    fr: Dans la palette de commandes, ouvrir le résultat en surbrillance

- id: app.new-campaign
  keys: ['N']
  action:
    en: New campaign
    vi: Chiến dịch mới
    de: Neue Kampagne
    es: Nueva campaña
    fr: Nouvelle campagne

- id: app.save
  keys: ['⌘S']
  action:
    en: Save version
    vi: Lưu phiên bản
    de: Version speichern
    es: Guardar versión
    fr: Enregistrer la version

- id: app.readiness
  keys: ['⌘Enter']
  action:
    en: Open Send Readiness
    vi: Mở Độ sẵn sàng gửi
    de: Versandbereitschaft öffnen
    es: Abrir la revisión previa
    fr: Ouvrir le contrôle avant envoi

- id: app.go-overview
  keys: ['G', 'O']
  action:
    en: Go to Overview
    vi: Đi đến Tổng quan
    de: Zur Übersicht
    es: Ir a Resumen
    fr: Aller à la vue d’ensemble

- id: app.go-campaigns
  keys: ['G', 'C']
  action:
    en: Go to Campaigns
    vi: Đi đến Chiến dịch
    de: Zu den Kampagnen
    es: Ir a Campañas
    fr: Aller à Campagnes

- id: app.go-automations
  keys: ['G', 'U']
  action:
    en: Go to Automations
    vi: Đi đến Tự động hóa
    de: Zu den Automationen
    es: Ir a Automatizaciones
    fr: Aller à Automatisations

- id: app.go-audience
  keys: ['G', 'A']
  action:
    en: Go to Audience
    vi: Đi đến Người đăng ký
    de: Zur Zielgruppe
    es: Ir a Audiencia
    fr: Aller à Audience

- id: app.go-forms
  keys: ['G', 'F']
  action:
    en: Go to Forms & pages
    vi: Đi đến Biểu mẫu và trang
    de: Zu „Formulare & Seiten“
    es: Ir a Formularios y páginas
    fr: Aller à Formulaires et pages

- id: app.go-deliverability
  keys: ['G', 'D']
  action:
    en: Go to Deliverability
    vi: Đi đến Khả năng vào hộp thư
    de: Zur Zustellbarkeit
    es: Ir a Entregabilidad
    fr: Aller à Délivrabilité

- id: app.go-providers
  keys: ['G', 'P']
  action:
    en: Go to Sending providers
    vi: Đi đến Nhà cung cấp gửi thư
    de: Zu den Versandanbietern
    es: Ir a Proveedores de envío
    fr: Aller à Fournisseurs d’envoi

- id: app.go-settings
  keys: ['G', 'S']
  action:
    en: Go to Settings
    vi: Đi đến Cài đặt
    de: Zu den Einstellungen
    es: Ir a Configuración
    fr: Aller à Paramètres

- id: app.close
  keys: ['Esc']
  action:
    en: Close panel or dialog
    vi: Đóng bảng hoặc hộp thoại
    de: Bereich oder Dialog schließen
    es: Cerrar el panel o el diálogo
    fr: Fermer le panneau ou la boîte de dialogue

- id: app.help
  keys: ['?']
  action:
    en: Show the keyboard shortcuts
    vi: Hiện bảng phím tắt
    de: Tastenkürzel anzeigen
    es: Mostrar los atajos de teclado
    fr: Afficher les raccourcis clavier

- id: app.replies-next-previous
  keys: ['J · K']
  action:
    en: In Audience › Replies, open the next or the previous reply
    vi: Trong Người đăng ký › Thư trả lời, mở thư trả lời tiếp theo hoặc trước đó
    de: Unter Zielgruppe › Antworten die nächste oder vorige Antwort öffnen
    es: En Audiencia › Respuestas, abrir la respuesta siguiente o la anterior
    fr: Dans Audience › Réponses, ouvrir la réponse suivante ou la précédente

- id: app.replies-done
  keys: ['E']
  action:
    en: In Audience › Replies, mark the open reply done
    vi: Trong Người đăng ký › Thư trả lời, đánh dấu thư trả lời đang xem là đã xong
    de: Unter Zielgruppe › Antworten die geöffnete Antwort als erledigt markieren
    es: En Audiencia › Respuestas, marcar como hecha la respuesta abierta
    fr: Dans Audience › Réponses, marquer comme traitée la réponse ouverte

- id: composer.save
  keys: ['⌘S']
  action:
    en: Save a version now
    vi: Lưu một phiên bản ngay
    de: Jetzt eine Version speichern
    es: Guardar una versión ahora
    fr: Enregistrer une version maintenant

- id: composer.undo
  keys: ['⌘Z']
  action:
    en: Undo, the subject, preheader and A/B test included
    vi: Hoàn tác, cả tiêu đề, dòng xem trước và thử nghiệm A/B
    de: Rückgängig, auch für Betreff, Vorschautext und A/B-Test
    es: Deshacer, incluidos el asunto, el preencabezado y la prueba A/B
    fr: Annuler, y compris l’objet, le texte d’aperçu et le test A/B

- id: composer.redo
  keys: ['⇧⌘Z']
  action:
    en: Redo
    vi: Làm lại
    de: Wiederholen
    es: Rehacer
    fr: Rétablir

- id: composer.copy-paste
  keys: ['⌘C · ⌘V']
  action:
    en: Copy and paste the selected component
    vi: Sao chép và dán thành phần đang chọn
    de: Ausgewähltes Element kopieren und einfügen
    es: Copiar y pegar el componente seleccionado
    fr: Copier et coller le composant sélectionné

- id: composer.delete
  keys: ['Delete']
  action:
    en: Delete the selected component
    vi: Xóa thành phần đang chọn
    de: Ausgewähltes Element löschen
    es: Eliminar el componente seleccionado
    fr: Supprimer le composant sélectionné

- id: composer.enter
  keys: ['Enter']
  action:
    en: Edit the selected text, or select the first element inside the selection
    vi: Sửa văn bản đang chọn, hoặc chọn thành phần đầu tiên bên trong
    de: Ausgewählten Text bearbeiten oder das erste Element in der Auswahl auswählen
    es: Editar el texto seleccionado o seleccionar el primer elemento de la selección
    fr: Modifier le texte sélectionné, ou sélectionner le premier élément de la sélection

- id: composer.stop-editing
  keys: ['Esc']
  action:
    en: Stop editing text, or select the parent
    vi: Dừng sửa văn bản, hoặc chọn thành phần cha
    de: Textbearbeitung beenden oder übergeordnetes Element auswählen
    es: Dejar de editar el texto o seleccionar el elemento superior
    fr: Arrêter de modifier le texte, ou sélectionner le parent

- id: composer.move
  keys: ['↑ ↓']
  action:
    en: Move the selected component up or down, with its Move button focused
    vi: Đưa thành phần đang chọn lên hoặc xuống khi nút Di chuyển của nó đang có tiêu điểm
    de: Ausgewähltes Element nach oben oder unten verschieben, mit dem Fokus auf seinem Button „Verschieben“
    es: Mover el componente seleccionado arriba o abajo, con el foco en su botón Mover
    fr: Déplacer le composant sélectionné vers le haut ou le bas, le focus sur son bouton Déplacer

- id: composer.layers
  keys: ['↑ ↓ → ←']
  action:
    en: In Layers, move between layers, open and close them; Enter selects one on the email
    vi: Trong Lớp, di chuyển giữa các lớp, mở và đóng chúng; Enter chọn lớp đó trên email
    de: In Ebenen zwischen Ebenen wechseln, sie öffnen und schließen; die Eingabetaste wählt eine in der E-Mail aus
    es: En Capas, moverse entre capas, abrirlas y cerrarlas; Intro selecciona una en el correo
    fr: Dans Calques, passer d’un calque à l’autre, les ouvrir et les fermer ; Entrée en sélectionne un dans l’e-mail

- id: composer.bold-italic
  keys: ['⌘B · ⌘I']
  action:
    en: Bold and italic while editing text
    vi: Đậm và nghiêng khi đang sửa văn bản
    de: Fett und kursiv beim Bearbeiten von Text
    es: Negrita y cursiva al editar texto
    fr: Gras et italique pendant l’édition du texte

- id: composer.write-move
  keys: ['Alt ↑ ↓']
  action:
    en: In Write mode, move the block you are in up or down
    vi: Ở chế độ Viết, đưa khối đang soạn lên hoặc xuống
    de: Im Modus „Schreiben“ den aktuellen Block nach oben oder unten verschieben
    es: En el modo Escribir, mover arriba o abajo el bloque en el que estás
    fr: En mode Rédaction, déplacer vers le haut ou le bas le bloc dans lequel vous êtes

- id: composer.help
  keys: ['⌘/']
  action:
    en: Show the composer's shortcuts
    vi: Hiện các phím tắt của trình soạn thảo
    de: Tastenkürzel des Editors anzeigen
    es: Mostrar los atajos del editor
    fr: Afficher les raccourcis de l’éditeur
