- id: _global
  command: reputecast <command> [flags]
  summary:
    en: Flags every command accepts.
    vi: Các cờ mà mọi lệnh đều chấp nhận.
    de: Flags, die jeder Befehl akzeptiert.
    es: Opciones que acepta cualquier comando.
    fr: Options acceptées par toutes les commandes.
  description:
    en: >-
      Flags override the config file and environment variables. Commands that need no configuration (`openapi`,
      `secrets generate-key`, `healthcheck`, `version`) ignore them.
    vi: >-
      Cờ ghi đè tệp cấu hình và biến môi trường. Các lệnh không cần cấu hình (`openapi`, `secrets generate-key`,
      `healthcheck`, `version`) bỏ qua các cờ này.
    de: >-
      Flags haben Vorrang vor der Konfigurationsdatei und den Umgebungsvariablen. Befehle, die keine Konfiguration
      brauchen (`openapi`, `secrets generate-key`, `healthcheck`, `version`), ignorieren sie.
    es: >-
      Las opciones prevalecen sobre el archivo de configuración y las variables de entorno. Los comandos que no
      necesitan configuración (`openapi`, `secrets generate-key`, `healthcheck`, `version`) las ignoran.
    fr: >-
      Les options remplacent le fichier de configuration et les variables d’environnement. Les commandes qui n’ont
      besoin d’aucune configuration (`openapi`, `secrets generate-key`, `healthcheck`, `version`) les ignorent.
  flags:
    - name: --config
      type: string
      default: ''
      description:
        en: Path to a YAML config file. Without it, ReputeCast reads the file named in `REPUTECAST_CONFIG`, if any.
        vi: >-
          Đường dẫn đến tệp cấu hình YAML. Nếu không có cờ này, ReputeCast đọc tệp được chỉ định trong
          `REPUTECAST_CONFIG`, nếu có.
        de: >-
          Pfad zu einer YAML-Konfigurationsdatei. Ohne dieses Flag liest ReputeCast die in `REPUTECAST_CONFIG`
          angegebene Datei, sofern vorhanden.
        es: >-
          Ruta a un archivo de configuración YAML. Sin ella, ReputeCast lee el archivo indicado en `REPUTECAST_CONFIG`,
          si lo hay.
        fr: >-
          Chemin d’un fichier de configuration YAML. Sans cette option, ReputeCast lit le fichier indiqué dans
          `REPUTECAST_CONFIG`, s’il y en a un.
    - name: --database-url
      type: string
      default: ''
      description:
        en: >-
          PostgreSQL connection URL. Overrides `database.url` from the config file, `REPUTECAST_DATABASE__URL` and
          `DATABASE_URL`.
        vi: >-
          URL kết nối PostgreSQL. Ghi đè `database.url` trong tệp cấu hình, `REPUTECAST_DATABASE__URL` và
          `DATABASE_URL`.
        de: >-
          Verbindungs-URL für PostgreSQL. Hat Vorrang vor `database.url` aus der Konfigurationsdatei,
          `REPUTECAST_DATABASE__URL` und `DATABASE_URL`.
        es: >-
          URL de conexión a PostgreSQL. Prevalece sobre `database.url` del archivo de configuración,
          `REPUTECAST_DATABASE__URL` y `DATABASE_URL`.
        fr: >-
          URL de connexion PostgreSQL. Remplace `database.url` du fichier de configuration, `REPUTECAST_DATABASE__URL`
          et `DATABASE_URL`.
    - name: --log-level
      type: string
      default: ''
      description:
        en: 'Log level: `debug`, `info`, `warn` or `error`. Overrides `log.level`.'
        vi: 'Mức log: `debug`, `info`, `warn` hoặc `error`. Ghi đè `log.level`.'
        de: 'Log-Level: `debug`, `info`, `warn` oder `error`. Hat Vorrang vor `log.level`.'
        es: 'Nivel de registro: `debug`, `info`, `warn` o `error`. Prevalece sobre `log.level`.'
        fr: 'Niveau de journalisation : `debug`, `info`, `warn` ou `error`. Remplace `log.level`.'

- id: serve
  command: reputecast serve [--role <roles>] [--addr <address>] [--auto-migrate] [--auto-install]
  summary:
    en: Run the web app, API, webhook ingest and workers.
    vi: Chạy ứng dụng web, API, phần tiếp nhận webhook và các worker.
    de: Web-App, API, Webhook-Empfang und Worker ausführen.
    es: Ejecutar la aplicación web, la API, la ingesta de webhooks y los workers.
    fr: Exécuter l’application web, l’API, la réception des webhooks et les workers.
  description:
    en: >-
      By default one process runs every role. Use `--role` to split the roles across processes, for example several
      web and ingest nodes behind a load balancer and one worker. Without `--auto-migrate`, a process whose database
      schema is behind the release serves read-only and holds its workers until `reputecast migrate up` runs. Processes
      with the web role also run the SMTP relay once an instance admin turns it on.
    vi: >-
      Theo mặc định, một tiến trình chạy mọi vai trò. Dùng `--role` để chia các vai trò cho nhiều tiến trình, ví dụ vài
      node web và ingest sau một bộ cân bằng tải cùng một worker. Không có `--auto-migrate`, tiến trình có lược đồ cơ sở
      dữ liệu cũ hơn bản phát hành sẽ chỉ cho đọc và giữ các worker lại cho đến khi chạy `reputecast migrate up`. Các
      tiến trình có vai trò web cũng chạy SMTP relay sau khi quản trị viên hệ thống bật nó.
    de: >-
      Standardmäßig führt ein Prozess alle Rollen aus. Mit `--role` verteilen Sie die Rollen auf mehrere Prozesse, zum
      Beispiel mehrere Web- und Ingest-Knoten hinter einem Load Balancer und einen Worker. Ohne `--auto-migrate`
      arbeitet ein Prozess, dessen Datenbankschema hinter dem Release zurückliegt, nur lesend und hält seine Worker an,
      bis `reputecast migrate up` läuft. Prozesse mit der Rolle web betreiben außerdem das SMTP-Relay, sobald ein
      Instanz-Admin es aktiviert.
    es: >-
      Por defecto, un solo proceso ejecuta todos los roles. Usa `--role` para repartir los roles entre procesos, por
      ejemplo varios nodos web y de ingesta detrás de un balanceador de carga y un worker. Sin `--auto-migrate`, un
      proceso cuyo esquema de base de datos va por detrás de la versión funciona en solo lectura y retiene sus workers
      hasta que se ejecuta `reputecast migrate up`. Los procesos con el rol web también ejecutan el SMTP relay en cuanto
      quien administra la instancia lo activa.
    fr: >-
      Par défaut, un seul processus exécute tous les rôles. Utilisez `--role` pour répartir les rôles entre plusieurs
      processus, par exemple plusieurs nœuds web et ingest derrière un répartiteur de charge et un worker. Sans
      `--auto-migrate`, un processus dont le schéma de base de données est en retard sur la version fonctionne en
      lecture seule et retient ses workers jusqu’à l’exécution de `reputecast migrate up`. Les processus qui ont le rôle
      web exécutent aussi le relais SMTP dès qu’un admin de l’instance l’active.
  flags:
    - name: --role
      type: string
      default: ''
      description:
        en: >-
          Comma-separated roles to run: `web`, `worker`, `ingest`. Without it, the `roles` config key applies (all three
          by default).
        vi: >-
          Các vai trò cần chạy, phân tách bằng dấu phẩy: `web`, `worker`, `ingest`. Nếu không có cờ này, khóa cấu hình
          `roles` được áp dụng (mặc định là cả ba).
        de: >-
          Kommagetrennte Rollen, die ausgeführt werden: `web`, `worker`, `ingest`. Ohne dieses Flag gilt der
          Konfigurationsschlüssel `roles` (standardmäßig alle drei).
        es: >-
          Roles que se ejecutan, separados por comas: `web`, `worker`, `ingest`. Sin ella, se aplica la clave de
          configuración `roles` (los tres por defecto).
        fr: >-
          Rôles à exécuter, séparés par des virgules : `web`, `worker`, `ingest`. Sans cette option, la clé de
          configuration `roles` s’applique (les trois par défaut).
    - name: --addr
      type: string
      default: ''
      description:
        en: Listen address. Without it, `http.addr` applies (`:8080` by default).
        vi: Địa chỉ lắng nghe. Nếu không có cờ này, `http.addr` được áp dụng (mặc định `:8080`).
        de: Adresse, auf der gelauscht wird. Ohne dieses Flag gilt `http.addr` (standardmäßig `:8080`).
        es: Dirección de escucha. Sin ella, se aplica `http.addr` (`:8080` por defecto).
        fr: Adresse d’écoute. Sans cette option, `http.addr` s’applique (`:8080` par défaut).
    - name: --auto-migrate
      type: bool
      default: 'false'
      description:
        en: Apply pending migrations at start. The default comes from `REPUTECAST_AUTO_MIGRATE` when it is set.
        vi: >-
          Áp dụng các migration đang chờ khi khởi động. Giá trị mặc định lấy từ `REPUTECAST_AUTO_MIGRATE` khi biến này
          được đặt.
        de: >-
          Ausstehende Migrationen beim Start anwenden. Der Standardwert kommt aus `REPUTECAST_AUTO_MIGRATE`, wenn diese
          Variable gesetzt ist.
        es: >-
          Aplicar las migraciones pendientes al arrancar. El valor predeterminado viene de `REPUTECAST_AUTO_MIGRATE`
          cuando está definida.
        fr: >-
          Appliquer les migrations en attente au démarrage. La valeur par défaut vient de `REPUTECAST_AUTO_MIGRATE`
          lorsqu’elle est définie.
    - name: --auto-install
      type: bool
      default: 'false'
      description:
        en: >-
          Create the first Owner when the database has no users, from `REPUTECAST_ADMIN_EMAIL`, `REPUTECAST_ADMIN_NAME`
          and `REPUTECAST_ADMIN_PASSWORD`, and print the sign-in details to the log. The default comes from
          `REPUTECAST_AUTO_INSTALL` when it is set.
        vi: >-
          Tạo Chủ sở hữu đầu tiên khi cơ sở dữ liệu chưa có người dùng, từ `REPUTECAST_ADMIN_EMAIL`,
          `REPUTECAST_ADMIN_NAME` và `REPUTECAST_ADMIN_PASSWORD`, rồi in thông tin đăng nhập vào log. Giá trị mặc định
          lấy từ `REPUTECAST_AUTO_INSTALL` khi biến này được đặt.
        de: >-
          Den ersten Inhaber anlegen, wenn die Datenbank keine Benutzer hat, aus `REPUTECAST_ADMIN_EMAIL`,
          `REPUTECAST_ADMIN_NAME` und `REPUTECAST_ADMIN_PASSWORD`, und die Anmeldedaten ins Log schreiben. Der
          Standardwert kommt aus `REPUTECAST_AUTO_INSTALL`, wenn diese Variable gesetzt ist.
        es: >-
          Crear el primer Propietario cuando la base de datos no tiene usuarios, a partir de `REPUTECAST_ADMIN_EMAIL`,
          `REPUTECAST_ADMIN_NAME` y `REPUTECAST_ADMIN_PASSWORD`, y escribir los datos de acceso en el registro. El valor
          predeterminado viene de `REPUTECAST_AUTO_INSTALL` cuando está definida.
        fr: >-
          Créer le premier Propriétaire lorsque la base de données n’a aucun utilisateur, à partir de
          `REPUTECAST_ADMIN_EMAIL`, `REPUTECAST_ADMIN_NAME` et `REPUTECAST_ADMIN_PASSWORD`, et écrire les informations
          de connexion dans le journal. La valeur par défaut vient de `REPUTECAST_AUTO_INSTALL` lorsqu’elle est définie.
  examples:
    - code: reputecast serve
      description:
        en: Run every role in one process.
        vi: Chạy mọi vai trò trong một tiến trình.
        de: Alle Rollen in einem Prozess ausführen.
        es: Ejecutar todos los roles en un solo proceso.
        fr: Exécuter tous les rôles dans un seul processus.
    - code: reputecast serve --role=web,ingest
      description:
        en: Serve the web app, API and provider webhooks only; run the workers in another process.
        vi: Chỉ phục vụ ứng dụng web, API và webhook của nhà cung cấp; chạy các worker ở một tiến trình khác.
        de: Nur Web-App, API und Webhooks der Anbieter bereitstellen; die Worker laufen in einem anderen Prozess.
        es: >-
          Servir solo la aplicación web, la API y los webhooks de los proveedores; ejecutar los workers en otro proceso.
        fr: >-
          Servir uniquement l’application web, l’API et les webhooks des fournisseurs ; exécuter les workers dans un
          autre processus.
    - code: reputecast serve --auto-migrate --auto-install
      description:
        en: What the Docker image runs at start.
        vi: Lệnh mà Docker image chạy khi khởi động.
        de: Was das Docker-Image beim Start ausführt.
        es: Lo que ejecuta la imagen de Docker al arrancar.
        fr: Ce que l’image Docker exécute au démarrage.

- id: worker
  command: reputecast worker
  summary:
    en: Run only the background workers.
    vi: Chỉ chạy các worker nền.
    de: Nur die Hintergrund-Worker ausführen.
    es: Ejecutar solo los workers en segundo plano.
    fr: Exécuter uniquement les workers en arrière-plan.
  description:
    en: >-
      Same as `serve --role=worker`. Runs sends, event processing, syncs and scheduled jobs. Its only HTTP listener is
      the metrics listener (`metrics.addr`, `:9464` by default), which also answers `/healthz` and `/readyz`. It doesn't
      apply migrations: while the schema is behind the release, its workers wait. Run at least one worker per instance.
    vi: >-
      Tương đương `serve --role=worker`. Chạy việc gửi, xử lý sự kiện, đồng bộ và các tác vụ theo lịch. Cổng HTTP duy
      nhất của lệnh này là cổng số liệu (`metrics.addr`, mặc định `:9464`), cổng này cũng trả lời `/healthz` và
      `/readyz`. Lệnh không áp dụng migration: khi lược đồ cũ hơn bản phát hành, các worker sẽ chờ. Hãy chạy ít nhất một
      worker cho mỗi hệ thống.
    de: >-
      Entspricht `serve --role=worker`. Führt Versände, Ereignisverarbeitung, Synchronisierungen und geplante Jobs aus.
      Sein einziger HTTP-Listener ist der Metrik-Listener (`metrics.addr`, standardmäßig `:9464`), der auch `/healthz`
      und `/readyz` beantwortet. Er wendet keine Migrationen an: Solange das Schema hinter dem Release zurückliegt,
      warten seine Worker. Führen Sie pro Instanz mindestens einen Worker aus.
    es: >-
      Equivale a `serve --role=worker`. Ejecuta los envíos, el procesamiento de eventos, las sincronizaciones y las
      tareas programadas. Su único listener HTTP es el de métricas (`metrics.addr`, `:9464` por defecto), que también
      responde a `/healthz` y `/readyz`. No aplica migraciones: mientras el esquema va por detrás de la versión, sus
      workers esperan. Ejecuta al menos un worker por instancia.
    fr: >-
      Équivaut à `serve --role=worker`. Exécute les envois, le traitement des événements, les synchronisations et les
      tâches programmées. Son seul écouteur HTTP est l’écouteur de métriques (`metrics.addr`, `:9464` par défaut), qui
      répond aussi à `/healthz` et `/readyz`. Il n’applique pas les migrations : tant que le schéma est en retard sur la
      version, ses workers attendent. Exécutez au moins un worker par instance.
  examples:
    - code: reputecast worker
      description:
        en: Start a worker process next to processes that run `serve --role=web,ingest`.
        vi: Khởi động một tiến trình worker bên cạnh các tiến trình chạy `serve --role=web,ingest`.
        de: Einen Worker-Prozess neben Prozessen starten, die `serve --role=web,ingest` ausführen.
        es: Iniciar un proceso worker junto a procesos que ejecutan `serve --role=web,ingest`.
        fr: Démarrer un processus worker à côté de processus qui exécutent `serve --role=web,ingest`.

- id: migrate
  command: reputecast migrate <up|down|status|partition-events|segments-role>
  summary:
    en: Manage the database schema.
    vi: Quản lý lược đồ cơ sở dữ liệu.
    de: Datenbankschema verwalten.
    es: Gestionar el esquema de la base de datos.
    fr: Gérer le schéma de la base de données.

- id: migrate up
  command: reputecast migrate up
  summary:
    en: Apply all pending migrations.
    vi: Áp dụng mọi migration đang chờ.
    de: Alle ausstehenden Migrationen anwenden.
    es: Aplicar todas las migraciones pendientes.
    fr: Appliquer toutes les migrations en attente.
  description:
    en: >-
      Applies ReputeCast's migrations, then the job queue's, and prints `Database is up to date.` Migrations take a
      lock, so processes that start together run them once.
    vi: >-
      Áp dụng các migration của ReputeCast, rồi của hàng đợi tác vụ, và in ra `Database is up to date.` Migration giữ
      một khóa, nên các tiến trình khởi động cùng lúc chỉ chạy chúng một lần.
    de: >-
      Wendet die Migrationen von ReputeCast an, danach die der Job-Warteschlange, und gibt `Database is up to date.`
      aus. Migrationen setzen eine Sperre, sodass Prozesse, die gleichzeitig starten, sie nur einmal ausführen.
    es: >-
      Aplica las migraciones de ReputeCast y después las de la cola de tareas, y escribe `Database is up to date.` Las
      migraciones toman un bloqueo, así que los procesos que arrancan a la vez las ejecutan una sola vez.
    fr: >-
      Applique les migrations de ReputeCast, puis celles de la file de tâches, et affiche `Database is up to date.` Les
      migrations prennent un verrou : des processus qui démarrent ensemble ne les exécutent donc qu’une fois.
  examples:
    - code: reputecast migrate up
      description:
        en: Apply migrations after replacing the binary with a new version.
        vi: Áp dụng migration sau khi thay binary bằng phiên bản mới.
        de: Migrationen anwenden, nachdem die Binärdatei durch eine neue Version ersetzt wurde.
        es: Aplicar las migraciones después de reemplazar el binario por una versión nueva.
        fr: Appliquer les migrations après avoir remplacé le binaire par une nouvelle version.

- id: migrate down
  command: reputecast migrate down
  summary:
    en: Roll back the latest migration.
    vi: Hoàn tác migration gần nhất.
    de: Letzte Migration zurücknehmen.
    es: Revertir la última migración.
    fr: Annuler la dernière migration.
  description:
    en: Rolls back one migration only. Run it again to roll back further.
    vi: Chỉ hoàn tác một migration. Chạy lại lệnh để hoàn tác thêm.
    de: Nimmt nur eine Migration zurück. Führen Sie den Befehl erneut aus, um weiter zurückzugehen.
    es: Revierte una sola migración. Vuelve a ejecutarlo para revertir más.
    fr: N’annule qu’une seule migration. Exécutez-la de nouveau pour revenir plus loin en arrière.
  examples:
    - code: reputecast migrate down
      description:
        en: Roll back the most recent migration.
        vi: Hoàn tác migration mới nhất.
        de: Die zuletzt angewendete Migration zurücknehmen.
        es: Revertir la migración más reciente.
        fr: Annuler la migration la plus récente.

- id: migrate status
  command: reputecast migrate status
  summary:
    en: List migrations and whether they are applied.
    vi: Liệt kê các migration và cho biết đã áp dụng hay chưa.
    de: Migrationen auflisten und anzeigen, ob sie angewendet sind.
    es: Listar las migraciones e indicar si están aplicadas.
    fr: Lister les migrations et indiquer si elles sont appliquées.
  description:
    en: >-
      Prints the columns `VERSION`, `APPLIED` and `FILE`. `APPLIED` shows the date and time a migration ran, or
      `pending`.
    vi: In ra các cột `VERSION`, `APPLIED` và `FILE`. `APPLIED` cho biết ngày giờ migration đã chạy, hoặc `pending`.
    de: >-
      Gibt die Spalten `VERSION`, `APPLIED` und `FILE` aus. `APPLIED` zeigt Datum und Uhrzeit, zu der eine Migration
      lief, oder `pending`.
    es: >-
      Escribe las columnas `VERSION`, `APPLIED` y `FILE`. `APPLIED` muestra la fecha y la hora en que se ejecutó una
      migración, o `pending`.
    fr: >-
      Affiche les colonnes `VERSION`, `APPLIED` et `FILE`. `APPLIED` indique la date et l’heure d’exécution d’une
      migration, ou `pending`.
  examples:
    - code: reputecast migrate status
      description:
        en: Check for pending migrations before an upgrade.
        vi: Kiểm tra migration đang chờ trước khi nâng cấp.
        de: Vor einem Upgrade auf ausstehende Migrationen prüfen.
        es: Comprobar si hay migraciones pendientes antes de una actualización.
        fr: Vérifier les migrations en attente avant une mise à niveau.

- id: migrate partition-events
  command: reputecast migrate partition-events
  summary:
    en: Split `delivery_events` into monthly partitions, without copying it.
    vi: Chia `delivery_events` thành các phân vùng theo tháng mà không sao chép bảng.
    de: '`delivery_events` in monatliche Partitionen aufteilen, ohne die Tabelle zu kopieren.'
    es: Dividir `delivery_events` en particiones mensuales, sin copiar la tabla.
    fr: Découper `delivery_events` en partitions mensuelles, sans la copier.
  description:
    en: >-
      The upgrade to 1.3 does this at `migrate up` (or `serve --auto-migrate`); run it first to pick the moment, at a
      quiet hour on a very large table. Nothing is copied: the current table becomes the partition of everything before
      next month, and later months get their own. It builds an index without blocking writes, checks a bound, then swaps
      tables under a short lock. Safe while ReputeCast runs and safe to run again; on a partitioned table it only makes
      missing months. Back up first.
    vi: >-
      Bản nâng cấp lên 1.3 làm việc này khi chạy `migrate up` (hoặc `serve --auto-migrate`); hãy chạy lệnh này trước để
      tự chọn thời điểm, vào giờ vắng nếu bảng rất lớn. Không có gì bị sao chép: bảng hiện tại trở thành phân vùng chứa
      mọi thứ trước tháng sau, và các tháng tiếp theo có phân vùng riêng. Lệnh tạo một chỉ mục mà không chặn ghi, kiểm
      tra một giới hạn, rồi hoán đổi bảng trong một lần khóa ngắn. An toàn khi ReputeCast đang chạy và khi chạy lại; với
      bảng đã phân vùng, lệnh chỉ tạo các tháng còn thiếu. Hãy sao lưu trước.
    de: >-
      Das Upgrade auf 1.3 erledigt das bei `migrate up` (oder `serve --auto-migrate`); führen Sie den Befehl vorher aus,
      um den Zeitpunkt selbst zu wählen, bei einer sehr großen Tabelle zu einer ruhigen Stunde. Nichts wird kopiert: Die
      aktuelle Tabelle wird zur Partition für alles vor dem nächsten Monat, und spätere Monate erhalten eigene
      Partitionen. Der Befehl erstellt einen Index, ohne Schreibvorgänge zu blockieren, prüft eine Grenze und tauscht
      die Tabellen dann unter einer kurzen Sperre aus. Sicher, während ReputeCast läuft, und sicher bei erneuter
      Ausführung; bei einer bereits partitionierten Tabelle legt er nur fehlende Monate an. Erstellen Sie vorher ein
      Backup.
    es: >-
      La actualización a 1.3 lo hace en `migrate up` (o en `serve --auto-migrate`); ejecútalo antes para elegir el
      momento, en una hora tranquila si la tabla es muy grande. No se copia nada: la tabla actual pasa a ser la
      partición de todo lo anterior al mes siguiente, y los meses posteriores tienen la suya. Crea un índice sin
      bloquear las escrituras, comprueba un límite y después intercambia las tablas con un bloqueo breve. Es seguro
      mientras ReputeCast funciona y se puede volver a ejecutar; en una tabla ya particionada solo crea los meses que
      faltan. Haz antes una copia de seguridad.
    fr: >-
      La mise à niveau vers la version 1.3 le fait lors de `migrate up` (ou de `serve --auto-migrate`) ; exécutez-la
      avant pour choisir le moment, à une heure creuse sur une très grande table. Rien n’est copié : la table actuelle
      devient la partition de tout ce qui précède le mois prochain, et les mois suivants ont chacun la leur. La commande
      construit un index sans bloquer les écritures, vérifie une borne, puis échange les tables sous un verrou bref.
      Sans risque pendant que ReputeCast tourne, et sans risque à relancer ; sur une table déjà partitionnée, elle ne
      crée que les mois manquants. Faites d’abord une sauvegarde.
  examples:
    - code: reputecast migrate partition-events
      description:
        en: Partition `delivery_events` before upgrading, so the upgrade only drops the old dedupe index.
        vi: Phân vùng `delivery_events` trước khi nâng cấp, để bản nâng cấp chỉ còn xóa chỉ mục chống trùng cũ.
        de: >-
          `delivery_events` vor dem Upgrade partitionieren, damit das Upgrade nur noch den alten Deduplizierungsindex
          entfernt.
        es: >-
          Particionar `delivery_events` antes de actualizar, para que la actualización solo elimine el antiguo índice de
          deduplicación.
        fr: >-
          Partitionner `delivery_events` avant la mise à niveau, pour que celle-ci ne supprime que l’ancien index de
          dédoublonnage.

- id: migrate segments-role
  command: reputecast migrate segments-role
  summary:
    en: Set up the role SQL segments run as again, after restoring on a new server.
    vi: Thiết lập lại vai trò mà phân khúc SQL chạy dưới quyền, sau khi khôi phục trên máy chủ mới.
    de: Die Rolle, unter der SQL-Segmente laufen, nach einer Wiederherstellung auf einem neuen Server erneut einrichten.
    es: Volver a configurar el rol con el que se ejecutan los segmentos SQL, después de restaurar en un servidor nuevo.
    fr: Reconfigurer le rôle sous lequel s’exécutent les segments SQL, après une restauration sur un nouveau serveur.
  description:
    en: >-
      `pg_dump` doesn't carry roles. After restoring on a new server, create the role as a superuser (unless the app's
      user has `CREATEROLE`) with `CREATE ROLE reputecast_segments NOLOGIN NOINHERIT;` and `GRANT reputecast_segments TO
      <app user>;`, then run this: it hands the segment function back to the role and prints the role check of
      `doctor`. Safe to run again.
    vi: >-
      `pg_dump` không mang theo vai trò. Sau khi khôi phục trên máy chủ mới, hãy tạo vai trò bằng tài khoản superuser
      (trừ khi người dùng của ứng dụng có `CREATEROLE`) với `CREATE ROLE reputecast_segments NOLOGIN NOINHERIT;` và
      `GRANT reputecast_segments TO <app user>;`, rồi chạy lệnh này: lệnh trả hàm phân khúc về cho vai trò đó và in ra
      kết quả kiểm tra vai trò của `doctor`. An toàn khi chạy lại.
    de: >-
      `pg_dump` überträgt keine Rollen. Legen Sie nach der Wiederherstellung auf einem neuen Server die Rolle als
      Superuser an (es sei denn, der Benutzer der App hat `CREATEROLE`), mit `CREATE ROLE reputecast_segments NOLOGIN
      NOINHERIT;` und `GRANT reputecast_segments TO <app user>;`, und führen Sie dann diesen Befehl aus: Er übergibt die
      Segmentfunktion wieder an die Rolle und gibt die Rollenprüfung von `doctor` aus. Sicher bei erneuter Ausführung.
    es: >-
      `pg_dump` no incluye los roles. Después de restaurar en un servidor nuevo, crea el rol como superusuario (salvo
      que el usuario de la aplicación tenga `CREATEROLE`) con `CREATE ROLE reputecast_segments NOLOGIN NOINHERIT;` y
      `GRANT reputecast_segments TO <app user>;`, y después ejecuta este comando: devuelve la función de los segmentos
      al rol y escribe la comprobación del rol de `doctor`. Se puede volver a ejecutar sin riesgo.
    fr: >-
      `pg_dump` ne transporte pas les rôles. Après une restauration sur un nouveau serveur, créez le rôle en tant que
      superutilisateur (sauf si l’utilisateur de l’application a `CREATEROLE`) avec `CREATE ROLE reputecast_segments
      NOLOGIN NOINHERIT;` et `GRANT reputecast_segments TO <app user>;`, puis exécutez cette commande : elle rend la
      fonction de segment au rôle et affiche le contrôle du rôle de `doctor`. Sans risque à relancer.
  examples:
    - code: reputecast migrate segments-role
      description:
        en: Turn SQL segments back on after a restore.
        vi: Bật lại phân khúc SQL sau khi khôi phục.
        de: SQL-Segmente nach einer Wiederherstellung wieder aktivieren.
        es: Volver a activar los segmentos SQL después de una restauración.
        fr: Réactiver les segments SQL après une restauration.

- id: install
  command: reputecast install [--email <address>] [--name <name>] [--password <password>]
  summary:
    en: Migrate the database and create the first Owner.
    vi: Chạy migration cơ sở dữ liệu và tạo Chủ sở hữu đầu tiên.
    de: Datenbank migrieren und den ersten Inhaber anlegen.
    es: Migrar la base de datos y crear el primer Propietario.
    fr: Migrer la base de données et créer le premier Propriétaire.
  description:
    en: >-
      Applies migrations and creates the first Owner: an instance admin whose password sign-in keeps working when an
      SSO domain is enforced. Without `--password`, it prints a temporary password that must be replaced at first
      sign-in, where the Owner also adds a passkey or authenticator app, saves recovery codes, confirms the public URL
      and creates the first workspace. Fails when the database already has users.
    vi: >-
      Áp dụng migration và tạo Chủ sở hữu đầu tiên: một quản trị viên hệ thống vẫn đăng nhập được bằng mật khẩu khi SSO
      được bắt buộc cho một tên miền. Không có `--password`, lệnh in ra một mật khẩu tạm thời phải được thay ở lần đăng
      nhập đầu tiên; lúc đó Chủ sở hữu cũng thêm khóa truy cập hoặc ứng dụng xác thực, lưu mã khôi phục, xác nhận URL
      công khai và tạo không gian làm việc đầu tiên. Lệnh thất bại khi cơ sở dữ liệu đã có người dùng.
    de: >-
      Wendet Migrationen an und legt den ersten Inhaber an: einen Instanz-Admin, dessen Anmeldung per Passwort weiter
      funktioniert, wenn SSO für eine Domain erzwungen wird. Ohne `--password` gibt der Befehl ein temporäres Passwort
      aus, das bei der ersten Anmeldung ersetzt werden muss; dabei fügt der Inhaber außerdem einen Passkey oder eine
      Authenticator-App hinzu, speichert Wiederherstellungscodes, bestätigt die öffentliche URL und erstellt den ersten
      Arbeitsbereich. Schlägt fehl, wenn die Datenbank bereits Benutzer hat.
    es: >-
      Aplica las migraciones y crea el primer Propietario: una cuenta de administración de la instancia cuyo inicio de
      sesión con contraseña sigue funcionando cuando se exige SSO en un dominio. Sin `--password`, escribe una
      contraseña temporal que hay que reemplazar en el primer inicio de sesión, donde el Propietario también añade una
      llave de acceso o una aplicación de autenticación, guarda los códigos de recuperación, confirma la URL pública y
      crea el primer espacio de trabajo. Falla si la base de datos ya tiene usuarios.
    fr: >-
      Applique les migrations et crée le premier Propriétaire : un admin de l’instance dont la connexion par mot de
      passe continue de fonctionner lorsqu’un domaine SSO est imposé. Sans `--password`, la commande affiche un mot de
      passe temporaire à remplacer à la première connexion, lors de laquelle le Propriétaire ajoute aussi une clé
      d’accès ou une application d’authentification, enregistre ses codes de récupération, confirme l’URL publique et
      crée le premier espace de travail. Échoue si la base de données a déjà des utilisateurs.
  flags:
    - name: --email
      type: string
      default: ''
      description:
        en: Owner email. Without it, `REPUTECAST_ADMIN_EMAIL` is used; one of them is required.
        vi: Email của Chủ sở hữu. Nếu không có cờ này, `REPUTECAST_ADMIN_EMAIL` được dùng; cần có một trong hai.
        de: >-
          E-Mail-Adresse des Inhabers. Ohne dieses Flag wird `REPUTECAST_ADMIN_EMAIL` verwendet; eines von beiden ist
          erforderlich.
        es: Correo del Propietario. Sin ella, se usa `REPUTECAST_ADMIN_EMAIL`; una de las dos es obligatoria.
        fr: >-
          Adresse e-mail du Propriétaire. Sans cette option, `REPUTECAST_ADMIN_EMAIL` est utilisé ; l’un des deux est
          obligatoire.
    - name: --name
      type: string
      default: ''
      description:
        en: Owner name. Without it, `REPUTECAST_ADMIN_NAME` is used.
        vi: Tên của Chủ sở hữu. Nếu không có cờ này, `REPUTECAST_ADMIN_NAME` được dùng.
        de: Name des Inhabers. Ohne dieses Flag wird `REPUTECAST_ADMIN_NAME` verwendet.
        es: Nombre del Propietario. Sin ella, se usa `REPUTECAST_ADMIN_NAME`.
        fr: Nom du Propriétaire. Sans cette option, `REPUTECAST_ADMIN_NAME` est utilisé.
    - name: --password
      type: string
      default: ''
      description:
        en: >-
          Owner password. Without it, `REPUTECAST_ADMIN_PASSWORD` is used, and when neither is set a temporary password
          is printed. A password you set must meet `auth.password_min_length`.
        vi: >-
          Mật khẩu của Chủ sở hữu. Nếu không có cờ này, `REPUTECAST_ADMIN_PASSWORD` được dùng, và khi cả hai đều chưa
          đặt thì một mật khẩu tạm thời được in ra. Mật khẩu bạn đặt phải đáp ứng `auth.password_min_length`.
        de: >-
          Passwort des Inhabers. Ohne dieses Flag wird `REPUTECAST_ADMIN_PASSWORD` verwendet; ist keines von beiden
          gesetzt, wird ein temporäres Passwort ausgegeben. Ein von Ihnen gesetztes Passwort muss
          `auth.password_min_length` erfüllen.
        es: >-
          Contraseña del Propietario. Sin ella, se usa `REPUTECAST_ADMIN_PASSWORD` y, si no se define ninguna de las
          dos, se escribe una contraseña temporal. La contraseña que definas debe cumplir `auth.password_min_length`.
        fr: >-
          Mot de passe du Propriétaire. Sans cette option, `REPUTECAST_ADMIN_PASSWORD` est utilisé, et si aucun des deux
          n’est défini, un mot de passe temporaire est affiché. Un mot de passe que vous définissez doit respecter
          `auth.password_min_length`.
  examples:
    - code: reputecast install --email linh@acme.io --name "Linh Nguyen"
      description:
        en: Create the first Owner and print a temporary password.
        vi: Tạo Chủ sở hữu đầu tiên và in ra mật khẩu tạm thời.
        de: Den ersten Inhaber anlegen und ein temporäres Passwort ausgeben.
        es: Crear el primer Propietario y escribir una contraseña temporal.
        fr: Créer le premier Propriétaire et afficher un mot de passe temporaire.

- id: user
  command: reputecast user <command> --email <address>
  summary:
    en: Manage accounts from the server.
    vi: Quản lý tài khoản từ máy chủ.
    de: Konten vom Server aus verwalten.
    es: Gestionar cuentas desde el servidor.
    fr: Gérer les comptes depuis le serveur.
  description:
    en: >-
      Works without a sending provider, so you can recover access before email is set up. Each action is written to the
      audit log with the actor "CLI (server)".
    vi: >-
      Hoạt động mà không cần nhà cung cấp gửi thư, nên bạn có thể khôi phục quyền truy cập trước khi thiết lập email.
      Mỗi thao tác được ghi vào nhật ký kiểm tra với người thực hiện là "CLI (server)".
    de: >-
      Funktioniert ohne Versandanbieter, sodass Sie den Zugang wiederherstellen können, bevor der E-Mail-Versand
      eingerichtet ist. Jede Aktion wird mit dem Akteur „CLI (server)“ ins Audit-Protokoll geschrieben.
    es: >-
      Funciona sin proveedor de envío, así que puedes recuperar el acceso antes de configurar el correo. Cada acción se
      escribe en el registro de auditoría con el actor “CLI (server)”.
    fr: >-
      Fonctionne sans fournisseur d’envoi : vous pouvez ainsi rétablir un accès avant que l’e-mail soit configuré.
      Chaque action est inscrite au journal d’audit avec l’acteur « CLI (server) ».

- id: user reset-password
  command: reputecast user reset-password --email <address> [--password <password>]
  summary:
    en: Print a one-time password reset link.
    vi: In ra liên kết đặt lại mật khẩu dùng một lần.
    de: Einen einmaligen Link zum Zurücksetzen des Passworts ausgeben.
    es: Escribir un enlace de un solo uso para restablecer la contraseña.
    fr: Afficher un lien de réinitialisation du mot de passe à usage unique.
  description:
    en: >-
      Prints a link that lets the person set a new password. It works once and expires in 15 minutes, and their current
      password keeps working until they use it. Deactivated accounts are refused. With `--password`, the password is set
      directly instead and every session of the account is signed out. The link starts with the public URL the server's
      links use: the one saved in Instance admin, else `http.public_url`, which wins when `http.public_url_locked` is
      on.
    vi: >-
      In ra một liên kết để người đó đặt mật khẩu mới. Liên kết chỉ dùng được một lần và hết hạn sau 15 phút; mật khẩu
      hiện tại của họ vẫn dùng được cho đến khi họ dùng liên kết. Tài khoản đã vô hiệu hóa bị từ chối. Với `--password`,
      mật khẩu được đặt trực tiếp và mọi phiên của tài khoản bị đăng xuất. Liên kết bắt đầu bằng URL công khai mà các
      liên kết của máy chủ dùng: URL lưu trong Quản trị hệ thống, nếu không có thì là `http.public_url`, giá trị này
      được ưu tiên khi bật `http.public_url_locked`.
    de: >-
      Gibt einen Link aus, mit dem die Person ein neues Passwort festlegen kann. Er funktioniert einmal und läuft nach
      15 Minuten ab, und ihr aktuelles Passwort funktioniert weiter, bis sie den Link verwendet. Deaktivierte Konten
      werden abgelehnt. Mit `--password` wird das Passwort stattdessen direkt gesetzt, und alle Sitzungen des Kontos
      werden abgemeldet. Der Link beginnt mit der öffentlichen URL, die die Links des Servers verwenden: der in der
      Instanzverwaltung gespeicherten, sonst `http.public_url`, die Vorrang hat, wenn `http.public_url_locked` aktiv
      ist.
    es: >-
      Escribe un enlace con el que la persona define una contraseña nueva. Funciona una sola vez y caduca en 15 minutos,
      y su contraseña actual sigue funcionando hasta que lo usa. Las cuentas desactivadas se rechazan. Con `--password`,
      la contraseña se define directamente y se cierran todas las sesiones de la cuenta. El enlace empieza por la URL
      pública que usan los enlaces del servidor: la guardada en Administración de la instancia o, si no hay,
      `http.public_url`, que prevalece cuando `http.public_url_locked` está activado.
    fr: >-
      Affiche un lien qui permet à la personne de définir un nouveau mot de passe. Il ne fonctionne qu’une fois et
      expire au bout de 15 minutes, et son mot de passe actuel continue de fonctionner jusqu’à ce qu’elle l’utilise. Les
      comptes désactivés sont refusés. Avec `--password`, le mot de passe est défini directement à la place, et toutes
      les sessions du compte sont déconnectées. Le lien commence par l’URL publique qu’utilisent les liens du serveur :
      celle enregistrée dans l’Administration de l’instance, sinon `http.public_url`, qui l’emporte lorsque
      `http.public_url_locked` est activé.
  flags:
    - name: --email
      type: string
      default: ''
      description:
        en: Account email. Required.
        vi: Email của tài khoản. Bắt buộc.
        de: E-Mail-Adresse des Kontos. Erforderlich.
        es: Correo de la cuenta. Obligatorio.
        fr: Adresse e-mail du compte. Obligatoire.
    - name: --password
      type: string
      default: ''
      description:
        en: Set this password directly instead of printing a reset link. It must meet `auth.password_min_length`.
        vi: Đặt trực tiếp mật khẩu này thay vì in ra liên kết đặt lại. Mật khẩu phải đáp ứng `auth.password_min_length`.
        de: >-
          Dieses Passwort direkt setzen, statt einen Link zum Zurücksetzen auszugeben. Es muss
          `auth.password_min_length` erfüllen.
        es: >-
          Definir esta contraseña directamente en lugar de escribir un enlace de restablecimiento. Debe cumplir
          `auth.password_min_length`.
        fr: >-
          Définir directement ce mot de passe au lieu d’afficher un lien de réinitialisation. Il doit respecter
          `auth.password_min_length`.
  examples:
    - code: reputecast user reset-password --email aisha@acme.io
      description:
        en: Print a reset link to send to the person privately.
        vi: In ra liên kết đặt lại để gửi riêng cho người đó.
        de: Einen Link zum Zurücksetzen ausgeben, um ihn der Person vertraulich zu schicken.
        es: Escribir un enlace de restablecimiento para enviarlo a la persona en privado.
        fr: Afficher un lien de réinitialisation à envoyer à la personne en privé.

- id: user reset-2fa
  command: reputecast user reset-2fa --email <address> --reason <text>
  summary:
    en: Remove an account's authenticator app and recovery codes.
    vi: Gỡ ứng dụng xác thực và mã khôi phục của một tài khoản.
    de: Authenticator-App und Wiederherstellungscodes eines Kontos entfernen.
    es: Quitar la aplicación de autenticación y los códigos de recuperación de una cuenta.
    fr: Retirer l’application d’authentification et les codes de récupération d’un compte.
  description:
    en: >-
      Passkeys stay. The person gets 72 hours to set up two-factor authentication again, and every session of the
      account is signed out. The reason is required and is written to the audit log.
    vi: >-
      Khóa truy cập được giữ nguyên. Người đó có 72 giờ để thiết lập lại xác thực hai lớp, và mọi phiên của tài khoản bị
      đăng xuất. Lý do là bắt buộc và được ghi vào nhật ký kiểm tra.
    de: >-
      Passkeys bleiben erhalten. Die Person hat 72 Stunden Zeit, die Zwei-Faktor-Authentifizierung erneut einzurichten,
      und alle Sitzungen des Kontos werden abgemeldet. Der Grund ist erforderlich und wird ins Audit-Protokoll
      geschrieben.
    es: >-
      Las llaves de acceso se mantienen. La persona tiene 72 horas para volver a configurar la verificación en dos
      pasos, y se cierran todas las sesiones de la cuenta. El motivo es obligatorio y se escribe en el registro de
      auditoría.
    fr: >-
      Les clés d’accès sont conservées. La personne dispose de 72 heures pour reconfigurer l’authentification à deux
      facteurs, et toutes les sessions du compte sont déconnectées. Le motif est obligatoire et inscrit au journal
      d’audit.
  flags:
    - name: --email
      type: string
      default: ''
      description:
        en: Account email. Required.
        vi: Email của tài khoản. Bắt buộc.
        de: E-Mail-Adresse des Kontos. Erforderlich.
        es: Correo de la cuenta. Obligatorio.
        fr: Adresse e-mail du compte. Obligatoire.
    - name: --reason
      type: string
      default: ''
      description:
        en: Why the reset is needed. Required; written to the audit log.
        vi: Lý do cần đặt lại. Bắt buộc; được ghi vào nhật ký kiểm tra.
        de: Warum das Zurücksetzen nötig ist. Erforderlich; wird ins Audit-Protokoll geschrieben.
        es: Por qué hace falta restablecerla. Obligatorio; se escribe en el registro de auditoría.
        fr: Pourquoi la réinitialisation est nécessaire. Obligatoire ; inscrit au journal d’audit.
  examples:
    - code: reputecast user reset-2fa --email aisha@acme.io --reason "lost phone, verified by video call"
      description:
        en: Reset two-factor authentication for a person who lost their phone.
        vi: Đặt lại xác thực hai lớp cho người bị mất điện thoại.
        de: Die Zwei-Faktor-Authentifizierung für eine Person zurücksetzen, die ihr Telefon verloren hat.
        es: Restablecer la verificación en dos pasos de una persona que perdió su móvil.
        fr: Réinitialiser l’authentification à deux facteurs d’une personne qui a perdu son téléphone.

- id: user make-admin
  command: reputecast user make-admin --email <address>
  summary:
    en: Make an account an instance admin.
    vi: Đặt một tài khoản làm quản trị viên hệ thống.
    de: Ein Konto zum Instanz-Admin machen.
    es: Dar a una cuenta la administración de la instancia.
    fr: Nommer un compte admin de l’instance.
  flags:
    - name: --email
      type: string
      default: ''
      description:
        en: Account email. Required.
        vi: Email của tài khoản. Bắt buộc.
        de: E-Mail-Adresse des Kontos. Erforderlich.
        es: Correo de la cuenta. Obligatorio.
        fr: Adresse e-mail du compte. Obligatoire.
  examples:
    - code: reputecast user make-admin --email aisha@acme.io
      description:
        en: Give an existing account access to Instance admin.
        vi: Cấp cho một tài khoản hiện có quyền truy cập Quản trị hệ thống.
        de: Einem bestehenden Konto Zugriff auf die Instanzverwaltung geben.
        es: Dar a una cuenta existente acceso a Administración de la instancia.
        fr: Donner à un compte existant l’accès à l’administration de l’instance.

- id: user unlock
  command: reputecast user unlock --email <address>
  summary:
    en: Clear a sign-in lockout.
    vi: Gỡ khóa đăng nhập.
    de: Eine Anmeldesperre aufheben.
    es: Quitar un bloqueo de acceso.
    fr: Lever un blocage de la connexion.
  flags:
    - name: --email
      type: string
      default: ''
      description:
        en: Account email. Required.
        vi: Email của tài khoản. Bắt buộc.
        de: E-Mail-Adresse des Kontos. Erforderlich.
        es: Correo de la cuenta. Obligatorio.
        fr: Adresse e-mail du compte. Obligatoire.
  examples:
    - code: reputecast user unlock --email aisha@acme.io
      description:
        en: Let a locked-out person sign in again without waiting for the lockout to end.
        vi: Cho người bị khóa đăng nhập vào lại mà không phải chờ hết thời gian khóa.
        de: Eine gesperrte Person sich wieder anmelden lassen, ohne auf das Ende der Sperre zu warten.
        es: Dejar que una persona bloqueada vuelva a iniciar sesión sin esperar a que termine el bloqueo.
        fr: Permettre à une personne bloquée de se reconnecter sans attendre la fin du blocage.

- id: seed
  command: reputecast seed [--sample <acme|northwind|load>] [--contacts <n>] [--force]
  summary:
    en: Load demo data for development and screenshots.
    vi: Nạp dữ liệu demo để phát triển và chụp ảnh màn hình.
    de: Demodaten für Entwicklung und Screenshots laden.
    es: Cargar datos de demostración para desarrollo y capturas de pantalla.
    fr: Charger des données de démonstration pour le développement et les captures d’écran.
  description:
    en: >-
      Applies migrations, then loads a sample instance. The Acme sample has Acme Newsletter with 48,213 subscribers,
      Amazon SES, Postmark and a warming Postal server, campaigns, automations, a team and audit history. The demo
      accounts and their password are printed at the end. Refuses to run unless `REPUTECAST_ENV` is `development`.
    vi: >-
      Áp dụng migration, rồi nạp một hệ thống mẫu. Mẫu Acme có Acme Newsletter với 48.213 người đăng ký, Amazon SES,
      Postmark và một máy chủ Postal đang khởi động, cùng các chiến dịch, tự động hóa, một nhóm và lịch sử nhật ký kiểm
      tra. Các tài khoản demo và mật khẩu của chúng được in ra ở cuối. Lệnh từ chối chạy trừ khi `REPUTECAST_ENV` là
      `development`.
    de: >-
      Wendet Migrationen an und lädt dann eine Beispielinstanz. Das Beispiel Acme enthält Acme Newsletter mit 48.213
      Abonnenten, Amazon SES, Postmark und einen Postal-Server im Warm-up, Kampagnen, Automationen, ein Team und einen
      Audit-Verlauf. Die Demokonten und ihr Passwort werden am Ende ausgegeben. Läuft nur, wenn `REPUTECAST_ENV` den
      Wert `development` hat.
    es: >-
      Aplica las migraciones y después carga una instancia de ejemplo. El ejemplo Acme tiene Acme Newsletter con 48.213
      suscriptores, Amazon SES, Postmark y un servidor Postal en calentamiento, campañas, automatizaciones, un equipo e
      historial de auditoría. Las cuentas de demostración y su contraseña se escriben al final. No se ejecuta salvo que
      `REPUTECAST_ENV` sea `development`.
    fr: >-
      Applique les migrations, puis charge une instance d’exemple. L’exemple Acme contient Acme Newsletter avec 48 213
      abonnés, Amazon SES, Postmark et un serveur Postal en chauffe, des campagnes, des automatisations, une équipe et
      un historique d’audit. Les comptes de démonstration et leur mot de passe sont affichés à la fin. Refuse de
      s’exécuter si `REPUTECAST_ENV` ne vaut pas `development`.
  flags:
    - name: --sample
      type: string
      default: acme
      description:
        en: >-
          Which sample to load: `acme`; `northwind` (an agency with seven clients, into an empty database); or `load` (a
          large "Load test" workspace for load tests, on an instance that already has a user, such as after `acme`).
        vi: >-
          Mẫu cần nạp: `acme`; `northwind` (một agency với bảy khách hàng, nạp vào cơ sở dữ liệu trống); hoặc `load` (một
          không gian làm việc "Load test" lớn để kiểm thử tải, trên hệ thống đã có người dùng, ví dụ sau `acme`).
        de: >-
          Welches Beispiel geladen wird: `acme`; `northwind` (eine Agentur mit sieben Kunden, in eine leere Datenbank);
          oder `load` (ein großer Arbeitsbereich „Load test“ für Lasttests, auf einer Instanz, die bereits einen
          Benutzer hat, etwa nach `acme`).
        es: >-
          Qué ejemplo cargar: `acme`; `northwind` (una agencia con siete clientes, en una base de datos vacía); o `load`
          (un espacio de trabajo grande, “Load test”, para pruebas de carga, en una instancia que ya tiene un usuario,
          por ejemplo después de `acme`).
        fr: >-
          Exemple à charger : `acme` ; `northwind` (une agence avec sept clients, dans une base de données vide) ; ou
          `load` (un grand espace de travail « Load test » pour les tests de charge, sur une instance qui a déjà un
          utilisateur, par exemple après `acme`).
    - name: --contacts
      type: int
      default: '1000000'
      description:
        en: 'With `--sample load`: how many contacts. Their messages and delivery events span five months.'
        vi: 'Với `--sample load`: số liên hệ cần tạo. Thư và sự kiện gửi của họ trải dài trong năm tháng.'
        de: >-
          Mit `--sample load`: wie viele Kontakte. Ihre Nachrichten und Zustellereignisse verteilen sich über fünf
          Monate.
        es: 'Con `--sample load`: cuántos contactos. Sus mensajes y eventos de entrega abarcan cinco meses.'
        fr: >-
          Avec `--sample load` : nombre de contacts. Leurs messages et événements de livraison s’étalent sur cinq mois.
    - name: --force
      type: bool
      default: 'false'
      description:
        en: Seed even when `REPUTECAST_ENV` is not `development`.
        vi: Vẫn nạp dữ liệu mẫu khi `REPUTECAST_ENV` không phải `development`.
        de: Auch dann Daten laden, wenn `REPUTECAST_ENV` nicht `development` ist.
        es: Cargar los datos aunque `REPUTECAST_ENV` no sea `development`.
        fr: Charger les données même si `REPUTECAST_ENV` ne vaut pas `development`.
  examples:
    - code: REPUTECAST_ENV=development reputecast seed
      description:
        en: Load the Acme sample.
        vi: Nạp mẫu Acme.
        de: Das Beispiel Acme laden.
        es: Cargar el ejemplo Acme.
        fr: Charger l’exemple Acme.
    - code: REPUTECAST_ENV=development reputecast seed --sample northwind
      description:
        en: Load the agency sample into an empty database.
        vi: Nạp mẫu agency vào cơ sở dữ liệu trống.
        de: Das Agenturbeispiel in eine leere Datenbank laden.
        es: Cargar el ejemplo de agencia en una base de datos vacía.
        fr: Charger l’exemple d’agence dans une base de données vide.
    - code: REPUTECAST_ENV=development reputecast seed --sample load --contacts 1000000
      description:
        en: Add a workspace with a million contacts for load tests.
        vi: Thêm một không gian làm việc với một triệu liên hệ để kiểm thử tải.
        de: Einen Arbeitsbereich mit einer Million Kontakten für Lasttests hinzufügen.
        es: Añadir un espacio de trabajo con un millón de contactos para pruebas de carga.
        fr: Ajouter un espace de travail avec un million de contacts pour les tests de charge.
  devOnly: true

- id: demo
  command: reputecast demo <command>
  summary:
    en: Development helpers for the Acme demo.
    vi: Công cụ hỗ trợ phát triển cho bản demo Acme.
    de: Entwicklungshilfen für die Acme-Demo.
    es: Utilidades de desarrollo para la demostración de Acme.
    fr: Outils de développement pour la démo Acme.
  description:
    en: Refuses to run unless `REPUTECAST_ENV` is `development`.
    vi: Từ chối chạy trừ khi `REPUTECAST_ENV` là `development`.
    de: Läuft nur, wenn `REPUTECAST_ENV` den Wert `development` hat.
    es: No se ejecuta salvo que `REPUTECAST_ENV` sea `development`.
    fr: Refuse de s’exécuter si `REPUTECAST_ENV` ne vaut pas `development`.
  devOnly: true

- id: demo send
  command: reputecast demo send "<campaign>" [flags]
  summary:
    en: Send a demo campaign through the simulated providers so the live monitor moves.
    vi: Gửi một chiến dịch demo qua các nhà cung cấp mô phỏng để màn hình theo dõi trực tiếp có số liệu chạy.
    de: Eine Demokampagne über die simulierten Anbieter senden, damit sich im Live-Monitor etwas bewegt.
    es: >-
      Enviar una campaña de demostración a través de los proveedores simulados para que el monitor en tiempo real se
      mueva.
    fr: Envoyer une campagne de démonstration via les fournisseurs simulés pour animer le suivi en direct.
  description:
    en: >-
      Starts the named campaign's send through the demo transport: nothing leaves the machine, and delivery, bounces,
      complaints, opens and clicks are simulated. The running server's worker sends it in real time, so start the server
      first. Only workspaces whose providers are all demo providers can send.
    vi: >-
      Bắt đầu gửi chiến dịch có tên đã cho qua kênh truyền demo: không có gì rời khỏi máy, còn việc gửi thành công, thư
      trả lại, khiếu nại, lượt mở và lượt nhấp đều được mô phỏng. Worker của máy chủ đang chạy gửi chiến dịch theo thời
      gian thực, nên hãy khởi động máy chủ trước. Chỉ không gian làm việc có toàn bộ nhà cung cấp là nhà cung cấp demo
      mới gửi được.
    de: >-
      Startet den Versand der angegebenen Kampagne über den Demo-Transport: Nichts verlässt den Rechner, und Zustellung,
      Bounces, Beschwerden, Öffnungen und Klicks werden simuliert. Der Worker des laufenden Servers sendet in Echtzeit,
      starten Sie also zuerst den Server. Senden können nur Arbeitsbereiche, deren Anbieter ausnahmslos Demo-Anbieter
      sind.
    es: >-
      Inicia el envío de la campaña indicada a través del transporte de demostración: nada sale del equipo, y la
      entrega, los rebotes, las quejas, las aperturas y los clics se simulan. El worker del servidor en ejecución la
      envía en tiempo real, así que inicia antes el servidor. Solo pueden enviar los espacios de trabajo cuyos
      proveedores son todos de demostración.
    fr: >-
      Lance l’envoi de la campagne indiquée via le transport de démonstration : rien ne quitte la machine, et la
      livraison, les rebonds, les plaintes, les ouvertures et les clics sont simulés. Le worker du serveur en cours
      d’exécution l’envoie en temps réel : démarrez donc d’abord le serveur. Seuls les espaces de travail dont tous les
      fournisseurs sont des fournisseurs de démonstration peuvent envoyer.
  args: '"<campaign>"'
  flags:
    - name: --scenario
      type: string
      default: normal
      description:
        en: >-
          `normal`; `outlook-complaints` (lapsed Outlook readers complain until the Outlook share auto-pauses);
          `postal-outage` (Postal refuses connections 14 minutes in and its share is held); or `steady` (normal, without
          the provider throttling a call now and then).
        vi: >-
          `normal`; `outlook-complaints` (người đọc Outlook lâu không tương tác gửi khiếu nại cho đến khi phần gửi đến
          Outlook tự động tạm dừng); `postal-outage` (Postal từ chối kết nối từ phút thứ 14 và phần gửi qua Postal bị
          tạm giữ); hoặc `steady` (như normal, nhưng nhà cung cấp không thỉnh thoảng giới hạn tốc độ một lệnh gọi).
        de: >-
          `normal`; `outlook-complaints` (nicht mehr aktive Outlook-Leser beschweren sich, bis der Outlook-Anteil
          automatisch pausiert); `postal-outage` (Postal verweigert nach 14 Minuten Verbindungen, und sein Anteil wird
          zurückgehalten); oder `steady` (wie normal, aber ohne dass der Anbieter ab und zu einen Aufruf drosselt).
        es: >-
          `normal`; `outlook-complaints` (los lectores de Outlook que han dejado de interactuar se quejan hasta que la
          parte de Outlook queda en pausa automática); `postal-outage` (Postal rechaza las conexiones a los 14 minutos y
          su parte queda retenida); o `steady` (normal, sin que el proveedor limite la velocidad de alguna llamada de
          vez en cuando).
        fr: >-
          `normal` ; `outlook-complaints` (les lecteurs Outlook désengagés se plaignent jusqu’à ce que la part Outlook
          soit mise en pause automatiquement) ; `postal-outage` (Postal refuse les connexions au bout de 14 minutes et
          sa part est retenue) ; ou `steady` (normal, sans que le fournisseur limite de temps en temps le débit d’un
          appel).
    - name: --workspace
      type: string
      default: acme-newsletter
      description:
        en: Workspace slug.
        vi: Slug của không gian làm việc.
        de: URL-Pfad des Arbeitsbereichs.
        es: Slug del espacio de trabajo.
        fr: Slug de l’espace de travail.
    - name: --elapsed
      type: duration
      default: 0s
      description:
        en: >-
          Start the send this long ago and send that part at once with back-dated times, so the monitor opens mid-send.
        vi: >-
          Bắt đầu lượt gửi từ khoảng thời gian này trước đây và gửi ngay phần đó với thời gian lùi về quá khứ, để màn
          hình theo dõi mở ra khi lượt gửi đang diễn ra.
        de: >-
          Den Versand vor dieser Zeitspanne beginnen lassen und diesen Teil sofort mit rückdatierten Zeiten senden,
          sodass sich der Monitor mitten im Versand öffnet.
        es: >-
          Iniciar el envío hace este tiempo y enviar esa parte de golpe con horas retroactivas, para que el monitor se
          abra a mitad del envío.
        fr: >-
          Faire démarrer l’envoi il y a cette durée et envoyer cette partie immédiatement avec des horaires antidatés,
          pour que le suivi s’ouvre en plein envoi.
    - name: --ab-window
      type: duration
      default: 7m
      description:
        en: How long the A/B test runs before the winner goes to the rest.
        vi: Thời gian thử nghiệm A/B chạy trước khi bản thắng được gửi đến những người còn lại.
        de: Wie lange der A/B-Test läuft, bevor der Gewinner an den Rest geht.
        es: Cuánto dura la prueba A/B antes de que la variante ganadora vaya al resto.
        fr: Durée du test A/B avant que la variante gagnante parte vers le reste de l’audience.
    - name: --reset
      type: bool
      default: 'false'
      description:
        en: >-
          Clear an earlier send of the campaign first, including what it changed outside the campaign (provider
          statistics, suppressions from its bounces).
        vi: >-
          Xóa lượt gửi trước đó của chiến dịch trước, kể cả những gì lượt gửi đó đã thay đổi bên ngoài chiến dịch (thống
          kê nhà cung cấp, các địa chỉ bị chặn gửi do thư trả lại của nó).
        de: >-
          Zuerst einen früheren Versand der Kampagne löschen, einschließlich dessen, was er außerhalb der Kampagne
          geändert hat (Anbieterstatistiken, Sperren aus seinen Bounces).
        es: >-
          Borrar antes un envío anterior de la campaña, incluido lo que cambió fuera de ella (estadísticas de los
          proveedores, supresiones por sus rebotes).
        fr: >-
          Effacer d’abord un envoi précédent de la campagne, y compris ce qu’il a modifié en dehors de la campagne
          (statistiques des fournisseurs, exclusions dues à ses rebonds).
    - name: --canary
      type: string
      default: ''
      description:
        en: >-
          `auto`, `on` or `off`: whether the send starts with a canary phase. Without it, the `normal` scenario runs a
          canary and the others don't. `auto` leaves it to the workspace's Traffic rules.
        vi: >-
          `auto`, `on` hoặc `off`: lượt gửi có bắt đầu bằng giai đoạn canary hay không. Nếu không có cờ này, kịch bản
          `normal` chạy canary còn các kịch bản khác thì không. `auto` để Quy tắc lưu lượng của không gian làm việc quyết
          định.
        de: >-
          `auto`, `on` oder `off`: ob der Versand mit einer Canary-Phase beginnt. Ohne dieses Flag läuft im Szenario
          `normal` ein Canary, in den anderen nicht. `auto` überlässt das den Traffic-Regeln des Arbeitsbereichs.
        es: >-
          `auto`, `on` u `off`: si el envío empieza con una fase de envío canario. Sin ella, el escenario `normal` hace
          un envío canario y los demás no. `auto` lo deja en manos de las Reglas de tráfico del espacio de trabajo.
        fr: >-
          `auto`, `on` ou `off` : l’envoi commence ou non par une phase canari. Sans cette option, le scénario `normal`
          lance un canari et les autres non. `auto` s’en remet aux règles de trafic de l’espace de travail.
  examples:
    - code: REPUTECAST_ENV=development reputecast demo send "Weekly Digest #142" --elapsed 20m
      description:
        en: Open the live monitor 20 minutes into a normal send.
        vi: Mở màn hình theo dõi trực tiếp ở phút thứ 20 của một lượt gửi bình thường.
        de: Den Live-Monitor 20 Minuten nach Beginn eines normalen Versands öffnen.
        es: Abrir el monitor en tiempo real a los 20 minutos de un envío normal.
        fr: Ouvrir le suivi en direct 20 minutes après le début d’un envoi normal.
    - code: REPUTECAST_ENV=development reputecast demo send "Weekly Digest #142" --scenario outlook-complaints --elapsed 20m --reset
      description:
        en: Show an auto-pause caused by Outlook complaints.
        vi: Hiển thị một lần tự động tạm dừng do khiếu nại từ Outlook.
        de: Eine Auto-Pause wegen Beschwerden bei Outlook zeigen.
        es: Mostrar una pausa automática causada por quejas de Outlook.
        fr: Montrer une pause automatique causée par des plaintes Outlook.
    - code: REPUTECAST_ENV=development reputecast demo send "Weekly Digest #142" --scenario postal-outage --elapsed 17m --reset
      description:
        en: Show a provider outage with a held share.
        vi: Hiển thị sự cố gián đoạn của nhà cung cấp với một phần gửi bị tạm giữ.
        de: Einen Anbieterausfall mit zurückgehaltenem Anteil zeigen.
        es: Mostrar una caída de un proveedor con una parte retenida.
        fr: Montrer une panne de fournisseur avec une part retenue.
  devOnly: true

- id: openapi
  command: reputecast openapi [--yaml] [--public] [--openapi <version>]
  summary:
    en: Print the OpenAPI document of the REST API.
    vi: In ra tài liệu OpenAPI của REST API.
    de: Das OpenAPI-Dokument der REST-API ausgeben.
    es: Escribir el documento OpenAPI de la API REST.
    fr: Afficher le document OpenAPI de l’API REST.
  description:
    en: >-
      Prints indented JSON in OpenAPI 3.1 by default. Needs no database or configuration. With `--public`, it prints the
      document the client SDKs are generated from: every operation an API key may call except the integration apps' own,
      only the schemas they reference, the binary's version, the instance URL as a `{baseUrl}` server and bearer
      security. Available from the next release after 1.6.0.
    vi: >-
      Mặc định in JSON có thụt lề theo OpenAPI 3.1. Không cần cơ sở dữ liệu hay cấu hình. Với `--public`, lệnh in tài
      liệu dùng để tạo các SDK client: mọi thao tác mà khóa API được gọi, trừ thao tác riêng của các ứng dụng tích hợp,
      chỉ các schema mà chúng tham chiếu, phiên bản của binary, URL của hệ thống ở dạng server `{baseUrl}` và bảo mật
      bearer. Có từ bản phát hành tiếp theo sau 1.6.0.
    de: >-
      Gibt standardmäßig eingerücktes JSON in OpenAPI 3.1 aus. Braucht weder Datenbank noch Konfiguration. Mit
      `--public` gibt der Befehl das Dokument aus, aus dem die Client-SDKs generiert werden: jede Operation, die ein
      API-Schlüssel aufrufen darf, außer denen der Integrations-Apps, nur die Schemas, auf die sie verweisen, die
      Version der Binärdatei, die URL der Instanz als Server `{baseUrl}` und Bearer-Authentifizierung. Verfügbar ab dem
      nächsten Release nach 1.6.0.
    es: >-
      Escribe por defecto JSON con sangría en OpenAPI 3.1. No necesita base de datos ni configuración. Con `--public`,
      escribe el documento del que se generan los SDK de cliente: todas las operaciones que puede llamar una clave de
      API salvo las propias de las aplicaciones de integración, solo los esquemas a los que hacen referencia, la versión
      del binario, la URL de la instancia como servidor `{baseUrl}` y la seguridad bearer. Disponible a partir de la
      próxima versión después de la 1.6.0.
    fr: >-
      Affiche par défaut du JSON indenté en OpenAPI 3.1. N’a besoin ni de base de données ni de configuration. Avec
      `--public`, affiche le document à partir duquel les SDK clients sont générés : chaque opération qu’une clé d’API
      peut appeler, sauf celles propres aux applications d’intégration, uniquement les schémas qu’elles référencent, la
      version du binaire, l’URL de l’instance comme serveur `{baseUrl}` et la sécurité bearer. Disponible à partir de la
      prochaine version après la 1.6.0.
  flags:
    - name: --yaml
      type: bool
      default: 'false'
      description:
        en: Print YAML instead of JSON.
        vi: In YAML thay vì JSON.
        de: YAML statt JSON ausgeben.
        es: Escribir YAML en lugar de JSON.
        fr: Afficher du YAML au lieu du JSON.
    - name: --public
      type: bool
      default: 'false'
      description:
        en: >-
          Only the operations an API key may call, for the client SDKs. Available from the next release after 1.6.0.
        vi: >-
          Chỉ các thao tác mà khóa API được gọi, dành cho các SDK client. Có từ bản phát hành tiếp theo sau 1.6.0.
        de: >-
          Nur die Operationen, die ein API-Schlüssel aufrufen darf, für die Client-SDKs. Verfügbar ab dem nächsten
          Release nach 1.6.0.
        es: >-
          Solo las operaciones que puede llamar una clave de API, para los SDK de cliente. Disponible a partir de la
          próxima versión después de la 1.6.0.
        fr: >-
          Uniquement les opérations qu’une clé d’API peut appeler, pour les SDK clients. Disponible à partir de la
          prochaine version après la 1.6.0.
    - name: --openapi
      type: string
      default: '3.1'
      description:
        en: >-
          OpenAPI version: `3.1`, or `3.0` for generators that don't read 3.1. Available from the next release after
          1.6.0.
        vi: >-
          Phiên bản OpenAPI: `3.1`, hoặc `3.0` cho các trình tạo mã không đọc được 3.1. Có từ bản phát hành tiếp theo
          sau 1.6.0.
        de: >-
          OpenAPI-Version: `3.1` oder `3.0` für Generatoren, die 3.1 nicht lesen. Verfügbar ab dem nächsten Release nach
          1.6.0.
        es: >-
          Versión de OpenAPI: `3.1`, o `3.0` para los generadores que no leen la 3.1. Disponible a partir de la próxima
          versión después de la 1.6.0.
        fr: >-
          Version d’OpenAPI : `3.1`, ou `3.0` pour les générateurs qui ne lisent pas la 3.1. Disponible à partir de la
          prochaine version après la 1.6.0.
  examples:
    - code: reputecast openapi > openapi.json
      description:
        en: Save the API description to generate a client.
        vi: Lưu mô tả API để tạo client.
        de: Die API-Beschreibung speichern, um einen Client zu generieren.
        es: Guardar la descripción de la API para generar un cliente.
        fr: Enregistrer la description de l’API pour générer un client.
    - code: reputecast openapi --yaml > openapi.yaml
      description:
        en: Save it as YAML.
        vi: Lưu dưới dạng YAML.
        de: Sie als YAML speichern.
        es: Guardarla como YAML.
        fr: L’enregistrer en YAML.
    - code: reputecast openapi --public --openapi 3.0 > public-3.0.json
      description:
        en: Save the document the client SDKs use, in OpenAPI 3.0 for a generator that doesn't read 3.1.
        vi: Lưu tài liệu mà các SDK client dùng, theo OpenAPI 3.0 cho trình tạo mã không đọc được 3.1.
        de: >-
          Das Dokument der Client-SDKs speichern, in OpenAPI 3.0 für einen Generator, der 3.1 nicht liest.
        es: >-
          Guardar el documento que usan los SDK de cliente, en OpenAPI 3.0 para un generador que no lee la 3.1.
        fr: >-
          Enregistrer le document qu’utilisent les SDK clients, en OpenAPI 3.0 pour un générateur qui ne lit pas la 3.1.

- id: secrets
  command: reputecast secrets <command>
  summary:
    en: Manage the key that encrypts credentials at rest.
    vi: Quản lý khóa mã hóa thông tin xác thực khi lưu trữ.
    de: Den Schlüssel verwalten, der gespeicherte Zugangsdaten verschlüsselt.
    es: Gestionar la clave que cifra las credenciales almacenadas.
    fr: Gérer la clé qui chiffre les identifiants stockés.

- id: secrets generate-key
  command: reputecast secrets generate-key
  summary:
    en: Print a new random key for `REPUTECAST_SECRETS__KEY`.
    vi: In ra một khóa ngẫu nhiên mới cho `REPUTECAST_SECRETS__KEY`.
    de: Einen neuen Zufallsschlüssel für `REPUTECAST_SECRETS__KEY` ausgeben.
    es: Escribir una clave aleatoria nueva para `REPUTECAST_SECRETS__KEY`.
    fr: Afficher une nouvelle clé aléatoire pour `REPUTECAST_SECRETS__KEY`.
  description:
    en: Prints 32 random bytes as standard base64. Needs no database or configuration.
    vi: In ra 32 byte ngẫu nhiên ở dạng base64 chuẩn. Không cần cơ sở dữ liệu hay cấu hình.
    de: Gibt 32 Zufallsbytes als Standard-Base64 aus. Braucht weder Datenbank noch Konfiguration.
    es: Escribe 32 bytes aleatorios en base64 estándar. No necesita base de datos ni configuración.
    fr: Affiche 32 octets aléatoires en base64 standard. N’a besoin ni de base de données ni de configuration.
  examples:
    - code: reputecast secrets generate-key
      description:
        en: Create a key to set as `REPUTECAST_SECRETS__KEY` instead of using a key file.
        vi: Tạo một khóa để đặt làm `REPUTECAST_SECRETS__KEY` thay vì dùng tệp khóa.
        de: >-
          Einen Schlüssel erzeugen, der als `REPUTECAST_SECRETS__KEY` gesetzt wird, statt eine Schlüsseldatei zu
          verwenden.
        es: Crear una clave para definirla como `REPUTECAST_SECRETS__KEY` en lugar de usar un archivo de clave.
        fr: Créer une clé à définir comme `REPUTECAST_SECRETS__KEY` au lieu d’utiliser un fichier de clé.

- id: secrets reseal
  command: reputecast secrets reseal [--dry-run]
  summary:
    en: Re-encrypt every stored secret with the current key, so previous keys can be dropped.
    vi: Mã hóa lại mọi bí mật đã lưu bằng khóa hiện tại, để có thể bỏ các khóa trước.
    de: >-
      Alle gespeicherten vertraulichen Werte mit dem aktuellen Schlüssel neu verschlüsseln, damit frühere Schlüssel
      entfernt werden können.
    es: >-
      Volver a cifrar todos los datos secretos almacenados con la clave actual, para poder quitar las claves anteriores.
    fr: Rechiffrer chaque secret stocké avec la clé actuelle, pour pouvoir abandonner les clés précédentes.
  description:
    en: >-
      After a key change (`secrets.key` set to a new key, the old one moved to `secrets.previous_keys`), re-encrypts
      every stored credential, token and secret with the new key and prints, per kind of value, how many were on a
      previous key, resealed and unreadable. Safe while ReputeCast runs and safe to run again; the reseal is in the
      instance audit log. Exits 1 when some values open with no configured key. Once nothing is left on a previous key,
      that key only checks links in emails already sent; remove it after a leak, at least a day later, since signup
      forms hand out tokens sealed with it for that long.
    vi: >-
      Sau khi đổi khóa (`secrets.key` đặt thành khóa mới, khóa cũ chuyển sang `secrets.previous_keys`), lệnh mã hóa lại
      mọi thông tin xác thực, token và bí mật đã lưu bằng khóa mới và in ra, theo từng loại giá trị, số giá trị còn dùng
      khóa trước, đã mã hóa lại và không đọc được. An toàn khi ReputeCast đang chạy và khi chạy lại; lần mã hóa lại được
      ghi vào nhật ký kiểm tra của hệ thống. Thoát với mã 1 khi có giá trị không mở được bằng khóa nào đã cấu hình. Khi
      không còn gì dùng khóa trước, khóa đó chỉ còn dùng để kiểm tra liên kết trong các email đã gửi; nếu khóa bị lộ, hãy
      gỡ nó sau ít nhất một ngày, vì biểu mẫu đăng ký phát token được mã hóa bằng khóa đó trong khoảng thời gian này.
    de: >-
      Verschlüsselt nach einem Schlüsselwechsel (`secrets.key` auf einen neuen Schlüssel gesetzt, der alte nach
      `secrets.previous_keys` verschoben) alle gespeicherten Zugangsdaten, Tokens und geheimen Schlüssel mit dem neuen
      Schlüssel und gibt je Art von Wert aus, wie viele noch einen früheren Schlüssel nutzten, neu versiegelt wurden und
      nicht lesbar waren. Sicher, während ReputeCast läuft, und sicher bei erneuter Ausführung; die Neuversiegelung
      steht im Audit-Protokoll der Instanz. Endet mit 1, wenn sich einige Werte mit keinem konfigurierten Schlüssel
      öffnen lassen. Sobald nichts mehr einen früheren Schlüssel nutzt, prüft dieser nur noch Links in bereits
      gesendeten E-Mails; entfernen Sie ihn nach einem Leck frühestens einen Tag später, da Anmeldeformulare so lange
      damit versiegelte Tokens ausgeben.
    es: >-
      Después de un cambio de clave (`secrets.key` con una clave nueva y la antigua movida a `secrets.previous_keys`),
      vuelve a cifrar con la clave nueva todas las credenciales, los tokens y los secretos almacenados, y escribe, por
      tipo de valor, cuántos estaban con una clave anterior, cuántos se han vuelto a sellar y cuántos no se pueden leer.
      Es seguro mientras ReputeCast funciona y se puede volver a ejecutar; el resellado queda en el registro de
      auditoría de la instancia. Sale con 1 cuando algunos valores no se abren con ninguna clave configurada. Cuando ya
      no queda nada con una clave anterior, esa clave solo comprueba enlaces de correos ya enviados; quítala después de
      una filtración, al menos un día más tarde, porque los formularios de suscripción reparten durante ese tiempo
      tokens sellados con ella.
    fr: >-
      Après un changement de clé (`secrets.key` défini sur une nouvelle clé, l’ancienne déplacée dans
      `secrets.previous_keys`), rechiffre chaque identifiant, jeton et secret stocké avec la nouvelle clé et affiche,
      par type de valeur, combien utilisaient une clé précédente, combien ont été rescellés et combien sont illisibles.
      Sans risque pendant que ReputeCast tourne, et sans risque à relancer ; le rescellement figure dans le journal
      d’audit de l’instance. Se termine avec le code 1 si certaines valeurs ne s’ouvrent avec aucune clé configurée. Une
      fois qu’aucune valeur n’utilise plus une clé précédente, celle-ci ne sert plus qu’à vérifier les liens des e-mails
      déjà envoyés ; après une fuite, retirez-la au moins un jour plus tard, car les formulaires d’inscription
      distribuent pendant ce délai des jetons scellés avec elle.
  flags:
    - name: --dry-run
      type: bool
      default: 'false'
      description:
        en: Count what would be resealed, without writing.
        vi: Đếm những gì sẽ được mã hóa lại, không ghi gì.
        de: Zählen, was neu versiegelt würde, ohne zu schreiben.
        es: Contar lo que se volvería a sellar, sin escribir nada.
        fr: Compter ce qui serait rescellé, sans rien écrire.
  examples:
    - code: reputecast secrets reseal --dry-run
      description:
        en: See how many values still use a previous key.
        vi: Xem còn bao nhiêu giá trị dùng khóa trước.
        de: Sehen, wie viele Werte noch einen früheren Schlüssel nutzen.
        es: Ver cuántos valores usan todavía una clave anterior.
        fr: Voir combien de valeurs utilisent encore une clé précédente.
    - code: reputecast secrets reseal
      description:
        en: Re-encrypt them with the current key after a rotation.
        vi: Mã hóa lại chúng bằng khóa hiện tại sau khi xoay vòng khóa.
        de: Sie nach einer Rotation mit dem aktuellen Schlüssel neu verschlüsseln.
        es: Volver a cifrarlos con la clave actual después de una rotación.
        fr: Les rechiffrer avec la clé actuelle après une rotation.

- id: storage
  command: reputecast storage <command>
  summary:
    en: Move the files kept outside the database to another storage backend.
    vi: Chuyển các tệp được giữ ngoài cơ sở dữ liệu sang nơi lưu khác.
    de: Die außerhalb der Datenbank aufbewahrten Dateien in einen anderen Speicher verschieben.
    es: Mover los archivos que se guardan fuera de la base de datos a otro almacenamiento.
    fr: Déplacer les fichiers conservés hors de la base de données vers un autre stockage.

- id: storage migrate
  command: reputecast storage migrate --to s3 [--dry-run]
  summary:
    en: Copy the files folder into the S3-compatible bucket that `storage.s3` names.
    vi: Sao chép thư mục tệp vào bucket tương thích S3 mà `storage.s3` chỉ định.
    de: Den Dateiordner in den S3-kompatiblen Bucket kopieren, den `storage.s3` benennt.
    es: Copiar la carpeta de archivos al bucket compatible con S3 que indica `storage.s3`.
    fr: Copier le dossier des fichiers dans le bucket compatible S3 que désigne `storage.s3`.
  description:
    en: >-
      Copies every file of the files folder (`files.dir`) into the bucket under the same key, eight at a time, reads
      each copy back to check its SHA-256, and skips files the bucket already holds at the same size. It never deletes
      local files, is safe to run while ReputeCast runs and safe to run again, and records a copy in the instance audit
      log. It needs the `storage.s3` keys set; `storage.backend` can stay `local` until you switch. Exits 1 when a file
      failed (each is named on standard error); the next run copies it. Available from the next release after 1.6.0.
    vi: >-
      Sao chép mọi tệp của thư mục tệp (`files.dir`) vào bucket với cùng khóa, mỗi lần tám tệp, đọc lại từng bản sao để
      kiểm tra SHA-256, và bỏ qua các tệp mà bucket đã có với cùng kích thước. Lệnh không bao giờ xóa tệp cục bộ, an
      toàn khi ReputeCast đang chạy và khi chạy lại, và ghi lần sao chép vào nhật ký kiểm tra của hệ thống. Lệnh cần đặt
      các khóa `storage.s3`; `storage.backend` có thể giữ là `local` cho đến khi bạn chuyển. Thoát với mã 1 khi có tệp
      sao chép thất bại (mỗi tệp được nêu tên trên standard error); lần chạy tiếp theo sẽ sao chép tệp đó. Có từ bản
      phát hành tiếp theo sau 1.6.0.
    de: >-
      Kopiert jede Datei des Dateiordners (`files.dir`) unter demselben Schlüssel in den Bucket, acht gleichzeitig,
      liest jede Kopie zurück, um ihre SHA-256-Prüfsumme zu prüfen, und überspringt Dateien, die der Bucket bereits in
      derselben Größe hat. Er löscht nie lokale Dateien, ist sicher, während ReputeCast läuft, und bei erneuter
      Ausführung, und vermerkt eine Kopie im Audit-Protokoll der Instanz. Er braucht die gesetzten Schlüssel
      `storage.s3`; `storage.backend` kann bis zur Umstellung `local` bleiben. Endet mit 1, wenn eine Datei
      fehlgeschlagen ist (jede wird in der Standardfehlerausgabe genannt); der nächste Lauf kopiert sie. Verfügbar ab
      dem nächsten Release nach 1.6.0.
    es: >-
      Copia todos los archivos de la carpeta de archivos (`files.dir`) al bucket con la misma clave, ocho a la vez, lee
      cada copia para comprobar su SHA-256 y se salta los archivos que el bucket ya tiene con el mismo tamaño. Nunca
      borra archivos locales, es seguro mientras ReputeCast funciona y se puede volver a ejecutar, y deja la copia en el
      registro de auditoría de la instancia. Necesita las claves `storage.s3` definidas; `storage.backend` puede seguir
      en `local` hasta el cambio. Sale con 1 cuando falla un archivo (cada uno se nombra en la salida de error
      estándar); la siguiente ejecución lo copia. Disponible a partir de la próxima versión después de la 1.6.0.
    fr: >-
      Copie chaque fichier du dossier des fichiers (`files.dir`) dans le bucket sous la même clé, huit à la fois, relit
      chaque copie pour vérifier son SHA-256 et ignore les fichiers que le bucket contient déjà avec la même taille. Ne
      supprime jamais les fichiers locaux, sans risque pendant que ReputeCast tourne et sans risque à relancer, et
      inscrit la copie dans le journal d’audit de l’instance. Nécessite les clés `storage.s3` ; `storage.backend` peut
      rester sur `local` jusqu’à la bascule. Se termine avec le code 1 si un fichier a échoué (chacun est nommé sur la
      sortie d’erreur standard) ; l’exécution suivante le copie. Disponible à partir de la prochaine version après la
      1.6.0.
  flags:
    - name: --to
      type: string
      default: ''
      description:
        en: The backend to copy to. Required, and only `s3`.
        vi: Nơi lưu cần sao chép đến. Bắt buộc, và chỉ có `s3`.
        de: Der Speicher, in den kopiert wird. Erforderlich, und nur `s3`.
        es: El almacenamiento al que se copia. Obligatorio, y solo `s3`.
        fr: Le stockage de destination. Obligatoire, et uniquement `s3`.
    - name: --dry-run
      type: bool
      default: 'false'
      description:
        en: Count what would be copied, without copying.
        vi: Đếm những gì sẽ được sao chép, không sao chép.
        de: Zählen, was kopiert würde, ohne zu kopieren.
        es: Contar lo que se copiaría, sin copiar.
        fr: Compter ce qui serait copié, sans rien copier.
  examples:
    - code: reputecast storage migrate --to s3 --dry-run
      description:
        en: Count the folder's files and those the bucket doesn't hold yet.
        vi: Đếm số tệp trong thư mục và số tệp mà bucket chưa có.
        de: Die Dateien des Ordners zählen und die, die der Bucket noch nicht hat.
        es: Contar los archivos de la carpeta y los que el bucket aún no tiene.
        fr: Compter les fichiers du dossier et ceux que le bucket n’a pas encore.
    - code: reputecast storage migrate --to s3
      description:
        en: >-
          Copy them, then set `storage.backend` to `s3`, run it once more and restart every process.
        vi: >-
          Sao chép chúng, rồi đặt `storage.backend` thành `s3`, chạy lại lệnh một lần nữa và khởi động lại mọi tiến
          trình.
        de: >-
          Sie kopieren, dann `storage.backend` auf `s3` setzen, den Befehl noch einmal ausführen und jeden Prozess neu
          starten.
        es: >-
          Copiarlos, después definir `storage.backend` como `s3`, ejecutarlo una vez más y reiniciar todos los procesos.
        fr: >-
          Les copier, puis définir `storage.backend` sur `s3`, relancer la commande une fois et redémarrer chaque
          processus.

- id: adapter
  command: reputecast adapter <command>
  summary:
    en: Install community adapters and tell ReputeCast where they run.
    vi: Cài adapter cộng đồng và cho ReputeCast biết chúng chạy ở đâu.
    de: Community-Adapter installieren und ReputeCast mitteilen, wo sie laufen.
    es: Instalar adaptadores de la comunidad e indicar a ReputeCast dónde se ejecutan.
    fr: Installer des adaptateurs communautaires et indiquer à ReputeCast où ils s’exécutent.
  description:
    en: >-
      Community adapters run in their own process and speak the adapter protocol. Install one from its manifest, run
      its process with the signing secret ReputeCast prints, and check it. Adapter addresses on loopback or private
      networks need `providers.allow_private_networks`.
    vi: >-
      Adapter cộng đồng chạy trong tiến trình riêng và giao tiếp bằng giao thức adapter. Hãy cài adapter từ manifest của
      nó, chạy tiến trình của nó với khóa bí mật ký mà ReputeCast in ra, rồi kiểm tra nó. Địa chỉ adapter trên loopback
      hoặc mạng riêng cần `providers.allow_private_networks`.
    de: >-
      Community-Adapter laufen in einem eigenen Prozess und sprechen das Adapter-Protokoll. Installieren Sie einen aus
      seinem Manifest, starten Sie seinen Prozess mit dem Signaturschlüssel, den ReputeCast ausgibt, und prüfen Sie ihn.
      Adapter-Adressen auf Loopback oder in privaten Netzen erfordern `providers.allow_private_networks`.
    es: >-
      Los adaptadores de la comunidad se ejecutan en su propio proceso y hablan el protocolo de adaptadores. Instala uno
      desde su manifest, ejecuta su proceso con el secreto de firma que escribe ReputeCast y compruébalo. Las
      direcciones de adaptadores en loopback o en redes privadas necesitan `providers.allow_private_networks`.
    fr: >-
      Les adaptateurs communautaires s’exécutent dans leur propre processus et parlent le protocole d’adaptateur.
      Installez-en un depuis son manifest, exécutez son processus avec le secret de signature qu’affiche ReputeCast,
      puis vérifiez-le. Les adresses d’adaptateurs sur des réseaux de bouclage ou privés nécessitent
      `providers.allow_private_networks`.

- id: adapter list
  command: reputecast adapter list
  summary:
    en: List installed community adapters, where they run and their last check.
    vi: Liệt kê các adapter cộng đồng đã cài, nơi chúng chạy và lần kiểm tra gần nhất.
    de: Installierte Community-Adapter auflisten, mit ihrem Standort und ihrer letzten Prüfung.
    es: Listar los adaptadores de la comunidad instalados, dónde se ejecutan y su última comprobación.
    fr: Lister les adaptateurs communautaires installés, où ils s’exécutent et leur dernière vérification.
  description:
    en: Prints the columns `ADAPTER`, `VERSION`, `ADDRESS`, `SECRET ISSUED`, `LAST CHECK` and `CONNECTED`.
    vi: In ra các cột `ADAPTER`, `VERSION`, `ADDRESS`, `SECRET ISSUED`, `LAST CHECK` và `CONNECTED`.
    de: Gibt die Spalten `ADAPTER`, `VERSION`, `ADDRESS`, `SECRET ISSUED`, `LAST CHECK` und `CONNECTED` aus.
    es: Escribe las columnas `ADAPTER`, `VERSION`, `ADDRESS`, `SECRET ISSUED`, `LAST CHECK` y `CONNECTED`.
    fr: Affiche les colonnes `ADAPTER`, `VERSION`, `ADDRESS`, `SECRET ISSUED`, `LAST CHECK` et `CONNECTED`.
  examples:
    - code: reputecast adapter list
      description:
        en: See which adapters are installed and how many providers use each.
        vi: Xem adapter nào đã được cài và mỗi adapter được bao nhiêu nhà cung cấp sử dụng.
        de: Sehen, welche Adapter installiert sind und wie viele Anbieter jeden davon nutzen.
        es: Ver qué adaptadores están instalados y cuántos proveedores usa cada uno.
        fr: Voir quels adaptateurs sont installés et combien de fournisseurs utilisent chacun d’eux.

- id: adapter install
  command: reputecast adapter install <manifest-url-or-file> [--url <address>]
  summary:
    en: Install a community adapter from its `manifest.json`, or update it when its id is already installed.
    vi: Cài một adapter cộng đồng từ `manifest.json` của nó, hoặc cập nhật adapter nếu id của nó đã được cài.
    de: >-
      Einen Community-Adapter aus seiner `manifest.json` installieren oder aktualisieren, wenn seine ID bereits
      installiert ist.
    es: Instalar un adaptador de la comunidad desde su `manifest.json`, o actualizarlo si su id ya está instalado.
    fr: >-
      Installer un adaptateur communautaire depuis son `manifest.json`, ou le mettre à jour si son id est déjà installé.
  description:
    en: >-
      Reads the manifest from an `https://` URL on a public address (redirects are not followed) or from a local file,
      up to 256 KiB. On a first install, ReputeCast prints the adapter's signing secret once: set it on the adapter
      process as `REPUTECAST_ADAPTER_SECRET`.
    vi: >-
      Đọc manifest từ một URL `https://` ở địa chỉ công khai (không đi theo chuyển hướng) hoặc từ tệp cục bộ, tối đa 256
      KiB. Ở lần cài đầu tiên, ReputeCast in ra khóa bí mật ký của adapter một lần duy nhất: hãy đặt nó cho tiến trình
      adapter dưới dạng `REPUTECAST_ADAPTER_SECRET`.
    de: >-
      Liest das Manifest von einer `https://`-URL unter einer öffentlichen Adresse (Weiterleitungen werden nicht
      verfolgt) oder aus einer lokalen Datei, bis zu 256 KiB. Bei einer Erstinstallation gibt ReputeCast den
      Signaturschlüssel des Adapters einmal aus: Setzen Sie ihn im Adapter-Prozess als `REPUTECAST_ADAPTER_SECRET`.
    es: >-
      Lee el manifest desde una URL `https://` en una dirección pública (no sigue redirecciones) o desde un archivo
      local, de hasta 256 KiB. En la primera instalación, ReputeCast escribe una sola vez el secreto de firma del
      adaptador: defínelo en el proceso del adaptador como `REPUTECAST_ADAPTER_SECRET`.
    fr: >-
      Lit le manifest depuis une URL `https://` à une adresse publique (les redirections ne sont pas suivies) ou depuis
      un fichier local, jusqu’à 256 Kio. Lors d’une première installation, ReputeCast affiche une seule fois le secret
      de signature de l’adaptateur : définissez-le sur le processus de l’adaptateur comme `REPUTECAST_ADAPTER_SECRET`.
  args: <manifest-url-or-file>
  flags:
    - name: --url
      type: string
      default: ''
      description:
        en: >-
          Where the adapter process listens, like `http://example-esp:4600`. If you omit it, set it later with
          `adapter set-url`.
        vi: >-
          Địa chỉ mà tiến trình adapter lắng nghe, ví dụ `http://example-esp:4600`. Nếu bỏ qua cờ này, hãy đặt sau bằng
          `adapter set-url`.
        de: >-
          Wo der Adapter-Prozess lauscht, etwa `http://example-esp:4600`. Wenn Sie das Flag weglassen, setzen Sie den
          Wert später mit `adapter set-url`.
        es: >-
          Dónde escucha el proceso del adaptador, por ejemplo `http://example-esp:4600`. Si la omites, defínela más
          tarde con `adapter set-url`.
        fr: >-
          Adresse d’écoute du processus de l’adaptateur, par exemple `http://example-esp:4600`. Si vous l’omettez,
          définissez-la plus tard avec `adapter set-url`.
  examples:
    - code: reputecast adapter install https://raw.githubusercontent.com/you/example-esp-adapter/main/manifest.json --url http://example-esp:4600
      description:
        en: Install from a published manifest.
        vi: Cài từ một manifest đã công bố.
        de: Aus einem veröffentlichten Manifest installieren.
        es: Instalar desde un manifest publicado.
        fr: Installer depuis un manifest publié.
    - code: reputecast adapter install ./manifest.json --url http://127.0.0.1:4600
      description:
        en: Install from a local file, for an adapter running on the same machine.
        vi: Cài từ tệp cục bộ, cho adapter chạy trên cùng máy.
        de: Aus einer lokalen Datei installieren, für einen Adapter auf demselben Rechner.
        es: Instalar desde un archivo local, para un adaptador que se ejecuta en el mismo equipo.
        fr: Installer depuis un fichier local, pour un adaptateur qui tourne sur la même machine.

- id: adapter set-url
  command: reputecast adapter set-url <id> <url>
  summary:
    en: Set where an adapter's process listens.
    vi: Đặt địa chỉ mà tiến trình của adapter lắng nghe.
    de: Festlegen, wo der Prozess eines Adapters lauscht.
    es: Definir dónde escucha el proceso de un adaptador.
    fr: Définir l’adresse d’écoute du processus d’un adaptateur.
  args: <id> <url>
  examples:
    - code: reputecast adapter set-url example-esp http://example-esp:4600
      description:
        en: Point ReputeCast at the adapter's address.
        vi: Trỏ ReputeCast đến địa chỉ của adapter.
        de: ReputeCast auf die Adresse des Adapters verweisen.
        es: Indicar a ReputeCast la dirección del adaptador.
        fr: Faire pointer ReputeCast vers l’adresse de l’adaptateur.

- id: adapter secret
  command: reputecast adapter secret <id>
  summary:
    en: Issue a new signing secret for an adapter and print it once.
    vi: Cấp khóa bí mật ký mới cho một adapter và in ra một lần duy nhất.
    de: Einen neuen Signaturschlüssel für einen Adapter ausstellen und ihn einmal ausgeben.
    es: Emitir un secreto de firma nuevo para un adaptador y escribirlo una sola vez.
    fr: Émettre un nouveau secret de signature pour un adaptateur et l’afficher une seule fois.
  description:
    en: >-
      The previous secret keeps working for 24 hours, so you can update the adapter process without downtime: it
      accepts several comma-separated secrets in `REPUTECAST_ADAPTER_SECRET`.
    vi: >-
      Khóa bí mật trước vẫn dùng được trong 24 giờ, nên bạn có thể cập nhật tiến trình adapter mà không bị gián đoạn:
      tiến trình chấp nhận nhiều khóa bí mật phân tách bằng dấu phẩy trong `REPUTECAST_ADAPTER_SECRET`.
    de: >-
      Der bisherige Signaturschlüssel funktioniert noch 24 Stunden, sodass Sie den Adapter-Prozess ohne Ausfallzeit
      aktualisieren können: Er akzeptiert in `REPUTECAST_ADAPTER_SECRET` mehrere kommagetrennte Schlüssel.
    es: >-
      El secreto anterior sigue funcionando durante 24 horas, así que puedes actualizar el proceso del adaptador sin
      interrupciones: acepta varios secretos separados por comas en `REPUTECAST_ADAPTER_SECRET`.
    fr: >-
      Le secret précédent continue de fonctionner pendant 24 heures, pour que vous puissiez mettre à jour le processus
      de l’adaptateur sans interruption : il accepte plusieurs secrets séparés par des virgules dans
      `REPUTECAST_ADAPTER_SECRET`.
  args: <id>
  examples:
    - code: reputecast adapter secret example-esp
      description:
        en: Rotate the adapter's signing secret.
        vi: Xoay vòng khóa bí mật ký của adapter.
        de: Den Signaturschlüssel des Adapters rotieren.
        es: Rotar el secreto de firma del adaptador.
        fr: Renouveler le secret de signature de l’adaptateur.

- id: adapter check
  command: reputecast adapter check <id>
  summary:
    en: Call an adapter's health operation and record the result.
    vi: Gọi thao tác kiểm tra tình trạng (health) của adapter và ghi lại kết quả.
    de: Die Zustandsprüfung eines Adapters aufrufen und das Ergebnis speichern.
    es: Llamar a la operación de estado de un adaptador y registrar el resultado.
    fr: Appeler l’opération de santé d’un adaptateur et enregistrer le résultat.
  args: <id>
  examples:
    - code: reputecast adapter check example-esp
      description:
        en: Confirm that ReputeCast can reach the adapter with its signing secret.
        vi: Xác nhận ReputeCast kết nối được với adapter bằng khóa bí mật ký của nó.
        de: Bestätigen, dass ReputeCast den Adapter mit seinem Signaturschlüssel erreicht.
        es: Confirmar que ReputeCast puede llegar al adaptador con su secreto de firma.
        fr: Confirmer que ReputeCast peut joindre l’adaptateur avec son secret de signature.

- id: adapter remove
  command: reputecast adapter remove <id>
  summary:
    en: Uninstall an adapter that no connected provider uses.
    vi: Gỡ cài đặt một adapter không còn nhà cung cấp đã kết nối nào sử dụng.
    de: Einen Adapter deinstallieren, den kein verbundener Anbieter nutzt.
    es: Desinstalar un adaptador que no usa ningún proveedor conectado.
    fr: Désinstaller un adaptateur qu’aucun fournisseur connecté n’utilise.
  args: <id>
  examples:
    - code: reputecast adapter remove example-esp
      description:
        en: Remove an adapter after disconnecting the providers that use it.
        vi: Gỡ một adapter sau khi ngắt kết nối các nhà cung cấp dùng nó.
        de: Einen Adapter entfernen, nachdem die Anbieter getrennt wurden, die ihn nutzen.
        es: Quitar un adaptador después de desconectar los proveedores que lo usan.
        fr: Retirer un adaptateur après avoir déconnecté les fournisseurs qui l’utilisent.

- id: healthcheck
  command: reputecast healthcheck [--live] [--url <url>] [--timeout <duration>]
  summary:
    en: Check that the ReputeCast process on this host is ready, for container health checks.
    vi: Kiểm tra tiến trình ReputeCast trên máy này đã sẵn sàng chưa, dùng cho kiểm tra tình trạng container.
    de: Prüfen, ob der ReputeCast-Prozess auf diesem Host bereit ist, für Zustandsprüfungen von Containern.
    es: >-
      Comprobar que el proceso de ReputeCast de este host está listo, para las comprobaciones de estado de los
      contenedores.
    fr: Vérifier que le processus ReputeCast de cet hôte est prêt, pour les vérifications de l’état des conteneurs.
  description:
    en: >-
      Asks the local process's `/readyz`: ready means its database answers, the schema has every migration and, in a
      worker, the workers run. It tries the HTTP listener (`REPUTECAST_HTTP__ADDR`, `:8080` by default), then the
      metrics listener (`REPUTECAST_METRICS__ADDR`, `:9464`), so it checks a worker-only process too. Prints the answer
      and exits 0 when ready, 1 otherwise. The Docker image's health check runs it.
    vi: >-
      Hỏi `/readyz` của tiến trình trên máy: sẵn sàng nghĩa là cơ sở dữ liệu phản hồi, lược đồ có đủ mọi migration và,
      với worker, các worker đang chạy. Lệnh thử cổng HTTP (`REPUTECAST_HTTP__ADDR`, mặc định `:8080`), rồi đến cổng số
      liệu (`REPUTECAST_METRICS__ADDR`, `:9464`), nên kiểm tra được cả tiến trình chỉ chạy worker. Lệnh in ra câu trả lời
      và thoát với mã 0 khi sẵn sàng, 1 trong trường hợp còn lại. Bước kiểm tra tình trạng của Docker image chạy lệnh này.
    de: >-
      Fragt `/readyz` des lokalen Prozesses ab: Bereit heißt, dass seine Datenbank antwortet, das Schema alle
      Migrationen hat und, bei einem Worker, die Worker laufen. Der Befehl versucht zuerst den HTTP-Listener
      (`REPUTECAST_HTTP__ADDR`, standardmäßig `:8080`), dann den Metrik-Listener (`REPUTECAST_METRICS__ADDR`, `:9464`),
      und prüft so auch einen reinen Worker-Prozess. Gibt die Antwort aus und endet mit 0, wenn der Prozess bereit ist,
      sonst mit 1. Die Zustandsprüfung des Docker-Images führt ihn aus.
    es: >-
      Consulta `/readyz` del proceso local: listo significa que su base de datos responde, que el esquema tiene todas
      las migraciones y, en un worker, que los workers se ejecutan. Prueba el listener HTTP (`REPUTECAST_HTTP__ADDR`,
      `:8080` por defecto) y después el de métricas (`REPUTECAST_METRICS__ADDR`, `:9464`), así que también comprueba un
      proceso que solo es worker. Escribe la respuesta y sale con 0 si está listo y con 1 si no. La comprobación de
      estado de la imagen de Docker lo ejecuta.
    fr: >-
      Interroge `/readyz` du processus local : prêt signifie que sa base de données répond, que le schéma a toutes les
      migrations et, dans un worker, que les workers tournent. La commande essaie l’écouteur HTTP
      (`REPUTECAST_HTTP__ADDR`, `:8080` par défaut), puis l’écouteur de métriques (`REPUTECAST_METRICS__ADDR`,
      `:9464`) : elle vérifie donc aussi un processus worker seul. Affiche la réponse et se termine avec le code 0 si le
      processus est prêt, 1 sinon. La vérification de l’état de l’image Docker l’exécute.
  flags:
    - name: --live
      type: bool
      default: 'false'
      description:
        en: Check liveness (`/healthz`) instead of readiness.
        vi: Kiểm tra tiến trình còn sống (`/healthz`) thay vì đã sẵn sàng.
        de: Erreichbarkeit (`/healthz`) statt Bereitschaft prüfen.
        es: Comprobar si está vivo (`/healthz`) en lugar de si está listo.
        fr: Vérifier la vivacité (`/healthz`) au lieu de la disponibilité.
    - name: --url
      type: string
      default: ''
      description:
        en: The URL to check. Without it, the local HTTP listener, then the metrics listener.
        vi: URL cần kiểm tra. Nếu không có cờ này, lệnh dùng cổng HTTP trên máy, rồi đến cổng số liệu.
        de: Die zu prüfende URL. Ohne dieses Flag der lokale HTTP-Listener, dann der Metrik-Listener.
        es: La URL que se comprueba. Sin ella, el listener HTTP local y después el de métricas.
        fr: URL à vérifier. Sans cette option, l’écouteur HTTP local, puis l’écouteur de métriques.
    - name: --timeout
      type: duration
      default: 3s
      description:
        en: How long to wait for an answer.
        vi: Thời gian chờ câu trả lời.
        de: Wie lange auf eine Antwort gewartet wird.
        es: Cuánto esperar una respuesta.
        fr: Durée d’attente d’une réponse.
  examples:
    - code: reputecast healthcheck
      description:
        en: Check readiness, as the Docker image's health check does.
        vi: Kiểm tra mức sẵn sàng, như bước kiểm tra tình trạng của Docker image.
        de: Bereitschaft prüfen, wie es die Zustandsprüfung des Docker-Images tut.
        es: Comprobar si está listo, como hace la comprobación de estado de la imagen de Docker.
        fr: Vérifier la disponibilité, comme le fait la vérification de l’état de l’image Docker.
    - code: reputecast healthcheck --live
      description:
        en: Check only that the process answers, even while it waits for migrations.
        vi: Chỉ kiểm tra tiến trình có phản hồi, kể cả khi nó đang chờ migration.
        de: Nur prüfen, ob der Prozess antwortet, auch während er auf Migrationen wartet.
        es: Comprobar solo que el proceso responde, aunque esté esperando migraciones.
        fr: Vérifier seulement que le processus répond, même pendant qu’il attend des migrations.

- id: doctor
  command: reputecast doctor
  summary:
    en: Check the database, schema, secret key, file storage and roles, after a restore or a move.
    vi: Kiểm tra cơ sở dữ liệu, lược đồ, khóa bí mật, nơi lưu tệp và vai trò, sau khi khôi phục hoặc chuyển máy chủ.
    de: >-
      Datenbank, Schema, geheimen Schlüssel, Dateispeicher und Rollen nach einer Wiederherstellung oder einem Umzug
      prüfen.
    es: >-
      Comprobar la base de datos, el esquema, la clave secreta, el almacenamiento de archivos y los roles, después de
      una restauración o un traslado.
    fr: >-
      Vérifier la base de données, le schéma, la clé secrète, le stockage des fichiers et les rôles, après une
      restauration ou un déménagement.
  description:
    en: >-
      Checks what a restore or a move to another host can get wrong, one line each marked `ok`, `warn` or `FAIL`: the
      PostgreSQL version (16 to 18), pending migrations, whether the secret key opens a sample of every kind of sealed
      value (and whether values still use a previous key), the file storage, the GeoIP database, the
      `reputecast_segments` role SQL segments run as (`pg_dump` doesn't carry roles) and `http.public_url`. File storage
      is the files folder, which must exist and be writable, or with `storage.backend` `s3` the bucket, which must
      answer and take, read back and delete a test object under `.doctor/`; the line counts what it holds. GeoIP shows
      the file's type and build date, or warns when it can't be read. The public URL warns when it isn't `https://`, or
      when `http.public_url_locked` pins an address only the server reaches. Exits 1 when a check fails.
    vi: >-
      Kiểm tra những gì có thể sai khi khôi phục hoặc chuyển sang máy chủ khác, mỗi mục một dòng đánh dấu `ok`, `warn`
      hoặc `FAIL`: phiên bản PostgreSQL (16 đến 18), migration đang chờ, khóa bí mật có mở được một mẫu của mọi loại giá
      trị đã mã hóa không (và còn giá trị nào dùng khóa trước không), nơi lưu tệp, cơ sở dữ liệu GeoIP, vai trò
      `reputecast_segments` mà phân khúc SQL chạy dưới quyền (`pg_dump` không mang theo vai trò) và `http.public_url`.
      Nơi lưu tệp là thư mục tệp, phải tồn tại và ghi được, hoặc với `storage.backend` là `s3` thì là bucket, phải phản
      hồi và nhận, đọc lại rồi xóa một đối tượng thử dưới `.doctor/`; dòng này đếm những gì nó đang chứa. GeoIP hiển thị
      loại tệp và ngày tạo, hoặc cảnh báo khi không đọc được tệp. URL công khai cảnh báo khi không phải `https://`, hoặc
      khi `http.public_url_locked` khóa một địa chỉ chỉ máy chủ truy cập được. Thoát với mã 1 khi có mục kiểm tra thất
      bại.
    de: >-
      Prüft, was bei einer Wiederherstellung oder einem Umzug auf einen anderen Host schiefgehen kann, je eine Zeile,
      markiert mit `ok`, `warn` oder `FAIL`: die PostgreSQL-Version (16 bis 18), ausstehende Migrationen, ob der geheime
      Schlüssel eine Stichprobe jeder Art versiegelter Werte öffnet (und ob Werte noch einen früheren Schlüssel nutzen),
      den Dateispeicher, die GeoIP-Datenbank, die Rolle `reputecast_segments`, unter der SQL-Segmente laufen (`pg_dump`
      überträgt keine Rollen), und `http.public_url`. Der Dateispeicher ist der Dateiordner, der existieren und
      beschreibbar sein muss, oder mit `storage.backend` `s3` der Bucket, der antworten und ein Testobjekt unter
      `.doctor/` annehmen, zurückgeben und löschen muss; die Zeile zählt, was er enthält. GeoIP zeigt Typ und
      Build-Datum der Datei oder warnt, wenn sie nicht lesbar ist. Die öffentliche URL warnt, wenn sie nicht `https://`
      ist oder wenn `http.public_url_locked` eine Adresse festlegt, die nur der Server erreicht. Endet mit 1, wenn eine
      Prüfung fehlschlägt.
    es: >-
      Comprueba lo que puede salir mal en una restauración o en un traslado a otro host, una línea por comprobación
      marcada `ok`, `warn` o `FAIL`: la versión de PostgreSQL (de 16 a 18), las migraciones pendientes, si la clave
      secreta abre una muestra de cada tipo de valor sellado (y si hay valores que aún usan una clave anterior), el
      almacenamiento de archivos, la base de datos GeoIP, el rol `reputecast_segments` con el que se ejecutan los
      segmentos SQL (`pg_dump` no incluye los roles) y `http.public_url`. El almacenamiento de archivos es la carpeta de
      archivos, que debe existir y admitir escritura, o, con `storage.backend` `s3`, el bucket, que debe responder y
      aceptar, devolver y borrar un objeto de prueba bajo `.doctor/`; la línea cuenta lo que contiene. GeoIP muestra el
      tipo del archivo y su fecha de compilación, o avisa cuando no se puede leer. La URL pública avisa cuando no es
      `https://` o cuando `http.public_url_locked` fija una dirección a la que solo llega el servidor. Sale con 1 cuando
      falla una comprobación.
    fr: >-
      Vérifie ce qu’une restauration ou un déménagement vers un autre hôte peut casser, une ligne par point marquée
      `ok`, `warn` ou `FAIL` : la version de PostgreSQL (16 à 18), les migrations en attente, si la clé secrète ouvre un
      échantillon de chaque type de valeur scellée (et si des valeurs utilisent encore une clé précédente), le stockage
      des fichiers, la base GeoIP, le rôle `reputecast_segments` sous lequel s’exécutent les segments SQL (`pg_dump` ne
      transporte pas les rôles) et `http.public_url`. Le stockage des fichiers est le dossier des fichiers, qui doit
      exister et être accessible en écriture, ou, avec `storage.backend` `s3`, le bucket, qui doit répondre puis
      accepter, relire et supprimer un objet de test sous `.doctor/` ; la ligne compte ce qu’il contient. GeoIP affiche
      le type du fichier et sa date de construction, ou avertit s’il est illisible. L’URL publique avertit lorsqu’elle
      n’est pas en `https://` ou lorsque `http.public_url_locked` fixe une adresse que seul le serveur peut joindre. Se
      termine avec le code 1 si un contrôle échoue.
  examples:
    - code: reputecast doctor
      description:
        en: Check a restored instance before starting it; every line should read `ok`.
        vi: Kiểm tra hệ thống vừa khôi phục trước khi khởi động; mọi dòng đều nên là `ok`.
        de: Eine wiederhergestellte Instanz vor dem Start prüfen; jede Zeile sollte `ok` lauten.
        es: Comprobar una instancia restaurada antes de iniciarla; todas las líneas deberían decir `ok`.
        fr: Vérifier une instance restaurée avant de la démarrer ; chaque ligne doit indiquer `ok`.

- id: version
  command: reputecast version
  summary:
    en: Print the version.
    vi: In ra phiên bản.
    de: Die Version ausgeben.
    es: Escribir la versión.
    fr: Afficher la version.
  description:
    en: Prints the version, the first 12 characters of the commit and the Go version.
    vi: In ra phiên bản, 12 ký tự đầu của commit và phiên bản Go.
    de: Gibt die Version, die ersten 12 Zeichen des Commits und die Go-Version aus.
    es: Escribe la versión, los 12 primeros caracteres del commit y la versión de Go.
    fr: Affiche la version, les 12 premiers caractères du commit et la version de Go.
  examples:
    - code: reputecast version
      description:
        en: Check which version is installed.
        vi: Kiểm tra phiên bản đang được cài.
        de: Prüfen, welche Version installiert ist.
        es: Comprobar qué versión está instalada.
        fr: Vérifier quelle version est installée.
