- id: lookups-gmail-postmaster
  name: Gmail Postmaster Tools
  family: lookups
  kind:
    en: Through HostRepute
    vi: Qua HostRepute
    de: Über HostRepute
    es: A través de HostRepute
    fr: Via HostRepute
  notes:
    en: Gmail's daily spam rate, reputation and authentication rates per sending domain arrive through a HostRepute connection. Send Readiness reads Gmail's compliance status from them, and the 72-hour complaint watch can compare Gmail's spam rate with the complaint threshold per mailbox provider.
    vi: Tỷ lệ thư rác theo ngày, uy tín và tỷ lệ xác thực của Gmail cho từng tên miền gửi đến qua kết nối HostRepute. Độ sẵn sàng gửi đọc trạng thái tuân thủ của Gmail từ dữ liệu này, còn việc theo dõi khiếu nại trong 72 giờ có thể so tỷ lệ thư rác của Gmail với ngưỡng khiếu nại theo nhà cung cấp hộp thư.
    de: >-
      Die tägliche Spamrate, Reputation und Authentifizierungsraten von Gmail je Versanddomain kommen über eine
      HostRepute-Verbindung. Die Versandbereitschaft liest daraus den Compliance-Status bei Gmail, und die
      72-Stunden-Überwachung von Beschwerden kann die Spamrate von Gmail mit der Beschwerdeschwelle je Postfachanbieter
      vergleichen.
    es: >-
      La tasa de spam diaria, la reputación y las tasas de autenticación de Gmail por dominio de envío llegan a través
      de una conexión con HostRepute. La revisión previa lee de ellas el estado de cumplimiento de Gmail, y la
      vigilancia de quejas de 72 horas puede comparar la tasa de spam de Gmail con el umbral de quejas por proveedor de
      buzón.
    fr: >-
      Le taux de spam quotidien, la réputation et les taux d’authentification de Gmail par domaine d’envoi arrivent via
      une connexion HostRepute. Le contrôle avant envoi y lit l’état de conformité de Gmail, et la surveillance des
      plaintes sur 72 heures peut comparer le taux de spam de Gmail au seuil de plainte par fournisseur de messagerie.
  page: /deliverability/hostrepute/
