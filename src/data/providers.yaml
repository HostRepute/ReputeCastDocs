# Services ReputeCast connects to, rendered by <ProviderMatrix family="…">.
# Email values come from each adapter's descriptor (internal/providers/<key>/<key>.go) and the
# "Built-in adapters at a glance" table in docs/adapters.md. `bulk` and `suppressionSync` use the
# app's own labels (ui-labels providers.bulk.terms*, providers.events.dir*).

# Email sending providers (built-in adapters; id = upstream adapter key)
- id: ses
  name: Amazon SES
  family: email
  kind: API
  bulk: Allowed
  webhooks: SNS signature (RSA, signing certificate)
  domainApi: API
  suppressionSync: Two-way
  batch: 50, in parallel
  notes:
    en: Connect with a CloudFormation stack or IAM access keys; SNS topics and configuration sets are created for you. Detects the SES sandbox and reads your sending quota and rate. Dedicated IPs optional.
  page: /providers/amazon-ses/
- id: postmark
  name: Postmark
  family: email
  kind: API
  bulk: Broadcast streams only
  webhooks: Basic auth
  domainApi: API (account token)
  suppressionSync: Two-way
  batch: '500'
  notes:
    en: Bulk mail goes on a Broadcast message stream, which ReputeCast can create. Suppressions sync per message stream. Test token sandbox; quota discovery.
  page: /providers/postmark/
- id: postal
  name: Postal (self-hosted)
  family: email
  kind: Self-hosted
  bulk: Your own policy
  webhooks: RSA signature (server JWKS)
  domainApi: Manual DNS
  suppressionSync: Local only
  batch: '1'
  notes:
    en: Your own Postal mail server. New IPs need warming up. Servers on a private network need providers.allow_private_networks.
  page: /providers/postal/
- id: mailgun
  name: Mailgun
  family: email
  kind: API
  bulk: Allowed
  webhooks: HMAC-SHA256 over timestamp and token with the account signing key; 12-hour window
  domainApi: API
  suppressionSync: Two-way
  batch: '1'
  notes:
    en: Detects sandbox domains; quota discovery. One call per message, several calls at a time.
  page: /providers/mailgun/
- id: sendgrid
  name: SendGrid
  family: email
  kind: API
  bulk: Allowed
  webhooks: ECDSA P-256 signed Event Webhook; 26-hour window
  domainApi: API
  suppressionSync: Two-way
  batch: '1'
  notes:
    en: Sandbox mode; quota discovery. One call per message, several calls at a time.
  page: /providers/sendgrid/
- id: resend
  name: Resend
  family: email
  kind: API
  bulk: Allowed
  webhooks: Standard Webhooks (Svix)
  domainApi: API
  suppressionSync: Two-way
  batch: '100'
  notes:
    en: Test addresses for trial sends; quota discovery.
  page: /providers/resend/
- id: sparkpost
  name: SparkPost
  family: email
  kind: API
  bulk: Allowed
  webhooks: Basic auth (SparkPost doesn't sign)
  domainApi: API
  suppressionSync: Two-way
  batch: '1'
  notes:
    en: Sandbox mode; quota discovery. One call per message, several calls at a time.
  page: /providers/sparkpost/
- id: mailjet
  name: Mailjet
  family: email
  kind: API
  bulk: Allowed
  webhooks: Basic auth in the callback URL (Mailjet doesn't sign)
  domainApi: API
  suppressionSync: Two-way
  batch: '50'
  notes:
    en: Suppressions sync with Mailjet's campaign exclusions. Sandbox mode; quota discovery.
  page: /providers/mailjet/
- id: brevo
  name: Brevo
  family: email
  kind: API
  bulk: Allowed
  webhooks: Bearer token (Brevo doesn't sign)
  domainApi: API
  suppressionSync: Pull only
  batch: '1'
  notes:
    en: Brevo rewrites links and adds an open pixel by default; turn its tracking off to avoid double tracking. Suppressions are pulled from Brevo but not pushed to it.
  page: /providers/brevo/
- id: azureacs
  name: Azure Communication Services
  family: email
  kind: API
  bulk: Allowed
  webhooks: Event Grid with an Entra ID token or a shared secret header
  domainApi: Manual DNS
  suppressionSync: Local only
  batch: '1'
  notes:
    en: Events arrive through Event Grid (Event Grid event schema only), after its validation handshake.
  page: /providers/azure-communication-services/
- id: smtp
  name: Generic SMTP
  family: email
  kind: SMTP
  bulk: Your own policy
  webhooks: Bounce mailbox (IMAP/POP3)
  domainApi: Manual DNS
  suppressionSync: Local only
  batch: 25 per connection
  notes:
    en: SMTP has no webhooks, so bounces are read from a bounce mailbox over IMAP or POP3.
  page: /providers/smtp/
- id: httpgeneric
  name: Generic HTTP adapter
  family: email
  kind: HTTP
  bulk: Your own policy
  webhooks: 'Configurable: HMAC, Standard Webhooks, basic auth, header secret'
  domainApi: Manual DNS
  suppressionSync: Local only
  batch: '1'
  notes:
    en: Maps any HTTP email API with a manifest, without writing code.
  page: /providers/generic-http/

# SMS providers (internal/sms/<adapter>; catalog order from sms.go catalogOrder)
- id: sms-twilio
  name: Twilio
  family: sms
  kind: Programmable Messaging API
  webhooks: Signed with a webhook shared key ReputeCast creates (X-Twilio-Signature)
  suppressionSync: From replies and refused texts
  notes:
    en: Connect with an API key SID and secret, never the auth token. Toll-free, 10DLC and sender IDs outside the US and Canada.
  page: /channels/sms/
- id: sms-vonage
  name: Vonage
  family: sms
  kind: SMS API
  webhooks: Signed webhooks, HMAC-SHA256 with the account signature secret
  suppressionSync: From replies and refused texts
  notes:
    en: Vonage reports no registration status through its API, so sender registrations are set by hand.
  page: /channels/sms/
- id: sms-plivo
  name: Plivo
  family: sms
  kind: Message API
  webhooks: Plivo V3 signature (HMAC-SHA256 with the auth token and a nonce)
  suppressionSync: None (keywords arrive as inbound texts)
  notes:
    en: Connect with the auth ID and auth token.
  page: /channels/sms/
- id: sms-telnyx
  name: Telnyx
  family: sms
  kind: API v2
  webhooks: Ed25519 signature checked with the account public key, with a timestamp
  suppressionSync: Read only
  notes:
    en: Connect with an API key and the account public key. Prices are entered by hand and corrected from each text's cost.
  page: /channels/sms/
- id: sms-aws-eum
  name: AWS End User Messaging
  family: sms
  kind: AWS API
  webhooks: Amazon SNS topic, signatures checked against Amazon's certificates
  suppressionSync: Two-way (opt-out list)
  notes:
    en: Texts from your own AWS account with a CloudFormation role or IAM keys. Prices are entered by hand.
  page: /channels/sms/

