    vi: SMTP không có webhook, nên thư trả lại được đọc từ hộp thư nhận thư trả lại qua IMAP hoặc POP3.
    de: SMTP hat keine Webhooks, daher werden Bounces über IMAP oder POP3 aus einem Bounce-Postfach gelesen.
    es: SMTP no tiene webhooks, así que los rebotes se leen de un buzón de rebotes por IMAP o POP3.
    fr: 'SMTP n’a pas de webhooks : les rebonds sont donc lus dans une boîte de réception des rebonds via IMAP ou POP3.'
  page: /providers/smtp/
