# Payments (internal/payments/stripe)
- id: payments-stripe
  name: Stripe
  family: payments
  kind:
    en: Restricted API key
    vi: Khóa API hạn chế
  webhooks:
    en: Created by ReputeCast in your Stripe account, one per key
    vi: Do ReputeCast tạo trong tài khoản Stripe của bạn, mỗi khóa một webhook
  notes:
    en: Connect with a restricted key (rk_live_ or rk_test_); secret keys are refused. A live and a test key can each be connected, and each gets its own webhook.
    vi: Kết nối bằng khóa hạn chế (rk_live_ hoặc rk_test_); khóa bí mật bị từ chối. Có thể kết nối một khóa chính thức và một khóa thử nghiệm, mỗi khóa có webhook riêng.
  page: /earn/connect-stripe/

# Stores (internal/commerce)
- id: stores-shopify
  name: Shopify
  family: stores
  kind:
    en: Custom app
    vi: Ứng dụng tùy chỉnh
  notes:
    en: Paste the client ID and client secret from the app's API credentials in Shopify.
    vi: Dán client ID và client secret lấy từ thông tin xác thực API của ứng dụng trong Shopify.
  page: /integrations/shopify-woocommerce/
- id: stores-woocommerce
  name: WooCommerce
  family: stores
  kind:
    en: REST API key and plugin
    vi: Khóa REST API và plugin
  webhooks:
    en: Registered with a secret; signatures are checked
    vi: Đăng ký kèm một khóa bí mật; chữ ký được kiểm tra
  notes:
    en: Without the ReputeCast plugin, ReputeCast syncs products and orders only, no customer joins a list, and abandoned checkouts aren't reported.
