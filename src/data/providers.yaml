    en: Connect with an API key SID and secret, never the auth token. Toll-free, 10DLC and sender IDs outside the US and Canada.
    vi: Kết nối bằng SID và secret của API key, không bao giờ dùng auth token. Hỗ trợ số miễn cước, 10DLC và ID người gửi ở ngoài Mỹ và Canada.
    de: >-
      Verbindung mit einer API Key SID und einem Secret, nie mit dem Auth Token. Gebührenfreie Nummern, 10DLC und
      Absenderkennungen außerhalb der USA und Kanadas.
    es: >-
      Conecta con un API key SID y su secreto, nunca con el auth token. Números gratuitos, 10DLC e ID de remitente fuera
      de EE. UU. y Canadá.
    fr: >-
      Connexion avec un API key SID et son secret, jamais avec l’auth token. Numéros gratuits, 10DLC et ID d’expéditeur
      hors des États-Unis et du Canada.
  page: /channels/sms/
- id: sms-vonage
  name: Vonage
  family: sms
  kind:
    en: SMS API
    vi: SMS API
    de: SMS API
    es: SMS API
    fr: SMS API
  webhooks:
    en: Signed webhooks, HMAC-SHA256 with the account signature secret
    vi: Webhook có chữ ký, HMAC-SHA256 bằng signature secret của tài khoản
    de: Signierte Webhooks, HMAC-SHA256 mit dem Signature Secret des Kontos
    es: Webhooks firmados, HMAC-SHA256 con el signature secret de la cuenta
    fr: Webhooks signés, HMAC-SHA256 avec le signature secret du compte
  suppressionSync:
    en: From replies and refused texts
    vi: Từ tin trả lời và tin nhắn bị từ chối
    de: Aus Antworten und abgelehnten SMS
    es: A partir de las respuestas y de los SMS rechazados
    fr: À partir des réponses et des SMS refusés
  notes:
    en: Vonage reports no registration status through its API, so sender registrations are set by hand.
    vi: Vonage không báo trạng thái đăng ký qua API, nên trạng thái đăng ký người gửi được đặt thủ công.
    de: Vonage meldet über seine API keinen Registrierungsstatus, daher werden Absenderregistrierungen von Hand gesetzt.
    es: >-
      Vonage no informa del estado del registro a través de su API, así que los registros de remitente se definen a
      mano.
    fr: >-
      Vonage ne communique aucun état d’enregistrement via son API : les enregistrements d’expéditeurs se définissent
      donc à la main.
  page: /channels/sms/
- id: sms-plivo
  name: Plivo
  family: sms
  kind:
    en: Message API
    vi: Message API
    de: Message API
    es: Message API
    fr: Message API
  webhooks:
    en: Plivo V3 signature (HMAC-SHA256 with the auth token and a nonce)
    vi: Chữ ký Plivo V3 (HMAC-SHA256 bằng auth token và một nonce)
    de: Plivo-V3-Signatur (HMAC-SHA256 mit dem Auth Token und einer Nonce)
    es: Firma V3 de Plivo (HMAC-SHA256 con el auth token y un nonce)
    fr: Signature Plivo V3 (HMAC-SHA256 avec l’auth token et un nonce)
  suppressionSync:
    en: None (keywords arrive as inbound texts)
    vi: Không có (từ khóa đến dưới dạng tin nhắn đến)
    de: Keine (Schlüsselwörter kommen als eingehende SMS an)
    es: Ninguna (las palabras clave llegan como SMS entrantes)
    fr: Aucune (les mots-clés arrivent comme SMS entrants)
  notes:
    en: Connect with the auth ID and auth token.
    vi: Kết nối bằng auth ID và auth token.
    de: Verbindung mit der Auth ID und dem Auth Token.
    es: Conecta con el auth ID y el auth token.
    fr: Connexion avec l’auth ID et l’auth token.
  page: /channels/sms/
- id: sms-telnyx
  name: Telnyx
  family: sms
  kind:
    en: API v2
    vi: API v2
    de: API v2
    es: API v2
    fr: API v2
  webhooks:
    en: Ed25519 signature checked with the account public key, with a timestamp
    vi: Chữ ký Ed25519 được kiểm tra bằng khóa công khai của tài khoản, kèm dấu thời gian
    de: Ed25519-Signatur, mit dem öffentlichen Schlüssel des Kontos und einem Zeitstempel geprüft
    es: Firma Ed25519 comprobada con la clave pública de la cuenta, con una marca de tiempo
    fr: Signature Ed25519 vérifiée avec la clé publique du compte, avec horodatage
  suppressionSync:
    en: Read only
    vi: Chỉ đọc
    de: Nur lesen
    es: Solo lectura
    fr: Lecture seule
  notes:
    en: Connect with an API key and the account public key. Prices are entered by hand and corrected from each text's cost.
    vi: Kết nối bằng khóa API và khóa công khai của tài khoản. Giá được nhập thủ công và được điều chỉnh theo chi phí thực của từng tin nhắn.
    de: >-
      Verbindung mit einem API-Schlüssel und dem öffentlichen Schlüssel des Kontos. Preise werden von Hand eingegeben
      und anhand der Kosten jeder SMS korrigiert.
    es: >-
      Conecta con una clave de API y la clave pública de la cuenta. Los precios se introducen a mano y se corrigen con
      el costo de cada SMS.
    fr: >-
      Connexion avec une clé API et la clé publique du compte. Les prix sont saisis à la main et corrigés d’après le
      coût de chaque SMS.
  page: /channels/sms/
- id: sms-aws-eum
  name: AWS End User Messaging
  family: sms
  kind:
    en: AWS API
    vi: API của AWS
    de: AWS API
    es: API de AWS
    fr: API AWS
  webhooks:
    en: Amazon SNS topic, signatures checked against Amazon's certificates
    vi: Amazon SNS topic; chữ ký được kiểm tra với chứng chỉ của Amazon
    de: Amazon-SNS-Topic, Signaturen werden mit den Zertifikaten von Amazon geprüft
    es: SNS topic de Amazon, firmas comprobadas con los certificados de Amazon
    fr: Sujet Amazon SNS, signatures vérifiées avec les certificats d’Amazon
  suppressionSync:
    en: Two-way (opt-out list)
    vi: Hai chiều (danh sách hủy nhận)
    de: Beidseitig (Abmeldeliste)
    es: Bidireccional (lista de bajas)
    fr: Bidirectionnelle (liste de désinscription)
  notes:
    en: Texts from your own AWS account with a CloudFormation role or IAM keys. Prices are entered by hand.
    vi: Nhắn tin từ tài khoản AWS của chính bạn bằng role CloudFormation hoặc khóa IAM. Giá được nhập thủ công.
    de: >-
      SMS aus Ihrem eigenen AWS-Konto mit einer CloudFormation-Rolle oder IAM-Schlüsseln. Preise werden von Hand
      eingegeben.
    es: >-
      SMS desde tu propia cuenta de AWS con un rol de CloudFormation o claves de IAM. Los precios se introducen a mano.
    fr: >-
      SMS envoyés depuis votre propre compte AWS, avec un rôle CloudFormation ou des clés IAM. Les prix sont saisis à la
      main.
  page: /channels/sms/

