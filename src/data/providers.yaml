# Link-domain blocklists and reputation data (internal/contentcheck/blocklist.go, internal/dnscheck, internal/readiness)
- id: lookups-spamhaus-dbl
  name: Spamhaus DBL
  family: lookups
  kind:
    en: DNS lookup, no account
    vi: Tra cứu DNS, không cần tài khoản
  notes:
    en: The domains of the links in your emails are looked up live for Send Readiness and the composer's inline checks. Answers are kept for an hour and shared by every workspace. A lookup that fails or that the list refuses is Unknown, never clean; the lists answer only your own recursive DNS resolver.
    vi: Tên miền của các liên kết trong email được tra cứu trực tiếp cho Độ sẵn sàng gửi và các kiểm tra ngay khi soạn của trình soạn thảo. Kết quả được giữ một giờ và dùng chung cho mọi không gian làm việc. Lần tra cứu thất bại hoặc bị danh sách từ chối có kết quả Không rõ, không bao giờ được coi là sạch; các danh sách chỉ trả lời DNS resolver đệ quy của riêng bạn.
  page: /campaigns/send-readiness/
- id: lookups-surbl
  name: SURBL
  family: lookups
  kind:
    en: DNS lookup, no account
    vi: Tra cứu DNS, không cần tài khoản
  notes:
    en: Looked up together with Spamhaus DBL, with the same cache and the same Unknown result when a lookup fails or is refused.
    vi: Được tra cứu cùng Spamhaus DBL, dùng chung bộ nhớ đệm và cùng kết quả Không rõ khi lần tra cứu thất bại hoặc bị từ chối.
  page: /campaigns/send-readiness/
- id: lookups-gmail-postmaster
  name: Gmail Postmaster Tools
  family: lookups
  kind:
    en: Through HostRepute
    vi: Qua HostRepute
  notes:
    en: Gmail's daily spam rate, reputation and authentication rates per sending domain arrive through a HostRepute connection. Send Readiness reads Gmail's compliance status from them, and the 72-hour complaint watch can compare Gmail's spam rate with the complaint threshold per mailbox provider.
    vi: Tỷ lệ thư rác theo ngày, uy tín và tỷ lệ xác thực của Gmail cho từng tên miền gửi đến qua kết nối HostRepute. Độ sẵn sàng gửi đọc trạng thái tuân thủ của Gmail từ dữ liệu này, còn việc theo dõi khiếu nại trong 72 giờ có thể so tỷ lệ thư rác của Gmail với ngưỡng khiếu nại theo nhà cung cấp hộp thư.
  page: /deliverability/hostrepute/
