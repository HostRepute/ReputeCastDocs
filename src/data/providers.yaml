# Services ReputeCast connects to, rendered by <ProviderMatrix family="…">.
# Capability values are { en, vi }. Email values come from each adapter's descriptor (internal/providers/<key>/<key>.go)
# and the "Built-in adapters at a glance" table in docs/adapters.md. Vietnamese follows the app: bulk terms and sync
# directions from web/src/features/providers/{bulk,events}.messages.vi.ts, domain setup from
# internal/providers/<key>/messages/vi.json, other words from docs/i18n/glossary-vi.md.

# Email sending providers (built-in adapters; id = upstream adapter key)
- id: ses
  name: Amazon SES
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Allowed
    vi: Được phép
  webhooks:
    en: Amazon SNS topic created by ReputeCast, delivered to a webhook (RSA signatures checked against Amazon's certificates) or to an Amazon SQS queue ReputeCast polls every 20 seconds
    vi: Amazon SNS topic do ReputeCast tạo, chuyển tới webhook (chữ ký RSA được kiểm tra với chứng chỉ của Amazon) hoặc tới một hàng đợi Amazon SQS mà ReputeCast đọc mỗi 20 giây
  domainApi:
    en: API
    vi: API
  suppressionSync:
    en: Two-way
    vi: Hai chiều
  batch:
    en: 50, in parallel
    vi: 50, song song
  notes:
    en: Connect with a CloudFormation stack or IAM access keys; ReputeCast creates the SNS topic and one configuration set per stream. Detects the SES sandbox in each region and reads your sending quota and rate. Setup ends only once a real delivery event arrives. The SQS queue needs no public URL, so it works behind NAT and firewalls.
    vi: Kết nối bằng stack CloudFormation hoặc access key IAM; ReputeCast tạo SNS topic và một configuration set cho mỗi luồng. Phát hiện sandbox của SES ở từng khu vực và đọc hạn mức gửi cùng tốc độ gửi của bạn. Việc thiết lập chỉ hoàn tất khi có một sự kiện gửi thư thật. Hàng đợi SQS không cần URL công khai, nên dùng được sau NAT và tường lửa.
  page: /providers/amazon-ses/
- id: postmark
  name: Postmark
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Broadcast streams only
    vi: Chỉ luồng Broadcast
  webhooks:
    en: Registered by ReputeCast on each message stream; basic auth
    vi: Do ReputeCast đăng ký trên từng luồng của Postmark; basic auth
  domainApi:
    en: API (account token)
    vi: API (Account API token)
  suppressionSync:
    en: Two-way
    vi: Hai chiều
  batch:
    en: '500'
    vi: '500'
  notes:
    en: Bulk mail goes on a Broadcast message stream, which ReputeCast can create. Suppressions sync per message stream. Month-to-date volume is read from Postmark; enter your plan size for the quota bar.
    vi: Thư hàng loạt đi qua một luồng Broadcast của Postmark, ReputeCast có thể tạo luồng này. Danh sách chặn gửi được đồng bộ theo từng luồng của Postmark. Lượng thư từ đầu tháng được đọc từ Postmark; hãy nhập quy mô gói của bạn để hiển thị thanh hạn mức.
  page: /providers/postmark/
- id: postal
  name: Postal (self-hosted)
  family: email
  kind:
    en: Self-hosted
    vi: Tự lưu trữ
  bulk:
    en: Your own policy
    vi: Theo chính sách của bạn
  webhooks:
    en: Added by hand in Postal; RSA signature checked with the server's JWKS
    vi: Thêm thủ công trong Postal; chữ ký RSA được kiểm tra bằng JWKS của máy chủ
  domainApi:
    en: Manual DNS
    vi: DNS thủ công
  suppressionSync:
    en: Local only
    vi: Chỉ cục bộ
  batch:
    en: '1'
    vi: '1'
  notes:
    en: Your own Postal mail server. You add the webhook in Postal. New IPs need warming up. Servers on a private network need providers.allow_private_networks.
    vi: Máy chủ thư Postal của riêng bạn. Bạn tự thêm webhook trong Postal. IP mới cần được khởi động. Máy chủ trong mạng riêng cần bật providers.allow_private_networks.
  page: /providers/postal/
- id: mailgun
  name: Mailgun
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Allowed
    vi: Được phép
  webhooks:
    en: Registered by ReputeCast; HMAC-SHA256 with the account's webhook signing key, 12-hour window
    vi: Do ReputeCast đăng ký; HMAC-SHA256 bằng khóa ký webhook của tài khoản, khung 12 giờ
  domainApi:
    en: API
    vi: API
  suppressionSync:
    en: Two-way
    vi: Hai chiều
  batch:
    en: '1'
    vi: '1'
  notes:
    en: Detects sandbox domains and reads the account's monthly sending limit. One call per message. Can poll Mailgun's events API while webhooks can't reach ReputeCast.
    vi: Phát hiện tên miền sandbox và đọc giới hạn gửi hằng tháng của tài khoản. Mỗi thư một lệnh gọi. Có thể hỏi định kỳ API sự kiện của Mailgun trong khi webhook chưa đến được ReputeCast.
  page: /providers/mailgun/
- id: sendgrid
  name: SendGrid
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Allowed
    vi: Được phép
  webhooks:
    en: Signed Event Webhook registered by ReputeCast; ECDSA P-256, 26-hour window
    vi: Signed Event Webhook do ReputeCast đăng ký; ECDSA P-256, khung 26 giờ
  domainApi:
    en: API
    vi: API
  suppressionSync:
    en: Two-way
    vi: Hai chiều
  batch:
    en: '1'
    vi: '1'
  notes:
    en: Reads the plan's email credits. One call per message.
    vi: Đọc số email credit của gói. Mỗi thư một lệnh gọi.
  page: /providers/sendgrid/
- id: resend
  name: Resend
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Allowed
    vi: Được phép
  webhooks:
    en: Registered by ReputeCast; Standard Webhooks (Svix) signature
    vi: Do ReputeCast đăng ký; chữ ký Standard Webhooks (Svix)
  domainApi:
    en: API
    vi: API
  suppressionSync:
    en: Two-way
    vi: Hai chiều
  batch:
    en: '100'
    vi: '100'
  notes:
    en: Up to 100 messages per call. An account without a verified domain shows as sandbox. Monthly volume is read from Resend.
    vi: Tối đa 100 thư mỗi lệnh gọi. Tài khoản chưa có tên miền đã xác minh hiển thị là sandbox. Lượng thư hằng tháng được đọc từ Resend.
  page: /providers/resend/
- id: sparkpost
  name: SparkPost
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Allowed
    vi: Được phép
  webhooks:
    en: Registered by ReputeCast; basic auth (SparkPost doesn't sign)
    vi: Do ReputeCast đăng ký; basic auth (SparkPost không ký)
  domainApi:
    en: API
    vi: API
  suppressionSync:
    en: Two-way
    vi: Hai chiều
  batch:
    en: '1'
    vi: '1'
  notes:
    en: Existing SparkPost accounts in the US or EU region. Reads the account's sending limit. One call per message.
    vi: Dành cho tài khoản SparkPost hiện có ở khu vực US hoặc EU. Đọc giới hạn gửi của tài khoản. Mỗi thư một lệnh gọi.
  page: /providers/sparkpost/
- id: mailjet
  name: Mailjet
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Allowed
    vi: Được phép
  webhooks:
    en: Registered by ReputeCast; basic auth in the callback URL (Mailjet doesn't sign)
    vi: Do ReputeCast đăng ký; basic auth trong URL callback (Mailjet không ký)
  domainApi:
    en: API
    vi: API
  suppressionSync:
    en: Two-way
    vi: Hai chiều
  batch:
    en: '50'
    vi: '50'
  notes:
    en: Mailjet allows one callback URL per event and API key, so use a key only ReputeCast uses. Suppressions sync with Mailjet's campaign exclusions.
    vi: Mailjet chỉ cho phép một URL callback cho mỗi sự kiện và khóa API, nên hãy dùng một khóa chỉ riêng ReputeCast dùng. Danh sách chặn gửi đồng bộ với danh sách loại trừ chiến dịch (campaign exclusions) của Mailjet.
  page: /providers/mailjet/
- id: brevo
  name: Brevo
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Allowed
    vi: Được phép
  webhooks:
    en: Registered by ReputeCast; bearer token (Brevo doesn't sign)
    vi: Do ReputeCast đăng ký; bearer token (Brevo không ký)
  domainApi:
    en: API
    vi: API
  suppressionSync:
    en: Pull only
    vi: Chỉ kéo về
  batch:
    en: '1'
    vi: '1'
  notes:
    en: Brevo tracks opens and clicks in transactional mail, and ReputeCast can't turn that off over its API. Suppressions are pulled from Brevo but not pushed to it.
    vi: Brevo theo dõi lượt mở và lượt nhấp trong thư giao dịch, và ReputeCast không tắt được việc này qua API của Brevo. Danh sách chặn gửi được kéo về từ Brevo nhưng không được đẩy lên Brevo.
  page: /providers/brevo/
- id: azureacs
  name: Azure Communication Services
  family: email
  kind:
    en: API
    vi: API
  bulk:
    en: Allowed
    vi: Được phép
  webhooks:
    en: Event Grid subscription you create in Azure; Entra ID token or a shared secret
    vi: Event Grid subscription do bạn tạo trong Azure; token Entra ID hoặc một khóa bí mật dùng chung
  domainApi:
    en: Manual DNS
    vi: DNS thủ công
  suppressionSync:
    en: Local only
    vi: Chỉ cục bộ
  batch:
    en: '1'
    vi: '1'
  notes:
    en: The email domain and the Event Grid subscription (Event Grid event schema) are set up in the Azure portal. ReputeCast answers Event Grid's validation handshake.
    vi: Tên miền email và Event Grid subscription (theo Event Grid event schema) được thiết lập trong Azure portal. ReputeCast trả lời bước bắt tay xác thực (validation handshake) của Event Grid.
  page: /providers/azure-communication-services/
- id: smtp
  name: Generic SMTP
  family: email
  kind:
    en: SMTP
    vi: SMTP
  bulk:
    en: Your own policy
    vi: Theo chính sách của bạn
  webhooks:
    en: Bounce mailbox (IMAP/POP3)
    vi: Hộp thư nhận thư trả lại (IMAP/POP3)
  domainApi:
    en: Manual DNS
    vi: DNS thủ công
  suppressionSync:
    en: Local only
    vi: Chỉ cục bộ
  batch:
    en: 25 per connection
    vi: 25 mỗi kết nối
  notes:
    en: SMTP has no webhooks, so bounces are read from a bounce mailbox over IMAP or POP3.
    vi: SMTP không có webhook, nên thư trả lại được đọc từ hộp thư nhận thư trả lại qua IMAP hoặc POP3.
  page: /providers/smtp/
- id: httpgeneric
  name: Generic HTTP adapter
  family: email
  kind:
    en: HTTP
    vi: HTTP
  bulk:
    en: Your own policy
    vi: Theo chính sách của bạn
  webhooks:
    en: Added by hand in your provider; HMAC, Standard Webhooks, basic auth, a header secret or none
    vi: Thêm thủ công tại nhà cung cấp của bạn; HMAC, Standard Webhooks, basic auth, khóa bí mật trong header hoặc không có
  domainApi:
    en: Manual DNS
    vi: DNS thủ công
  suppressionSync:
    en: Local only
    vi: Chỉ cục bộ
  batch:
    en: '1'
    vi: '1'
  notes:
    en: Maps any HTTP email API's send call and webhook without writing code, from a form or a manifest.
    vi: Ánh xạ lệnh gửi và webhook của bất kỳ API email HTTP nào mà không cần viết mã, từ một biểu mẫu hoặc một manifest.
  page: /providers/generic-http/

# SMS providers (internal/sms/<adapter>; catalog order from sms.go catalogOrder)
- id: sms-twilio
  name: Twilio
  family: sms
  kind:
    en: Programmable Messaging API
    vi: Programmable Messaging API
  webhooks:
    en: Signed with a webhook shared key ReputeCast creates (X-Twilio-Signature)
    vi: Ký bằng khóa webhook dùng chung do ReputeCast tạo (X-Twilio-Signature)
  suppressionSync:
    en: From replies and refused texts
    vi: Từ tin trả lời và tin nhắn bị từ chối
  notes:
    en: Connect with an API key SID and secret, never the auth token. Toll-free, 10DLC and sender IDs outside the US and Canada.
    vi: Kết nối bằng SID và secret của API key, không bao giờ dùng auth token. Hỗ trợ số miễn cước, 10DLC và ID người gửi ở ngoài Mỹ và Canada.
  page: /channels/sms/
- id: sms-vonage
  name: Vonage
  family: sms
  kind:
    en: SMS API
    vi: SMS API
  webhooks:
    en: Signed webhooks, HMAC-SHA256 with the account signature secret
    vi: Webhook có chữ ký, HMAC-SHA256 bằng signature secret của tài khoản
  suppressionSync:
    en: From replies and refused texts
    vi: Từ tin trả lời và tin nhắn bị từ chối
  notes:
    en: Vonage reports no registration status through its API, so sender registrations are set by hand.
    vi: Vonage không báo trạng thái đăng ký qua API, nên trạng thái đăng ký người gửi được đặt thủ công.
  page: /channels/sms/
- id: sms-plivo
  name: Plivo
  family: sms
  kind:
    en: Message API
    vi: Message API
  webhooks:
    en: Plivo V3 signature (HMAC-SHA256 with the auth token and a nonce)
    vi: Chữ ký Plivo V3 (HMAC-SHA256 bằng auth token và một nonce)
  suppressionSync:
    en: None (keywords arrive as inbound texts)
    vi: Không có (từ khóa đến dưới dạng tin nhắn đến)
  notes:
    en: Connect with the auth ID and auth token.
    vi: Kết nối bằng auth ID và auth token.
  page: /channels/sms/
- id: sms-telnyx
  name: Telnyx
  family: sms
  kind:
    en: API v2
    vi: API v2
  webhooks:
    en: Ed25519 signature checked with the account public key, with a timestamp
    vi: Chữ ký Ed25519 được kiểm tra bằng khóa công khai của tài khoản, kèm dấu thời gian
  suppressionSync:
    en: Read only
    vi: Chỉ đọc
  notes:
    en: Connect with an API key and the account public key. Prices are entered by hand and corrected from each text's cost.
    vi: Kết nối bằng khóa API và khóa công khai của tài khoản. Giá được nhập thủ công và được điều chỉnh theo chi phí thực của từng tin nhắn.
  page: /channels/sms/
- id: sms-aws-eum
  name: AWS End User Messaging
  family: sms
  kind:
    en: AWS API
    vi: API của AWS
  webhooks:
    en: Amazon SNS topic, signatures checked against Amazon's certificates
    vi: Amazon SNS topic; chữ ký được kiểm tra với chứng chỉ của Amazon
  suppressionSync:
    en: Two-way (opt-out list)
    vi: Hai chiều (danh sách hủy nhận)
  notes:
    en: Texts from your own AWS account with a CloudFormation role or IAM keys. Prices are entered by hand.
    vi: Nhắn tin từ tài khoản AWS của chính bạn bằng role CloudFormation hoặc khóa IAM. Giá được nhập thủ công.
  page: /channels/sms/

