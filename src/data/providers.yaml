# Payments (internal/payments/stripe)
- id: payments-stripe
  name: Stripe
  family: payments
  kind: Restricted API key
  webhooks: Created by ReputeCast in your Stripe account, one per key
  notes:
    en: Connect with a restricted key (rk_live_ or rk_test_); secret keys are refused. A live and a test key can each be connected, and each gets its own webhook.
  page: /earn/connect-stripe/

# Stores (internal/commerce)
- id: stores-shopify
  name: Shopify
  family: stores
  kind: Custom app
  notes:
    en: Paste the client ID and client secret from the app's API credentials in Shopify.
  page: /integrations/shopify-woocommerce/
- id: stores-woocommerce
  name: WooCommerce
  family: stores
  kind: REST API key and plugin
  webhooks: Registered with a secret; signatures are checked
  notes:
    en: Without the ReputeCast plugin, ReputeCast syncs products and orders only, no customer joins a list, and abandoned checkouts aren't reported.
  page: /integrations/shopify-woocommerce/

# Web push (internal/push)
- id: push-web
  name: Web push
  family: push
  kind: VAPID keys
  notes:
    en: Built in, with no outside account. VAPID keys are generated per workspace; the private key is sealed and never returned.
  page: /channels/web-push/

# WhatsApp (internal/whatsapp/meta)
- id: whatsapp-meta
  name: WhatsApp Cloud API (Meta)
  family: whatsapp
  kind: Cloud API
  webhooks: Verification handshake and X-Hub-Signature-256
  notes:
    en: The only WhatsApp provider. Message templates and the phone number's quality rating and messaging limit come from Meta.
  page: /channels/whatsapp/

