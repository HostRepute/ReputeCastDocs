      Arbeitsbereichs. Der Schlüssel wird verschlüsselt gespeichert. Ein Rendering, das nicht innerhalb von 15 Minuten
      fertig ist, schlägt fehl; rendern Sie erneut, um es noch einmal zu versuchen.
    es: >-
      Capturas de pantalla de la campaña guardada en clientes de correo reales, hechas con la propia cuenta de Litmus
      del espacio de trabajo. La clave se guarda cifrada. Un renderizado que no ha terminado en 15 minutos falla; vuelve
      a renderizar para reintentarlo.
