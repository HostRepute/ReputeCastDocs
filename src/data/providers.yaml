      Die E-Mail-Domain und das Event-Grid-Abonnement (Event-Grid-Ereignisschema) werden im Azure-Portal eingerichtet.
      ReputeCast beantwortet den Validierungs-Handshake von Event Grid.
    es: >-
      El dominio de correo y la suscripción de Event Grid (esquema de eventos de Event Grid) se configuran en Azure
