# Services ReputeCast connects to, rendered by <ProviderMatrix family="…">.
# Capability values are { en, vi }. Email values come from each adapter's descriptor (internal/providers/<key>/<key>.go)
# and the "Built-in adapters at a glance" table in docs/adapters.md. Vietnamese follows the app: bulk terms and sync
# directions from web/src/features/providers/{bulk,events}.messages.vi.ts, domain setup from
# internal/providers/<key>/messages/vi.json, other words from docs/i18n/glossary-vi.md.

# Email sending providers (built-in adapters; id = upstream adapter key)
- id: ses
  name: Amazon SES
  family: email
  kind:
    en: API
    vi: API
    de: API
    es: API
    fr: API
  bulk:
    en: Allowed
    vi: Được phép
    de: Erlaubt
    es: Permitido
    fr: Autorisé
  webhooks:
    en: Amazon SNS topic created by ReputeCast, delivered to a webhook (RSA signatures checked against Amazon's certificates) or to an Amazon SQS queue ReputeCast polls every 20 seconds
    vi: Amazon SNS topic do ReputeCast tạo, chuyển tới webhook (chữ ký RSA được kiểm tra với chứng chỉ của Amazon) hoặc tới một hàng đợi Amazon SQS mà ReputeCast đọc mỗi 20 giây
    de: >-
      Von ReputeCast erstelltes Amazon-SNS-Topic, zugestellt an einen Webhook (RSA-Signaturen werden mit den
      Zertifikaten von Amazon geprüft) oder an eine Amazon-SQS-Warteschlange, die ReputeCast alle 20 Sekunden abfragt
    es: >-
      SNS topic de Amazon creado por ReputeCast, entregado a un webhook (firmas RSA comprobadas con los certificados de
      Amazon) o a una cola de Amazon SQS que ReputeCast consulta cada 20 segundos
    fr: >-
      Sujet Amazon SNS créé par ReputeCast, livré à un webhook (signatures RSA vérifiées avec les certificats d’Amazon)
      ou à une file Amazon SQS que ReputeCast interroge toutes les 20 secondes
  domainApi:
    en: API
    vi: API
    de: API
    es: API
    fr: API
  suppressionSync:
    en: Two-way
    vi: Hai chiều
    de: Beidseitig
    es: Bidireccional
    fr: Bidirectionnelle
  batch:
    en: 50, in parallel
    vi: 50, song song
    de: '50, parallel'
    es: '50, en paralelo'
    fr: '50, en parallèle'
  notes:
    en: Connect with a CloudFormation stack or IAM access keys; ReputeCast creates the SNS topic and one configuration set per stream. Detects the SES sandbox in each region and reads your sending quota and rate. Setup ends only once a real delivery event arrives. The SQS queue needs no public URL, so it works behind NAT and firewalls.
    vi: Kết nối bằng stack CloudFormation hoặc access key IAM; ReputeCast tạo SNS topic và một configuration set cho mỗi luồng. Phát hiện sandbox của SES ở từng khu vực và đọc hạn mức gửi cùng tốc độ gửi của bạn. Việc thiết lập chỉ hoàn tất khi có một sự kiện gửi thư thật. Hàng đợi SQS không cần URL công khai, nên dùng được sau NAT và tường lửa.
    de: >-
      Verbindung über einen CloudFormation-Stack oder IAM-Zugriffsschlüssel; ReputeCast erstellt das SNS-Topic und ein
      Configuration Set je Stream. Erkennt die SES-Sandbox in jeder Region und liest Ihr Versandkontingent und Ihre
      Senderate. Die Einrichtung endet erst, wenn ein echtes Zustellereignis eintrifft. Die SQS-Warteschlange braucht
      keine öffentliche URL und funktioniert daher hinter NAT und Firewalls.
    es: >-
      Conecta con un stack de CloudFormation o con claves de acceso de IAM; ReputeCast crea el SNS topic y un
      configuration set por flujo. Detecta el sandbox de SES en cada región y lee tu cuota y tu velocidad de envío. La
      configuración solo termina cuando llega un evento de entrega real. La cola SQS no necesita una URL pública, así
      que funciona detrás de NAT y cortafuegos.
    fr: >-
      Connexion avec une stack CloudFormation ou des clés d’accès IAM ; ReputeCast crée le sujet SNS et un configuration
      set par flux. Détecte le sandbox SES dans chaque région et lit votre quota et votre débit d’envoi. La
      configuration ne se termine qu’à l’arrivée d’un véritable événement de livraison. La file SQS n’a besoin d’aucune
      URL publique : elle fonctionne donc derrière un NAT et des pare-feu.
  page: /providers/amazon-ses/
- id: postmark
  name: Postmark
  family: email
  kind:
    en: API
    vi: API
    de: API
    es: API
    fr: API
  bulk:
    en: Broadcast streams only
    vi: Chỉ luồng Broadcast
    de: Nur Broadcast-Streams
    es: Solo flujos Broadcast
    fr: Flux Broadcast uniquement
  webhooks:
    en: Registered by ReputeCast on each message stream; basic auth
    vi: Do ReputeCast đăng ký trên từng luồng của Postmark; basic auth
    de: Von ReputeCast für jeden Message Stream registriert; Basic Auth
    es: Registrados por ReputeCast en cada flujo de mensajes; autenticación básica
    fr: Enregistrés par ReputeCast sur chaque message stream ; authentification basique
  domainApi:
    en: API (account token)
    vi: API (Account API token)
    de: API (Konto-Token)
    es: API (token de la cuenta)
    fr: API (jeton de compte)
  suppressionSync:
    en: Two-way
    vi: Hai chiều
    de: Beidseitig
    es: Bidireccional
    fr: Bidirectionnelle
  batch:
    en: '500'
    vi: '500'
    de: '500'
    es: '500'
    fr: '500'
  notes:
    en: Bulk mail goes on a Broadcast message stream, which ReputeCast can create. Suppressions sync per message stream. Month-to-date volume is read from Postmark; enter your plan size for the quota bar.
    vi: Thư hàng loạt đi qua một luồng Broadcast của Postmark, ReputeCast có thể tạo luồng này. Danh sách chặn gửi được đồng bộ theo từng luồng của Postmark. Lượng thư từ đầu tháng được đọc từ Postmark; hãy nhập quy mô gói của bạn để hiển thị thanh hạn mức.
    de: >-
      Massen-E-Mails laufen über einen Broadcast-Message-Stream, den ReputeCast erstellen kann. Sperren werden je
      Message Stream synchronisiert. Das Volumen seit Monatsbeginn wird von Postmark gelesen; geben Sie die Größe Ihres
      Tarifs für die Kontingentanzeige ein.
    es: >-
      El correo masivo va por un flujo de mensajes Broadcast, que ReputeCast puede crear. Las supresiones se sincronizan
      por flujo de mensajes. El volumen del mes en curso se lee de Postmark; introduce el tamaño de tu plan para la
      barra de cuota.
    fr: >-
      Les envois en masse passent par un message stream Broadcast, que ReputeCast peut créer. Les exclusions se
      synchronisent par message stream. Le volume depuis le début du mois est lu dans Postmark ; indiquez la taille de
      votre forfait pour la barre de quota.
  page: /providers/postmark/
- id: postal
  name: Postal (self-hosted)
  family: email
  kind:
    en: Self-hosted
    vi: Tự lưu trữ
    de: Selbst gehostet
    es: Autoalojado
    fr: Auto-hébergé
  bulk:
    en: Your own policy
    vi: Theo chính sách của bạn
    de: Ihre eigene Richtlinie
    es: Tu propia política
    fr: Votre propre politique
  webhooks:
    en: Added by hand in Postal; RSA signature checked with the server's JWKS
    vi: Thêm thủ công trong Postal; chữ ký RSA được kiểm tra bằng JWKS của máy chủ
    de: Von Hand in Postal hinzugefügt; RSA-Signatur wird mit dem JWKS des Servers geprüft
    es: Se añade a mano en Postal; firma RSA comprobada con el JWKS del servidor
    fr: Ajouté à la main dans Postal ; signature RSA vérifiée avec le JWKS du serveur
  domainApi:
    en: Manual DNS
    vi: DNS thủ công
    de: Manuelles DNS
    es: DNS manual
    fr: DNS manuel
  suppressionSync:
    en: Local only
    vi: Chỉ cục bộ
    de: Nur lokal
    es: Solo local
    fr: Locale uniquement
  batch:
    en: '1'
    vi: '1'
    de: '1'
    es: '1'
    fr: '1'
  notes:
    en: Your own Postal mail server. You add the webhook in Postal. New IPs need warming up. Servers on a private network need providers.allow_private_networks.
    vi: Máy chủ thư Postal của riêng bạn. Bạn tự thêm webhook trong Postal. IP mới cần được khởi động. Máy chủ trong mạng riêng cần bật providers.allow_private_networks.
    de: >-
      Ihr eigener Postal-Mailserver. Den Webhook fügen Sie in Postal hinzu. Neue IPs brauchen ein Warm-up. Server in
      einem privaten Netz erfordern providers.allow_private_networks.
    es: >-
      Tu propio servidor de correo Postal. El webhook lo añades tú en Postal. Las IP nuevas necesitan calentamiento. Los
      servidores en una red privada necesitan providers.allow_private_networks.
    fr: >-
      Votre propre serveur de messagerie Postal. Vous ajoutez le webhook dans Postal. Les nouvelles IP doivent passer
      par une chauffe. Les serveurs situés sur un réseau privé nécessitent providers.allow_private_networks.
  page: /providers/postal/
