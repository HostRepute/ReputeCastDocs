    vi: Thêm thủ công tại nhà cung cấp của bạn; HMAC, Standard Webhooks, basic auth, khóa bí mật trong header hoặc không có
    de: >-
      Von Hand bei Ihrem Anbieter hinzugefügt; HMAC, Standard Webhooks, Basic Auth, ein geheimer Schlüssel im Header
