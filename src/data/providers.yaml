      Mailjet permite una URL de callback por evento y por clave de API, así que usa una clave que solo use ReputeCast.
      Las supresiones se sincronizan con las exclusiones de campañas de Mailjet.
    fr: >-
      Mailjet n’autorise qu’une URL de callback par événement et par clé API : utilisez donc une clé réservée à
      ReputeCast. Les exclusions se synchronisent avec les exclusions de campagne de Mailjet.
