    vi: SMTP
    de: SMTP
    es: SMTP
    fr: SMTP
  bulk:
    en: Your own policy
    vi: Theo chính sách của bạn
    de: Ihre eigene Richtlinie
    es: Tu propia política
    fr: Votre propre politique
  webhooks:
    en: Bounce mailbox (IMAP/POP3)
    vi: Hộp thư nhận thư trả lại (IMAP/POP3)
    de: Bounce-Postfach (IMAP/POP3)
    es: Buzón de rebotes (IMAP/POP3)
    fr: Boîte de réception des rebonds (IMAP/POP3)
