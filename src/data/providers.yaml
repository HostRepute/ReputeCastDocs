      Captures d’écran de la campagne enregistrée dans de vrais clients de messagerie, réalisées avec le compte Litmus
      propre à l’espace de travail. La clé est stockée chiffrée. Un rendu qui n’est pas terminé au bout de 15 minutes
      échoue ; relancez le rendu pour réessayer.
