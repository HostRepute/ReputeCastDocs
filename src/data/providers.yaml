    vi: Ảnh chụp chiến dịch đã lưu trong các ứng dụng email thật, tạo bằng tài khoản Litmus riêng của không gian làm việc. Khóa được lưu mã hóa. Lượt hiển thị chưa xong trong 15 phút sẽ thất bại; hãy hiển thị lại để thử lần nữa.
