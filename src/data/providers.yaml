    vi: Do ReputeCast đăng ký; HMAC-SHA256 bằng khóa ký webhook của tài khoản, khung 12 giờ
    de: Von ReputeCast registriert; HMAC-SHA256 mit dem Webhook-Signaturschlüssel des Kontos, 12-Stunden-Fenster
    es: Registrados por ReputeCast; HMAC-SHA256 con la clave de firma de webhooks de la cuenta, ventana de 12 horas
    fr: Enregistrés par ReputeCast ; HMAC-SHA256 avec la clé de signature des webhooks du compte, fenêtre de 12 heures
  domainApi:
    en: API
    vi: API
    de: API
    es: API
    fr: API
  suppressionSync:
    en: Two-way
    vi: Hai chiều
    de: Beidseitig
    es: Bidireccional
    fr: Bidirectionnelle
  batch:
    en: '1'
    vi: '1'
    de: '1'
    es: '1'
    fr: '1'
  notes:
    en: Detects sandbox domains and reads the account's monthly sending limit. One call per message. Can poll Mailgun's events API while webhooks can't reach ReputeCast.
    vi: Phát hiện tên miền sandbox và đọc giới hạn gửi hằng tháng của tài khoản. Mỗi thư một lệnh gọi. Có thể hỏi định kỳ API sự kiện của Mailgun trong khi webhook chưa đến được ReputeCast.
    de: >-
      Erkennt Sandbox-Domains und liest das monatliche Versandlimit des Kontos. Ein Aufruf pro Nachricht. Kann die
      Event-API von Mailgun abfragen, solange Webhooks ReputeCast nicht erreichen.
    es: >-
      Detecta los dominios sandbox y lee el límite de envío mensual de la cuenta. Una llamada por mensaje. Puede
      consultar periódicamente la API de eventos de Mailgun mientras los webhooks no pueden llegar a ReputeCast.
    fr: >-
      Détecte les domaines sandbox et lit la limite d’envoi mensuelle du compte. Un appel par message. Peut interroger
      l’API des événements de Mailgun tant que les webhooks ne peuvent pas joindre ReputeCast.
