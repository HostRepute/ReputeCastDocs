    de: >-
      Brevo trackt Öffnungen und Klicks in Transaktions-E-Mails, und ReputeCast kann das über die API nicht abschalten.
      Sperren werden von Brevo abgerufen, aber nicht dorthin übertragen.
    es: >-
      Brevo hace el seguimiento de aperturas y clics en el correo transaccional, y ReputeCast no puede desactivarlo a
      través de su API. Las supresiones se reciben de Brevo, pero no se envían a Brevo.
    fr: >-
      Brevo suit les ouvertures et les clics dans les e-mails transactionnels, et ReputeCast ne peut pas désactiver ce
      suivi via son API. Les exclusions sont importées depuis Brevo mais pas exportées vers Brevo.
