# Link-domain blocklists and reputation data (internal/contentcheck/blocklist.go, internal/dnscheck, internal/readiness)
- id: lookups-spamhaus-dbl
  name: Spamhaus DBL
  family: lookups
  kind:
    en: DNS lookup, no account
    vi: Tra cứu DNS, không cần tài khoản
    de: DNS-Abfrage, kein Konto
    es: Consulta DNS, sin cuenta
    fr: Requête DNS, sans compte
  notes:
    en: The domains of the links in your emails are looked up live for Send Readiness and the composer's inline checks. Answers are kept for an hour and shared by every workspace. A lookup that fails or that the list refuses is Unknown, never clean; the lists answer only your own recursive DNS resolver.
    vi: Tên miền của các liên kết trong email được tra cứu trực tiếp cho Độ sẵn sàng gửi và các kiểm tra ngay khi soạn của trình soạn thảo. Kết quả được giữ một giờ và dùng chung cho mọi không gian làm việc. Lần tra cứu thất bại hoặc bị danh sách từ chối có kết quả Không rõ, không bao giờ được coi là sạch; các danh sách chỉ trả lời DNS resolver đệ quy của riêng bạn.
    de: >-
      Die Domains der Links in Ihren E-Mails werden für die Versandbereitschaft und die Inline-Prüfungen des Editors
      live abgefragt. Antworten werden eine Stunde lang gespeichert und von allen Arbeitsbereichen geteilt. Eine
      Abfrage, die fehlschlägt oder die die Liste ablehnt, ergibt Unbekannt, nie nicht gelistet; die Listen antworten
      nur Ihrem eigenen rekursiven DNS-Resolver.
    es: >-
      Los dominios de los enlaces de tus correos se consultan en tiempo real para la revisión previa y las
      comprobaciones en línea del editor. Las respuestas se guardan durante una hora y se comparten entre todos los
      espacios de trabajo. Una consulta que falla o que la lista rechaza da Desconocido, nunca limpio; las listas solo
      responden a tu propio resolutor DNS recursivo.
    fr: >-
      Les domaines des liens de vos e-mails sont vérifiés en direct pour le contrôle avant envoi et les vérifications en
      ligne de l’éditeur. Les réponses sont conservées une heure et partagées par tous les espaces de travail. Une
      requête qui échoue ou que la liste refuse donne Inconnu, jamais non listé ; les listes ne répondent qu’à votre
      propre résolveur DNS récursif.
  page: /campaigns/send-readiness/
