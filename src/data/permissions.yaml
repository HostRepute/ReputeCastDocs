# Workspace permission keys (internal/authz/permissions.go Defs) and the instance-level agency keys
# (internal/authz/agency.go AgencyDefs), in catalogue order. holders: all = members, API keys and MCP agents;
# no-agents = members and API keys; people = members only; owner = the built-in Owner role only.
# English descriptions come from the Defs text. Guarded by pnpm upstream:check.
