# Workspace permission keys (internal/authz/permissions.go Defs) and the instance-level agency keys
# (internal/authz/agency.go AgencyDefs), in catalogue order. holders: all = members, API keys and MCP agents;
# no-agents = members and API keys; people = members only; owner = the built-in Owner role only.
# English descriptions come from the Defs text. Guarded by pnpm upstream:check.
- id: campaigns:view
  group:
    en: Campaigns
    vi: Chiến dịch
  description:
    en: See campaigns, their content, audience and status.
  sensitive: false
  holders: all
- id: campaigns:edit
  group:
    en: Campaigns
    vi: Chiến dịch
  description:
    en: Create and edit drafts, request approval.
  sensitive: false
  holders: all
  implies:
    - campaigns:view
- id: campaigns:send
  group:
    en: Campaigns
    vi: Chiến dịch
  description:
    en: Start or schedule a send, and resume a paused one.
  sensitive: true
  holders: all
  implies:
    - campaigns:view
- id: campaigns:pause
  group:
    en: Campaigns
    vi: Chiến dịch
  description:
    en: Stop a send that is running. Resuming needs campaigns:send.
  sensitive: false
  holders: all
  implies:
    - campaigns:view
- id: campaigns:approve
  group:
    en: Campaigns
    vi: Chiến dịch
  description:
    en: Approve, reject or request changes on sends that need approval.
  sensitive: true
  holders: all
  implies:
    - campaigns:view
