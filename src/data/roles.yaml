  description:
    en: Everything, including transferring ownership and deleting the workspace
    vi: Mọi quyền, kể cả chuyển quyền sở hữu và xóa không gian làm việc
    de: Alles, einschließlich Übertragung der Inhaberschaft und Löschen des Arbeitsbereichs
