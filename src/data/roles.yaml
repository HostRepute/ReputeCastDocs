- id: editor
  name:
    en: Editor
    vi: Biên tập viên
    de: Bearbeiter
    es: Editor
    fr: Éditeur
  scope: workspace
  description:
    en: View everything; edit campaigns, templates, automations, segments (no SQL) and forms; send, pause and publish; import contacts
    vi: Xem mọi thứ; sửa chiến dịch, mẫu, tự động hóa, phân khúc (không có SQL) và biểu mẫu; gửi, tạm dừng và xuất bản; nhập liên hệ
    de: >-
      Alles ansehen; Kampagnen, Vorlagen, Automationen, Segmente (ohne SQL) und Formulare bearbeiten; senden, pausieren
      und veröffentlichen; Kontakte importieren
    es: >-
      Ver todo; editar campañas, plantillas, automatizaciones, segmentos (sin SQL) y formularios; enviar, pausar y
      publicar; importar contactos
    fr: >-
      Consulter tout ; modifier les campagnes, modèles, automatisations, segments (sans SQL) et formulaires ; envoyer,
      mettre en pause et publier ; importer des contacts
  permissions:
