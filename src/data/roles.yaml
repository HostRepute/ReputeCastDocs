# Built-in roles: Owner, Admin, Editor and Viewer (internal/authz/permissions.go BuiltinRoles), the client roles of
# agency client workspaces and the instance-level agency roles (internal/authz/agency.go). permissions = the fully
# expanded key list (implied keys included) in catalogue order. Descriptions are the upstream role descriptions
# (internal/authz/messages/{en,vi}.json role.<key>.about).
