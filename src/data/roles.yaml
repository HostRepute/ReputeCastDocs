- id: viewer
  name:
    en: Viewer
    vi: Người xem
    de: Betrachter
    es: Lector
    fr: Observateur
  scope: workspace
  description:
    en: Read-only. Never sees secrets
    vi: Chỉ đọc. Không bao giờ thấy thông tin bí mật
    de: Nur Lesezugriff. Sieht nie vertrauliche Zugangsdaten
    es: Solo lectura. Nunca ve datos secretos
    fr: Lecture seule. Ne voit jamais les secrets
  permissions:
    - campaigns:view
    - templates:view
    - transactional:view
    - automations:view
    - subscribers:view
    - reports:view
    - deliverability:view
    - providers:view
    - team:view
    - integrations:view
    - grow:view
    - earn:view
    - website:view
    - products:view
    - audit:view
- id: client_approver
  name:
    en: Client approver
    vi: Người duyệt phía khách hàng
    de: Freigeber (Kunde)
    es: Aprobador del cliente
    fr: Approbateur client
  scope: client
  description:
    en: Sees campaigns, templates, automations, reports, deliverability and contacts (no export); approves sends
    vi: Xem chiến dịch, mẫu, tự động hóa, báo cáo, khả năng vào hộp thư và liên hệ (không xuất); phê duyệt lần gửi
    de: Sieht Kampagnen, Vorlagen, Automationen, Berichte, Zustellbarkeit und Kontakte (kein Export); gibt Versände frei
    es: >-
      Ve campañas, plantillas, automatizaciones, informes, entregabilidad y contactos (sin exportar); aprueba los envíos
    fr: >-
      Voit les campagnes, modèles, automatisations, rapports, la délivrabilité et les contacts (sans export) ; approuve
      les envois
  permissions:
    - campaigns:view
    - campaigns:approve
    - templates:view
    - automations:view
    - subscribers:view
    - reports:view
    - deliverability:view
- id: client_viewer
  name:
    en: Client viewer
    vi: Người xem phía khách hàng
    de: Betrachter (Kunde)
    es: Lector del cliente
    fr: Observateur client
  scope: client
  description:
    en: Sees campaigns, templates, automations, reports and deliverability; no contacts
    vi: Xem chiến dịch, mẫu, tự động hóa, báo cáo và khả năng vào hộp thư; không xem liên hệ
    de: Sieht Kampagnen, Vorlagen, Automationen, Berichte und Zustellbarkeit; keine Kontakte
    es: Ve campañas, plantillas, automatizaciones, informes y entregabilidad; sin contactos
    fr: Voit les campagnes, modèles, automatisations, rapports et la délivrabilité ; pas les contacts
  permissions:
    - campaigns:view
    - templates:view
    - automations:view
    - reports:view
    - deliverability:view
- id: agency_manager
  name:
    en: Agency manager
    vi: Quản lý agency
    de: Agenturleitung
    es: Responsable de agencia
    fr: Responsable d’agence
  scope: agency
  description:
    en: Every client, staff, templates, usage and rates
    vi: Mọi khách hàng, nhân sự, mẫu, mức sử dụng và mức phí
    de: Alle Kunden, Agenturteam, Vorlagen, Nutzung und Sätze
    es: Todos los clientes, el personal, las plantillas, el uso y las tarifas
    fr: Tous les clients, le personnel, les modèles, la consommation et les tarifs
  permissions:
    - agency:view
    - agency:usage
    - agency:library
    - agency:manage
- id: account_manager
  name:
    en: Account manager
    vi: Phụ trách khách hàng
    de: Kundenbetreuung
    es: Responsable de cuentas
    fr: Responsable de compte
  scope: agency
  description:
    en: "The clients they're assigned to: overview, search, usage and the library"
    vi: 'Các khách hàng được phân công: tổng quan, tìm kiếm, mức sử dụng và thư viện'
    de: 'Die zugewiesenen Kunden: Übersicht, Suche, Nutzung und Bibliothek'
    es: 'Los clientes que tiene asignados: resumen, búsqueda, uso y biblioteca'
    fr: 'Les clients affectés : vue d’ensemble, recherche, consommation et bibliothèque'
  permissions:
    - agency:view
    - agency:usage
    - agency:library
