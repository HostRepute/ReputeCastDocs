- id: env
  env: REPUTECAST_ENV
  type: string
  default: production
  group: general
  description:
    en: >-
      Run mode: `production` or `development`. `development` enables the `seed` and `demo` commands, the demo's
      simulated providers, DNS and other services, delivery of the demo's mail to `mail.dev_smtp` and the
      pseudo-locale. Use `production` for every real instance.
    vi: >-
      Chế độ chạy: `production` hoặc `development`. `development` bật các lệnh `seed` và `demo`, các nhà cung cấp, DNS
      và dịch vụ khác được mô phỏng của bản demo, việc chuyển thư của bản demo đến `mail.dev_smtp` và ngôn ngữ giả
      (pseudo-locale). Hãy dùng `production` cho mọi hệ thống chạy thật.
    de: >-
      Betriebsmodus: `production` oder `development`. `development` aktiviert die Befehle `seed` und `demo`, die
      simulierten Anbieter, DNS und anderen Dienste der Demo, die Zustellung der Demo-E-Mails an `mail.dev_smtp` und die
      Pseudo-Locale. Verwenden Sie `production` für jede echte Instanz.
    es: >-
      Modo de ejecución: `production` o `development`. `development` activa los comandos `seed` y `demo`, los
      proveedores, el DNS y otros servicios simulados de la demostración, la entrega del correo de la demostración a
      `mail.dev_smtp` y el pseudoidioma. Usa `production` en todas las instancias reales.
    fr: >-
      Mode d’exécution : `production` ou `development`. `development` active les commandes `seed` et `demo`, les
      fournisseurs, le DNS et les autres services simulés de la démo, la livraison des e-mails de la démo à
      `mail.dev_smtp` et la pseudo-locale. Utilisez `production` pour toute instance réelle.
  kind: key

- id: roles
  env: REPUTECAST_ROLES
  type: list
  default: web,worker,ingest
  group: general
  description:
    en: >-
      Roles this process runs: `web` (app, API, public pages, MCP and the SMTP relay), `ingest` (provider webhooks) and
      `worker` (background jobs). The `--role` flag of `serve` overrides it. As an environment variable, separate roles
      with commas.
    vi: >-
      Các vai trò mà tiến trình này chạy: `web` (ứng dụng, API, trang công khai, MCP và SMTP relay), `ingest` (webhook
      của nhà cung cấp) và `worker` (tác vụ nền). Cờ `--role` của `serve` ghi đè giá trị này. Khi đặt bằng biến môi
      trường, hãy phân tách các vai trò bằng dấu phẩy.
    de: >-
      Rollen, die dieser Prozess ausführt: `web` (App, API, öffentliche Seiten, MCP und das SMTP-Relay), `ingest`
      (Webhooks der Anbieter) und `worker` (Hintergrundjobs). Das Flag `--role` von `serve` hat Vorrang. Als
      Umgebungsvariable trennen Sie die Rollen durch Kommas.
    es: >-
      Roles que ejecuta este proceso: `web` (aplicación, API, páginas públicas, MCP y el SMTP relay), `ingest` (webhooks
      de los proveedores) y `worker` (tareas en segundo plano). La opción `--role` de `serve` prevalece sobre ella. Como
      variable de entorno, separa los roles con comas.
    fr: >-
      Rôles qu’exécute ce processus : `web` (application, API, pages publiques, MCP et relais SMTP), `ingest` (webhooks
      des fournisseurs) et `worker` (tâches en arrière-plan). L’option `--role` de `serve` le remplace. En variable
      d’environnement, séparez les rôles par des virgules.
  kind: key

- id: http.addr
  env: REPUTECAST_HTTP__ADDR
  type: string
  default: ':8080'
  group: http
  description:
    en: >-
      Address the HTTP server listens on. The `--addr` flag of `serve` overrides it. When `REPUTECAST_HTTP__ADDR` isn't
      set, the `PORT` variable sets it to `:<PORT>`. The Docker image sets `REPUTECAST_HTTP__ADDR=:8080`.
    vi: >-
      Địa chỉ mà máy chủ HTTP lắng nghe. Cờ `--addr` của `serve` ghi đè giá trị này. Khi chưa đặt
      `REPUTECAST_HTTP__ADDR`, biến `PORT` đặt giá trị này thành `:<PORT>`. Docker image đặt
      `REPUTECAST_HTTP__ADDR=:8080`.
    de: >-
      Adresse, auf der der HTTP-Server lauscht. Das Flag `--addr` von `serve` hat Vorrang. Ist `REPUTECAST_HTTP__ADDR`
      nicht gesetzt, setzt die Variable `PORT` sie auf `:<PORT>`. Das Docker-Image setzt `REPUTECAST_HTTP__ADDR=:8080`.
    es: >-
      Dirección en la que escucha el servidor HTTP. La opción `--addr` de `serve` prevalece sobre ella. Cuando
      `REPUTECAST_HTTP__ADDR` no está definida, la variable `PORT` la fija en `:<PORT>`. La imagen de Docker define
      `REPUTECAST_HTTP__ADDR=:8080`.
    fr: >-
      Adresse sur laquelle écoute le serveur HTTP. L’option `--addr` de `serve` la remplace. Lorsque
      `REPUTECAST_HTTP__ADDR` n’est pas défini, la variable `PORT` la fixe à `:<PORT>`. L’image Docker définit
      `REPUTECAST_HTTP__ADDR=:8080`.
  kind: key

- id: http.public_url
  env: REPUTECAST_PUBLIC_URL
  type: string
  default: http://localhost:8080
  group: http
  description:
    en: >-
      Address people and sending providers use to reach this instance. ReputeCast builds provider webhook URLs, sign-in
      redirects, passkeys, public pages and links in emails from it, so providers must be able to reach it from the
      internet. Must be an absolute URL; an `https://` address turns on HSTS and Secure cookies. A public URL saved in
      Instance admin › Instance & updates replaces it, unless `http.public_url_locked` is `true`. Since 1.2.0 its
      environment variable is `REPUTECAST_PUBLIC_URL`; the earlier name `REPUTECAST_HTTP__PUBLIC_URL` still works when
      `REPUTECAST_PUBLIC_URL` isn't set.
    vi: >-
      Địa chỉ mà mọi người và các nhà cung cấp gửi thư dùng để truy cập hệ thống này. ReputeCast dựng URL webhook cho
      nhà cung cấp, chuyển hướng đăng nhập, khóa truy cập, trang công khai và liên kết trong email từ địa chỉ này, nên
      nhà cung cấp phải truy cập được nó từ internet. Phải là URL tuyệt đối; địa chỉ `https://` sẽ bật HSTS và cookie
      Secure. URL công khai lưu trong Quản trị hệ thống › Hệ thống và cập nhật sẽ thay thế giá trị này, trừ khi
      `http.public_url_locked` là `true`. Từ bản 1.2.0, biến môi trường của khóa này là `REPUTECAST_PUBLIC_URL`; tên cũ
      `REPUTECAST_HTTP__PUBLIC_URL` vẫn dùng được khi `REPUTECAST_PUBLIC_URL` chưa được đặt.
    de: >-
      Adresse, über die Personen und Versandanbieter diese Instanz erreichen. ReputeCast bildet daraus die Webhook-URLs
      der Anbieter, Weiterleitungen bei der Anmeldung, Passkeys, öffentliche Seiten und Links in E-Mails, daher müssen
      Anbieter sie aus dem Internet erreichen können. Muss eine absolute URL sein; eine `https://`-Adresse aktiviert
      HSTS und Secure-Cookies. Eine unter Instanzverwaltung › Instanz & Updates gespeicherte öffentliche URL ersetzt
      sie, außer wenn `http.public_url_locked` `true` ist. Seit 1.2.0 lautet ihre Umgebungsvariable
      `REPUTECAST_PUBLIC_URL`; der frühere Name `REPUTECAST_HTTP__PUBLIC_URL` funktioniert weiterhin, wenn
      `REPUTECAST_PUBLIC_URL` nicht gesetzt ist.
    es: >-
      Dirección que usan las personas y los proveedores de envío para llegar a esta instancia. ReputeCast construye a
      partir de ella las URL de los webhooks de los proveedores, las redirecciones del inicio de sesión, las llaves de
      acceso, las páginas públicas y los enlaces de los correos, así que los proveedores deben poder llegar a ella desde
      internet. Debe ser una URL absoluta; una dirección `https://` activa HSTS y las cookies Secure. Una URL pública
      guardada en Administración de la instancia › Instancia y actualizaciones la reemplaza, salvo que
      `http.public_url_locked` sea `true`. Desde la 1.2.0 su variable de entorno es `REPUTECAST_PUBLIC_URL`; el nombre
      anterior, `REPUTECAST_HTTP__PUBLIC_URL`, sigue funcionando cuando `REPUTECAST_PUBLIC_URL` no está definida.
    fr: >-
      Adresse qu’utilisent les personnes et les fournisseurs d’envoi pour joindre cette instance. ReputeCast s’en sert
      pour construire les URL de webhook des fournisseurs, les redirections de connexion, les clés d’accès, les pages
      publiques et les liens des e-mails : les fournisseurs doivent donc pouvoir la joindre depuis Internet. Doit être
      une URL absolue ; une adresse `https://` active HSTS et les cookies Secure. Une URL publique enregistrée dans
      Administration de l’instance › Instance et mises à jour la remplace, sauf si `http.public_url_locked` vaut `true`.
      Depuis la version 1.2.0, sa variable d’environnement est `REPUTECAST_PUBLIC_URL` ; l’ancien nom
      `REPUTECAST_HTTP__PUBLIC_URL` fonctionne toujours tant que `REPUTECAST_PUBLIC_URL` n’est pas défini.
  kind: key

- id: http.public_url_locked
  env: REPUTECAST_HTTP__PUBLIC_URL_LOCKED
  type: bool
  default: 'false'
  group: http
  description:
    en: >-
      `true` pins the public URL to `http.public_url`, for a hosting company or an IT team that runs the instance for
      someone else and owns its DNS and TLS. An address saved in Instance admin is ignored, the field there and at the
      first sign-in is read only, and the API refuses another address with `409` and the code `operator_locked`. At
      start the locked address becomes the saved one and provider webhooks move to it, audited as the server
      configuration's; webhooks that providers keep in their own settings are listed in the log. `reputecast doctor`
      warns when the locked address is one only the server itself reaches, such as `localhost`. Since 1.5.0.
    vi: >-
      `true` cố định URL công khai theo `http.public_url`, dành cho công ty hosting hoặc đội IT vận hành hệ thống cho
      người khác và nắm DNS cùng TLS của nó. Địa chỉ lưu trong Quản trị hệ thống bị bỏ qua, ô nhập ở đó và ở lần đăng
      nhập đầu tiên chỉ đọc, và API từ chối địa chỉ khác bằng `409` với mã `operator_locked`. Khi khởi động, địa chỉ bị
      khóa trở thành địa chỉ đã lưu và webhook của nhà cung cấp chuyển sang địa chỉ đó, được ghi nhật ký kiểm tra dưới
      tên cấu hình máy chủ; các webhook mà nhà cung cấp lưu trong cài đặt riêng của họ được liệt kê trong log.
      `reputecast doctor` cảnh báo khi địa chỉ bị khóa là địa chỉ chỉ chính máy chủ truy cập được, như `localhost`. Từ
      bản 1.5.0.
    de: >-
      `true` legt die öffentliche URL auf `http.public_url` fest, für eine Hosting-Firma oder ein IT-Team, das die
      Instanz für andere betreibt und ihr DNS und TLS verwaltet. Eine in der Instanzverwaltung gespeicherte Adresse wird
      ignoriert, das Feld dort und bei der ersten Anmeldung ist schreibgeschützt, und die API lehnt eine andere Adresse
      mit `409` und dem Code `operator_locked` ab. Beim Start wird die festgelegte Adresse zur gespeicherten, und die
      Webhooks der Anbieter ziehen zu ihr um, im Audit-Protokoll als Werk der Serverkonfiguration vermerkt; Webhooks,
      die Anbieter in ihren eigenen Einstellungen führen, stehen im Log. `reputecast doctor` warnt, wenn die festgelegte
      Adresse nur vom Server selbst erreichbar ist, etwa `localhost`. Seit 1.5.0.
    es: >-
      `true` fija la URL pública en `http.public_url`, para una empresa de hosting o un equipo de TI que gestiona la
      instancia para otros y controla su DNS y su TLS. Se ignora la dirección guardada en Administración de la
      instancia, el campo de allí y el del primer inicio de sesión son de solo lectura, y la API rechaza otra dirección
      con `409` y el código `operator_locked`. Al arrancar, la dirección fijada pasa a ser la guardada y los webhooks de
      los proveedores se mueven a ella, con la configuración del servidor como autora en el registro de auditoría; los
      webhooks que los proveedores guardan en su propia configuración se listan en el registro. `reputecast doctor`
      avisa cuando la dirección fijada es una a la que solo llega el propio servidor, como `localhost`. Desde la 1.5.0.
    fr: >-
      `true` fixe l’URL publique à `http.public_url`, pour un hébergeur ou une équipe informatique qui exploite
      l’instance pour d’autres et gère son DNS et son TLS. Une adresse enregistrée dans l’Administration de l’instance
      est ignorée, le champ y est en lecture seule, comme à la première connexion, et l’API refuse une autre adresse
      avec `409` et le code `operator_locked`. Au démarrage, l’adresse fixée devient l’adresse enregistrée et les
      webhooks des fournisseurs y sont déplacés, au nom de la configuration du serveur dans le journal d’audit ; les
      webhooks que les fournisseurs gardent dans leurs propres réglages sont listés dans les journaux. `reputecast
      doctor` avertit lorsque l’adresse fixée n’est joignable que par le serveur lui-même, comme `localhost`. Depuis la
      version 1.5.0.
  kind: key

- id: http.trusted_proxies
  env: REPUTECAST_HTTP__TRUSTED_PROXIES
  type: list
  default: ''
  group: http
  description:
    en: >-
      IP addresses or CIDR ranges of your reverse proxies. Only requests from them may set the client address with
      `X-Forwarded-For` or `X-Real-IP`, which rate limits, the audit log and the allowed IPs of API keys and MCP agents
      use. Entries that are no address or range are logged and ignored. As an environment variable, separate entries
      with commas. The keyword `private` stands for every private (RFC 1918), shared (`100.64.0.0/10`) and loopback
      network, IPv6 unique local and loopback included: the router of a hosting platform or a Kubernetes Ingress
      controller, whose address you can't know in advance. Don't use it when clients reach ReputeCast directly from a
      private network, such as an office LAN: they could claim any address. Available from the next release after 1.6.0.
    vi: >-
      Địa chỉ IP hoặc dải CIDR của các reverse proxy của bạn. Chỉ yêu cầu đến từ các địa chỉ này mới được đặt địa chỉ
      máy khách bằng `X-Forwarded-For` hoặc `X-Real-IP`; giới hạn tốc độ, nhật ký kiểm tra và danh sách IP được phép của
      khóa API và tác tử MCP dùng địa chỉ máy khách đó. Mục nào không phải địa chỉ hay dải địa chỉ sẽ được ghi log và bỏ
      qua. Khi đặt bằng biến môi trường, hãy phân tách các mục bằng dấu phẩy. Từ khóa `private` đại diện cho mọi mạng
      riêng (RFC 1918), mạng dùng chung (`100.64.0.0/10`) và loopback, gồm cả địa chỉ IPv6 unique local và loopback: bộ
      định tuyến của nền tảng hosting hoặc Ingress controller của Kubernetes, những nơi bạn không biết trước địa chỉ.
      Đừng dùng từ khóa này khi máy khách truy cập ReputeCast trực tiếp từ một mạng riêng, như mạng LAN văn phòng: họ có
      thể tự nhận bất kỳ địa chỉ nào. Có từ bản phát hành tiếp theo sau 1.6.0.
    de: >-
      IP-Adressen oder CIDR-Bereiche Ihrer Reverse Proxys. Nur Anfragen von ihnen dürfen die Client-Adresse mit
      `X-Forwarded-For` oder `X-Real-IP` setzen, die von Ratenlimits, dem Audit-Protokoll und den erlaubten IPs von
      API-Schlüsseln und MCP-Agenten verwendet wird. Einträge, die weder Adresse noch Bereich sind, werden protokolliert
      und ignoriert. Als Umgebungsvariable trennen Sie die Einträge durch Kommas. Das Schlüsselwort `private` steht für
      alle privaten (RFC 1918), gemeinsam genutzten (`100.64.0.0/10`) und Loopback-Netze, einschließlich IPv6 Unique
      Local und Loopback: den Router einer Hosting-Plattform oder einen Kubernetes-Ingress-Controller, dessen Adresse
      Sie nicht im Voraus kennen. Verwenden Sie es nicht, wenn Clients ReputeCast direkt aus einem privaten Netz
      erreichen, etwa einem Büro-LAN: Diese könnten jede beliebige Adresse angeben. Verfügbar ab dem nächsten Release
      nach 1.6.0.
    es: >-
      Direcciones IP o rangos CIDR de tus proxies inversos. Solo las solicitudes que vienen de ellos pueden fijar la
      dirección del cliente con `X-Forwarded-For` o `X-Real-IP`, que usan los límites de frecuencia, el registro de
      auditoría y las IP permitidas de las claves de API y los agentes MCP. Las entradas que no son una dirección ni un
      rango se registran y se ignoran. Como variable de entorno, separa las entradas con comas. La palabra clave
      `private` equivale a todas las redes privadas (RFC 1918), compartidas (`100.64.0.0/10`) y de loopback, incluidas
      las IPv6 locales únicas y de loopback: el router de una plataforma de hosting o un Ingress controller de
      Kubernetes, cuya dirección no puedes conocer de antemano. No la uses cuando los clientes llegan a ReputeCast
      directamente desde una red privada, como la LAN de una oficina: podrían declarar cualquier dirección. Disponible a
      partir de la próxima versión después de la 1.6.0.
    fr: >-
      Adresses IP ou plages CIDR de vos reverse proxies. Seules les requêtes qui en proviennent peuvent définir
      l’adresse du client avec `X-Forwarded-For` ou `X-Real-IP`, que les limites de débit, le journal d’audit et les IP
      autorisées des clés d’API et des agents MCP utilisent. Les entrées qui ne sont ni une adresse ni une plage sont
      journalisées et ignorées. En variable d’environnement, séparez les entrées par des virgules. Le mot-clé `private`
      désigne tous les réseaux privés (RFC 1918), partagés (`100.64.0.0/10`) et de bouclage, y compris les adresses IPv6
      locales uniques et de bouclage : le routeur d’une plateforme d’hébergement ou un Ingress controller Kubernetes,
      dont vous ne pouvez pas connaître l’adresse à l’avance. Ne l’utilisez pas lorsque des clients joignent ReputeCast
      directement depuis un réseau privé, comme le LAN d’un bureau : ils pourraient annoncer n’importe quelle adresse.
      Disponible à partir de la prochaine version après la 1.6.0.
  kind: key

- id: http.rate_limit_auth
  env: REPUTECAST_HTTP__RATE_LIMIT_AUTH
  type: int
  default: '30'
  group: http
  description:
    en: Requests per minute each client IP address may make to the sign-in endpoints (`/api/v1/auth/*`).
    vi: Số yêu cầu mỗi phút mà mỗi địa chỉ IP máy khách được gửi đến các endpoint đăng nhập (`/api/v1/auth/*`).
    de: Anfragen pro Minute, die jede Client-IP-Adresse an die Anmelde-Endpunkte (`/api/v1/auth/*`) stellen darf.
    es: >-
      Solicitudes por minuto que cada dirección IP de cliente puede hacer a los endpoints de inicio de sesión
      (`/api/v1/auth/*`).
    fr: Requêtes par minute que chaque adresse IP cliente peut envoyer aux endpoints de connexion (`/api/v1/auth/*`).
  kind: key

- id: http.rate_limit_api
  env: REPUTECAST_HTTP__RATE_LIMIT_API
  type: int
  default: '600'
  group: http
  description:
    en: >-
      Requests per minute to the API from each API key, each signed-in browser session, or each IP address for calls
      with neither. `0` or less turns off every API limit, `http.rate_limit_ip` and `http.rate_limit_auth` too.
    vi: >-
      Số yêu cầu mỗi phút gửi đến API từ mỗi khóa API, mỗi phiên trình duyệt đã đăng nhập, hoặc mỗi địa chỉ IP với các
      lệnh gọi không có cả hai. Giá trị `0` trở xuống sẽ tắt mọi giới hạn API, kể cả `http.rate_limit_ip` và
      `http.rate_limit_auth`.
    de: >-
      Anfragen pro Minute an die API je API-Schlüssel, je angemeldeter Browsersitzung oder, bei Aufrufen ohne beides, je
      IP-Adresse. `0` oder weniger schaltet alle API-Limits ab, auch `http.rate_limit_ip` und `http.rate_limit_auth`.
    es: >-
      Solicitudes por minuto a la API desde cada clave de API, cada sesión de navegador iniciada o cada dirección IP en
      las llamadas que no tienen ninguna de las dos. `0` o menos desactiva todos los límites de la API, también
      `http.rate_limit_ip` y `http.rate_limit_auth`.
    fr: >-
      Requêtes par minute vers l’API depuis chaque clé API, chaque session de navigateur connectée, ou chaque adresse IP
      pour les appels sans l’une ni l’autre. `0` ou moins désactive toutes les limites de l’API, y compris
      `http.rate_limit_ip` et `http.rate_limit_auth`.
  kind: key

- id: http.rate_limit_ip
  env: REPUTECAST_HTTP__RATE_LIMIT_IP
  type: int
  default: '6000'
  group: http
  description:
    en: >-
      Requests per minute to the API from all signed-in browsers at one IP address together, so an office behind one
      NAT shares it; each session still has `http.rate_limit_api`. `0` or less means ten times `http.rate_limit_api`.
      Each web process counts its own requests, so behind a load balancer with N web processes a caller can reach N
      times the API limits.
    vi: >-
      Số yêu cầu mỗi phút gửi đến API từ mọi trình duyệt đã đăng nhập tại cùng một địa chỉ IP cộng lại, nên một văn
      phòng sau cùng một NAT dùng chung giới hạn này; mỗi phiên vẫn có `http.rate_limit_api`. Giá trị `0` trở xuống
      nghĩa là gấp mười lần `http.rate_limit_api`. Mỗi tiến trình web tự đếm yêu cầu của nó, nên sau một bộ cân bằng
      tải có N tiến trình web, một bên gọi có thể đạt gấp N lần các giới hạn API.
    de: >-
      Anfragen pro Minute an die API von allen angemeldeten Browsern unter einer IP-Adresse zusammen, sodass sich ein
      Büro hinter einem NAT dieses Limit teilt; jede Sitzung hat weiterhin `http.rate_limit_api`. `0` oder weniger
      bedeutet das Zehnfache von `http.rate_limit_api`. Jeder Web-Prozess zählt seine eigenen Anfragen, daher kann ein
      Aufrufer hinter einem Load Balancer mit N Web-Prozessen das N-Fache der API-Limits erreichen.
    es: >-
      Solicitudes por minuto a la API desde todos los navegadores con sesión iniciada de una misma dirección IP en
      conjunto, de modo que una oficina detrás de un mismo NAT lo comparte; cada sesión sigue teniendo
      `http.rate_limit_api`. `0` o menos equivale a diez veces `http.rate_limit_api`. Cada proceso web cuenta sus
      propias solicitudes, así que detrás de un balanceador de carga con N procesos web quien llama puede alcanzar N
      veces los límites de la API.
    fr: >-
      Requêtes par minute vers l’API depuis l’ensemble des navigateurs connectés d’une même adresse IP, si bien qu’un
      bureau derrière un même NAT se la partage ; chaque session conserve sa propre limite `http.rate_limit_api`. `0` ou
      moins équivaut à dix fois `http.rate_limit_api`. Chaque processus web compte ses propres requêtes : derrière un
      répartiteur de charge avec N processus web, un appelant peut donc atteindre N fois les limites de l’API.
  kind: key

- id: http.read_timeout
  env: REPUTECAST_HTTP__READ_TIMEOUT
  type: duration
  default: 30s
  group: http
  description:
    en: Longest time the server waits to read a whole request, body included.
    vi: Thời gian tối đa máy chủ chờ để đọc xong một yêu cầu, kể cả phần thân.
    de: Längste Zeit, die der Server wartet, um eine ganze Anfrage einschließlich Body zu lesen.
    es: Tiempo máximo que el servidor espera para leer una solicitud completa, incluido el cuerpo.
    fr: Durée maximale pendant laquelle le serveur attend de lire une requête entière, corps compris.
  kind: key

- id: http.write_timeout
  env: REPUTECAST_HTTP__WRITE_TIMEOUT
  type: duration
  default: 60s
  group: http
  description:
    en: Longest time the server spends writing a response.
    vi: Thời gian tối đa máy chủ dành để ghi một phản hồi.
    de: Längste Zeit, die der Server mit dem Schreiben einer Antwort verbringt.
    es: Tiempo máximo que el servidor dedica a escribir una respuesta.
    fr: Durée maximale que le serveur consacre à l’écriture d’une réponse.
  kind: key

- id: http.shutdown_timeout
  env: REPUTECAST_HTTP__SHUTDOWN_TIMEOUT
  type: duration
  default: 20s
  group: http
  description:
    en: How long a stopping process waits for open requests to finish.
    vi: Thời gian một tiến trình đang dừng chờ các yêu cầu đang mở hoàn tất.
    de: Wie lange ein Prozess beim Beenden wartet, bis offene Anfragen abgeschlossen sind.
    es: Cuánto espera un proceso que se detiene a que terminen las solicitudes abiertas.
    fr: Durée pendant laquelle un processus qui s’arrête attend la fin des requêtes en cours.
  kind: key

- id: database.url
  env: REPUTECAST_DATABASE__URL
  type: string
  default: postgres://reputecast:reputecast@localhost:5432/reputecast?sslmode=disable
  group: database
  description:
    en: >-
      PostgreSQL connection URL. When `REPUTECAST_DATABASE__URL` is unset, `DATABASE_URL` is used instead. The
      `--database-url` flag overrides both. The default matches the development database.
    vi: >-
      URL kết nối PostgreSQL. Khi chưa đặt `REPUTECAST_DATABASE__URL`, `DATABASE_URL` sẽ được dùng thay thế. Cờ
      `--database-url` ghi đè cả hai. Giá trị mặc định khớp với cơ sở dữ liệu phát triển.
    de: >-
      Verbindungs-URL für PostgreSQL. Ist `REPUTECAST_DATABASE__URL` nicht gesetzt, wird stattdessen `DATABASE_URL`
      verwendet. Das Flag `--database-url` hat Vorrang vor beiden. Der Standardwert passt zur Entwicklungsdatenbank.
    es: >-
      URL de conexión a PostgreSQL. Cuando `REPUTECAST_DATABASE__URL` no está definida, se usa `DATABASE_URL` en su
      lugar. La opción `--database-url` prevalece sobre ambas. El valor predeterminado corresponde a la base de datos de
      desarrollo.
    fr: >-
      URL de connexion PostgreSQL. Si `REPUTECAST_DATABASE__URL` n’est pas défini, `DATABASE_URL` est utilisé à la
      place. L’option `--database-url` remplace les deux. La valeur par défaut correspond à la base de données de
      développement.
  kind: key

- id: database.max_conns
  env: REPUTECAST_DATABASE__MAX_CONNS
  type: int
  default: '20'
  group: database
  description:
    en: Size of each process's connection pool. Keep the total over all processes below PostgreSQL's `max_connections`.
    vi: >-
      Kích thước nhóm kết nối (connection pool) của mỗi tiến trình. Hãy giữ tổng của mọi tiến trình dưới
      `max_connections` của PostgreSQL.
    de: >-
      Größe des Verbindungspools jedes Prozesses. Halten Sie die Summe über alle Prozesse unter `max_connections` von
      PostgreSQL.
    es: >-
      Tamaño del grupo de conexiones de cada proceso. Mantén el total de todos los procesos por debajo de
      `max_connections` de PostgreSQL.
    fr: >-
      Taille du pool de connexions de chaque processus. Gardez le total de tous les processus sous la valeur
      `max_connections` de PostgreSQL.
  kind: key

- id: secrets.key
  env: REPUTECAST_SECRETS__KEY
  type: string
  default: ''
  group: secrets
  description:
    en: >-
      Base64-encoded 32-byte key that encrypts provider credentials and other secrets in the database (AES-256-GCM).
      Create one with `reputecast secrets generate-key`. When it is empty, the key is read from `secrets.key_file`. Back
      it up with the database: without it, stored credentials can't be decrypted.
    vi: >-
      Khóa 32 byte mã hóa Base64, dùng để mã hóa thông tin xác thực của nhà cung cấp và các bí mật khác trong cơ sở dữ
      liệu (AES-256-GCM). Tạo khóa bằng `reputecast secrets generate-key`. Khi để trống, khóa được đọc từ
      `secrets.key_file`. Hãy sao lưu khóa cùng cơ sở dữ liệu: thiếu khóa, thông tin xác thực đã lưu không thể giải mã.
    de: >-
      Base64-kodierter 32-Byte-Schlüssel, der die Zugangsdaten der Anbieter und andere vertrauliche Werte in der
      Datenbank verschlüsselt (AES-256-GCM). Erzeugen Sie ihn mit `reputecast secrets generate-key`. Ist er leer, wird
      der Schlüssel aus `secrets.key_file` gelesen. Sichern Sie ihn zusammen mit der Datenbank: Ohne ihn lassen sich
      gespeicherte Zugangsdaten nicht entschlüsseln.
    es: >-
      Clave de 32 bytes codificada en base64 que cifra las credenciales de los proveedores y otros datos secretos en la
      base de datos (AES-256-GCM). Crea una con `reputecast secrets generate-key`. Cuando está vacía, la clave se lee de
      `secrets.key_file`. Haz una copia de seguridad junto con la base de datos: sin ella, las credenciales almacenadas
      no se pueden descifrar.
    fr: >-
      Clé de 32 octets encodée en Base64 qui chiffre les identifiants des fournisseurs et les autres secrets dans la
      base de données (AES-256-GCM). Créez-en une avec `reputecast secrets generate-key`. Si elle est vide, la clé est
      lue dans `secrets.key_file`. Sauvegardez-la avec la base de données : sans elle, les identifiants enregistrés ne
      peuvent pas être déchiffrés.
  kind: key

- id: secrets.previous_keys
  env: REPUTECAST_SECRETS__PREVIOUS_KEYS
  type: list
  default: ''
  group: secrets
  description:
    en: >-
      Earlier keys, still accepted for decrypting while you rotate. To rotate, move the current key here, set a new
      `secrets.key`, then run `reputecast secrets reseal`. Links in emails already sent keep working only while their
      key stays here. As an environment variable, separate keys with commas.
    vi: >-
      Các khóa trước đây, vẫn được chấp nhận để giải mã trong lúc bạn xoay vòng khóa. Để xoay vòng, hãy chuyển khóa hiện
      tại vào đây, đặt một `secrets.key` mới, rồi chạy `reputecast secrets reseal`. Liên kết trong các email đã gửi chỉ
      còn hoạt động khi khóa của chúng vẫn ở đây. Khi đặt bằng biến môi trường, hãy phân tách các khóa bằng dấu phẩy.
    de: >-
      Frühere Schlüssel, die während einer Rotation weiter zum Entschlüsseln akzeptiert werden. Zum Rotieren verschieben
      Sie den aktuellen Schlüssel hierher, setzen einen neuen `secrets.key` und führen dann `reputecast secrets reseal`
      aus. Links in bereits gesendeten E-Mails funktionieren nur, solange ihr Schlüssel hier steht. Als
      Umgebungsvariable trennen Sie die Schlüssel durch Kommas.
    es: >-
      Claves anteriores, que se siguen aceptando para descifrar mientras haces la rotación. Para rotar, mueve aquí la
      clave actual, define una `secrets.key` nueva y después ejecuta `reputecast secrets reseal`. Los enlaces de los
      correos ya enviados solo siguen funcionando mientras su clave permanece aquí. Como variable de entorno, separa las
      claves con comas.
    fr: >-
      Clés précédentes, encore acceptées pour le déchiffrement pendant une rotation. Pour effectuer la rotation,
      déplacez la clé actuelle ici, définissez une nouvelle `secrets.key`, puis exécutez `reputecast secrets reseal`.
      Les liens des e-mails déjà envoyés ne fonctionnent que tant que leur clé reste ici. En variable d’environnement,
      séparez les clés par des virgules.
  kind: key

- id: secrets.key_file
  env: REPUTECAST_SECRETS__KEY_FILE
  type: string
  default: data/secret.key
  group: secrets
  description:
    en: >-
      File that holds the key when `secrets.key` is empty, relative to the working directory unless absolute. If the
      file doesn't exist, ReputeCast creates it with a new key (mode `0600`) and logs a warning to back it up. The
      Docker image sets `/var/lib/reputecast/secret.key`.
    vi: >-
      Tệp chứa khóa khi `secrets.key` để trống, tính tương đối từ thư mục làm việc trừ khi là đường dẫn tuyệt đối. Nếu
      tệp chưa tồn tại, ReputeCast tạo tệp với một khóa mới (quyền `0600`) và ghi cảnh báo vào log để nhắc bạn sao lưu.
      Docker image đặt `/var/lib/reputecast/secret.key`.
    de: >-
      Datei mit dem Schlüssel, wenn `secrets.key` leer ist, relativ zum Arbeitsverzeichnis, sofern nicht absolut.
      Existiert die Datei nicht, legt ReputeCast sie mit einem neuen Schlüssel an (Modus `0600`) und protokolliert eine
      Warnung, sie zu sichern. Das Docker-Image setzt `/var/lib/reputecast/secret.key`.
    es: >-
      Archivo que contiene la clave cuando `secrets.key` está vacía, relativo al directorio de trabajo salvo que sea
      absoluto. Si el archivo no existe, ReputeCast lo crea con una clave nueva (modo `0600`) y registra un aviso para
      que hagas una copia de seguridad. La imagen de Docker define `/var/lib/reputecast/secret.key`.
    fr: >-
      Fichier qui contient la clé lorsque `secrets.key` est vide, relatif au répertoire de travail sauf s’il est absolu.
      Si le fichier n’existe pas, ReputeCast le crée avec une nouvelle clé (mode `0600`) et journalise un avertissement
      invitant à le sauvegarder. L’image Docker définit `/var/lib/reputecast/secret.key`.
  kind: key

- id: log.level
  env: REPUTECAST_LOG__LEVEL
  type: string
  default: info
  group: log
  description:
    en: 'Lowest level logged: `debug`, `info`, `warn` or `error`. The `--log-level` flag overrides it.'
    vi: 'Mức log thấp nhất được ghi: `debug`, `info`, `warn` hoặc `error`. Cờ `--log-level` ghi đè giá trị này.'
    de: 'Niedrigste protokollierte Stufe: `debug`, `info`, `warn` oder `error`. Das Flag `--log-level` hat Vorrang.'
    es: 'Nivel mínimo que se registra: `debug`, `info`, `warn` o `error`. La opción `--log-level` prevalece sobre ella.'
    fr: 'Niveau le plus bas journalisé : `debug`, `info`, `warn` ou `error`. L’option `--log-level` le remplace.'
  kind: key

- id: log.format
  env: REPUTECAST_LOG__FORMAT
  type: string
  default: text
  group: log
  description:
    en: Log format, `text` or `json`. Logs go to standard error. The Docker image sets `json`.
    vi: Định dạng log, `text` hoặc `json`. Log được ghi ra standard error. Docker image đặt `json`.
    de: Log-Format, `text` oder `json`. Logs gehen an die Standardfehlerausgabe. Das Docker-Image setzt `json`.
    es: >-
      Formato del registro, `text` o `json`. Los registros van a la salida de error estándar. La imagen de Docker define
      `json`.
    fr: >-
      Format des journaux, `text` ou `json`. Les journaux sont écrits sur la sortie d’erreur standard. L’image Docker
      définit `json`.
  kind: key

- id: auth.session_idle
  env: REPUTECAST_AUTH__SESSION_IDLE
  type: duration
  default: 12h
  group: auth
  description:
    en: >-
      Idle timeout used only when the authentication policy can't be read from the database. Set the idle timeout in
      Instance admin › Authentication.
    vi: >-
      Thời gian chờ khi không hoạt động, chỉ dùng khi không đọc được chính sách xác thực từ cơ sở dữ liệu. Hãy đặt thời
      gian chờ này trong Quản trị hệ thống › Xác thực.
    de: >-
      Zeitlimit bei Inaktivität, das nur gilt, wenn die Authentifizierungsrichtlinie nicht aus der Datenbank gelesen
      werden kann. Legen Sie das Zeitlimit bei Inaktivität unter Instanzverwaltung › Authentifizierung fest.
    es: >-
      Tiempo de inactividad que solo se usa cuando la política de autenticación no se puede leer de la base de datos.
      Define el tiempo de inactividad en Administración de la instancia › Autenticación.
    fr: >-
      Délai d’inactivité utilisé uniquement lorsque la politique d’authentification ne peut pas être lue dans la base de
      données. Définissez le délai d’inactivité dans Administration de l’instance › Authentification.
  kind: key

- id: auth.cookie_name
  env: REPUTECAST_AUTH__COOKIE_NAME
  type: string
  default: rc_session
  group: auth
  description:
    en: Name of the session cookie.
    vi: Tên cookie phiên.
    de: Name des Sitzungscookies.
    es: Nombre de la cookie de sesión.
    fr: Nom du cookie de session.
  kind: key

- id: auth.cookie_secure
  env: REPUTECAST_AUTH__COOKIE_SECURE
  type: bool
  default: 'true'
  group: auth
  description:
    en: >-
      Mark the session cookie Secure, so browsers send it over HTTPS only. Ignored in development. An `http.public_url`
      that starts with `https://` always makes the cookie Secure.
    vi: >-
      Đánh dấu cookie phiên là Secure để trình duyệt chỉ gửi cookie qua HTTPS. Bị bỏ qua ở chế độ phát triển. Khi
      `http.public_url` bắt đầu bằng `https://`, cookie luôn là Secure.
    de: >-
      Das Sitzungscookie als Secure markieren, sodass Browser es nur über HTTPS senden. Wird in der Entwicklung
      ignoriert. Eine `http.public_url`, die mit `https://` beginnt, macht das Cookie immer Secure.
    es: >-
      Marcar la cookie de sesión como Secure, para que los navegadores solo la envíen por HTTPS. Se ignora en
      desarrollo. Una `http.public_url` que empieza por `https://` siempre hace que la cookie sea Secure.
    fr: >-
      Marquer le cookie de session comme Secure, pour que les navigateurs ne l’envoient qu’en HTTPS. Ignoré en
      développement. Une valeur `http.public_url` qui commence par `https://` rend toujours le cookie Secure.
  kind: key

- id: auth.password_min_length
  env: REPUTECAST_AUTH__PASSWORD_MIN_LENGTH
  type: int
  default: '12'
  group: auth
  description:
    en: >-
      Minimum length of passwords set with `reputecast install` and `reputecast user reset-password --password`. At
      least 8. Passwords set in the app follow the policy in Instance admin › Authentication.
    vi: >-
      Độ dài tối thiểu của mật khẩu đặt bằng `reputecast install` và `reputecast user reset-password --password`. Ít
      nhất là 8. Mật khẩu đặt trong ứng dụng tuân theo chính sách trong Quản trị hệ thống › Xác thực.
    de: >-
      Mindestlänge von Passwörtern, die mit `reputecast install` und `reputecast user reset-password --password` gesetzt
      werden. Mindestens 8. Passwörter, die in der App gesetzt werden, folgen der Richtlinie unter Instanzverwaltung ›
      Authentifizierung.
    es: >-
      Longitud mínima de las contraseñas definidas con `reputecast install` y `reputecast user reset-password
      --password`. Al menos 8. Las contraseñas definidas en la aplicación siguen la política de Administración de la
      instancia › Autenticación.
    fr: >-
      Longueur minimale des mots de passe définis avec `reputecast install` et `reputecast user reset-password
      --password`. Au moins 8. Les mots de passe définis dans l’application suivent la politique de Administration de
      l’instance › Authentification.
  kind: key

- id: worker.concurrency
  env: REPUTECAST_WORKER__CONCURRENCY
  type: int
  default: '50'
  group: worker
  description:
    en: >-
      Background jobs a worker process runs at once on its sending queue. The other queues get a share of it: events
      half, default a quarter and system a fifth, at least 2 each. Values below 4 count as 4.
    vi: >-
      Số tác vụ nền mà một tiến trình worker chạy cùng lúc trên hàng đợi gửi. Các hàng đợi khác nhận một phần của con số
      này: events một nửa, default một phần tư và system một phần năm, mỗi hàng đợi ít nhất 2. Giá trị dưới 4 được tính
      là 4.
    de: >-
      Hintergrundjobs, die ein Worker-Prozess gleichzeitig in seiner Versandwarteschlange ausführt. Die anderen
      Warteschlangen erhalten einen Anteil davon: events die Hälfte, default ein Viertel und system ein Fünftel, jeweils
      mindestens 2. Werte unter 4 zählen als 4.
    es: >-
      Tareas en segundo plano que un proceso worker ejecuta a la vez en su cola de envíos. Las demás colas reciben una
      parte: events la mitad, default una cuarta parte y system una quinta parte, al menos 2 cada una. Los valores
      inferiores a 4 cuentan como 4.
    fr: >-
      Tâches en arrière-plan qu’un processus worker exécute simultanément sur sa file d’envoi. Les autres files en
      reçoivent une part : la moitié pour events, un quart pour default et un cinquième pour system, au moins 2 chacune.
      Les valeurs inférieures à 4 comptent pour 4.
  kind: key

- id: updates.check
  env: REPUTECAST_UPDATES__CHECK
  type: bool
  default: 'true'
  group: updates
  description:
    en: >-
      Allow the daily check for a newer ReputeCast release on GitHub and for a newer WordPress plugin. `false` turns
      both off for the whole instance, and the first sign-in can't turn the check on. When it is `true`, instance admins
      can still turn the check off in Instance admin › Instance & updates.
    vi: >-
      Cho phép kiểm tra hằng ngày xem có bản phát hành ReputeCast mới hơn trên GitHub và plugin WordPress mới hơn hay
      không. `false` tắt cả hai cho toàn hệ thống, và lần đăng nhập đầu tiên không bật được việc kiểm tra. Khi là
      `true`, quản trị viên hệ thống vẫn có thể tắt việc kiểm tra trong Quản trị hệ thống › Hệ thống và cập nhật.
    de: >-
      Die tägliche Prüfung auf ein neueres ReputeCast-Release auf GitHub und ein neueres WordPress-Plugin erlauben.
      `false` schaltet beides für die ganze Instanz ab, und die erste Anmeldung kann die Prüfung nicht einschalten. Bei
      `true` können Instanz-Admins die Prüfung unter Instanzverwaltung › Instanz & Updates trotzdem abschalten.
    es: >-
      Permitir la comprobación diaria de una versión más reciente de ReputeCast en GitHub y de una versión más reciente
      del plugin de WordPress. `false` desactiva ambas para toda la instancia, y el primer inicio de sesión no puede
      activar la comprobación. Cuando es `true`, quien administra la instancia puede seguir desactivando la comprobación
      en Administración de la instancia › Instancia y actualizaciones.
    fr: >-
      Autoriser la vérification quotidienne d’une nouvelle version de ReputeCast sur GitHub et d’une nouvelle version de
      l’extension WordPress. `false` désactive les deux pour toute l’instance, et la première connexion ne peut pas
      activer la vérification. Lorsqu’elle vaut `true`, les admins de l’instance peuvent encore désactiver la
      vérification dans Administration de l’instance › Instance et mises à jour.
  kind: key

- id: updates.repo
  env: REPUTECAST_UPDATES__REPO
  type: string
  default: hostrepute/reputecast
  group: updates
  description:
    en: GitHub repository the release check reads, as `owner/name`.
    vi: Kho GitHub mà việc kiểm tra bản phát hành đọc, ở dạng `owner/name`.
    de: GitHub-Repository, das die Release-Prüfung liest, im Format `owner/name`.
    es: Repositorio de GitHub que lee la comprobación de versiones, en formato `owner/name`.
    fr: Dépôt GitHub que lit la vérification des versions, au format `owner/name`.
  kind: key

- id: updates.managed_by
  env: REPUTECAST_UPDATES__MANAGED_BY
  type: string
  default: ''
  group: updates
  description:
    en: >-
      Who upgrades this instance when someone runs it for its users, such as `Northwind Hosting`. Instance admin ›
      Instance & updates then says upgrades are managed by them instead of showing the `docker compose` upgrade command
      and the backup line. Since 1.5.0.
    vi: >-
      Ai nâng cấp hệ thống này khi có người vận hành nó cho người dùng, ví dụ `Northwind Hosting`. Khi đó Quản trị hệ
      thống › Hệ thống và cập nhật cho biết việc nâng cấp do họ quản lý, thay vì hiện lệnh nâng cấp `docker compose` và
      dòng sao lưu. Từ bản 1.5.0.
    de: >-
      Wer diese Instanz aktualisiert, wenn jemand sie für ihre Benutzer betreibt, etwa `Northwind Hosting`.
      Instanzverwaltung › Instanz & Updates nennt dann diesen Betreiber als Verantwortlichen für Upgrades, statt den
      Upgrade-Befehl `docker compose` und die Zeile zur Sicherung zu zeigen. Seit 1.5.0.
    es: >-
      Quién actualiza esta instancia cuando alguien la gestiona para sus usuarios, por ejemplo `Northwind Hosting`.
      Administración de la instancia › Instancia y actualizaciones indica entonces que las actualizaciones las gestiona
      esa persona o empresa, en lugar de mostrar el comando de actualización `docker compose` y la línea de la copia de
      seguridad. Desde la 1.5.0.
    fr: >-
      Qui met à jour cette instance lorsque quelqu’un l’exploite pour ses utilisateurs, par exemple `Northwind Hosting`.
      Administration de l’instance › Instance et mises à jour indique alors que les mises à jour sont gérées par cet
      interlocuteur, au lieu d’afficher la commande de mise à jour `docker compose` et la ligne sur la sauvegarde.
      Depuis la version 1.5.0.
  kind: key

- id: metrics.enabled
  env: REPUTECAST_METRICS__ENABLED
  type: bool
  default: 'true'
  group: metrics
  description:
    en: Serve Prometheus metrics at `/metrics`, on the listener of `metrics.addr` and, with `metrics.token`, on the main one.
    vi: >-
      Cung cấp số liệu Prometheus tại `/metrics`, trên cổng lắng nghe của `metrics.addr` và, khi có `metrics.token`, trên
      cổng chính.
    de: >-
      Prometheus-Metriken unter `/metrics` bereitstellen, auf dem Listener von `metrics.addr` und, mit `metrics.token`,
      auch auf dem Haupt-Listener.
    es: >-
      Servir métricas de Prometheus en `/metrics`, en el listener de `metrics.addr` y, con `metrics.token`, en el
      principal.
    fr: >-
      Servir les métriques Prometheus sur `/metrics`, sur l’écouteur de `metrics.addr` et, avec `metrics.token`, sur
      l’écouteur principal.
  kind: key

- id: metrics.addr
  env: REPUTECAST_METRICS__ADDR
  type: string
  default: ':9464'
  group: metrics
  description:
    en: >-
      Listen address of the metrics listener, which serves `/metrics` and also answers `/healthz` and `/readyz`. Keep
      this port off the internet (the Docker image doesn't publish it). Empty serves no metrics listener, except in a
      process that runs only the worker role: it has no main listener, so it always opens one, on `:9464`, for health
      checks.
    vi: >-
      Địa chỉ lắng nghe của cổng số liệu, nơi phục vụ `/metrics` và cũng trả lời `/healthz` và `/readyz`. Đừng để cổng
      này lộ ra internet (Docker image không công khai cổng này). Để trống thì không có cổng số liệu, trừ tiến trình chỉ
      chạy vai trò worker: tiến trình đó không có cổng lắng nghe chính nên luôn mở một cổng, tại `:9464`, để kiểm tra
      tình trạng.
    de: >-
      Adresse des Metrik-Listeners, der `/metrics` bereitstellt und auch `/healthz` und `/readyz` beantwortet. Halten
      Sie diesen Port vom Internet fern (das Docker-Image veröffentlicht ihn nicht). Leer bedeutet kein Metrik-Listener,
      außer in einem Prozess, der nur die Rolle worker ausführt: Er hat keinen Haupt-Listener und öffnet daher immer
      einen auf `:9464` für Zustandsprüfungen.
    es: >-
      Dirección de escucha del listener de métricas, que sirve `/metrics` y también responde a `/healthz` y `/readyz`.
      No expongas este puerto a internet (la imagen de Docker no lo publica). Si está vacía, no se sirve ningún listener
      de métricas, salvo en un proceso que solo ejecuta el rol worker: no tiene listener principal, así que siempre abre
      uno, en `:9464`, para las comprobaciones de estado.
    fr: >-
      Adresse d’écoute de l’écouteur de métriques, qui sert `/metrics` et répond aussi à `/healthz` et `/readyz`. Gardez
      ce port hors d’Internet (l’image Docker ne le publie pas). Vide, aucun écouteur de métriques n’est servi, sauf
      dans un processus qui n’exécute que le rôle worker : comme il n’a pas d’écouteur principal, il en ouvre toujours
      un, sur `:9464`, pour les vérifications de l’état.
  kind: key

- id: metrics.token
  env: REPUTECAST_METRICS__TOKEN
  type: string
  default: ''
  group: metrics
  description:
    en: >-
      Bearer token, at least 16 characters, that also serves `/metrics` on the main listener to requests with
      `Authorization: Bearer <token>`. Without it the main listener answers `/metrics` with 404. Never logged.
    vi: >-
      Bearer token dài ít nhất 16 ký tự, giúp `/metrics` cũng được phục vụ trên cổng lắng nghe chính cho các yêu cầu có
      `Authorization: Bearer <token>`. Không có token, cổng lắng nghe chính trả lời `/metrics` bằng 404. Không bao giờ
      được ghi vào log.
    de: >-
      Bearer-Token mit mindestens 16 Zeichen, das `/metrics` zusätzlich auf dem Haupt-Listener für Anfragen mit
      `Authorization: Bearer <token>` bereitstellt. Ohne es beantwortet der Haupt-Listener `/metrics` mit 404. Wird nie
      protokolliert.
    es: >-
      Token Bearer, de al menos 16 caracteres, que también sirve `/metrics` en el listener principal a las solicitudes
      con `Authorization: Bearer <token>`. Sin él, el listener principal responde a `/metrics` con 404. Nunca se
      registra.
    fr: >-
      Jeton Bearer d’au moins 16 caractères qui sert aussi `/metrics` sur l’écouteur principal aux requêtes portant
      `Authorization: Bearer <token>`. Sans lui, l’écouteur principal répond à `/metrics` par une erreur 404. Jamais
      journalisé.
  kind: key

- id: webhooks.allow_private_networks
  env: REPUTECAST_WEBHOOKS__ALLOW_PRIVATE_NETWORKS
  type: bool
  default: 'false'
  group: webhooks
  description:
    en: >-
      Let URLs that ReputeCast sends webhooks to (webhook endpoints, the audit log stream, integration hooks such as a
      private n8n, and referral reward webhooks) resolve to loopback and private (RFC 1918) addresses. Off by default,
      so users can't reach internal services. Link-local and cloud metadata addresses are always blocked.
    vi: >-
      Cho phép các URL mà ReputeCast gửi webhook đến (endpoint webhook, luồng nhật ký kiểm tra, hook tích hợp như một
      n8n nội bộ, và webhook phần thưởng giới thiệu) phân giải ra địa chỉ loopback và địa chỉ riêng (RFC 1918). Tắt theo
      mặc định để người dùng không truy cập được dịch vụ nội bộ. Địa chỉ link-local và địa chỉ metadata của đám mây luôn
      bị chặn.
    de: >-
      URLs, an die ReputeCast Webhooks sendet (Webhook-Endpunkte, der Stream des Audit-Protokolls, Integrations-Hooks
      wie ein privates n8n und Webhooks für Empfehlungsprämien), auf Loopback- und private Adressen (RFC 1918) auflösen
      lassen. Standardmäßig aus, damit Benutzer keine internen Dienste erreichen. Link-Local- und
      Cloud-Metadatenadressen sind immer gesperrt.
    es: >-
      Permitir que las URL a las que ReputeCast envía webhooks (endpoints de webhook, el flujo del registro de
      auditoría, los hooks de integraciones como un n8n privado y los webhooks de recompensas por referidos) se
      resuelvan a direcciones de loopback y privadas (RFC 1918). Desactivado por defecto, para que los usuarios no
      puedan llegar a servicios internos. Las direcciones link-local y de metadatos de la nube siempre se bloquean.
    fr: >-
      Autoriser les URL auxquelles ReputeCast envoie des webhooks (endpoints de webhook, flux du journal d’audit, hooks
      d’intégration tels qu’un n8n privé, et webhooks de récompense de parrainage) à se résoudre vers des adresses de
      bouclage et privées (RFC 1918). Désactivé par défaut, pour que les utilisateurs ne puissent pas atteindre des
      services internes. Les adresses link-local et de métadonnées cloud sont toujours bloquées.
  kind: key

- id: providers.allow_private_networks
  env: REPUTECAST_PROVIDERS__ALLOW_PRIVATE_NETWORKS
  type: bool
  default: 'false'
  group: providers
  description:
    en: >-
      Let addresses that workspace admins enter for outside services resolve to loopback and private (RFC 1918)
      addresses: sending provider APIs and SMTP servers, community adapter processes, AI model servers, importers,
      feeds, verification services, seed mailboxes and other connected services. Off by default, so users can't reach
      internal services. Link-local and cloud metadata addresses are always blocked. Community adapters on such
      addresses may use plain `http://`.
    vi: >-
      Cho phép các địa chỉ mà quản trị viên không gian làm việc nhập cho dịch vụ bên ngoài phân giải ra địa chỉ loopback
      và địa chỉ riêng (RFC 1918): API và máy chủ SMTP của nhà cung cấp gửi thư, tiến trình adapter cộng đồng, máy chủ
      mô hình AI, công cụ nhập dữ liệu, nguồn cấp, dịch vụ xác minh, hộp thư thử và các dịch vụ đã kết nối khác. Tắt
      theo mặc định để người dùng không truy cập được dịch vụ nội bộ. Địa chỉ link-local và địa chỉ metadata của đám mây
      luôn bị chặn. Adapter cộng đồng ở các địa chỉ này có thể dùng `http://` thường.
    de: >-
      Adressen, die Admins eines Arbeitsbereichs für externe Dienste eingeben, auf Loopback- und private Adressen (RFC
      1918) auflösen lassen: APIs und SMTP-Server von Versandanbietern, Prozesse von Community-Adaptern,
      KI-Modellserver, Importer, Feeds, Prüfdienste, Testpostfächer und andere verbundene Dienste. Standardmäßig aus,
      damit Benutzer keine internen Dienste erreichen. Link-Local- und Cloud-Metadatenadressen sind immer gesperrt.
      Community-Adapter unter solchen Adressen dürfen einfaches `http://` verwenden.
    es: >-
      Permitir que las direcciones que los administradores del espacio de trabajo introducen para servicios externos se
      resuelvan a direcciones de loopback y privadas (RFC 1918): API y servidores SMTP de los proveedores de envío,
      procesos de adaptadores de la comunidad, servidores de modelos de IA, importadores, feeds, servicios de
      verificación, buzones de prueba y otros servicios conectados. Desactivado por defecto, para que los usuarios no
      puedan llegar a servicios internos. Las direcciones link-local y de metadatos de la nube siempre se bloquean. Los
      adaptadores de la comunidad en esas direcciones pueden usar `http://` sin cifrar.
    fr: >-
      Autoriser les adresses que les admins des espaces de travail saisissent pour des services externes à se résoudre
      vers des adresses de bouclage et privées (RFC 1918) : API et serveurs SMTP des fournisseurs d’envoi, processus
      d’adaptateurs communautaires, serveurs de modèles d’IA, outils d’import, flux, services de vérification, boîtes
      témoins et autres services connectés. Désactivé par défaut, pour que les utilisateurs ne puissent pas atteindre
      des services internes. Les adresses link-local et de métadonnées cloud sont toujours bloquées. Les adaptateurs
      communautaires situés à de telles adresses peuvent utiliser `http://` simple.
  kind: key

- id: hostrepute.api_url
  env: REPUTECAST_HOSTREPUTE__API_URL
  type: string
  default: https://api.hostrepute.com/v1
  group: hostrepute
  description:
    en: HostRepute API base URL for new connections.
    vi: URL gốc của API HostRepute cho các kết nối mới.
    de: Basis-URL der HostRepute-API für neue Verbindungen.
    es: URL base de la API de HostRepute para las conexiones nuevas.
    fr: URL de base de l’API HostRepute pour les nouvelles connexions.
  kind: key

- id: hostrepute.auth_url
  env: REPUTECAST_HOSTREPUTE__AUTH_URL
  type: string
  default: https://app.hostrepute.com/oauth/authorize
  group: hostrepute
  description:
    en: HostRepute OAuth authorization endpoint.
    vi: Endpoint ủy quyền OAuth của HostRepute.
    de: OAuth-Autorisierungsendpunkt von HostRepute.
    es: Endpoint de autorización OAuth de HostRepute.
    fr: Endpoint d’autorisation OAuth de HostRepute.
  kind: key

- id: hostrepute.token_url
  env: REPUTECAST_HOSTREPUTE__TOKEN_URL
  type: string
  default: https://api.hostrepute.com/oauth/token
  group: hostrepute
  description:
    en: HostRepute OAuth token endpoint.
    vi: Endpoint token OAuth của HostRepute.
    de: OAuth-Token-Endpunkt von HostRepute.
    es: Endpoint de tokens OAuth de HostRepute.
    fr: Endpoint de jeton OAuth de HostRepute.
  kind: key

- id: hostrepute.revoke_url
  env: REPUTECAST_HOSTREPUTE__REVOKE_URL
  type: string
  default: https://api.hostrepute.com/oauth/revoke
  group: hostrepute
  description:
    en: HostRepute OAuth token revocation endpoint, called when a workspace disconnects.
    vi: Endpoint thu hồi token OAuth của HostRepute, được gọi khi một không gian làm việc ngắt kết nối.
    de: >-
      OAuth-Endpunkt von HostRepute zum Widerrufen von Tokens, aufgerufen, wenn ein Arbeitsbereich die Verbindung
      trennt.
    es: >-
      Endpoint de revocación de tokens OAuth de HostRepute, al que se llama cuando un espacio de trabajo se desconecta.
    fr: Endpoint de révocation des jetons OAuth de HostRepute, appelé lorsqu’un espace de travail se déconnecte.
  kind: key

- id: hostrepute.client_id
  env: REPUTECAST_HOSTREPUTE__CLIENT_ID
  type: string
  default: reputecast
  group: hostrepute
  description:
    en: >-
      OAuth client ID. ReputeCast connects as a public client with PKCE; set this and `hostrepute.client_secret` only if
      you registered your own client with HostRepute.
    vi: >-
      Client ID OAuth. ReputeCast kết nối như một public client với PKCE; chỉ đặt giá trị này và
      `hostrepute.client_secret` nếu bạn đã đăng ký client riêng với HostRepute.
    de: >-
      OAuth-Client-ID. ReputeCast verbindet sich als öffentlicher Client mit PKCE; setzen Sie diesen Wert und
      `hostrepute.client_secret` nur, wenn Sie bei HostRepute einen eigenen Client registriert haben.
    es: >-
      Client ID de OAuth. ReputeCast se conecta como cliente público con PKCE; define este valor y
      `hostrepute.client_secret` solo si registraste tu propio cliente en HostRepute.
    fr: >-
      ID client OAuth. ReputeCast se connecte en tant que client public avec PKCE ; définissez cette valeur et
      `hostrepute.client_secret` uniquement si vous avez enregistré votre propre client auprès de HostRepute.
  kind: key

- id: hostrepute.client_secret
  env: REPUTECAST_HOSTREPUTE__CLIENT_SECRET
  type: string
  default: ''
  group: hostrepute
  description:
    en: OAuth client secret of your own registered client. Leave it empty for the default public client.
    vi: Client secret OAuth của client bạn tự đăng ký. Để trống nếu dùng public client mặc định.
    de: >-
      OAuth-Client-Secret Ihres eigenen registrierten Clients. Lassen Sie es für den öffentlichen Standard-Client leer.
    es: Client secret de OAuth de tu propio cliente registrado. Déjalo vacío para el cliente público predeterminado.
    fr: Secret client OAuth de votre propre client enregistré. Laissez-le vide pour le client public par défaut.
  kind: key

- id: hostrepute.demo
  env: REPUTECAST_HOSTREPUTE__DEMO
  type: bool
  default: 'false'
  group: hostrepute
  description:
    en: Use a built-in offline HostRepute with sample data and instant OAuth approval, for development and screenshots.
    vi: >-
      Dùng một HostRepute ngoại tuyến có sẵn, với dữ liệu mẫu và phê duyệt OAuth tức thì, để phát triển và chụp ảnh màn
      hình.
    de: >-
      Ein integriertes Offline-HostRepute mit Beispieldaten und sofortiger OAuth-Freigabe verwenden, für Entwicklung und
      Screenshots.
    es: >-
      Usar un HostRepute integrado sin conexión, con datos de ejemplo y aprobación OAuth inmediata, para desarrollo y
      capturas de pantalla.
    fr: >-
      Utiliser un HostRepute hors ligne intégré, avec des données d’exemple et une approbation OAuth instantanée, pour
      le développement et les captures d’écran.
  kind: key

- id: dns.servers
  env: REPUTECAST_DNS__SERVERS
  type: list
  default: ''
  group: dns
  description:
    en: >-
      DNS resolvers for authentication checks and blocklist lookups, as `host` or `host:port`. Empty uses the system
      resolvers. Blocklists such as Spamhaus refuse queries that come through public resolvers, so use your own
      resolver. As an environment variable, separate servers with commas.
    vi: >-
      Các DNS resolver dùng cho kiểm tra xác thực và tra cứu danh sách chặn, ở dạng `host` hoặc `host:port`. Để trống
      thì dùng resolver của hệ điều hành. Các danh sách chặn như Spamhaus từ chối truy vấn đi qua resolver công cộng,
      nên hãy dùng resolver của riêng bạn. Khi đặt bằng biến môi trường, hãy phân tách các máy chủ bằng dấu phẩy.
    de: >-
      DNS-Resolver für Authentifizierungsprüfungen und Blocklisten-Abfragen, als `host` oder `host:port`. Leer verwendet
      die Resolver des Systems. Blocklisten wie Spamhaus lehnen Anfragen ab, die über öffentliche Resolver kommen,
      verwenden Sie daher einen eigenen Resolver. Als Umgebungsvariable trennen Sie die Server durch Kommas.
    es: >-
      Resolutores DNS para las comprobaciones de autenticación y las consultas a listas de bloqueo, como `host` o
      `host:port`. Si está vacío, se usan los resolutores del sistema. Las listas de bloqueo como Spamhaus rechazan las
      consultas que llegan a través de resolutores públicos, así que usa tu propio resolutor. Como variable de entorno,
      separa los servidores con comas.
    fr: >-
      Résolveurs DNS pour les contrôles d’authentification et les recherches dans les listes de blocage, au format
      `host` ou `host:port`. Vide, les résolveurs du système sont utilisés. Les listes de blocage comme Spamhaus
      refusent les requêtes qui passent par des résolveurs publics : utilisez donc votre propre résolveur. En variable
      d’environnement, séparez les serveurs par des virgules.
  kind: key

- id: dns.timeout
  env: REPUTECAST_DNS__TIMEOUT
  type: duration
  default: 4s
  group: dns
  description:
    en: Timeout of one DNS lookup.
    vi: Thời gian chờ của một lượt tra cứu DNS.
    de: Zeitlimit für eine DNS-Abfrage.
    es: Tiempo de espera de una consulta DNS.
    fr: Délai d’expiration d’une requête DNS.
  kind: key

- id: mail.dev_smtp
  env: REPUTECAST_MAIL__DEV_SMTP
  type: string
  default: localhost:1025
  group: mail
  description:
    en: >-
      Development only: SMTP address (`host:port`) of a mail catcher such as Mailpit, where mail for the demo's sample
      providers goes instead of a real provider.
    vi: >-
      Chỉ dùng khi phát triển: địa chỉ SMTP (`host:port`) của một công cụ hứng thư như Mailpit, nơi thư của các nhà cung
      cấp mẫu trong bản demo được chuyển đến thay vì một nhà cung cấp thật.
    de: >-
      Nur für die Entwicklung: SMTP-Adresse (`host:port`) eines Mail-Catchers wie Mailpit, an den E-Mails für die
      Beispielanbieter der Demo statt an einen echten Anbieter gehen.
    es: >-
      Solo en desarrollo: dirección SMTP (`host:port`) de un capturador de correo como Mailpit, adonde va el correo de
      los proveedores de ejemplo de la demostración en lugar de a un proveedor real.
    fr: >-
      Développement uniquement : adresse SMTP (`host:port`) d’un capteur d’e-mails tel que Mailpit, où vont les e-mails
      des fournisseurs d’exemple de la démo au lieu d’un vrai fournisseur.
  kind: key

- id: connect.ses_template_url
  env: REPUTECAST_CONNECT__SES_TEMPLATE_URL
  type: string
  default: https://reputecast.com/cf/reputecast-ses.yaml
  group: connect
  description:
    en: >-
      CloudFormation template that the Launch stack link opens when you connect Amazon SES. Point it at your own
      published copy to use a different template.
    vi: >-
      Template CloudFormation mà liên kết Khởi chạy stack trong AWS mở ra khi bạn kết nối Amazon SES. Hãy trỏ đến bản
      sao do bạn tự xuất bản để dùng một template khác.
    de: >-
      CloudFormation-Template, das der Link „Stack in AWS starten“ öffnet, wenn Sie Amazon SES verbinden. Verweisen Sie
      auf Ihre eigene veröffentlichte Kopie, um ein anderes Template zu verwenden.
    es: >-
      Plantilla de CloudFormation que abre el enlace “Lanzar el stack en AWS” cuando conectas Amazon SES. Apúntala a tu
      propia copia publicada para usar otra plantilla.
    fr: >-
      Modèle CloudFormation qu’ouvre le lien Lancer la stack lorsque vous connectez Amazon SES. Faites-le pointer vers
      votre propre copie publiée pour utiliser un autre modèle.
  kind: key

- id: i18n.pseudo_locale
  env: REPUTECAST_I18N__PSEUDO_LOCALE
  type: bool
  default: 'false'
  group: i18n
  description:
    en: >-
      Offer the Pseudo (+40%) app language outside development, to check layouts on a staging instance. Every string is
      accented, about 40% longer and wrapped in ⟦ ⟧. Development always offers it.
    vi: >-
      Cung cấp ngôn ngữ ứng dụng Pseudo (+40%) ngoài chế độ phát triển, để kiểm tra bố cục trên một hệ thống staging.
      Mọi chuỗi đều được thêm dấu, dài hơn khoảng 40% và được bọc trong ⟦ ⟧. Chế độ phát triển luôn có ngôn ngữ này.
    de: >-
      Die App-Sprache Pseudo (+40%) auch außerhalb der Entwicklung anbieten, um Layouts auf einer Staging-Instanz zu
      prüfen. Jeder Text ist mit Akzenten versehen, etwa 40 % länger und in ⟦ ⟧ eingeschlossen. In der Entwicklung wird
      sie immer angeboten.
    es: >-
      Ofrecer el idioma de la aplicación Pseudo (+40%) fuera de desarrollo, para comprobar el diseño en una instancia de
      staging. Todos los textos llevan acentos, son un 40 % más largos y van entre ⟦ ⟧. En desarrollo siempre se ofrece.
    fr: >-
      Proposer la langue d’application Pseudo (+40 %) en dehors du développement, pour vérifier les mises en page sur
      une instance de préproduction. Chaque chaîne est accentuée, environ 40 % plus longue et entourée de ⟦ ⟧. Le
      développement la propose toujours.
  kind: key

- id: files.dir
  env: REPUTECAST_FILES__DIR
  type: string
  default: ''
  group: files
  description:
    en: >-
      The files folder: digital products' files, lead magnets, uploads in progress and audience exports, with
      `storage.backend` `local` (the default). Empty uses a `files` folder next to `secrets.key_file`
      (`/var/lib/reputecast/files` in the Docker image). When you split roles across machines, every web and worker
      process needs the same folder, or the files go in a bucket with `storage.backend` `s3`.
    vi: >-
      Thư mục tệp: tệp của sản phẩm số, quà tặng đăng ký (lead magnet), tệp đang tải lên và tệp xuất người đăng ký,
      khi `storage.backend` là `local` (mặc định). Để trống thì dùng thư mục `files` cạnh
      `secrets.key_file` (`/var/lib/reputecast/files` trong Docker image). Khi bạn chia vai trò ra nhiều máy, mọi tiến
      trình web và worker cần dùng chung một thư mục, hoặc tệp được lưu trong bucket với `storage.backend` là `s3`.
    de: >-
      Der Dateiordner: Dateien digitaler Produkte, Lead-Magnete, laufende Uploads und Exporte der Zielgruppe, mit
      `storage.backend` `local` (Standard). Leer verwendet einen Ordner `files` neben `secrets.key_file`
      (`/var/lib/reputecast/files` im Docker-Image). Wenn Sie Rollen auf mehrere Rechner verteilen, braucht jeder Web-
      und Worker-Prozess denselben Ordner, oder die Dateien liegen mit `storage.backend` `s3` in einem Bucket.
    es: >-
      La carpeta de archivos: los archivos de los productos digitales, los regalos de suscripción, las subidas en curso
      y las exportaciones de la audiencia, con `storage.backend` `local` (el valor predeterminado). Si está vacía, se
      usa una carpeta `files` junto a `secrets.key_file` (`/var/lib/reputecast/files` en la imagen de Docker). Cuando
      repartes los roles entre varias máquinas, todos los procesos web y worker necesitan la misma carpeta, o los
      archivos van a un bucket con `storage.backend` `s3`.
    fr: >-
      Le dossier des fichiers : fichiers des produits numériques, cadeaux d’inscription, imports en cours et exports de
      l’audience, avec `storage.backend` `local` (la valeur par défaut). Vide, un dossier `files` situé à côté de
      `secrets.key_file` est utilisé (`/var/lib/reputecast/files` dans l’image Docker). Lorsque vous répartissez les
      rôles sur plusieurs machines, chaque processus web et worker a besoin du même dossier, ou les fichiers vont dans
      un bucket avec `storage.backend` `s3`.
  kind: key

- id: storage.backend
  env: REPUTECAST_STORAGE__BACKEND
  type: string
  default: local
  group: storage
  description:
    en: >-
      Where the files kept outside the database live: `local`, the files folder (`files.dir`), or `s3`, the
      S3-compatible bucket the `storage.s3` keys name (AWS S3, MinIO, Cloudflare R2, DigitalOcean Spaces, Backblaze B2,
      Wasabi). A bucket lets several web and worker processes share the files without a shared volume. Downloads still
      go through ReputeCast either way. Available from the next release after 1.6.0.
    vi: >-
      Nơi lưu các tệp được giữ ngoài cơ sở dữ liệu: `local` là thư mục tệp (`files.dir`), còn `s3` là bucket tương thích
      S3 mà các khóa `storage.s3` chỉ định (AWS S3, MinIO, Cloudflare R2, DigitalOcean Spaces, Backblaze B2, Wasabi).
      Bucket cho phép nhiều tiến trình web và worker dùng chung tệp mà không cần ổ đĩa dùng chung. Dù chọn cách nào,
      việc tải xuống vẫn đi qua ReputeCast. Có từ bản phát hành tiếp theo sau 1.6.0.
    de: >-
      Wo die Dateien liegen, die außerhalb der Datenbank aufbewahrt werden: `local`, der Dateiordner (`files.dir`), oder
      `s3`, der S3-kompatible Bucket, den die Schlüssel `storage.s3` benennen (AWS S3, MinIO, Cloudflare R2,
      DigitalOcean Spaces, Backblaze B2, Wasabi). Mit einem Bucket teilen sich mehrere Web- und Worker-Prozesse die
      Dateien ohne gemeinsames Volume. Downloads laufen in beiden Fällen über ReputeCast. Verfügbar ab dem nächsten
      Release nach 1.6.0.
    es: >-
      Dónde se guardan los archivos que se mantienen fuera de la base de datos: `local`, la carpeta de archivos
      (`files.dir`), o `s3`, el bucket compatible con S3 que indican las claves `storage.s3` (AWS S3, MinIO, Cloudflare
      R2, DigitalOcean Spaces, Backblaze B2, Wasabi). Un bucket permite que varios procesos web y worker compartan los
      archivos sin un volumen compartido. En ambos casos, las descargas siguen pasando por ReputeCast. Disponible a
      partir de la próxima versión después de la 1.6.0.
    fr: >-
      Où se trouvent les fichiers conservés hors de la base de données : `local`, le dossier des fichiers (`files.dir`),
      ou `s3`, le bucket compatible S3 que désignent les clés `storage.s3` (AWS S3, MinIO, Cloudflare R2, DigitalOcean
      Spaces, Backblaze B2, Wasabi). Un bucket permet à plusieurs processus web et worker de partager les fichiers sans
      volume partagé. Dans les deux cas, les téléchargements passent toujours par ReputeCast. Disponible à partir de la
      prochaine version après la 1.6.0.
  kind: key

- id: storage.s3.bucket
  env: REPUTECAST_STORAGE__S3__BUCKET
  type: string
  default: ''
  group: storage
  description:
    en: The bucket's name. Required with `storage.backend` `s3`. ReputeCast doesn't create the bucket.
    vi: Tên bucket. Bắt buộc khi `storage.backend` là `s3`. ReputeCast không tạo bucket.
    de: Der Name des Buckets. Erforderlich mit `storage.backend` `s3`. ReputeCast legt den Bucket nicht an.
    es: El nombre del bucket. Obligatorio con `storage.backend` `s3`. ReputeCast no crea el bucket.
    fr: Le nom du bucket. Obligatoire avec `storage.backend` `s3`. ReputeCast ne crée pas le bucket.
  kind: key

- id: storage.s3.region
  env: REPUTECAST_STORAGE__S3__REGION
  type: string
  default: ''
  group: storage
  description:
    en: >-
      The bucket's region. Empty uses the AWS environment's (`AWS_REGION`, the shared config file), else `us-east-1`,
      which S3-compatible services accept.
    vi: >-
      Vùng (region) của bucket. Để trống thì dùng vùng của môi trường AWS (`AWS_REGION`, tệp cấu hình dùng chung), nếu
      không có thì dùng `us-east-1`, giá trị mà các dịch vụ tương thích S3 chấp nhận.
    de: >-
      Die Region des Buckets. Leer verwendet die der AWS-Umgebung (`AWS_REGION`, die gemeinsame Konfigurationsdatei),
      sonst `us-east-1`, das S3-kompatible Dienste akzeptieren.
    es: >-
      La región del bucket. Si está vacía, se usa la del entorno de AWS (`AWS_REGION`, el archivo de configuración
      compartido) y, si no hay, `us-east-1`, que aceptan los servicios compatibles con S3.
    fr: >-
      La région du bucket. Vide, celle de l’environnement AWS est utilisée (`AWS_REGION`, le fichier de configuration
      partagé), sinon `us-east-1`, que les services compatibles S3 acceptent.
  kind: key

- id: storage.s3.endpoint
  env: REPUTECAST_STORAGE__S3__ENDPOINT
  type: string
  default: ''
  group: storage
  description:
    en: >-
      The service's URL for a provider other than AWS, such as `http://minio:9000`,
      `https://<account>.r2.cloudflarestorage.com` or `https://nyc3.digitaloceanspaces.com`. Empty is AWS S3. Must be an
      `http://` or `https://` URL. With an endpoint, ReputeCast sends request checksums only where S3 requires them, as
      several services don't take the AWS SDK's default ones.
    vi: >-
      URL của dịch vụ khi không dùng AWS, ví dụ `http://minio:9000`, `https://<account>.r2.cloudflarestorage.com` hoặc
      `https://nyc3.digitaloceanspaces.com`. Để trống là AWS S3. Phải là URL `http://` hoặc `https://`. Khi có endpoint,
      ReputeCast chỉ gửi checksum của yêu cầu ở những chỗ S3 bắt buộc, vì một số dịch vụ không nhận checksum mặc định
      của AWS SDK.
    de: >-
      Die URL des Dienstes bei einem anderen Anbieter als AWS, etwa `http://minio:9000`,
      `https://<account>.r2.cloudflarestorage.com` oder `https://nyc3.digitaloceanspaces.com`. Leer ist AWS S3. Muss
      eine `http://`- oder `https://`-URL sein. Mit einem Endpunkt sendet ReputeCast Prüfsummen nur dort, wo S3 sie
      verlangt, da mehrere Dienste die Standardprüfsummen des AWS SDK nicht annehmen.
    es: >-
      La URL del servicio para un proveedor que no sea AWS, como `http://minio:9000`,
      `https://<account>.r2.cloudflarestorage.com` o `https://nyc3.digitaloceanspaces.com`. Vacía es AWS S3. Debe ser
      una URL `http://` o `https://`. Con un endpoint, ReputeCast envía sumas de comprobación de las solicitudes solo
      donde S3 las exige, porque varios servicios no aceptan las predeterminadas del SDK de AWS.
    fr: >-
      L’URL du service pour un fournisseur autre qu’AWS, comme `http://minio:9000`,
      `https://<account>.r2.cloudflarestorage.com` ou `https://nyc3.digitaloceanspaces.com`. Vide, c’est AWS S3. Doit
      être une URL `http://` ou `https://`. Avec un point de terminaison, ReputeCast n’envoie de sommes de contrôle que
      là où S3 les exige, car plusieurs services n’acceptent pas celles que le SDK AWS envoie par défaut.
  kind: key

- id: storage.s3.path_style
  env: REPUTECAST_STORAGE__S3__PATH_STYLE
  type: bool
  default: 'false'
  group: storage
  description:
    en: >-
      `true` puts the bucket in the path (`http://minio:9000/<bucket>/<key>`) instead of the host name. MinIO and most
      self-hosted services need it.
    vi: >-
      `true` đặt bucket trong đường dẫn (`http://minio:9000/<bucket>/<key>`) thay vì trong tên máy chủ. MinIO và hầu hết
      dịch vụ tự lưu trữ cần thiết lập này.
    de: >-
      `true` setzt den Bucket in den Pfad (`http://minio:9000/<bucket>/<key>`) statt in den Hostnamen. MinIO und die
      meisten selbst gehosteten Dienste brauchen das.
    es: >-
      `true` pone el bucket en la ruta (`http://minio:9000/<bucket>/<key>`) en lugar de en el nombre del host. MinIO y
      la mayoría de los servicios autoalojados lo necesitan.
    fr: >-
      `true` place le bucket dans le chemin (`http://minio:9000/<bucket>/<key>`) au lieu du nom d’hôte. MinIO et la
      plupart des services auto-hébergés en ont besoin.
  kind: key

- id: storage.s3.prefix
  env: REPUTECAST_STORAGE__S3__PREFIX
  type: string
  default: ''
  group: storage
  description:
    en: Put every key under this prefix, such as `reputecast/`, to share a bucket. It must not start with `/`.
    vi: >-
      Đặt mọi khóa dưới tiền tố này, ví dụ `reputecast/`, để dùng chung một bucket. Tiền tố không được bắt đầu bằng `/`.
    de: >-
      Jeden Schlüssel unter dieses Präfix legen, etwa `reputecast/`, um einen Bucket zu teilen. Es darf nicht mit `/`
      beginnen.
    es: >-
      Poner todas las claves bajo este prefijo, como `reputecast/`, para compartir un bucket. No puede empezar por `/`.
    fr: >-
      Placer chaque clé sous ce préfixe, comme `reputecast/`, pour partager un bucket. Il ne doit pas commencer par `/`.
  kind: key

- id: storage.s3.access_key_id
  env: REPUTECAST_STORAGE__S3__ACCESS_KEY_ID
  type: string
  default: ''
  group: storage
  description:
    en: >-
      The access key's ID. Set it with `storage.s3.secret_access_key`, or neither for the default AWS credential chain:
      environment variables, the shared credentials file, an EC2 or ECS role, IRSA or EKS Pod Identity.
    vi: >-
      ID của khóa truy cập. Đặt cùng `storage.s3.secret_access_key`, hoặc không đặt cả hai để dùng chuỗi thông tin xác
      thực mặc định của AWS: biến môi trường, tệp thông tin xác thực dùng chung, vai trò EC2 hoặc ECS, IRSA hoặc EKS Pod
      Identity.
    de: >-
      Die ID des Zugriffsschlüssels. Setzen Sie sie zusammen mit `storage.s3.secret_access_key` oder keinen von beiden
      für die Standard-Anmeldekette von AWS: Umgebungsvariablen, die gemeinsame Credentials-Datei, eine EC2- oder
      ECS-Rolle, IRSA oder EKS Pod Identity.
    es: >-
      El ID de la clave de acceso. Defínelo junto con `storage.s3.secret_access_key`, o ninguno de los dos para la
      cadena de credenciales predeterminada de AWS: variables de entorno, el archivo de credenciales compartido, un rol
      de EC2 o ECS, IRSA o EKS Pod Identity.
    fr: >-
      L’ID de la clé d’accès. Définissez-le avec `storage.s3.secret_access_key`, ou aucun des deux pour la chaîne
      d’identifiants AWS par défaut : variables d’environnement, fichier d’identifiants partagé, rôle EC2 ou ECS, IRSA
      ou EKS Pod Identity.
  kind: key

- id: storage.s3.secret_access_key
  env: REPUTECAST_STORAGE__S3__SECRET_ACCESS_KEY
  type: string
  default: ''
  group: storage
  description:
    en: The secret access key that goes with `storage.s3.access_key_id`. Instance admin never shows either.
    vi: >-
      Khóa truy cập bí mật đi cùng `storage.s3.access_key_id`. Quản trị hệ thống không bao giờ hiển thị hai giá trị này.
    de: >-
      Der geheime Zugriffsschlüssel zu `storage.s3.access_key_id`. Die Instanzverwaltung zeigt keinen der beiden an.
    es: >-
      La clave de acceso secreta que va con `storage.s3.access_key_id`. Administración de la instancia nunca muestra
      ninguna de las dos.
    fr: >-
      La clé d’accès secrète associée à `storage.s3.access_key_id`. L’Administration de l’instance n’affiche jamais ni
      l’une ni l’autre.
  kind: key

- id: storage.s3.sse
  env: REPUTECAST_STORAGE__S3__SSE
  type: string
  default: ''
  group: storage
  description:
    en: >-
      Server-side encryption of what ReputeCast writes: `AES256` (SSE-S3) or `aws:kms` (SSE-KMS). Empty uses the
      bucket's default.
    vi: >-
      Mã hóa phía máy chủ cho những gì ReputeCast ghi: `AES256` (SSE-S3) hoặc `aws:kms` (SSE-KMS). Để trống thì dùng
      thiết lập mặc định của bucket.
    de: >-
      Serverseitige Verschlüsselung dessen, was ReputeCast schreibt: `AES256` (SSE-S3) oder `aws:kms` (SSE-KMS). Leer
      verwendet die Standardeinstellung des Buckets.
    es: >-
      Cifrado en el servidor de lo que escribe ReputeCast: `AES256` (SSE-S3) o `aws:kms` (SSE-KMS). Si está vacío, se
      usa el predeterminado del bucket.
    fr: >-
      Chiffrement côté serveur de ce qu’écrit ReputeCast : `AES256` (SSE-S3) ou `aws:kms` (SSE-KMS). Vide, le réglage
      par défaut du bucket s’applique.
  kind: key

- id: storage.s3.kms_key_id
  env: REPUTECAST_STORAGE__S3__KMS_KEY_ID
  type: string
  default: ''
  group: storage
  description:
    en: The KMS key for `storage.s3.sse` `aws:kms`. Empty uses the account's default key for S3.
    vi: Khóa KMS cho `storage.s3.sse` là `aws:kms`. Để trống thì dùng khóa mặc định của tài khoản cho S3.
    de: Der KMS-Schlüssel für `storage.s3.sse` `aws:kms`. Leer verwendet den Standardschlüssel des Kontos für S3.
    es: >-
      La clave de KMS para `storage.s3.sse` `aws:kms`. Si está vacía, se usa la clave predeterminada de la cuenta para
      S3.
    fr: >-
      La clé KMS pour `storage.s3.sse` `aws:kms`. Vide, la clé par défaut du compte pour S3 est utilisée.
  kind: key

- id: geoip.database
  env: REPUTECAST_GEOIP__DATABASE
  type: string
  default: ''
  group: geoip
  description:
    en: >-
      Path to a MaxMind DB (`.mmdb`) file you download: GeoLite2 City or Country, or DB-IP Lite City or Country. Empty
      is off. Campaign reports place opens and clicks by country and city with it; only the country code and the English
      city name are kept, and the IP isn't stored for this. ReputeCast reads the file into memory at start (a City
      database takes about its file size) and never downloads it: replace the file and restart to update it. `reputecast
      doctor` shows the file's type and build date. Since 1.6.0. Signup forms' country rules use it too. Available from
      the next release after 1.6.0.
    vi: >-
      Đường dẫn đến tệp MaxMind DB (`.mmdb`) mà bạn tải về: GeoLite2 City hoặc Country, hoặc DB-IP Lite City hoặc
      Country. Để trống là tắt. Báo cáo chiến dịch dùng tệp này để xác định quốc gia và thành phố của lượt mở và lượt
      nhấp; chỉ mã quốc gia và tên thành phố bằng tiếng Anh được lưu lại, và IP không được lưu cho việc này. ReputeCast
      đọc tệp vào bộ nhớ khi khởi động (cơ sở dữ liệu City chiếm khoảng bằng kích thước tệp) và không bao giờ tự tải
      tệp: hãy thay tệp và khởi động lại để cập nhật. `reputecast doctor` hiển thị loại tệp và ngày tạo tệp. Từ bản
      1.6.0. Quy tắc quốc gia của biểu mẫu đăng ký cũng dùng tệp này. Có từ bản phát hành tiếp theo sau 1.6.0.
    de: >-
      Pfad zu einer MaxMind-DB-Datei (`.mmdb`), die Sie herunterladen: GeoLite2 City oder Country oder DB-IP Lite City
      oder Country. Leer ist aus. Kampagnenberichte ordnen damit Öffnungen und Klicks nach Land und Stadt zu;
      gespeichert werden nur der Ländercode und der englische Städtename, die IP wird dafür nicht gespeichert.
      ReputeCast liest die Datei beim Start in den Arbeitsspeicher (eine City-Datenbank belegt etwa ihre Dateigröße) und
      lädt sie nie selbst herunter: Ersetzen Sie die Datei und starten Sie neu, um sie zu aktualisieren. `reputecast
      doctor` zeigt den Typ und das Build-Datum der Datei. Seit 1.6.0. Auch die Länderregeln von Anmeldeformularen
      verwenden sie. Verfügbar ab der nächsten Version nach 1.6.0.
    es: >-
      Ruta a un archivo MaxMind DB (`.mmdb`) que descargas tú: GeoLite2 City o Country, o DB-IP Lite City o Country.
      Vacía es desactivado. Los informes de las campañas sitúan con él las aperturas y los clics por país y ciudad; solo
      se guardan el código del país y el nombre de la ciudad en inglés, y la IP no se almacena para esto. ReputeCast lee
      el archivo en memoria al arrancar (una base de datos City ocupa más o menos lo que pesa el archivo) y nunca lo
      descarga: reemplaza el archivo y reinicia para actualizarlo. `reputecast doctor` muestra el tipo del archivo y su
      fecha de compilación. Desde la 1.6.0. Las reglas de país de los formularios de suscripción también lo usan.
      Disponible a partir de la próxima versión después de la 1.6.0.
    fr: >-
      Chemin d’un fichier MaxMind DB (`.mmdb`) que vous téléchargez : GeoLite2 City ou Country, ou DB-IP Lite City ou
      Country. Vide, la fonction est désactivée. Les rapports de campagne s’en servent pour situer les ouvertures et les
      clics par pays et par ville ; seuls le code du pays et le nom anglais de la ville sont conservés, et l’IP n’est
      pas stockée pour cela. ReputeCast lit le fichier en mémoire au démarrage (une base City occupe à peu près la
      taille de son fichier) et ne le télécharge jamais : remplacez le fichier et redémarrez pour le mettre à jour.
      `reputecast doctor` affiche le type du fichier et sa date de construction. Depuis la version 1.6.0. Les règles de
      pays des formulaires d’inscription l’utilisent aussi. Disponible à partir de la prochaine version après la 1.6.0.
  kind: key

- id: REPUTECAST_CONFIG
  env: REPUTECAST_CONFIG
  type: string
  default: ''
  group: environment
  description:
    en: Path to a YAML config file, read when the `--config` flag is not passed.
    vi: Đường dẫn đến tệp cấu hình YAML, được đọc khi không truyền cờ `--config`.
    de: Pfad zu einer YAML-Konfigurationsdatei, gelesen, wenn das Flag `--config` nicht übergeben wird.
    es: Ruta a un archivo de configuración YAML, que se lee cuando no se pasa la opción `--config`.
    fr: Chemin d’un fichier de configuration YAML, lu lorsque l’option `--config` n’est pas passée.
  kind: env-only

- id: DATABASE_URL
  env: DATABASE_URL
  type: string
  default: ''
  group: environment
  description:
    en: >-
      PostgreSQL connection URL, used when `REPUTECAST_DATABASE__URL` is unset. It overrides `database.url` from the
      config file.
    vi: >-
      URL kết nối PostgreSQL, được dùng khi chưa đặt `REPUTECAST_DATABASE__URL`. Biến này ghi đè `database.url` trong
      tệp cấu hình.
    de: >-
      Verbindungs-URL für PostgreSQL, verwendet, wenn `REPUTECAST_DATABASE__URL` nicht gesetzt ist. Hat Vorrang vor
      `database.url` aus der Konfigurationsdatei.
    es: >-
      URL de conexión a PostgreSQL, que se usa cuando `REPUTECAST_DATABASE__URL` no está definida. Prevalece sobre
      `database.url` del archivo de configuración.
    fr: >-
      URL de connexion PostgreSQL, utilisée lorsque `REPUTECAST_DATABASE__URL` n’est pas défini. Elle remplace la valeur
      `database.url` du fichier de configuration.
  kind: env-only

- id: REPUTECAST_AUTO_MIGRATE
  env: REPUTECAST_AUTO_MIGRATE
  type: bool
  default: 'false'
  group: environment
  description:
    en: >-
      Default of `reputecast serve --auto-migrate`: `true` applies pending migrations at start. The Docker image's start
      command passes the flag, and the shipped `docker-compose.yml` sets the variable to `true`.
    vi: >-
      Giá trị mặc định của `reputecast serve --auto-migrate`: `true` áp dụng các migration đang chờ khi khởi động. Lệnh
      khởi động của Docker image truyền cờ này, và tệp `docker-compose.yml` đi kèm đặt biến này thành `true`.
    de: >-
      Standardwert von `reputecast serve --auto-migrate`: `true` wendet ausstehende Migrationen beim Start an. Der
      Startbefehl des Docker-Images übergibt das Flag, und die mitgelieferte `docker-compose.yml` setzt die Variable auf
      `true`.
    es: >-
      Valor predeterminado de `reputecast serve --auto-migrate`: `true` aplica las migraciones pendientes al arrancar.
      El comando de inicio de la imagen de Docker pasa la opción, y el `docker-compose.yml` incluido define la variable
      como `true`.
    fr: >-
      Valeur par défaut de `reputecast serve --auto-migrate` : `true` applique les migrations en attente au démarrage.
      La commande de démarrage de l’image Docker passe l’option, et le fichier `docker-compose.yml` fourni définit la
      variable sur `true`.
  kind: env-only

- id: REPUTECAST_AUTO_INSTALL
  env: REPUTECAST_AUTO_INSTALL
  type: bool
  default: 'false'
  group: environment
  description:
    en: >-
      Default of `reputecast serve --auto-install`: `true` creates the first Owner at start when the database has no
      users. The Docker image's start command passes the flag, and the shipped `docker-compose.yml` sets the variable
      to `true`.
    vi: >-
      Giá trị mặc định của `reputecast serve --auto-install`: `true` tạo Chủ sở hữu đầu tiên khi khởi động nếu cơ sở dữ
      liệu chưa có người dùng. Lệnh khởi động của Docker image truyền cờ này, và tệp `docker-compose.yml` đi kèm đặt
      biến này thành `true`.
    de: >-
      Standardwert von `reputecast serve --auto-install`: `true` legt beim Start den ersten Inhaber an, wenn die
      Datenbank keine Benutzer hat. Der Startbefehl des Docker-Images übergibt das Flag, und die mitgelieferte
      `docker-compose.yml` setzt die Variable auf `true`.
    es: >-
      Valor predeterminado de `reputecast serve --auto-install`: `true` crea el primer Propietario al arrancar cuando la
      base de datos no tiene usuarios. El comando de inicio de la imagen de Docker pasa la opción, y el
      `docker-compose.yml` incluido define la variable como `true`.
    fr: >-
      Valeur par défaut de `reputecast serve --auto-install` : `true` crée le premier Propriétaire au démarrage lorsque
      la base de données n’a aucun utilisateur. La commande de démarrage de l’image Docker passe l’option, et le fichier
      `docker-compose.yml` fourni définit la variable sur `true`.
  kind: env-only

- id: REPUTECAST_ADMIN_EMAIL
  env: REPUTECAST_ADMIN_EMAIL
  type: string
  default: ''
  group: environment
  description:
    en: >-
      Email of the first Owner, read by `reputecast install` when `--email` is not passed and by `serve
      --auto-install`. The shipped `docker-compose.yml` passes `admin@example.com` when you don't set it.
    vi: >-
      Email của Chủ sở hữu đầu tiên, được `reputecast install` đọc khi không truyền `--email`, và được `serve
      --auto-install` đọc. Tệp `docker-compose.yml` đi kèm truyền `admin@example.com` khi bạn không đặt biến này.
    de: >-
      E-Mail-Adresse des ersten Inhabers, gelesen von `reputecast install`, wenn `--email` nicht übergeben wird, und von
      `serve --auto-install`. Die mitgelieferte `docker-compose.yml` übergibt `admin@example.com`, wenn Sie sie nicht
      setzen.
    es: >-
      Correo del primer Propietario, que leen `reputecast install` cuando no se pasa `--email` y `serve --auto-install`.
      El `docker-compose.yml` incluido pasa `admin@example.com` si no la defines.
    fr: >-
      Adresse e-mail du premier Propriétaire, lue par `reputecast install` lorsque `--email` n’est pas passé et par
      `serve --auto-install`. Le fichier `docker-compose.yml` fourni passe `admin@example.com` si vous ne la définissez
      pas.
  kind: env-only

- id: REPUTECAST_ADMIN_NAME
  env: REPUTECAST_ADMIN_NAME
  type: string
  default: ''
  group: environment
  description:
    en: Name of the first Owner, read by `reputecast install` when `--name` is not passed and by `serve --auto-install`.
    vi: >-
      Tên của Chủ sở hữu đầu tiên, được `reputecast install` đọc khi không truyền `--name`, và được `serve
      --auto-install` đọc.
    de: >-
      Name des ersten Inhabers, gelesen von `reputecast install`, wenn `--name` nicht übergeben wird, und von `serve
      --auto-install`.
    es: >-
      Nombre del primer Propietario, que leen `reputecast install` cuando no se pasa `--name` y `serve --auto-install`.
    fr: >-
      Nom du premier Propriétaire, lu par `reputecast install` lorsque `--name` n’est pas passé et par `serve
      --auto-install`.
  kind: env-only

- id: REPUTECAST_ADMIN_PASSWORD
  env: REPUTECAST_ADMIN_PASSWORD
  type: string
  default: ''
  group: environment
  description:
    en: >-
      Password of the first Owner, read by `reputecast install` when `--password` is not passed and by `serve
      --auto-install`. When it is unset, a temporary password is printed instead.
    vi: >-
      Mật khẩu của Chủ sở hữu đầu tiên, được `reputecast install` đọc khi không truyền `--password`, và được `serve
      --auto-install` đọc. Khi chưa đặt biến này, một mật khẩu tạm thời sẽ được in ra thay thế.
    de: >-
      Passwort des ersten Inhabers, gelesen von `reputecast install`, wenn `--password` nicht übergeben wird, und von
      `serve --auto-install`. Ist sie nicht gesetzt, wird stattdessen ein temporäres Passwort ausgegeben.
    es: >-
      Contraseña del primer Propietario, que leen `reputecast install` cuando no se pasa `--password` y `serve
      --auto-install`. Si no está definida, se escribe una contraseña temporal en su lugar.
    fr: >-
      Mot de passe du premier Propriétaire, lu par `reputecast install` lorsque `--password` n’est pas passé et par
      `serve --auto-install`. S’il n’est pas défini, un mot de passe temporaire est affiché à la place.
  kind: env-only

- id: REPUTECAST_IMAGE
  env: REPUTECAST_IMAGE
  type: string
  default: ghcr.io/hostrepute/reputecast
  group: environment
  description:
    en: >-
      Read by the shipped `docker-compose.yml`, not by ReputeCast: the image the `app` service runs. Set it to
      `reputecast` with `REPUTECAST_VERSION=local` to run an image built from a checkout with `make docker
      VERSION=local`.
    vi: >-
      Do tệp `docker-compose.yml` đi kèm đọc, không phải ReputeCast: image mà service `app` chạy. Đặt thành `reputecast`
      cùng `REPUTECAST_VERSION=local` để chạy image bạn tự build từ mã nguồn bằng `make docker VERSION=local`.
    de: >-
      Wird von der mitgelieferten `docker-compose.yml` gelesen, nicht von ReputeCast: das Image, das der Dienst `app`
      ausführt. Setzen Sie sie auf `reputecast` mit `REPUTECAST_VERSION=local`, um ein Image auszuführen, das aus einem
      Checkout mit `make docker VERSION=local` gebaut wurde.
    es: >-
      La lee el `docker-compose.yml` incluido, no ReputeCast: la imagen que ejecuta el servicio `app`. Defínela como
      `reputecast` con `REPUTECAST_VERSION=local` para ejecutar una imagen creada desde un checkout con `make docker
      VERSION=local`.
    fr: >-
      Lue par le fichier `docker-compose.yml` fourni, pas par ReputeCast : l’image qu’exécute le service `app`.
      Définissez-la sur `reputecast` avec `REPUTECAST_VERSION=local` pour exécuter une image construite depuis un
      checkout avec `make docker VERSION=local`.
  kind: env-only

- id: REPUTECAST_VERSION
  env: REPUTECAST_VERSION
  type: string
  default: latest
  group: environment
  description:
    en: 'Read by the shipped `docker-compose.yml`, not by ReputeCast: the image tag the `app` service runs.'
    vi: 'Do tệp `docker-compose.yml` đi kèm đọc, không phải ReputeCast: tag của image mà service `app` chạy.'
    de: >-
      Wird von der mitgelieferten `docker-compose.yml` gelesen, nicht von ReputeCast: das Image-Tag, das der Dienst
      `app` ausführt.
    es: >-
      La lee el `docker-compose.yml` incluido, no ReputeCast: la etiqueta de la imagen que ejecuta el servicio `app`.
    fr: >-
      Lue par le fichier `docker-compose.yml` fourni, pas par ReputeCast : le tag de l’image qu’exécute le service
      `app`.
  kind: env-only

- id: REPUTECAST_PORT
  env: REPUTECAST_PORT
  type: int
  default: '8080'
  group: environment
  description:
    en: >-
      Read by the shipped `docker-compose.yml`, not by ReputeCast: the host port published to the `app` container's
      port 8080.
    vi: >-
      Do tệp `docker-compose.yml` đi kèm đọc, không phải ReputeCast: cổng trên máy chủ được ánh xạ đến cổng 8080 của
      container `app`.
    de: >-
      Wird von der mitgelieferten `docker-compose.yml` gelesen, nicht von ReputeCast: der Host-Port, der auf Port 8080
      des Containers `app` veröffentlicht wird.
    es: >-
      La lee el `docker-compose.yml` incluido, no ReputeCast: el puerto del host que se publica hacia el puerto 8080 del
      contenedor `app`.
    fr: >-
      Lue par le fichier `docker-compose.yml` fourni, pas par ReputeCast : le port de l’hôte publié vers le port 8080 du
      conteneur `app`.
  kind: env-only

- id: POSTGRES_PASSWORD
  env: POSTGRES_PASSWORD
  type: string
  default: reputecast
  group: environment
  description:
    en: >-
      Read by the shipped `docker-compose.yml`: the password of the `postgres` service's `reputecast` user, also used in
      the app's database URL. Set your own before the first start.
    vi: >-
      Do tệp `docker-compose.yml` đi kèm đọc: mật khẩu của người dùng `reputecast` trong service `postgres`, cũng được
      dùng trong URL cơ sở dữ liệu của ứng dụng. Hãy đặt mật khẩu của riêng bạn trước lần khởi động đầu tiên.
    de: >-
      Wird von der mitgelieferten `docker-compose.yml` gelesen: das Passwort des Benutzers `reputecast` im Dienst
      `postgres`, das auch in der Datenbank-URL der App verwendet wird. Setzen Sie vor dem ersten Start ein eigenes.
    es: >-
      La lee el `docker-compose.yml` incluido: la contraseña del usuario `reputecast` del servicio `postgres`, que
      también se usa en la URL de la base de datos de la aplicación. Define la tuya antes del primer arranque.
    fr: >-
      Lue par le fichier `docker-compose.yml` fourni : le mot de passe de l’utilisateur `reputecast` du service
      `postgres`, également utilisé dans l’URL de base de données de l’application. Définissez le vôtre avant le premier
      démarrage.
  kind: env-only

- id: REPUTECAST_ADAPTER_SECRET
  env: REPUTECAST_ADAPTER_SECRET
  type: list
  default: ''
  group: environment
  description:
    en: >-
      Read by community adapter processes built with the adapter SDK: the signing secret that `reputecast adapter
      install` or `reputecast adapter secret` printed. During a rotation, set several secrets separated by commas.
    vi: >-
      Do các tiến trình adapter cộng đồng xây dựng bằng adapter SDK đọc: khóa bí mật ký mà `reputecast adapter install`
      hoặc `reputecast adapter secret` đã in ra. Trong lúc xoay vòng, hãy đặt nhiều khóa bí mật, phân tách bằng dấu
      phẩy.
    de: >-
      Wird von Prozessen von Community-Adaptern gelesen, die mit dem Adapter-SDK gebaut sind: der Signaturschlüssel, den
      `reputecast adapter install` oder `reputecast adapter secret` ausgegeben hat. Setzen Sie während einer Rotation
      mehrere Schlüssel, getrennt durch Kommas.
    es: >-
      La leen los procesos de adaptadores de la comunidad creados con el SDK de adaptadores: el secreto de firma que
      escribió `reputecast adapter install` o `reputecast adapter secret`. Durante una rotación, define varios secretos
      separados por comas.
    fr: >-
      Lue par les processus d’adaptateurs communautaires construits avec le SDK d’adaptateur : le secret de signature
      qu’a affiché `reputecast adapter install` ou `reputecast adapter secret`. Pendant une rotation, définissez
      plusieurs secrets séparés par des virgules.
  kind: env-only

- id: REPUTECAST_ADAPTER_ALLOW_HOSTS
  env: REPUTECAST_ADAPTER_ALLOW_HOSTS
  type: list
  default: ''
  group: environment
  description:
    en: >-
      Read by community adapter processes built with the adapter SDK: extra hosts the adapter may call on top of those
      in its manifest, separated by commas, for example a local fake provider in tests.
    vi: >-
      Do các tiến trình adapter cộng đồng xây dựng bằng adapter SDK đọc: các host bổ sung mà adapter được phép gọi,
      ngoài các host trong manifest của nó, phân tách bằng dấu phẩy, ví dụ một nhà cung cấp giả lập chạy cục bộ khi kiểm
      thử.
    de: >-
      Wird von Prozessen von Community-Adaptern gelesen, die mit dem Adapter-SDK gebaut sind: zusätzliche Hosts, die der
      Adapter über die in seinem Manifest hinaus aufrufen darf, getrennt durch Kommas, zum Beispiel ein lokaler
      Fake-Anbieter in Tests.
    es: >-
      La leen los procesos de adaptadores de la comunidad creados con el SDK de adaptadores: hosts adicionales a los que
      puede llamar el adaptador, además de los de su manifest, separados por comas, por ejemplo un proveedor falso local
      en las pruebas.
    fr: >-
      Lue par les processus d’adaptateurs communautaires construits avec le SDK d’adaptateur : hôtes supplémentaires que
      l’adaptateur peut appeler en plus de ceux de son manifest, séparés par des virgules, par exemple un faux
      fournisseur local dans les tests.
  kind: env-only

- id: REPUTECAST_ADAPTER_LOG_LEVEL
  env: REPUTECAST_ADAPTER_LOG_LEVEL
  type: string
  default: info
  group: environment
  description:
    en: >-
      Read by community adapter processes built with the adapter SDK: the lowest level logged, `debug`, `info`, `warn`
      or `error`.
    vi: >-
      Do các tiến trình adapter cộng đồng xây dựng bằng adapter SDK đọc: mức log thấp nhất được ghi, `debug`, `info`,
      `warn` hoặc `error`.
    de: >-
      Wird von Prozessen von Community-Adaptern gelesen, die mit dem Adapter-SDK gebaut sind: die niedrigste
      protokollierte Stufe, `debug`, `info`, `warn` oder `error`.
    es: >-
      La leen los procesos de adaptadores de la comunidad creados con el SDK de adaptadores: el nivel mínimo que se
      registra, `debug`, `info`, `warn` o `error`.
    fr: >-
      Lue par les processus d’adaptateurs communautaires construits avec le SDK d’adaptateur : le niveau le plus bas
      journalisé, `debug`, `info`, `warn` ou `error`.
  kind: env-only

- id: PORT
  env: PORT
  type: int
  default: '4600'
  group: environment
  description:
    en: >-
      Read by community adapter processes built with the adapter SDK: the port the adapter listens on (the default
      applies to them). ReputeCast itself listens on `:<PORT>` when `REPUTECAST_HTTP__ADDR` isn't set: hosting platforms
      such as Render, Railway, Heroku and Cloud Run set it. The Docker image sets `REPUTECAST_HTTP__ADDR=:8080`, so a
      container listens on 8080 whatever `PORT` says; the one-click templates set `PORT=8080`, which tells the platform
      where to route. A `PORT` that isn't a port number (1–65535) stops the start. Available from the next release after
      1.6.0.
    vi: >-
      Do các tiến trình adapter cộng đồng xây dựng bằng adapter SDK đọc: cổng mà adapter lắng nghe (giá trị mặc định áp
      dụng cho chúng). Bản thân ReputeCast lắng nghe trên `:<PORT>` khi chưa đặt `REPUTECAST_HTTP__ADDR`: các nền tảng
      hosting như Render, Railway, Heroku và Cloud Run đặt biến này. Docker image đặt `REPUTECAST_HTTP__ADDR=:8080`, nên
      container lắng nghe trên 8080 bất kể `PORT` là gì; các mẫu cài đặt một lần nhấp đặt `PORT=8080` để báo cho nền
      tảng biết cần chuyển lưu lượng đến đâu. `PORT` không phải số cổng (1–65535) sẽ khiến tiến trình không khởi động.
      Có từ bản phát hành tiếp theo sau 1.6.0.
    de: >-
      Wird von Prozessen von Community-Adaptern gelesen, die mit dem Adapter-SDK gebaut sind: der Port, auf dem der
      Adapter lauscht (der Standardwert gilt für sie). ReputeCast selbst lauscht auf `:<PORT>`, wenn
      `REPUTECAST_HTTP__ADDR` nicht gesetzt ist: Hosting-Plattformen wie Render, Railway, Heroku und Cloud Run setzen
      sie. Das Docker-Image setzt `REPUTECAST_HTTP__ADDR=:8080`, daher lauscht ein Container auf 8080, egal was `PORT`
      sagt; die One-Click-Vorlagen setzen `PORT=8080`, was der Plattform sagt, wohin sie weiterleiten soll. Ein `PORT`,
      der keine Portnummer (1–65535) ist, verhindert den Start. Verfügbar ab der nächsten Version nach 1.6.0.
    es: >-
      La leen los procesos de adaptadores de la comunidad creados con el SDK de adaptadores: el puerto en el que escucha
      el adaptador (el valor predeterminado es el suyo). ReputeCast escucha en `:<PORT>` cuando `REPUTECAST_HTTP__ADDR`
      no está definida: la definen plataformas de hosting como Render, Railway, Heroku y Cloud Run. La imagen de Docker
      define `REPUTECAST_HTTP__ADDR=:8080`, así que un contenedor escucha en 8080 diga lo que diga `PORT`; las
      plantillas de instalación con un clic definen `PORT=8080`, que indica a la plataforma adónde enviar el tráfico. Un
      `PORT` que no es un número de puerto (1–65535) impide el arranque. Disponible a partir de la próxima versión
      después de la 1.6.0.
    fr: >-
      Lue par les processus d’adaptateurs communautaires construits avec le SDK d’adaptateur : le port sur lequel écoute
      l’adaptateur (la valeur par défaut est la leur). ReputeCast lui-même écoute sur `:<PORT>` lorsque
      `REPUTECAST_HTTP__ADDR` n’est pas défini : des plateformes d’hébergement comme Render, Railway, Heroku et Cloud
      Run la définissent. L’image Docker définit `REPUTECAST_HTTP__ADDR=:8080`, donc un conteneur écoute sur 8080 quelle
      que soit la valeur de `PORT` ; les modèles d’installation en un clic définissent `PORT=8080`, ce qui indique à la
      plateforme où acheminer le trafic. Un `PORT` qui n’est pas un numéro de port (1–65535) empêche le démarrage.
      Disponible à partir de la prochaine version après la 1.6.0.
  kind: env-only

- id: HOST
  env: HOST
  type: string
  default: 127.0.0.1
  group: environment
  description:
    en: >-
      Read by community adapter processes built with the adapter SDK: the address the adapter listens on. The adapter
      template's Docker image sets `0.0.0.0`.
    vi: >-
      Do các tiến trình adapter cộng đồng xây dựng bằng adapter SDK đọc: địa chỉ mà adapter lắng nghe. Docker image của
      adapter template đặt `0.0.0.0`.
    de: >-
      Wird von Prozessen von Community-Adaptern gelesen, die mit dem Adapter-SDK gebaut sind: die Adresse, auf der der
      Adapter lauscht. Das Docker-Image der Adapter-Vorlage setzt `0.0.0.0`.
    es: >-
      La leen los procesos de adaptadores de la comunidad creados con el SDK de adaptadores: la dirección en la que
      escucha el adaptador. La imagen de Docker de la plantilla de adaptador define `0.0.0.0`.
    fr: >-
      Lue par les processus d’adaptateurs communautaires construits avec le SDK d’adaptateur : l’adresse sur laquelle
      écoute l’adaptateur. L’image Docker du modèle d’adaptateur définit `0.0.0.0`.
  kind: env-only
