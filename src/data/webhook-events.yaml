# Outgoing webhook events: internal/webhooks/webhooks.go Events plus the init() appends in internal/{earn,products,
# push,texting,website,whatsapp}. sample = the data object of the integration trigger samples
# (internal/integrations/hooks.go SampleData), keys sorted as the API returns them. Descriptions come from
# internal/webhooks/messages/{en,vi}.json (event.<name>) and the owning packages' messages (webhook.<name>); groups are
# docs labels (the API field stays English). Guarded by pnpm upstream:check.
- id: contact.subscribed
  group:
    en: Contacts
    vi: Liên hệ
    de: Kontakte
    es: Contactos
    fr: Contacts
  description:
    en: A contact joined a list (after double opt-in when it's on).
    vi: Một liên hệ đã tham gia danh sách (sau bước xác nhận hai bước nếu đang bật).
    de: Ein Kontakt ist einer Liste beigetreten (nach dem Double-Opt-in, falls aktiviert).
    es: Un contacto se unió a una lista (tras la doble confirmación, si está activada).
    fr: Un contact a rejoint une liste (après le double opt-in s’il est activé).
  sample: |-
    {
      "company": "",
      "contact_id": "0192a4c1-7d4e-7c1e-9a40-3f1b2c8d5e01",
      "country": "MX",
      "email": "lucia.fernandez@example.com",
