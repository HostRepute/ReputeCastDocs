# UI labels shown in the docs through <UiPath> and the page meta row "In the app".
# en = the English text the app shows: a string literal in `source` (upstream repo-relative message file), or
# one select/plural option of an ICU message there, with inline tags removed; vi = the same message's text in
# the sibling *.vi.ts or messages/vi.json (omitted only where upstream has none: pages fall back to English).
# ids: nav.*, settings.*, admin.* for navigation; otherwise the upstream message id (<namespace>.<key>) or
# <feature folder>.<name> for labels named before upstream moved them into message files.
# Checked by `pnpm upstream:check`.

