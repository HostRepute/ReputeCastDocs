# Code samples for POST /api/v1/workspaces/{workspace}/commerce/stock-requests (create-stock-request).
# Authored samples replace the plugin's generated snippets on this page, so every language is listed here.
- lang: sh
  label: cURL
  source: |
    # REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:create.
    # Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    # productId: ReputeCast's product ID or the store's own; add storeId when two stores share one.
    curl --request POST \
      --url https://reputecast.example.com/api/v1/workspaces/your-workspace/commerce/stock-requests \
      --header "Authorization: Bearer $REPUTECAST_API_KEY" \
      --header 'Content-Type: application/json' \
      --data '{ "email": "sam.rivera@outlook.com", "productId": "0192f1c4-6b7a-7d2e-9f10-2b3c4d5e6f70" }'
- lang: js
  label: JavaScript (fetch)
  source: |
    // REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:create.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    // productId: ReputeCast's product ID or the store's own; add storeId when two stores share one.
    const response = await fetch(
      'https://reputecast.example.com/api/v1/workspaces/your-workspace/commerce/stock-requests',
      {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${process.env.REPUTECAST_API_KEY}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email: 'sam.rivera@outlook.com', productId: '0192f1c4-6b7a-7d2e-9f10-2b3c4d5e6f70' }),
      },
    )
    const result = await response.json()
    // 404: no contact with that address, or no such product in a connected store.
    if (!response.ok) throw new Error(`${response.status} ${result.code}: ${result.detail}`)
    console.log(result.title, result.available) // available: in stock now, so the flow starts on its next return
- lang: go
  label: Go (net/http)
  source: |
    // REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:create.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    // productId: ReputeCast's product ID or the store's own; add storeId when two stores share one.
    package main

    import (
    	"bytes"
    	"encoding/json"
    	"fmt"
    	"log"
    	"net/http"
    	"os"
    )

    func main() {
    	body, err := json.Marshal(map[string]string{"email": "sam.rivera@outlook.com", "productId": "0192f1c4-6b7a-7d2e-9f10-2b3c4d5e6f70"})
    	if err != nil {
    		log.Fatal(err)
    	}
    	req, err := http.NewRequest(http.MethodPost,
    		"https://reputecast.example.com/api/v1/workspaces/your-workspace/commerce/stock-requests", bytes.NewReader(body))
    	if err != nil {
    		log.Fatal(err)
    	}
    	req.Header.Set("Authorization", "Bearer "+os.Getenv("REPUTECAST_API_KEY"))
    	req.Header.Set("Content-Type", "application/json")

    	resp, err := http.DefaultClient.Do(req)
    	if err != nil {
    		log.Fatal(err)
    	}
    	defer resp.Body.Close()

    	var result struct {
    		Title     string `json:"title"`
    		Available bool   `json:"available"`
    		Code      string `json:"code"`
    		Detail    string `json:"detail"`
    	}
    	if err := json.NewDecoder(resp.Body).Decode(&result); err != nil {
    		log.Fatal(err)
    	}
    	// 404: no contact with that address, or no such product in a connected store.
    	if resp.StatusCode >= 300 {
    		log.Fatalf("%d %s: %s", resp.StatusCode, result.Code, result.Detail)
    	}
    	fmt.Println(result.Title, result.Available)
    }
- lang: python
  label: Python (requests)
  source: |
    # REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:create.
    # Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    # productId: ReputeCast's product ID or the store's own; add storeId when two stores share one.
    import os

    import requests

    response = requests.post(
        "https://reputecast.example.com/api/v1/workspaces/your-workspace/commerce/stock-requests",
        headers={"Authorization": f"Bearer {os.environ['REPUTECAST_API_KEY']}"},
        json={"email": "sam.rivera@outlook.com", "productId": "0192f1c4-6b7a-7d2e-9f10-2b3c4d5e6f70"},
        timeout=10,
    )
    result = response.json()
    # 404: no contact with that address, or no such product in a connected store.
    if not response.ok:
        raise RuntimeError(f"{response.status_code} {result.get('code')}: {result.get('detail')}")
    print(result["title"], result["available"])
- lang: php
  label: PHP (curl)
  source: |
    <?php
    // REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:create.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    // productId: ReputeCast's product ID or the store's own; add storeId when two stores share one.
    $payload = ['email' => 'sam.rivera@outlook.com', 'productId' => '0192f1c4-6b7a-7d2e-9f10-2b3c4d5e6f70'];

    $ch = curl_init('https://reputecast.example.com/api/v1/workspaces/your-workspace/commerce/stock-requests');
    curl_setopt_array($ch, [
        CURLOPT_POST => true,
        CURLOPT_RETURNTRANSFER => true,
        CURLOPT_HTTPHEADER => [
            'Authorization: Bearer ' . getenv('REPUTECAST_API_KEY'),
            'Content-Type: application/json',
        ],
        CURLOPT_POSTFIELDS => json_encode($payload, JSON_THROW_ON_ERROR),
    ]);
    $body = curl_exec($ch);
    if ($body === false) {
        throw new RuntimeException(curl_error($ch));
    }
    $status = curl_getinfo($ch, CURLINFO_RESPONSE_CODE);
    $result = json_decode($body, true, flags: JSON_THROW_ON_ERROR);
    // 404: no contact with that address, or no such product in a connected store.
    if ($status >= 300) {
        throw new RuntimeException("{$status} {$result['code']}: {$result['detail']}");
    }
    echo $result['title'], PHP_EOL;
