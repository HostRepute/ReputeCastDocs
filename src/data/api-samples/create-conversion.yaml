# Code samples for POST /api/v1/workspaces/{workspace}/conversions (create-conversion).
# Authored samples replace the plugin's generated snippets on this page, so every language is listed here.
- lang: sh
  label: cURL
  source: |
    # REPUTECAST_API_KEY: an API key (rc_live_…) with conversions:create.
    # Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    # Add "click_token" with the rc_click value of the link the reader followed, when you have it.
    curl --request POST \
      --url https://reputecast.example.com/api/v1/workspaces/your-workspace/conversions \
      --header "Authorization: Bearer $REPUTECAST_API_KEY" \
      --header 'Content-Type: application/json' \
      --header 'Idempotency-Key: order-1042' \
      --data '{
        "name": "Upgraded to Team plan",
        "value": "29.00",
        "currency": "USD",
        "email": "sam.rivera@outlook.com",
        "metadata": { "order_id": "1042" }
      }'
- lang: js
  label: JavaScript (fetch)
  source: |
    // REPUTECAST_API_KEY: an API key (rc_live_…) with conversions:create.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    const response = await fetch('https://reputecast.example.com/api/v1/workspaces/your-workspace/conversions', {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${process.env.REPUTECAST_API_KEY}`,
        'Content-Type': 'application/json',
        // Sending the same key again answers with the first conversion instead of recording a second.
        'Idempotency-Key': 'order-1042',
      },
      body: JSON.stringify({
        name: 'Upgraded to Team plan',
        value: '29.00', // a decimal string, not a number
        currency: 'USD',
        email: 'sam.rivera@outlook.com', // the email, the click token, or both
        // click_token: the rc_click value of the link the reader followed, when you have it
        metadata: { order_id: '1042' },
      }),
    })
    const result = await response.json()
    if (!response.ok) throw new Error(`${response.status} ${result.code}: ${result.detail}`)
    // matched: click_token, email or none; credited: the campaign or automation email it counts for.
    console.log(result.id, result.matched, result.credited?.name)
- lang: go
  label: Go (net/http)
  source: |
    // REPUTECAST_API_KEY: an API key (rc_live_…) with conversions:create.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    package main

    import (
    	"bytes"
    	"encoding/json"
    	"fmt"
    	"log"
    	"net/http"
    	"os"
    )

    func main() {
    	body, err := json.Marshal(map[string]any{
    		"name":     "Upgraded to Team plan",
    		"value":    "29.00", // a decimal string, not a number
    		"currency": "USD",
    		"email":    "sam.rivera@outlook.com", // the email, the click token, or both
    		"metadata": map[string]string{"order_id": "1042"},
    		// "click_token": the rc_click value of the link the reader followed, when you have it
    	})
    	if err != nil {
    		log.Fatal(err)
    	}
    	req, err := http.NewRequest(http.MethodPost,
    		"https://reputecast.example.com/api/v1/workspaces/your-workspace/conversions", bytes.NewReader(body))
    	if err != nil {
    		log.Fatal(err)
    	}
    	req.Header.Set("Authorization", "Bearer "+os.Getenv("REPUTECAST_API_KEY"))
    	req.Header.Set("Content-Type", "application/json")
    	// Sending the same key again answers with the first conversion instead of recording a second.
    	req.Header.Set("Idempotency-Key", "order-1042")

    	resp, err := http.DefaultClient.Do(req)
    	if err != nil {
    		log.Fatal(err)
    	}
    	defer resp.Body.Close()

    	var result struct {
    		ID       string `json:"id"`
    		Matched  string `json:"matched"` // click_token, email or none
    		Credited *struct {
    			Kind string `json:"kind"` // campaign or automation
    			Name string `json:"name"`
    		} `json:"credited"`
    		Code   string `json:"code"`
    		Detail string `json:"detail"`
    	}
    	if err := json.NewDecoder(resp.Body).Decode(&result); err != nil {
    		log.Fatal(err)
    	}
    	if resp.StatusCode >= 300 {
    		log.Fatalf("%d %s: %s", resp.StatusCode, result.Code, result.Detail)
    	}
    	fmt.Println(result.ID, result.Matched)
    	if result.Credited != nil {
    		fmt.Println("Credited to", result.Credited.Kind, result.Credited.Name)
    	}
    }
- lang: python
  label: Python (requests)
  source: |
    # REPUTECAST_API_KEY: an API key (rc_live_…) with conversions:create.
    # Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    import os

    import requests

    conversion = {
        "name": "Upgraded to Team plan",
        "value": "29.00",  # a decimal string, not a number
        "currency": "USD",
        "email": "sam.rivera@outlook.com",  # the email, the click token, or both
        "metadata": {"order_id": "1042"},
        # "click_token": the rc_click value of the link the reader followed, when you have it
    }

    response = requests.post(
        "https://reputecast.example.com/api/v1/workspaces/your-workspace/conversions",
        headers={
            "Authorization": f"Bearer {os.environ['REPUTECAST_API_KEY']}",
            # Sending the same key again answers with the first conversion instead of recording a second.
            "Idempotency-Key": "order-1042",
        },
        json=conversion,
        timeout=10,
    )
    result = response.json()
    if not response.ok:
        raise RuntimeError(f"{response.status_code} {result.get('code')}: {result.get('detail')}")
    # matched: click_token, email or none; credited: the campaign or automation email it counts for.
    print(result["id"], result["matched"], (result.get("credited") or {}).get("name"))
- lang: php
  label: PHP (curl)
  source: |
    <?php
    // REPUTECAST_API_KEY: an API key (rc_live_…) with conversions:create.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    $payload = [
        'name' => 'Upgraded to Team plan',
        'value' => '29.00', // a decimal string, not a number
        'currency' => 'USD',
        'email' => 'sam.rivera@outlook.com', // the email, the click token, or both
        'metadata' => ['order_id' => '1042'],
        // 'click_token' => the rc_click value of the link the reader followed, when you have it
    ];

    $ch = curl_init('https://reputecast.example.com/api/v1/workspaces/your-workspace/conversions');
    curl_setopt_array($ch, [
        CURLOPT_POST => true,
        CURLOPT_RETURNTRANSFER => true,
        CURLOPT_HTTPHEADER => [
            'Authorization: Bearer ' . getenv('REPUTECAST_API_KEY'),
            'Content-Type: application/json',
            // Sending the same key again answers with the first conversion instead of recording a second.
            'Idempotency-Key: order-1042',
        ],
        CURLOPT_POSTFIELDS => json_encode($payload, JSON_THROW_ON_ERROR),
    ]);
    $body = curl_exec($ch);
    if ($body === false) {
        throw new RuntimeException(curl_error($ch));
    }
    $status = curl_getinfo($ch, CURLINFO_RESPONSE_CODE);
    $result = json_decode($body, true, flags: JSON_THROW_ON_ERROR);
    if ($status >= 300) {
        throw new RuntimeException("{$status} {$result['code']}: {$result['detail']}");
    }
    // matched: click_token, email or none; credited: the campaign or automation email it counts for.
    echo $result['id'], ' ', $result['matched'], ' ', $result['credited']['name'] ?? '', PHP_EOL;
