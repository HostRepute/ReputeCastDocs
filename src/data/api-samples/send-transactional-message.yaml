# Code samples for POST /api/v1/workspaces/{workspace}/transactional/messages (send-transactional-message).
# Authored samples replace the plugin's generated snippets on this page, so every language is listed here.
- lang: sh
  label: cURL
  source: |
    # REPUTECAST_API_KEY: an API key (rc_live_…) with transactional:send.
    # Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    curl --request POST \
      --url https://reputecast.example.com/api/v1/workspaces/your-workspace/transactional/messages \
      --header "Authorization: Bearer $REPUTECAST_API_KEY" \
      --header 'Content-Type: application/json' \
      --header 'Idempotency-Key: password-reset-8f14e45f' \
      --data '{
        "template": "password-reset",
        "to": { "email": "sam.rivera@outlook.com", "name": "Sam Rivera" },
        "data": {
          "first_name": "Sam",
          "reset_url": "https://app.example.com/reset/8f14e45f",
          "expires_in": "30 minutes"
        },
        "tags": ["password-reset"]
      }'
- lang: js
  label: JavaScript (fetch)
  source: |
    // REPUTECAST_API_KEY: an API key (rc_live_…) with transactional:send.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    const response = await fetch(
      'https://reputecast.example.com/api/v1/workspaces/your-workspace/transactional/messages',
      {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${process.env.REPUTECAST_API_KEY}`,
          'Content-Type': 'application/json',
          // A retry with the same key within 24 hours never sends twice.
          'Idempotency-Key': 'password-reset-8f14e45f',
        },
        body: JSON.stringify({
          template: 'password-reset',
          to: { email: 'sam.rivera@outlook.com', name: 'Sam Rivera' },
          data: {
            first_name: 'Sam',
            reset_url: 'https://app.example.com/reset/8f14e45f',
            expires_in: '30 minutes',
          },
          tags: ['password-reset'],
        }),
      },
    )
    const result = await response.json()
    if (!response.ok) throw new Error(`${response.status} ${result.code}: ${result.detail}`)
    console.log(result.id, result.status) // status: queued
- lang: go
  label: Go (net/http)
  source: |
    // REPUTECAST_API_KEY: an API key (rc_live_…) with transactional:send.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    package main

    import (
    	"bytes"
    	"encoding/json"
    	"fmt"
    	"log"
    	"net/http"
    	"os"
    )

    func main() {
    	body, err := json.Marshal(map[string]any{
    		"template": "password-reset",
    		"to":       map[string]string{"email": "sam.rivera@outlook.com", "name": "Sam Rivera"},
    		"data": map[string]string{
    			"first_name": "Sam",
    			"reset_url":  "https://app.example.com/reset/8f14e45f",
    			"expires_in": "30 minutes",
    		},
    		"tags": []string{"password-reset"},
    	})
    	if err != nil {
    		log.Fatal(err)
    	}
    	req, err := http.NewRequest(http.MethodPost,
    		"https://reputecast.example.com/api/v1/workspaces/your-workspace/transactional/messages", bytes.NewReader(body))
    	if err != nil {
    		log.Fatal(err)
    	}
    	req.Header.Set("Authorization", "Bearer "+os.Getenv("REPUTECAST_API_KEY"))
    	req.Header.Set("Content-Type", "application/json")
    	// A retry with the same key within 24 hours never sends twice.
    	req.Header.Set("Idempotency-Key", "password-reset-8f14e45f")

    	resp, err := http.DefaultClient.Do(req)
    	if err != nil {
    		log.Fatal(err)
    	}
    	defer resp.Body.Close()

    	var result struct {
    		ID     string `json:"id"`
    		Status string `json:"status"`
    		Code   string `json:"code"`
    		Detail string `json:"detail"`
    	}
    	if err := json.NewDecoder(resp.Body).Decode(&result); err != nil {
    		log.Fatal(err)
    	}
    	if resp.StatusCode >= 300 {
    		log.Fatalf("%d %s: %s", resp.StatusCode, result.Code, result.Detail)
    	}
    	fmt.Println(result.ID, result.Status) // status: queued
    }
- lang: python
  label: Python (requests)
  source: |
    # REPUTECAST_API_KEY: an API key (rc_live_…) with transactional:send.
    # Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    import os

    import requests

    response = requests.post(
        "https://reputecast.example.com/api/v1/workspaces/your-workspace/transactional/messages",
        headers={
            "Authorization": f"Bearer {os.environ['REPUTECAST_API_KEY']}",
            # A retry with the same key within 24 hours never sends twice.
            "Idempotency-Key": "password-reset-8f14e45f",
        },
        json={
            "template": "password-reset",
            "to": {"email": "sam.rivera@outlook.com", "name": "Sam Rivera"},
            "data": {
                "first_name": "Sam",
                "reset_url": "https://app.example.com/reset/8f14e45f",
                "expires_in": "30 minutes",
            },
            "tags": ["password-reset"],
        },
        timeout=10,
    )
    result = response.json()
    if not response.ok:
        raise RuntimeError(f"{response.status_code} {result.get('code')}: {result.get('detail')}")
    print(result["id"], result["status"])  # status: queued
- lang: php
  label: PHP (curl)
  source: |
    <?php
    // REPUTECAST_API_KEY: an API key (rc_live_…) with transactional:send.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    $payload = [
        'template' => 'password-reset',
        'to' => ['email' => 'sam.rivera@outlook.com', 'name' => 'Sam Rivera'],
        'data' => [
            'first_name' => 'Sam',
            'reset_url' => 'https://app.example.com/reset/8f14e45f',
            'expires_in' => '30 minutes',
        ],
        'tags' => ['password-reset'],
    ];

    $ch = curl_init('https://reputecast.example.com/api/v1/workspaces/your-workspace/transactional/messages');
    curl_setopt_array($ch, [
        CURLOPT_POST => true,
        CURLOPT_RETURNTRANSFER => true,
        CURLOPT_HTTPHEADER => [
            'Authorization: Bearer ' . getenv('REPUTECAST_API_KEY'),
            'Content-Type: application/json',
            // A retry with the same key within 24 hours never sends twice.
            'Idempotency-Key: password-reset-8f14e45f',
        ],
        CURLOPT_POSTFIELDS => json_encode($payload, JSON_THROW_ON_ERROR),
    ]);
    $body = curl_exec($ch);
    if ($body === false) {
        throw new RuntimeException(curl_error($ch));
    }
    $status = curl_getinfo($ch, CURLINFO_RESPONSE_CODE);
    $result = json_decode($body, true, flags: JSON_THROW_ON_ERROR);
    if ($status >= 300) {
        throw new RuntimeException("{$status} {$result['code']}: {$result['detail']}");
    }
    echo $result['id'], ' ', $result['status'], PHP_EOL; // status: queued
