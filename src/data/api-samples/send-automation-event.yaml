# Code samples for POST /api/v1/workspaces/{workspace}/automations/events (send-automation-event).
# Authored samples replace the plugin's generated snippets on this page, so every language is listed here.
- lang: sh
  label: cURL
  source: |
    # REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:edit.
    # Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    curl --request POST \
      --url https://reputecast.example.com/api/v1/workspaces/your-workspace/automations/events \
      --header "Authorization: Bearer $REPUTECAST_API_KEY" \
      --header 'Content-Type: application/json' \
      --data '{
        "event": "trial.started",
        "email": "sam.rivera@outlook.com",
        "properties": { "plan": "team", "trial_days": 14 }
      }'
- lang: js
  label: JavaScript (fetch)
  source: |
    // REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:edit.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    const response = await fetch('https://reputecast.example.com/api/v1/workspaces/your-workspace/automations/events', {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${process.env.REPUTECAST_API_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        event: 'trial.started', // letters, numbers and . _ : -
        email: 'sam.rivera@outlook.com', // or contactId
        properties: { plan: 'team', trial_days: 14 }, // under 16 KB
      }),
    })
    const result = await response.json()
    // 404: no contact with that address; add the contact first, then send the event.
    if (!response.ok) throw new Error(`${response.status} ${result.code}: ${result.detail}`)
    console.log(`Recorded for ${result.contactId}; ${result.flows} live automations start from it`)
- lang: go
  label: Go (net/http)
  source: |
    // REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:edit.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    package main

    import (
    	"bytes"
    	"encoding/json"
    	"fmt"
    	"log"
    	"net/http"
    	"os"
    )

    func main() {
    	body, err := json.Marshal(map[string]any{
    		"event":      "trial.started",                                  // letters, numbers and . _ : -
    		"email":      "sam.rivera@outlook.com",                         // or contactId
    		"properties": map[string]any{"plan": "team", "trial_days": 14}, // under 16 KB
    	})
    	if err != nil {
    		log.Fatal(err)
    	}
    	req, err := http.NewRequest(http.MethodPost,
    		"https://reputecast.example.com/api/v1/workspaces/your-workspace/automations/events", bytes.NewReader(body))
    	if err != nil {
    		log.Fatal(err)
    	}
    	req.Header.Set("Authorization", "Bearer "+os.Getenv("REPUTECAST_API_KEY"))
    	req.Header.Set("Content-Type", "application/json")

    	resp, err := http.DefaultClient.Do(req)
    	if err != nil {
    		log.Fatal(err)
    	}
    	defer resp.Body.Close()

    	var result struct {
    		ContactID string `json:"contactId"`
    		Flows     int    `json:"flows"`
    		Code      string `json:"code"`
    		Detail    string `json:"detail"`
    	}
    	if err := json.NewDecoder(resp.Body).Decode(&result); err != nil {
    		log.Fatal(err)
    	}
    	// 404: no contact with that address; add the contact first, then send the event.
    	if resp.StatusCode >= 300 {
    		log.Fatalf("%d %s: %s", resp.StatusCode, result.Code, result.Detail)
    	}
    	fmt.Printf("Recorded for %s; %d live automations start from it\n", result.ContactID, result.Flows)
    }
- lang: python
  label: Python (requests)
  source: |
    # REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:edit.
    # Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    import os

    import requests

    response = requests.post(
        "https://reputecast.example.com/api/v1/workspaces/your-workspace/automations/events",
        headers={"Authorization": f"Bearer {os.environ['REPUTECAST_API_KEY']}"},
        json={
            "event": "trial.started",  # letters, numbers and . _ : -
            "email": "sam.rivera@outlook.com",  # or contactId
            "properties": {"plan": "team", "trial_days": 14},  # under 16 KB
        },
        timeout=10,
    )
    result = response.json()
    # 404: no contact with that address; add the contact first, then send the event.
    if not response.ok:
        raise RuntimeError(f"{response.status_code} {result.get('code')}: {result.get('detail')}")
    print(f"Recorded for {result['contactId']}; {result['flows']} live automations start from it")
- lang: php
  label: PHP (curl)
  source: |
    <?php
    // REPUTECAST_API_KEY: an API key (rc_live_…) with subscribers:edit.
    // Replace reputecast.example.com with your public URL and your-workspace with your workspace slug.
    $payload = [
        'event' => 'trial.started', // letters, numbers and . _ : -
        'email' => 'sam.rivera@outlook.com', // or contactId
        'properties' => ['plan' => 'team', 'trial_days' => 14], // under 16 KB
    ];

    $ch = curl_init('https://reputecast.example.com/api/v1/workspaces/your-workspace/automations/events');
    curl_setopt_array($ch, [
        CURLOPT_POST => true,
        CURLOPT_RETURNTRANSFER => true,
        CURLOPT_HTTPHEADER => [
            'Authorization: Bearer ' . getenv('REPUTECAST_API_KEY'),
            'Content-Type: application/json',
        ],
        CURLOPT_POSTFIELDS => json_encode($payload, JSON_THROW_ON_ERROR),
    ]);
    $body = curl_exec($ch);
    if ($body === false) {
        throw new RuntimeException(curl_error($ch));
    }
    $status = curl_getinfo($ch, CURLINFO_RESPONSE_CODE);
    $result = json_decode($body, true, flags: JSON_THROW_ON_ERROR);
    // 404: no contact with that address; add the contact first, then send the event.
    if ($status >= 300) {
        throw new RuntimeException("{$status} {$result['code']}: {$result['detail']}");
    }
    echo "Recorded for {$result['contactId']}; {$result['flows']} live automations start from it", PHP_EOL;
