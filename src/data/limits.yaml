- id: auto-pause.bounce-rate
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Bounce rate (hard and soft bounces per message sent), per mailbox provider, per sending provider and for the whole send
    vi: Tỷ lệ trả thư (thư trả lại vĩnh viễn và tạm thời trên mỗi thư đã gửi), theo nhà cung cấp hộp thư, theo nhà cung cấp gửi thư và trên cả lần gửi
  value: 2.0%
  change:
    en: Settings › Providers, 0.1–50%; per campaign in Review & send, or with Edit for this send on the live monitor, 0.1–20%
    vi: Cài đặt › Nhà cung cấp, 0.1–50%; theo từng chiến dịch trong Kiểm tra và gửi, hoặc bằng Sửa cho lần gửi này trên màn hình theo dõi trực tiếp, 0.1–20%

- id: auto-pause.complaint-rate
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Complaint rate of the whole send (complaints per message delivered to mailbox providers that report complaints; Gmail and iCloud don't)
    vi: Tỷ lệ khiếu nại của cả lần gửi (khiếu nại trên mỗi thư gửi thành công tới các nhà cung cấp hộp thư có báo cáo khiếu nại; Gmail và iCloud không báo cáo)
  value: 0.10%
  change:
    en: Settings › Providers, 0.01–5%; per campaign in Review & send, or with Edit for this send on the live monitor, 0.01–5%
    vi: Cài đặt › Nhà cung cấp, 0.01–5%; theo từng chiến dịch trong Kiểm tra và gửi, hoặc bằng Sửa cho lần gửi này trên màn hình theo dõi trực tiếp, 0.01–5%

- id: auto-pause.mailbox-complaint-rate
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Complaint rate per mailbox provider that reports complaints (Outlook, Yahoo, other), and what it does
    vi: Tỷ lệ khiếu nại theo từng nhà cung cấp hộp thư có báo cáo khiếu nại (Outlook, Yahoo, nhà cung cấp khác), và hành động khi vượt ngưỡng
  value: 0.10%, the same as the complaint rate unless set separately → pause that mailbox provider
  change:
    en: Settings › Providers or Sending providers › Traffic rules, 0.01–5%, with the action (pause the mailbox provider, pause the send or warn) on Traffic rules; per campaign in Review & send, 0.01–5% and at most 5 times the complaint rate
    vi: Cài đặt › Nhà cung cấp hoặc Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.01–5%, kèm hành động (tạm dừng nhà cung cấp hộp thư, tạm dừng lần gửi hoặc cảnh báo) trong Quy tắc lưu lượng; theo từng chiến dịch trong Kiểm tra và gửi, 0.01–5% và tối đa gấp 5 lần tỷ lệ khiếu nại

- id: auto-pause.block-bounce
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Block/policy bounces at one mailbox provider (refused for reputation, policy or content)
    vi: Thư trả lại do chặn hoặc chính sách tại một nhà cung cấp hộp thư (bị từ chối vì danh tiếng, chính sách hoặc nội dung)
  value: 0.5% → pause that mailbox provider
  change:
    en: Sending providers › Traffic rules, 0.01–20%; action pause the mailbox provider, slow it to half rate, pause the send or warn
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.01–20%; hành động tạm dừng nhà cung cấp hộp thư, giảm còn một nửa tốc độ, tạm dừng lần gửi hoặc cảnh báo

- id: auto-pause.block-burst
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Burst of block/policy bounces at Gmail, Outlook, Yahoo or iCloud (not Other)
    vi: Thư trả lại do chặn hoặc chính sách tăng đột biến tại Gmail, Outlook, Yahoo hoặc iCloud (không tính Khác)
  value: 3 or more within 10 minutes, clearly over the block/policy limit among the mail sent there in that time
  change:
    en: Fixed; not counted in the 10 minutes after someone resumes that mailbox provider
    vi: Cố định; không tính trong 10 phút sau khi có người cho nhà cung cấp hộp thư đó tiếp tục

- id: auto-pause.unknown-user-warn
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Unknown users (other hard bounces) over the whole send, first level
    vi: Người nhận không tồn tại (các thư trả lại vĩnh viễn khác) trên cả lần gửi, mức thứ nhất
  value: 3% → warn
  change:
    en: Sending providers › Traffic rules, 0.1–50%; action warn, slow to half rate or pause the send
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.1–50%; hành động cảnh báo, giảm còn một nửa tốc độ hoặc tạm dừng lần gửi

- id: auto-pause.unknown-user-pause
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Unknown users (other hard bounces) over the whole send, second level
    vi: Người nhận không tồn tại (các thư trả lại vĩnh viễn khác) trên cả lần gửi, mức thứ hai
  value: 5% → pause the send
  change:
    en: Sending providers › Traffic rules, 0.1–50% and above the first level; action pause the send, warn or slow to half rate
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.1–50% và cao hơn mức thứ nhất; hành động tạm dừng lần gửi, cảnh báo hoặc giảm còn một nửa tốc độ

- id: auto-pause.deferral-slow
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Soft bounces and deferrals at one mailbox provider, first level
    vi: Thư trả lại tạm thời và hoãn nhận tại một nhà cung cấp hộp thư, mức thứ nhất
  value: 15% over 10 minutes → slow that mailbox provider to half rate
  change:
    en: Sending providers › Traffic rules, 1–100%, over 5, 10, 15 or 30 minutes; action slow to half rate, pause the mailbox provider or warn
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 1–100%, trong 5, 10, 15 hoặc 30 phút; hành động giảm còn một nửa tốc độ, tạm dừng nhà cung cấp hộp thư hoặc cảnh báo

- id: auto-pause.deferral-rate
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Soft bounces and deferrals at one mailbox provider, second level
    vi: Thư trả lại tạm thời và hoãn nhận tại một nhà cung cấp hộp thư, mức thứ hai
  value: 40% over 10 minutes → pause that mailbox provider
  change:
    en: Sending providers › Traffic rules, 1–100% and above the first level, over 5, 10, 15 or 30 minutes; action pause the mailbox provider, slow or warn. Per send with Edit for this send, 1–100%
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 1–100% và cao hơn mức thứ nhất, trong 5, 10, 15 hoặc 30 phút; hành động tạm dừng nhà cung cấp hộp thư, giảm tốc độ hoặc cảnh báo. Theo từng lần gửi bằng Sửa cho lần gửi này, 1–100%

- id: auto-pause.api-errors
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Sending provider API errors over 3 minutes
    vi: Lỗi API của nhà cung cấp gửi thư trong 3 phút
  value: 5.0%, judged after 20 calls and 3 failures → hold that provider's share
  change:
    en: Settings › Providers, 0.5–100%; per campaign in Review & send, or with Edit for this send, 1–100%
    vi: Cài đặt › Nhà cung cấp, 0.5–100%; theo từng chiến dịch trong Kiểm tra và gửi, hoặc bằng Sửa cho lần gửi này, 1–100%

- id: auto-pause.scope
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: What a tripped threshold pauses
    vi: Phạm vi bị tạm dừng khi vượt ngưỡng
  value: Only the affected mailbox provider or sending provider (route)
  change:
    en: Settings › Providers › Pause scope, or per campaign in Review & send; route or the whole campaign
    vi: Cài đặt › Nhà cung cấp › Phạm vi tạm dừng, hoặc theo từng chiến dịch trong Kiểm tra và gửi; tuyến hoặc toàn bộ chiến dịch

- id: auto-pause.check-interval
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: How often rates are checked during a send
    vi: Tần suất kiểm tra các tỷ lệ trong khi gửi
  value: Every 2 s; bounce types, deferral windows and reply rules every 10 s
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.min-events
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Bounces, complaints or deferrals needed before a rate can trip
    vi: Số thư trả lại, khiếu nại hoặc hoãn nhận cần có trước khi một tỷ lệ có thể vượt ngưỡng
  value: '5'
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.confidence
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Confidence that a rate is above its threshold before it trips
    vi: Độ tin cậy cần có rằng một tỷ lệ đã vượt ngưỡng trước khi tạm dừng
  value: About 90%
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.clearly-over
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Complaints and block/policy bounces clearly over the limit trip a send of any size
    vi: Khiếu nại và thư trả lại do chặn hoặc chính sách rõ ràng vượt giới hạn sẽ vượt ngưỡng với lần gửi ở mọi quy mô
  value: 3 or more, with the lower end of the one-sided 95% Wilson interval above the limit
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.min-sample-route
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Messages before a mailbox provider's or sending provider's rates count
    vi: Số thư cần có trước khi tính tỷ lệ của một nhà cung cấp hộp thư hoặc nhà cung cấp gửi thư
  value: 500 messages
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.min-sample-campaign
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Messages before campaign-wide rates count
    vi: Số thư cần có trước khi tính tỷ lệ trên toàn chiến dịch
  value: 1,000 messages
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.outage-hold
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Provider outage during a send holds the provider's share after
    vi: Khi nhà cung cấp gặp sự cố gián đoạn trong lúc gửi, phần của nhà cung cấp đó bị tạm giữ sau
  value: 3 minutes of failed calls (at least 5 calls) or of throttling (at least 5 throttled calls); API errors over their threshold; at once when the provider is marked down, rejects the credentials, refuses the sender or says its quota is used up
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.retry-held-share
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: A held share tests its provider
    vi: Phần bị tạm giữ tự kiểm tra nhà cung cấp của nó
  value: 1 test message every 60 s (to a seed mailbox when the workspace has one); the share resumes after 3 in a row go through
  change:
    en: Fixed. Retry keeps the tests going and asks again after 15 minutes if the provider still fails
    vi: Cố định. Thử lại giữ các lần kiểm tra và hỏi lại sau 15 phút nếu nhà cung cấp vẫn lỗi

- id: auto-pause.send-retry
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Retries of a message that failed temporarily
    vi: Số lần thử lại một thư bị lỗi tạm thời
  value: Up to 10 attempts, after 5 s, 10 s, 20 s, 40 s, then every 60 s
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.in-doubt
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: A provider call that ended without a recorded answer
    vi: Lệnh gọi tới nhà cung cấp kết thúc mà không ghi nhận được phản hồi
  value: After 5 minutes, sent again with the same key while the provider still recognizes it (SparkPost 24 h, Brevo 30 min, less 5 minutes); otherwise in doubt until someone decides
  change:
    en: Fixed
    vi: Cố định

- id: auto-pause.editable-until
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Campaign thresholds can be changed until
    vi: Có thể đổi ngưỡng của chiến dịch cho đến khi
  value: The send ends
  change:
    en: Review & send before it starts; Edit for this send on the live monitor while it sends or waits, recorded in the audit log. Changes to the workspace defaults don't affect a send that has started
    vi: Kiểm tra và gửi trước khi bắt đầu; Sửa cho lần gửi này trên màn hình theo dõi trực tiếp trong khi đang gửi hoặc đang chờ, có ghi vào nhật ký kiểm tra. Thay đổi ở cài đặt mặc định của không gian làm việc không ảnh hưởng đến lần gửi đã bắt đầu

- id: auto-pause.rates
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
  setting:
    en: Rate per mailbox provider during a send
    vi: Tốc độ theo nhà cung cấp hộp thư trong khi gửi
  value: The workspace throttles (Outlook 5/s, Yahoo 4/s, iCloud 3/s, Gmail and Other at the sending provider's rate), shared by the sends going out at once
  change:
    en: Adjust rates on the live monitor, for the rest of the send on every route; 0 (full rate) or 0.1–1,000 messages per second
    vi: Điều chỉnh tốc độ trên màn hình theo dõi trực tiếp, cho phần còn lại của lần gửi trên mọi tuyến; 0 (tốc độ tối đa) hoặc 0,1–1.000 thư mỗi giây

- id: canary.auto
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: A send starts with a canary by itself when
    vi: Lần gửi tự bắt đầu bằng gửi thử khi
  value: The sending domain is in its first 30 days, or a dedicated IP never sent for the workspace; some recipients never got mail from the domain; the audience is over 2× the median of the last 8 sends
  change:
    en: Sending providers › Traffic rules › Canary defaults, each reason on or off; Review & send can choose Start with a canary or No canary
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng › Mặc định gửi thử, bật hoặc tắt từng lý do; Kiểm tra và gửi có thể chọn bắt đầu bằng gửi thử hoặc không gửi thử

- id: canary.min-audience
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: Smallest audience for an automatic canary
    vi: Số người nhận nhỏ nhất để tự gửi thử
  value: 1,000 recipients
  change:
    en: Fixed; a canary chosen in Review & send runs at any size
    vi: Cố định; gửi thử được chọn trong Kiểm tra và gửi chạy ở mọi quy mô

- id: canary.size
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: Who gets the canary
    vi: Ai nhận thư gửi thử
  value: The 5% most engaged recipients, plus the workspace's seed mailboxes
  change:
    en: Sending providers › Traffic rules, 1–20%; seed mailboxes on or off
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 1–20%; bật hoặc tắt hộp thư thử

- id: canary.watch
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: Watch after the last canary message
    vi: Thời gian theo dõi sau thư gửi thử cuối cùng
  value: 20 minutes
  change:
    en: Sending providers › Traffic rules, 10, 20, 30 or 60 minutes; Watch 10 more minutes on the live monitor
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 10, 20, 30 hoặc 60 phút; Theo dõi thêm 10 phút trên màn hình theo dõi trực tiếp

- id: canary.gate-bounce
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: 'Gate: bounces'
    vi: 'Điều kiện: thư trả lại'
  value: 1.0%
  change:
    en: Sending providers › Traffic rules, 0.1–20%
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.1–20%

- id: canary.gate-block
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: 'Gate: block/policy bounces'
    vi: 'Điều kiện: thư trả lại do chặn hoặc chính sách'
  value: 0.2%
  change:
    en: Sending providers › Traffic rules, 0.01–20%
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.01–20%

- id: canary.gate-deferral
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: 'Gate: deferrals'
    vi: 'Điều kiện: hoãn nhận'
  value: 15%
  change:
    en: Sending providers › Traffic rules, 1–100%
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 1–100%

- id: canary.gate-complaint
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: 'Gate: complaints per mailbox provider that reports them'
    vi: 'Điều kiện: khiếu nại theo nhà cung cấp hộp thư có báo cáo khiếu nại'
  value: 0.10%, judged once 500 are delivered to that mailbox provider
  change:
    en: Sending providers › Traffic rules, 0.01–5%
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.01–5%

- id: canary.gate-seeds
  area:
    en: Canary
    vi: Gửi thử (canary)
  setting:
    en: 'Gate: seed mailboxes in spam'
    vi: 'Điều kiện: hộp thư thử vào thư rác'
  value: At most 2
  change:
    en: Sending providers › Traffic rules, 0–100
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0–100

- id: traffic-rules.reply-yahoo-tss04
  area:
    en: Traffic rules
    vi: Quy tắc lưu lượng
  setting:
    en: 'Default reply rule: Yahoo, reply contains TSS04'
    vi: 'Quy tắc phản hồi mặc định: Yahoo, phản hồi chứa TSS04'
  value: 10 replies in 10 min → pause Yahoo for 2 h
  change:
    en: Sending providers › Traffic rules; change, turn off or remove it like any rule
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng; sửa, tắt hoặc xóa như mọi quy tắc khác

- id: traffic-rules.reply-yahoo-ts04
  area:
    en: Traffic rules
    vi: Quy tắc lưu lượng
  setting:
    en: 'Default reply rule: Yahoo, reply contains TS04'
    vi: 'Quy tắc phản hồi mặc định: Yahoo, phản hồi chứa TS04'
  value: 10 replies in 10 min → pause Yahoo for 2 h
  change:
    en: Sending providers › Traffic rules
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng

- id: traffic-rules.reply-outlook-s3150
  area:
    en: Traffic rules
    vi: Quy tắc lưu lượng
  setting:
    en: 'Default reply rule: Outlook, reply contains S3150'
    vi: 'Quy tắc phản hồi mặc định: Outlook, phản hồi chứa S3150'
  value: First reply → pause Outlook on that route and alert, until someone resumes
  change:
    en: Sending providers › Traffic rules
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng

- id: traffic-rules.reply-gmail-4-7-28
  area:
    en: Traffic rules
    vi: Quy tắc lưu lượng
  setting:
    en: 'Default reply rule: Gmail, reply contains 421-4.7.28'
    vi: 'Quy tắc phản hồi mặc định: Gmail, phản hồi chứa 421-4.7.28'
  value: 5 replies in 10 min → slow Gmail to 50% for 30 min
  change:
    en: Sending providers › Traffic rules
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng

- id: traffic-rules.reply-rule
