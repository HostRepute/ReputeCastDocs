- id: auto-pause.bounce-rate
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Bounce rate (hard and soft bounces per message sent), per mailbox provider, per sending provider and for the whole send
    vi: Tỷ lệ trả thư (thư trả lại vĩnh viễn và tạm thời trên mỗi thư đã gửi), theo nhà cung cấp hộp thư, theo nhà cung cấp gửi thư và trên cả lần gửi
    de: >-
      Bounce-Rate (Hard Bounces und Soft Bounces je gesendeter Nachricht), je Postfachanbieter, je Versandanbieter und
      für den gesamten Versand
    es: >-
      Tasa de rebote (rebotes permanentes y temporales por mensaje enviado), por proveedor de buzón, por proveedor de
      envío y para todo el envío
    fr: >-
      Taux de rebond (rebonds définitifs et temporaires par message envoyé), par fournisseur de messagerie, par
      fournisseur d’envoi et sur l’ensemble de l’envoi
  value: 2.0%
  change:
    en: Settings › Providers, 0.1–50%; per campaign in Review & send, or with Edit for this send on the live monitor, 0.1–20%
    vi: Cài đặt › Nhà cung cấp, 0.1–50%; theo từng chiến dịch trong Kiểm tra và gửi, hoặc bằng Sửa cho lần gửi này trên màn hình theo dõi trực tiếp, 0.1–20%
    de: >-
      Einstellungen › Anbieter, 0,1–50 %; je Kampagne unter Prüfen & senden oder mit „Für diesen Versand bearbeiten“ im
      Live-Monitor, 0,1–20 %
    es: >-
      Configuración › Proveedores, 0,1–50 %; por campaña en Revisar y enviar, o con Editar para este envío en el monitor
      en tiempo real, 0,1–20 %
    fr: >-
      Paramètres › Fournisseurs, 0,1–50 % ; par campagne dans Vérifier et envoyer, ou avec « Modifier pour cet envoi »
      sur le suivi en direct, 0,1–20 %

- id: auto-pause.complaint-rate
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Complaint rate of the whole send (complaints per message delivered to mailbox providers that report complaints; Gmail and iCloud don't)
    vi: Tỷ lệ khiếu nại của cả lần gửi (khiếu nại trên mỗi thư gửi thành công tới các nhà cung cấp hộp thư có báo cáo khiếu nại; Gmail và iCloud không báo cáo)
    de: >-
      Beschwerderate des gesamten Versands (Beschwerden je zugestellter Nachricht bei Postfachanbietern, die Beschwerden
      melden; Gmail und iCloud tun das nicht)
    es: >-
      Tasa de quejas de todo el envío (quejas por mensaje entregado a los proveedores de buzón que informan de las
      quejas; Gmail e iCloud no lo hacen)
    fr: >-
      Taux de plainte de l’ensemble de l’envoi (plaintes par message délivré aux fournisseurs de messagerie qui
      signalent les plaintes ; Gmail et iCloud ne le font pas)
  value: 0.10%
  change:
    en: Settings › Providers, 0.01–5%; per campaign in Review & send, or with Edit for this send on the live monitor, 0.01–5%
    vi: Cài đặt › Nhà cung cấp, 0.01–5%; theo từng chiến dịch trong Kiểm tra và gửi, hoặc bằng Sửa cho lần gửi này trên màn hình theo dõi trực tiếp, 0.01–5%
    de: >-
      Einstellungen › Anbieter, 0,01–5 %; je Kampagne unter Prüfen & senden oder mit „Für diesen Versand bearbeiten“ im
      Live-Monitor, 0,01–5 %
    es: >-
      Configuración › Proveedores, 0,01–5 %; por campaña en Revisar y enviar, o con Editar para este envío en el monitor
      en tiempo real, 0,01–5 %
    fr: >-
      Paramètres › Fournisseurs, 0,01–5 % ; par campagne dans Vérifier et envoyer, ou avec « Modifier pour cet envoi »
      sur le suivi en direct, 0,01–5 %

- id: auto-pause.mailbox-complaint-rate
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Complaint rate per mailbox provider that reports complaints (Outlook, Yahoo, other), and what it does
    vi: Tỷ lệ khiếu nại theo từng nhà cung cấp hộp thư có báo cáo khiếu nại (Outlook, Yahoo, nhà cung cấp khác), và hành động khi vượt ngưỡng
    de: Beschwerderate je Postfachanbieter, der Beschwerden meldet (Outlook, Yahoo, Andere), und was dann geschieht
    es: Tasa de quejas por proveedor de buzón que informa de las quejas (Outlook, Yahoo, otros) y la acción que ejecuta
    fr: >-
      Taux de plainte par fournisseur de messagerie qui signale les plaintes (Outlook, Yahoo, autres), et action
      déclenchée
  value: 0.10%, the same as the complaint rate unless set separately → pause that mailbox provider
  change:
    en: Settings › Providers or Sending providers › Traffic rules, 0.01–5%, with the action (pause the mailbox provider, pause the send or warn) on Traffic rules; per campaign in Review & send, 0.01–5% and at most 5 times the complaint rate
    vi: Cài đặt › Nhà cung cấp hoặc Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.01–5%, kèm hành động (tạm dừng nhà cung cấp hộp thư, tạm dừng lần gửi hoặc cảnh báo) trong Quy tắc lưu lượng; theo từng chiến dịch trong Kiểm tra và gửi, 0.01–5% và tối đa gấp 5 lần tỷ lệ khiếu nại
    de: >-
      Einstellungen › Anbieter oder Versandanbieter › Traffic-Regeln, 0,01–5 %, mit der Aktion (Postfachanbieter
      pausieren, Versand pausieren oder warnen) unter Traffic-Regeln; je Kampagne unter Prüfen & senden, 0,01–5 % und
      höchstens das 5-Fache der Beschwerderate
    es: >-
      Configuración › Proveedores o Proveedores de envío › Reglas de tráfico, 0,01–5 %, con la acción (pausar el
      proveedor de buzón, pausar el envío o avisar) en Reglas de tráfico; por campaña en Revisar y enviar, 0,01–5 % y
      como máximo 5 veces la tasa de quejas
    fr: >-
      Paramètres › Fournisseurs ou Fournisseurs d’envoi › Règles de trafic, 0,01–5 %, avec l’action (mettre la
      messagerie en pause, mettre l’envoi en pause ou avertir) dans Règles de trafic ; par campagne dans Vérifier et
      envoyer, 0,01–5 % et au plus 5 fois le taux de plainte

- id: auto-pause.block-bounce
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Block/policy bounces at one mailbox provider (refused for reputation, policy or content)
    vi: Thư trả lại do chặn hoặc chính sách tại một nhà cung cấp hộp thư (bị từ chối vì danh tiếng, chính sách hoặc nội dung)
    de: Block-/Richtlinien-Bounces bei einem Postfachanbieter (abgelehnt wegen Reputation, Richtlinien oder Inhalt)
    es: Rebotes por bloqueo/política en un proveedor de buzón (rechazos por reputación, política o contenido)
    fr: >-
      Rebonds pour blocage ou politique chez un fournisseur de messagerie (refus pour réputation, politique ou contenu)
  value: 0.5% → pause that mailbox provider
  change:
    en: Sending providers › Traffic rules, 0.01–20%; action pause the mailbox provider, slow it to half rate, pause the send or warn
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.01–20%; hành động tạm dừng nhà cung cấp hộp thư, giảm còn một nửa tốc độ, tạm dừng lần gửi hoặc cảnh báo
    de: >-
      Versandanbieter › Traffic-Regeln, 0,01–20 %; Aktion: Postfachanbieter pausieren, auf halbe Rate verlangsamen,
      Versand pausieren oder warnen
    es: >-
      Proveedores de envío › Reglas de tráfico, 0,01–20 %; acción: pausar el proveedor de buzón, reducir su velocidad a
      la mitad, pausar el envío o avisar
    fr: >-
      Fournisseurs d’envoi › Règles de trafic, 0,01–20 % ; action : mettre la messagerie en pause, ralentir de moitié,
      mettre l’envoi en pause ou avertir

- id: auto-pause.block-burst
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Burst of block/policy bounces at Gmail, Outlook, Yahoo or iCloud (not Other)
    vi: Thư trả lại do chặn hoặc chính sách tăng đột biến tại Gmail, Outlook, Yahoo hoặc iCloud (không tính Khác)
    de: Häufung von Block-/Richtlinien-Bounces bei Gmail, Outlook, Yahoo oder iCloud (nicht Andere)
    es: Pico de rebotes por bloqueo/política en Gmail, Outlook, Yahoo o iCloud (no en Otros)
    fr: Pic de rebonds pour blocage ou politique chez Gmail, Outlook, Yahoo ou iCloud (hors Autres)
  value: 3 or more within 10 minutes, clearly over the block/policy limit among the mail sent there in that time
  change:
    en: Fixed; not counted in the 10 minutes after someone resumes that mailbox provider
    vi: Cố định; không tính trong 10 phút sau khi có người cho nhà cung cấp hộp thư đó tiếp tục
    de: Fest vorgegeben; wird in den 10 Minuten, nachdem jemand diesen Postfachanbieter fortgesetzt hat, nicht gezählt
    es: Fijo; no se cuenta en los 10 minutos siguientes a que alguien reanude ese proveedor de buzón
    fr: Non modifiable ; non compté dans les 10 minutes qui suivent la reprise de l’envoi vers cette messagerie

- id: auto-pause.unknown-user-warn
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Unknown users (other hard bounces) over the whole send, first level
    vi: Người nhận không tồn tại (các thư trả lại vĩnh viễn khác) trên cả lần gửi, mức thứ nhất
    de: Unbekannte Empfänger (sonstige Hard Bounces) im gesamten Versand, erste Stufe
    es: Usuarios desconocidos (otros rebotes permanentes) en todo el envío, primer nivel
    fr: Utilisateurs inconnus (autres rebonds définitifs) sur l’ensemble de l’envoi, premier niveau
  value: 3% → warn
  change:
    en: Sending providers › Traffic rules, 0.1–50%; action warn, slow to half rate or pause the send
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.1–50%; hành động cảnh báo, giảm còn một nửa tốc độ hoặc tạm dừng lần gửi
    de: 'Versandanbieter › Traffic-Regeln, 0,1–50 %; Aktion: warnen, auf halbe Rate verlangsamen oder Versand pausieren'
    es: >-
      Proveedores de envío › Reglas de tráfico, 0,1–50 %; acción: avisar, reducir la velocidad a la mitad o pausar el
      envío
    fr: >-
      Fournisseurs d’envoi › Règles de trafic, 0,1–50 % ; action : avertir, ralentir de moitié ou mettre l’envoi en
      pause

- id: auto-pause.unknown-user-pause
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Unknown users (other hard bounces) over the whole send, second level
    vi: Người nhận không tồn tại (các thư trả lại vĩnh viễn khác) trên cả lần gửi, mức thứ hai
    de: Unbekannte Empfänger (sonstige Hard Bounces) im gesamten Versand, zweite Stufe
    es: Usuarios desconocidos (otros rebotes permanentes) en todo el envío, segundo nivel
    fr: Utilisateurs inconnus (autres rebonds définitifs) sur l’ensemble de l’envoi, second niveau
  value: 5% → pause the send
  change:
    en: Sending providers › Traffic rules, 0.1–50% and above the first level; action pause the send, warn or slow to half rate
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 0.1–50% và cao hơn mức thứ nhất; hành động tạm dừng lần gửi, cảnh báo hoặc giảm còn một nửa tốc độ
    de: >-
      Versandanbieter › Traffic-Regeln, 0,1–50 % und über der ersten Stufe; Aktion: Versand pausieren, warnen oder auf
      halbe Rate verlangsamen
    es: >-
      Proveedores de envío › Reglas de tráfico, 0,1–50 % y por encima del primer nivel; acción: pausar el envío, avisar
      o reducir la velocidad a la mitad
    fr: >-
      Fournisseurs d’envoi › Règles de trafic, 0,1–50 % et au-dessus du premier niveau ; action : mettre l’envoi en
      pause, avertir ou ralentir de moitié

- id: auto-pause.deferral-slow
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Soft bounces and deferrals at one mailbox provider, first level
    vi: Thư trả lại tạm thời và hoãn nhận tại một nhà cung cấp hộp thư, mức thứ nhất
    de: Soft Bounces und Zurückstellungen bei einem Postfachanbieter, erste Stufe
    es: Rebotes temporales y aplazamientos en un proveedor de buzón, primer nivel
    fr: Rebonds temporaires et reports chez un fournisseur de messagerie, premier niveau
  value: 15% over 10 minutes → slow that mailbox provider to half rate
  change:
    en: Sending providers › Traffic rules, 1–100%, over 5, 10, 15 or 30 minutes; action slow to half rate, pause the mailbox provider or warn
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 1–100%, trong 5, 10, 15 hoặc 30 phút; hành động giảm còn một nửa tốc độ, tạm dừng nhà cung cấp hộp thư hoặc cảnh báo
    de: >-
      Versandanbieter › Traffic-Regeln, 1–100 %, über 5, 10, 15 oder 30 Minuten; Aktion: auf halbe Rate verlangsamen,
      Postfachanbieter pausieren oder warnen
    es: >-
      Proveedores de envío › Reglas de tráfico, 1–100 %, en 5, 10, 15 o 30 minutos; acción: reducir la velocidad a la
      mitad, pausar el proveedor de buzón o avisar
    fr: >-
      Fournisseurs d’envoi › Règles de trafic, 1–100 %, sur 5, 10, 15 ou 30 minutes ; action : ralentir de moitié,
      mettre la messagerie en pause ou avertir

- id: auto-pause.deferral-rate
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Soft bounces and deferrals at one mailbox provider, second level
    vi: Thư trả lại tạm thời và hoãn nhận tại một nhà cung cấp hộp thư, mức thứ hai
    de: Soft Bounces und Zurückstellungen bei einem Postfachanbieter, zweite Stufe
    es: Rebotes temporales y aplazamientos en un proveedor de buzón, segundo nivel
    fr: Rebonds temporaires et reports chez un fournisseur de messagerie, second niveau
  value: 40% over 10 minutes → pause that mailbox provider
  change:
    en: Sending providers › Traffic rules, 1–100% and above the first level, over 5, 10, 15 or 30 minutes; action pause the mailbox provider, slow or warn. Per send with Edit for this send, 1–100%
    vi: Nhà cung cấp gửi thư › Quy tắc lưu lượng, 1–100% và cao hơn mức thứ nhất, trong 5, 10, 15 hoặc 30 phút; hành động tạm dừng nhà cung cấp hộp thư, giảm tốc độ hoặc cảnh báo. Theo từng lần gửi bằng Sửa cho lần gửi này, 1–100%
    de: >-
      Versandanbieter › Traffic-Regeln, 1–100 % und über der ersten Stufe, über 5, 10, 15 oder 30 Minuten; Aktion:
      Postfachanbieter pausieren, verlangsamen oder warnen. Je Versand mit „Für diesen Versand bearbeiten“, 1–100 %
    es: >-
      Proveedores de envío › Reglas de tráfico, 1–100 % y por encima del primer nivel, en 5, 10, 15 o 30 minutos;
      acción: pausar el proveedor de buzón, reducir la velocidad o avisar. Por envío con Editar para este envío, 1–100 %
    fr: >-
      Fournisseurs d’envoi › Règles de trafic, 1–100 % et au-dessus du premier niveau, sur 5, 10, 15 ou 30 minutes ;
      action : mettre la messagerie en pause, ralentir ou avertir. Par envoi avec « Modifier pour cet envoi », 1–100 %

- id: auto-pause.api-errors
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Sending provider API errors over 3 minutes
    vi: Lỗi API của nhà cung cấp gửi thư trong 3 phút
    de: API-Fehler des Versandanbieters über 3 Minuten
    es: Errores de API del proveedor de envío durante 3 minutos
    fr: Erreurs d’API du fournisseur d’envoi sur 3 minutes
  value: 5.0%, judged after 20 calls and 3 failures → hold that provider's share
  change:
    en: Settings › Providers, 0.5–100%; per campaign in Review & send, or with Edit for this send, 1–100%
    vi: Cài đặt › Nhà cung cấp, 0.5–100%; theo từng chiến dịch trong Kiểm tra và gửi, hoặc bằng Sửa cho lần gửi này, 1–100%
    de: >-
      Einstellungen › Anbieter, 0,5–100 %; je Kampagne unter Prüfen & senden oder mit „Für diesen Versand bearbeiten“,
      1–100 %
    es: Configuración › Proveedores, 0,5–100 %; por campaña en Revisar y enviar, o con Editar para este envío, 1–100 %
    fr: >-
      Paramètres › Fournisseurs, 0,5–100 % ; par campagne dans Vérifier et envoyer, ou avec « Modifier pour cet envoi »,
      1–100 %

- id: auto-pause.scope
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: What a tripped threshold pauses
    vi: Phạm vi bị tạm dừng khi vượt ngưỡng
    de: Was ein ausgelöster Schwellenwert pausiert
    es: Qué pausa un umbral cuando se activa
    fr: Ce que met en pause un seuil franchi
  value: Only the affected mailbox provider or sending provider (route)
  change:
    en: Settings › Providers › Pause scope, or per campaign in Review & send; route or the whole campaign
    vi: Cài đặt › Nhà cung cấp › Phạm vi tạm dừng, hoặc theo từng chiến dịch trong Kiểm tra và gửi; tuyến hoặc toàn bộ chiến dịch
    de: Einstellungen › Anbieter › Umfang der Pause oder je Kampagne unter Prüfen & senden; Route oder gesamte Kampagne
    es: Configuración › Proveedores › Alcance de la pausa, o por campaña en Revisar y enviar; la ruta o toda la campaña
    fr: >-
      Paramètres › Fournisseurs › Portée de la pause, ou par campagne dans Vérifier et envoyer ; la route ou toute la
      campagne

- id: auto-pause.check-interval
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: How often rates are checked during a send
    vi: Tần suất kiểm tra các tỷ lệ trong khi gửi
    de: Wie oft die Raten während eines Versands geprüft werden
    es: Frecuencia con la que se comprueban las tasas durante un envío
    fr: Fréquence de vérification des taux pendant un envoi
  value: Every 2 s; bounce types, deferral windows and reply rules every 10 s
  change:
    en: Fixed
    vi: Cố định
    de: Fest vorgegeben
    es: Fijo
    fr: Non modifiable

- id: auto-pause.min-events
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Bounces, complaints or deferrals needed before a rate can trip
    vi: Số thư trả lại, khiếu nại hoặc hoãn nhận cần có trước khi một tỷ lệ có thể vượt ngưỡng
    de: Bounces, Beschwerden oder Zurückstellungen, die nötig sind, bevor eine Rate auslösen kann
    es: Rebotes, quejas o aplazamientos necesarios antes de que una tasa pueda activarse
    fr: Rebonds, plaintes ou reports nécessaires avant qu’un taux puisse se déclencher
  value: '5'
  change:
    en: Fixed
    vi: Cố định
    de: Fest vorgegeben
    es: Fijo
    fr: Non modifiable

- id: auto-pause.confidence
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
  setting:
    en: Confidence that a rate is above its threshold before it trips
    vi: Độ tin cậy cần có rằng một tỷ lệ đã vượt ngưỡng trước khi tạm dừng
    de: Konfidenz, dass eine Rate über ihrem Schwellenwert liegt, bevor sie auslöst
    es: Confianza en que una tasa supera su umbral antes de que se active
    fr: Degré de confiance qu’un taux dépasse son seuil avant qu’il se déclenche
  value: About 90%
  change:
    en: Fixed
    vi: Cố định
    de: Fest vorgegeben
    es: Fijo
    fr: Non modifiable

- id: auto-pause.clearly-over
  area:
    en: Auto-pause
    vi: Tự động tạm dừng
    de: Auto-Pause
    es: Pausa automática
    fr: Pause automatique
