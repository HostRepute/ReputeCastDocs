StylesPath = .vale/styles
MinAlertLevel = warning

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, ReputeCast
Vale.Spelling = NO
# Import lines and JSX components are not prose.
BlockIgnores = (?m)^import .+$, (?s)<(Screenshot|LimitsTable|ProviderMatrix|UiPath|TableScroll|CliReference|ConfigReference|PermissionsTable|RolesMatrix|WebhookEventsTable|McpReference|ErrorCodesTable|Glossary|ShortcutsTable|ArchitectureDiagram|SendFlowDiagram|LinkCard|Card|CardGrid|Steps|Tabs|TabItem|Aside|FileTree|Badge)\b[^>]*/>
TokenIgnores = (<UiPath[^>]*/>), (\{[^}\n]*\})
