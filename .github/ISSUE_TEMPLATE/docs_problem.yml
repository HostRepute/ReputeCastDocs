name: Docs problem
description: A page is wrong, out of date, unclear or missing something.
labels: ['docs']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs. For a bug in the app itself, open an issue in [hostrepute/reputecast](https://github.com/hostrepute/reputecast/issues/new/choose) instead.
  - type: input
    id: page
    attributes:
      label: Page
      description: The page's address, for example https://docs.reputecast.com/providers/amazon-ses/
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Wrong or out of date
        - Unclear
        - Something is missing
        - Broken link, image or screenshot
        - Vietnamese translation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Quote the sentence or describe the part of the page, and what you expected to read.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. What the page should say instead, with a source if you have one.
  - type: input
    id: version
    attributes:
      label: ReputeCast version
      description: Optional. Instance admin › Instance & updates shows it, or run `reputecast version`.
      placeholder: v1.0.1
