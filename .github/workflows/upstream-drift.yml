name: Upstream drift

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hostrepute/reputecast
          path: upstream
          fetch-depth: 0 # the page review diffs against the commit in src/data/upstream.json
          token: ${{ secrets.UPSTREAM_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm upstream:check
        env:
          REPUTECAST_SRC: upstream
