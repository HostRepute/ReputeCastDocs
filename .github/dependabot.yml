# Monthly dependency updates, one grouped pull request per ecosystem for minor and patch versions. Versions are
# pinned exactly (README.md, Dependencies); take a major version by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Node is 24 LTS (.nvmrc): its types follow the runtime's major.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
