# pnpm 12 replaced onlyBuiltDependencies with allowBuilds.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# These pinned releases are newer than pnpm's minimum release age (same pattern as upstream site/).
minimumReleaseAgeExclude:
  - '@astrojs/check@0.9.12'
  - '@astrojs/language-server@2.17.3'
  - '@astrojs/markdown-satteri@0.4.5'
  - '@astrojs/prism@4.1.1'
  - '@astrojs/telemetry@3.4.1'
  - astro@7.4.2
